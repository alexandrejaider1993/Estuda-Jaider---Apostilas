<!doctype html>
<html lang="pt-BR" data-skin="eleven" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Estuda Jaider">
<link rel="icon" type="image/png" href="favicon.png?v=3">
<link rel="shortcut icon" href="favicon.ico?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<title>Estuda Jaider · Apostilas Interativas</title>
<script>
  try {
    const t = localStorage.getItem("ej_tema");
    document.documentElement.dataset.tema = t === "escuro" ? "escuro" : "claro";
    document.documentElement.dataset.skin = "eleven";
  } catch (e) {}
  (function () {
    const detectarCelular = () => {
      const uaMovel = /Android|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent || "");
      const toque = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
      const telaPequena = window.innerWidth <= 768;
      return (uaMovel && telaPequena) || (toque && window.innerWidth <= 640);
    };
    const aplicarDispositivo = () => {
      document.documentElement.dataset.dispositivo = detectarCelular() ? "celular" : "desktop";
    };
    aplicarDispositivo();
    window.addEventListener("resize", aplicarDispositivo, { passive: true });
    window.addEventListener("orientationchange", aplicarDispositivo, { passive: true });
  })();
</script>

<style>
  @font-face { font-family: "Inter"; font-style: normal; font-weight: 400; font-display: swap; src: url("fonts/Inter-Regular.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-style: normal; font-weight: 600; font-display: swap; src: url("fonts/Inter-SemiBold.woff2") format("woff2"); }
  @font-face { font-family: "Inter Display"; font-style: normal; font-weight: 400; font-display: swap; src: url("fonts/InterDisplay-Regular.woff2") format("woff2"); }
  @font-face { font-family: "Inter Display"; font-style: normal; font-weight: 600; font-display: swap; src: url("fonts/InterDisplay-SemiBold.woff2") format("woff2"); }
  @font-face { font-family: "Source Serif 4"; font-style: normal; font-weight: 400; font-display: swap; src: url("fonts/SourceSerif4-Regular.woff2") format("woff2"); }
  @font-face { font-family: "Source Serif 4"; font-style: italic; font-weight: 400; font-display: swap; src: url("fonts/SourceSerif4-Italic.woff2") format("woff2"); }

  :root {
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    --curva: var(--ease-out);
    --duracao: 200ms;
    --t-toque: 160ms;
    --t-entrada: 240ms;
    --header-altura: 52px;
    --largura-lateral: 10px;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: var(--fonte-ui);
    color: var(--cor-tinta);
    background: var(--el-moldura, var(--cor-fundo));
  }

  [hidden] { display: none !important; }

  /* Tela de Boas-Vindas (ocupa a tela toda quando ativa) */
  .tela-boasvindas {
    position: fixed;
    inset: 0;
    z-index: 9000;
    display: flex;
    flex-direction: column;
    background: var(--cor-fundo);
    color: var(--cor-tinta);
  }

  /* Moldura Superior do App */
  .app-shell-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: var(--header-altura);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 0 18px;
    box-sizing: border-box;
  }

  .shell-header-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .app-marca {
    display: inline-flex;
    align-items: center;
    border: 0;
    background: transparent;
    color: var(--cor-tinta);
    font: 400 15.5px/1 var(--fonte-ui);
    letter-spacing: -0.015em;
    cursor: pointer;
    padding: 7px 10px;
    border-radius: 8px;
    -webkit-font-smoothing: antialiased;
  }
  .app-marca:hover { background: var(--el-pilula-ativa); box-shadow: var(--el-sombra-pilula); }

  /* Busca Global no Topo */
  .shell-header-center {
    flex: 1;
    max-width: 480px;
    position: relative;
  }
  .busca {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 34px;
    padding: 0 12px;
    border-radius: 8px;
    background: var(--el-pilula-ativa, var(--cor-superficie));
    box-shadow: var(--el-sombra-pilula);
  }
  .busca svg { width: 15px; height: 15px; color: var(--cor-suave); flex: none; }
  .busca input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--cor-tinta);
    font: 400 13.5px var(--fonte-ui);
  }
  .busca input::placeholder { color: var(--cor-suave); }
  .busca kbd {
    font: 500 11px/1 var(--fonte-ui);
    color: var(--cor-suave);
    padding: 3px 5px;
    border-radius: 5px;
    border: 1px solid var(--cor-fio);
    background: var(--cor-superficie-2);
  }

  .busca-lista {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: var(--cor-superficie);
    border-radius: 12px;
    box-shadow: 0 14px 38px rgba(0,0,0,.18), 0 0 0 1px var(--cor-fio);
    list-style: none;
    margin: 0;
    padding: 6px;
    max-height: 400px;
    overflow-y: auto;
    z-index: 1200;
  }
  .busca-grupo-tit {
    padding: 8px 10px 4px;
    font: 600 11px/1.2 var(--fonte-ui);
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--cor-suave);
  }
  .busca-item {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--cor-tinta);
    font-size: 13.5px;
  }
  .busca-item:hover, .busca-item[aria-selected="true"] {
    background: var(--cor-superficie-2);
  }
  .busca-item__secao { font-weight: 600; font-size: 13.5px; display: flex; justify-content: space-between; gap: 8px; }
  .busca-item__secao small { font-weight: 400; color: var(--cor-suave); font-size: 11.5px; }
  .busca-item__trecho { font-size: 12.5px; color: var(--cor-suave); line-height: 1.35; }
  .busca-item__trecho mark { background: rgba(212, 178, 122, .32); color: var(--cor-tinta); border-radius: 3px; padding: 0 2px; }
  .busca-vazio { padding: 14px; text-align: center; color: var(--cor-suave); font-size: 13.5px; }

  /* Botões à Direita no Topo */
  .shell-header-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .topbar-btn, .tema-botao {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 34px;
    padding: 0 11px;
    border-radius: 8px;
    border: 0;
    background: transparent;
    color: var(--cor-suave);
    font: 500 13px/1 var(--fonte-ui);
    cursor: pointer;
  }
  .topbar-btn svg, .tema-botao svg { width: 16px; height: 16px; flex: none; }
  .topbar-btn:hover, .tema-botao:hover {
    background: var(--el-pilula-ativa);
    color: var(--cor-tinta);
    box-shadow: var(--el-sombra-pilula);
  }
  .admin-botao {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 34px;
    padding: 0 10px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--cor-suave);
    font: 500 12.5px/1 var(--fonte-ui);
    cursor: pointer;
    transition: all 160ms var(--ease-out);
  }
  .admin-botao svg { width: 15px; height: 15px; flex: none; }
  .admin-botao:hover {
    background: var(--el-pilula-ativa);
    color: var(--cor-tinta);
    box-shadow: var(--el-sombra-pilula);
  }
  .admin-botao[data-ativo="1"] {
    border-color: var(--cor-nervo, #d29922);
    background: rgba(210, 153, 34, 0.14);
    color: var(--cor-tinta);
    font-weight: 600;
  }

  .conta-pilula {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 34px;
    padding: 0 12px;
    border-radius: 8px;
    border: 1px solid var(--cor-fio);
    background: var(--el-pilula-ativa, var(--cor-superficie));
    color: var(--cor-tinta);
    font: 500 13px/1 var(--fonte-ui);
    box-shadow: var(--el-sombra-pilula);
    cursor: pointer;
  }
  .conta-pilula:hover { border-color: var(--el-borda-forte, var(--cor-tinta)); }
  .conta-pilula img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; }
  .conta-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cor-suave); flex: none; }
  .conta-dot[data-st="salvo"], .conta-dot[data-st="conectado"] { background: var(--cor-linfa, #2ea043); }
  .conta-dot[data-st="sincronizando"] { background: var(--cor-nervo, #d29922); animation: pulsoSync 1s infinite alternate; }
  .conta-dot[data-st="erro"] { background: var(--cor-arteria, #cf222e); }
  @keyframes pulsoSync { from { opacity: .4; } to { opacity: 1; } }

  /* Área de trabalho principal (Cartão arredondado do skin-eleven) */
  .app-workspace-shell {
    position: fixed;
    top: var(--header-altura) !important;
    left: 10px !important;
    right: 10px !important;
    bottom: 10px !important;
    width: calc(100vw - 20px) !important;
    height: calc(100vh - var(--header-altura) - 10px) !important;
    border-radius: 16px !important;
    border: 1px solid var(--cor-fio) !important;
    background: var(--cor-superficie) !important;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 8px 24px rgba(0, 0, 0, .04) !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    box-sizing: border-box;
  }

  main.container {
    max-width: none !important;
    margin: 0 !important;
    padding: 18px 30px 32px !important;
    box-sizing: border-box !important;
  }
  main.container .hero {
    padding: 4px 0 24px !important;
  }
  main.container.ia-lendo {
    padding: 10px 16px !important;
  }
  @media (max-width: 640px) {
    main.container { padding: 16px !important; }
    .shell-header-center { max-width: 200px; }
    .conta-pilula span.conta-sub { display: none; }
  }

  /* Otimizações automáticas quando o sistema detecta celular */
  html[data-dispositivo="celular"],
  html[data-dispositivo="celular"] body {
    overscroll-behavior-y: contain;
    -webkit-tap-highlight-color: transparent;
  }
  html[data-dispositivo="celular"] button,
  html[data-dispositivo="celular"] a {
    touch-action: manipulation;
  }
  html[data-dispositivo="celular"] .app-shell-header {
    padding: 0 10px !important;
    padding-top: env(safe-area-inset-top) !important;
    height: calc(var(--header-altura) + env(safe-area-inset-top)) !important;
    gap: 8px;
  }
  html[data-dispositivo="celular"] .app-marca {
    padding: 6px 8px;
    font-size: 14.5px;
    white-space: nowrap;
  }
  html[data-dispositivo="celular"] .shell-header-center {
    max-width: none;
    min-width: 0;
  }
  html[data-dispositivo="celular"] .busca {
    height: 38px;
    padding: 0 10px;
  }
  html[data-dispositivo="celular"] .busca input {
    font-size: 16px; /* evita zoom automático no iOS Safari */
  }
  html[data-dispositivo="celular"] .busca kbd {
    display: none;
  }
  html[data-dispositivo="celular"] .busca-lista {
    position: fixed;
    top: calc(var(--header-altura) + env(safe-area-inset-top) + 4px);
    left: 10px;
    right: 10px;
    max-height: 65dvh;
  }
  html[data-dispositivo="celular"] .shell-header-right {
    gap: 4px;
    flex: none;
  }
  html[data-dispositivo="celular"] .tema-botao,
  html[data-dispositivo="celular"] .admin-botao,
  html[data-dispositivo="celular"] .conta-pilula {
    min-height: 38px;
    padding: 0 9px;
  }
  html[data-dispositivo="celular"] .conta-pilula #contaTexto {
    max-width: 72px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  html[data-dispositivo="celular"] .app-workspace-shell {
    top: calc(var(--header-altura) + env(safe-area-inset-top)) !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    width: 100% !important;
    height: calc(100vh - var(--header-altura) - env(safe-area-inset-top)) !important;
    height: calc(100dvh - var(--header-altura) - env(safe-area-inset-top)) !important;
    border-radius: 14px 14px 0 0 !important;
    border-left: 0 !important;
    border-right: 0 !important;
    border-bottom: 0 !important;
    -webkit-overflow-scrolling: touch;
  }
  html[data-dispositivo="celular"] main.container {
    padding: 12px 14px calc(24px + env(safe-area-inset-bottom)) !important;
  }
  html[data-dispositivo="celular"] main.container.ia-lendo {
    padding: 6px 8px calc(8px + env(safe-area-inset-bottom)) !important;
  }
  html[data-dispositivo="celular"] .campo {
    font-size: 16px;
    min-height: 42px;
  }
  html[data-dispositivo="celular"] .conta-modal {
    max-height: 88dvh;
    overflow-y: auto;
    padding: 18px;
  }
  html[data-dispositivo="celular"] #toastCaixa {
    left: 12px;
    right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom));
    align-items: center;
  }
  html[data-dispositivo="celular"] .ej-toast {
    max-width: 100%;
    text-align: center;
  }

  /* Campo genérico usado pelas caixas de diálogo */
  .campo {
    display: block;
    width: 100%;
    min-height: 38px;
    padding: 8px 12px;
    border: 1px solid var(--cor-fio);
    border-radius: 8px;
    background: var(--cor-superficie);
    color: var(--cor-tinta);
    font: 400 14px/1.4 var(--fonte-ui);
    box-sizing: border-box;
  }
  .campo:focus { outline: 2px solid var(--cor-tinta); outline-offset: 1px; }

  /* Toast de avisos */
  #toastCaixa {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 20000;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .ej-toast {
    pointer-events: auto;
    padding: 10px 16px;
    border-radius: 10px;
    background: var(--cor-tinta);
    color: var(--cor-fundo);
    font: 500 13.5px/1.35 var(--fonte-ui);
    box-shadow: 0 10px 28px rgba(0,0,0,.22);
    animation: toastEntra .2s var(--ease-out);
  }
  .ej-toast--erro { background: var(--cor-arteria, #c93b2b); color: #fff; }
  @keyframes toastEntra { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* Modal da Conta Google & Backup */
  .conta-modal-fundo {
    position: fixed;
    inset: 0;
    z-index: 10500;
    background: rgba(0,0,0,.36);
    display: grid;
    place-items: center;
    padding: 16px;
  }
  .conta-modal {
    width: min(460px, 100%);
    padding: 22px;
    border-radius: 14px;
    border: 1px solid var(--cor-fio);
    background: var(--cor-superficie);
    color: var(--cor-tinta);
    box-shadow: 0 20px 50px rgba(0,0,0,.28);
    font: 400 14px/1.45 var(--fonte-ui);
  }
  .conta-modal h2 { margin: 0 0 6px; font: 600 18px/1.25 var(--fonte-ui); }
  .conta-modal p { margin: 0 0 14px; color: var(--cor-suave); font-size: 13.5px; }
  .conta-modal__perfil {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border-radius: 10px;
    background: var(--cor-superficie-2);
    margin-bottom: 14px;
  }
  .conta-modal__perfil img { width: 40px; height: 40px; border-radius: 50%; }
  .conta-modal__perfil b { display: block; font-size: 14.5px; }
  .conta-modal__perfil small { color: var(--cor-suave); font-size: 12.5px; }
  .conta-modal__secao {
    padding-top: 14px;
    margin-top: 14px;
    border-top: 1px solid var(--cor-fio);
  }
  .conta-modal__acoes {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }
  .conta-modal details { margin-top: 12px; font-size: 12.5px; color: var(--cor-suave); }
  .conta-modal summary { cursor: pointer; font-weight: 600; color: var(--cor-tinta); }

  /* Página Home (Hub visual com 3 cards em destaque) */
  #homeHub.container {
    max-width: none !important;
    margin: 0 !important;
    padding: 36px 32px 44px !important;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box !important;
  }
  .home-hub__inner {
    width: min(1060px, 100%);
    margin: 0 auto;
  }
  .home-hub__head {
    margin-bottom: 30px;
  }
  .home-hub__eyebrow {
    display: inline-block;
    font: 600 11.5px/1.2 var(--fonte-ui);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--cor-suave);
    margin-bottom: 10px;
  }
  .home-hub__tit {
    margin: 0 0 10px;
    font: 600 32px/1.15 var(--fonte-titulo);
    letter-spacing: -0.028em;
    color: var(--cor-tinta);
  }
  .home-hub__sub {
    margin: 0;
    font-size: 15px;
    line-height: 1.5;
    color: var(--cor-suave);
  }
  .home-hub__grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
  }
  .home-card-wrap {
    position: relative;
  }
  .home-card {
    position: relative;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    aspect-ratio: 1 / 1;
    padding: 0;
    border-radius: 2px;
    border: 0;
    overflow: hidden;
    background: #0f0f12;
    color: #ffffff;
    font: inherit;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0, 0, 0, .08);
    transition: transform 220ms var(--ease-out), box-shadow 220ms var(--ease-out);
  }
  .home-card__admin-bar {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 4;
    display: none;
    align-items: center;
    gap: 6px;
  }
  html[data-admin="1"] .home-card__admin-bar {
    display: flex;
  }
  .home-card__admin-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    padding: 0 10px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    background: rgba(15, 15, 18, 0.72);
    color: #ffffff;
    font: 600 12px/1 var(--fonte-ui);
    cursor: pointer;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
    transition: background-color 160ms var(--ease-out), transform 160ms var(--ease-out), border-color 160ms var(--ease-out);
  }
  .home-card__admin-btn:hover {
    background: rgba(15, 15, 18, 0.92);
    border-color: rgba(255, 255, 255, 0.42);
    transform: translateY(-1px);
  }
  .home-card__admin-btn--icon {
    width: 32px;
    padding: 0;
    justify-content: center;
  }
  .home-card__admin-btn svg {
    width: 14px;
    height: 14px;
    flex: none;
  }
  .home-card::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    background: radial-gradient(circle at center, rgba(0, 0, 0, 0.22) 0%, rgba(0, 0, 0, 0.06) 62%, rgba(0, 0, 0, 0.22) 100%);
    pointer-events: none;
    transition: opacity 220ms var(--ease-out);
  }
  .home-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 18px 38px rgba(0, 0, 0, .18);
  }
  .home-card:active {
    transform: translateY(-1px) scale(0.99);
  }
  .home-card:focus-visible {
    outline: 2.5px solid var(--cor-tinta);
    outline-offset: 3px;
  }
  .home-card__bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;

    transition: transform 420ms var(--ease-out);
  }

    transform: scale(1.05);

  .home-card__tit {
    position: relative;
    z-index: 2;

  .home-card__seta {

  <div id="toastCaixa" aria-live="polite"></div>

  <!-- Scripts do Sistema -->
  <script src="marca_texto.js?v=2"></script>
  <script src="faixa_preenchida.js?v=2"></script>
  <script src="storage_drive.js?v=12"></script>
  <script src="pasta_visual.js?v=5"></script>
  <script src="login_eleven.js?v=5"></script>
  <script src="interativos.js?v=10"></script>
  <script src="banco_questoes.js?v=4"></script>
  <script src="abnt_gerador.js?v=7"></script>
  <script>
    (function () {
      "use strict";
      const $ = id => document.getElementById(id);
      const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

      // Toast global usado por interativos.js
      window.mostrarToast = function (msg, tipo = "sucesso", duracao = 3200) {
        const cx = $("toastCaixa");
        if (!cx) return;
        const el = document.createElement("div");
        el.className = "ej-toast" + (tipo === "erro" ? " ej-toast--erro" : "");
        el.textContent = msg;
        cx.appendChild(el);
        setTimeout(() => { el.remove(); }, duracao);
      };

      // Tema Claro / Escuro
      const IC_SOL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>';
      const IC_LUA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';

      function atualizarIconesTema() {
        const escuro = document.documentElement.dataset.tema === "escuro";
        ["btnTemaLogin", "btnTemaApp"].forEach(id => {
          const b = $(id);
          if (b) b.innerHTML = escuro ? IC_SOL : IC_LUA;
        });
      }
      function alternarTema() {
        const novo = document.documentElement.dataset.tema === "escuro" ? "claro" : "escuro";
        document.documentElement.dataset.tema = novo;
        try { localStorage.setItem("ej_tema", novo); } catch (e) {}
        atualizarIconesTema();
      }
      $("btnTemaLogin").onclick = alternarTema;
      $("btnTemaApp").onclick = alternarTema;
      atualizarIconesTema();

      // Controle da Tela de Boas-Vindas (Acesso exclusivo via Login Google)
      const telaBV = $("telaBoasVindas");
      function temSessaoGoogleAtiva() {
        const st = window.EJStorageDrive ? window.EJStorageDrive.obterStatus() : null;
        return !!(st && st.conectado && st.conta && st.conta.email);
      }
      function entrarNoApp() {
        if (!temSessaoGoogleAtiva()) {
          telaBV.hidden = false;
          return;
        }
        telaBV.hidden = true;
        try { sessionStorage.setItem("ej_bv_entrou", "1"); } catch (e) {}
        if (window.interativos) window.interativos.carregar();
      }
      function mostrarBoasVindas() {
        telaBV.hidden = false;
        try { sessionStorage.removeItem("ej_bv_entrou"); } catch (e) {}
      }

      if (temSessaoGoogleAtiva()) {
        telaBV.hidden = true;
      } else {
        telaBV.hidden = false;
        try { sessionStorage.removeItem("ej_bv_entrou"); } catch (e) {}
      }

      const btnEntrarSemLogin = $("btnEntrarSistema");
      if (btnEntrarSemLogin) btnEntrarSemLogin.remove();

      let loginGoogleEmCurso = false;
      async function acionarLoginGoogle() {
        if (loginGoogleEmCurso) return;
        loginGoogleEmCurso = true;
        const btn = $("btnEntrarGoogle");
        const htmlOriginal = btn ? btn.innerHTML : "";
        let timerId = null;
        let inicioMs = 0;

        if (btn) btn.disabled = true;

        const iniciarCronometro = () => {
          if (timerId) return;
          inicioMs = performance.now();
          const spanLabel = btn ? btn.querySelector("span") : null;
          const atualizar = () => {
            const seg = ((performance.now() - inicioMs) / 1000).toFixed(1).replace(".", ",");
            if (spanLabel) {
              spanLabel.innerHTML = `Entrando... <span style="font-variant-numeric:tabular-nums">${seg}s</span>`;
            } else if (btn) {
              btn.textContent = `Entrando... ${seg}s`;
            }
          };
          atualizar();
          timerId = setInterval(atualizar, 100);
        };

        try {
          await window.EJStorageDrive.entrarComGoogle({ aoAutenticar: iniciarCronometro });
          const totalSeg = inicioMs ? ((performance.now() - inicioMs) / 1000).toFixed(1).replace(".", ",") : "";
          window.mostrarToast(totalSeg ? `Conectado ao Google Drive! (${totalSeg}s)` : "Conectado ao Google Drive!");
          entrarNoApp();
        } catch (e) {
          window.mostrarToast(e.message || "Não foi possível conectar ao Google.", "erro", 4500);
        } finally {
          if (timerId) clearInterval(timerId);
          if (btn) {
            btn.disabled = false;
            if (htmlOriginal) btn.innerHTML = htmlOriginal;
          }
          loginGoogleEmCurso = false;
        }
      }

      $("btnEntrarGoogle").onclick = acionarLoginGoogle;

      // Navegação entre Home, Apostilas Interativas, Banco de Questões e Colocar na ABNT
      function alternarAbaPrincipal(aba) {
        const alvo = aba === "abnt" ? "abnt"
          : aba === "apostilas" ? "apostilas"
          : aba === "questoes" ? "questoes"
          : "home";
        const elHome = $("homeHub");
        const elInterativos = $("interativos");
        const elQuestoes = $("bancoQuestoes");
        const elAbnt = $("geradorAbnt");
        const btnHm = $("btnNavHome");
        const btnAp = $("btnNavApostilas");
        const btnQs = $("btnNavQuestoes");
        const btnAb = $("btnNavAbnt");

        if (elHome) elHome.hidden = alvo !== "home";
        if (elInterativos) elInterativos.hidden = alvo !== "apostilas";
        if (elQuestoes) elQuestoes.hidden = alvo !== "questoes";
        if (elAbnt) elAbnt.hidden = alvo !== "abnt";

        if (btnHm) btnHm.setAttribute("aria-selected", alvo === "home" ? "true" : "false");
        if (btnAp) btnAp.setAttribute("aria-selected", alvo === "apostilas" ? "true" : "false");
        if (btnQs) btnQs.setAttribute("aria-selected", alvo === "questoes" ? "true" : "false");
        if (btnAb) btnAb.setAttribute("aria-selected", alvo === "abnt" ? "true" : "false");

        if (alvo === "abnt" && window.EJGeradorABNT) {
          window.EJGeradorABNT.abrir();
        } else if (alvo === "questoes" && window.EJBancoQuestoes) {
          window.EJBancoQuestoes.abrir();
        } else if (alvo === "apostilas" && window.interativos) {
          window.interativos.carregar();
        }

        const shell = document.querySelector(".app-workspace-shell");
        if (shell) shell.scrollTo({ top: 0, behavior: "smooth" });
        try {
          const hashAlvo = alvo === "abnt" ? "#abnt"
            : alvo === "apostilas" ? "#apostilas"
            : alvo === "questoes" ? "#questoes"
            : "";
          if (hashAlvo && location.hash !== hashAlvo) history.replaceState(null, "", hashAlvo);
          else if (!hashAlvo && (location.hash === "#abnt" || location.hash === "#apostilas" || location.hash === "#questoes")) {
            history.replaceState(null, "", location.pathname + location.search);
          }
        } catch (e) {}
      }
      window.alternarAbaPrincipal = alternarAbaPrincipal;

      if ($("btnNavHome")) $("btnNavHome").onclick = () => {
        if (window.interativos) window.interativos.fechar();
        alternarAbaPrincipal("home");
      };
      if ($("btnNavApostilas")) $("btnNavApostilas").onclick = () => alternarAbaPrincipal("apostilas");
      if ($("btnNavQuestoes")) $("btnNavQuestoes").onclick = () => {
        if (window.interativos) window.interativos.fechar();
        alternarAbaPrincipal("questoes");
      };
      if ($("btnNavAbnt")) $("btnNavAbnt").onclick = () => alternarAbaPrincipal("abnt");
      if ($("btnHomeApostilas")) $("btnHomeApostilas").onclick = () => alternarAbaPrincipal("apostilas");
      if ($("btnHomeQuestoes")) $("btnHomeQuestoes").onclick = () => alternarAbaPrincipal("questoes");
      if ($("btnHomeAbnt")) $("btnHomeAbnt").onclick = () => alternarAbaPrincipal("abnt");

      // Personalização das imagens dos cards da Home no Modo Administrador
      function aplicarCapasHome() {
        const capas = (window.EJStorageDrive && window.EJStorageDrive.obterCapasHome)
          ? window.EJStorageDrive.obterCapasHome()
          : {};
        document.querySelectorAll("img[data-home-bg]").forEach(img => {
          const id = img.dataset.homeBg;
          const customUrl = capas[id] || "";
          const padrao = img.dataset.defaultSrc || img.getAttribute("src") || "";
          img.src = customUrl || padrao;
          const btnReset = document.querySelector(`[data-home-restaurar="${id}"]`);
          if (btnReset) btnReset.hidden = !customUrl;
        });
      }

      function otimizarImagemCapaHome(arquivo) {
        return new Promise((resolve, reject) => {
          if (!arquivo || !arquivo.type || !arquivo.type.startsWith("image/")) {
            return reject(new Error("Selecione um arquivo de imagem válido (JPG, PNG, WebP ou GIF)."));
          }
          // Mantém GIFs animados sem passar pelo canvas
          if (arquivo.type === "image/gif") {
            const fr = new FileReader();
            fr.onload = () => resolve(fr.result);
            fr.onerror = () => reject(new Error("Não foi possível ler o GIF."));
            fr.readAsDataURL(arquivo);
            return;
          }
          const fr = new FileReader();
          fr.onload = () => {
            const img = new Image();
            img.onload = () => {
              const MAX = 1400;
              let w = img.naturalWidth || img.width;
              let h = img.naturalHeight || img.height;
              if (w > MAX || h > MAX) {
                const esc = Math.min(MAX / w, MAX / h);
                w = Math.round(w * esc);
                h = Math.round(h * esc);
              }
              const cv = document.createElement("canvas");
              cv.width = w;
              cv.height = h;
              const ctx = cv.getContext("2d");
              ctx.drawImage(img, 0, 0, w, h);
              try {
                const saida = cv.toDataURL("image/webp", 0.9);
                resolve(saida.startsWith("data:image/webp") ? saida : cv.toDataURL("image/jpeg", 0.9));
              } catch (e) {
                resolve(fr.result);
              }
            };
            img.onerror = () => reject(new Error("Não foi possível processar esta imagem."));
            img.src = fr.result;
          };
          fr.onerror = () => reject(new Error("Não foi possível ler a imagem."));
          fr.readAsDataURL(arquivo);
        });
      }

      const inputCapaHome = $("inputCapaHome");
      let cardAlvoCapa = "";
      document.querySelectorAll("[data-home-trocar]").forEach(btn => {
        btn.addEventListener("click", e => {
          e.preventDefault();
          e.stopPropagation();
          if (!window.EJStorageDrive || !window.EJStorageDrive.ehAdmin()) {
            window.mostrarToast("Ative o Modo Administrador primeiro.", "erro");
            return;
          }
          cardAlvoCapa = btn.dataset.homeTrocar || "";
          if (inputCapaHome) {
            inputCapaHome.value = "";
            inputCapaHome.click();
          }
        });
      });

      document.querySelectorAll("[data-home-restaurar]").forEach(btn => {
        btn.addEventListener("click", e => {
          e.preventDefault();
          e.stopPropagation();
          const id = btn.dataset.homeRestaurar || "";
          try {
            window.EJStorageDrive.restaurarCapaHome(id);
            aplicarCapasHome();
            window.mostrarToast("Imagem padrão restaurada!");
          } catch (err) {
            window.mostrarToast(err.message || "Erro ao restaurar imagem.", "erro");
          }
        });
      });

      if (inputCapaHome) {
        inputCapaHome.addEventListener("change", async () => {
          const arq = inputCapaHome.files && inputCapaHome.files[0];
          const alvo = cardAlvoCapa;
          inputCapaHome.value = "";
          if (!arq || !alvo) return;
          try {
            const dataUrl = await otimizarImagemCapaHome(arq);
            window.EJStorageDrive.salvarCapaHome(alvo, dataUrl);
            aplicarCapasHome();
            const nomes = { apostilas: "Apostilas", questoes: "Questões", abnt: "ABNT" };
            window.mostrarToast(`Imagem do card ${nomes[alvo] || alvo} atualizada!`);
          } catch (err) {
            window.mostrarToast(err.message || "Não foi possível trocar a imagem.", "erro", 4500);
          }
        });
      }

      window.addEventListener("ej-home-capas-mudou", aplicarCapasHome);
      window.addEventListener("ej-admin-mudou", aplicarCapasHome);
      aplicarCapasHome();

      if (location.hash === "#abnt") alternarAbaPrincipal("abnt");
      else if (location.hash === "#questoes") alternarAbaPrincipal("questoes");
      else if (location.hash === "#apostilas") alternarAbaPrincipal("apostilas");
      else alternarAbaPrincipal("home");

      $("btnMarcaInicio").onclick = () => {
        if (window.interativos) window.interativos.fechar();
        if (temSessaoGoogleAtiva()) {
          telaBV.hidden = true;
          try { sessionStorage.setItem("ej_bv_entrou", "1"); } catch (e) {}
          alternarAbaPrincipal("home");
        } else {
          mostrarBoasVindas();
        }
      };

      // Atalho Enter na tela de boas-vindas aciona o login com Google
      document.addEventListener("keydown", e => {
        if (!telaBV.hidden && e.key === "Enter" && !e.ctrlKey && !e.altKey && !e.metaKey) {
          if (document.activeElement && document.activeElement.tagName === "BUTTON") return;
          e.preventDefault();
          acionarLoginGoogle();
        }
      });

      // Status do Google Drive na Barra Superior
      function desenharStatusConta(det) {
        const dot = $("contaDot"), foto = $("contaFoto"), txt = $("contaTexto");
        if (!dot || !txt) return;
        dot.dataset.st = det.status || "local";
        if (det.conectado && det.conta) {
          if (det.conta.foto) { foto.src = det.conta.foto; foto.hidden = false; }
          else foto.hidden = true;
          const primeiroNome = String(det.conta.nome || "Google Drive").split(" ")[0];
          const estadoTxt = det.status === "sincronizando" ? "Sincronizando..."
            : det.status === "erro" ? "Erro no Drive"
            : "Salvo no Drive";
          txt.innerHTML = `<b>${esc(primeiroNome)}</b> <span class="conta-sub" style="color:var(--cor-suave)">· ${esc(estadoTxt)}</span>`;
          const saud = $("homeSaudacao");
          if (saud) saud.textContent = `Olá, ${primeiroNome}. O que você quer fazer agora?`;
        } else {
          foto.hidden = true;
          txt.textContent = "Entrar com Google";
          const saud = $("homeSaudacao");
          if (saud) saud.textContent = "O que você quer fazer agora?";
        }
      }
      window.addEventListener("ej-sync-status", e => desenharStatusConta(e.detail));
      if (window.EJStorageDrive) desenharStatusConta(window.EJStorageDrive.obterStatus());

      // Modal de Conta Google
      function abrirModalConta() {
        const st = window.EJStorageDrive.obterStatus();
        const fundo = document.createElement("div");
        fundo.className = "conta-modal-fundo";
        fundo.innerHTML = `
          <div class="conta-modal" role="dialog" aria-modal="true" aria-labelledby="cmTit">
            <h2 id="cmTit">Progresso e Google Drive</h2>
            <p>Suas respostas, posição de leitura e marcações do Estojo são salvos automaticamente neste navegador e sincronizados com o seu Google Drive pessoal.</p>
            ${st.conectado && st.conta ? `
              <div class="conta-modal__perfil">
                ${st.conta.foto ? `<img src="${esc(st.conta.foto)}" alt="">` : ""}
                <div style="flex:1;min-width:0">
                  <b>${esc(st.conta.nome || "Conta Google")}</b>
                  <small>${esc(st.conta.email || "")}</small>
                </div>
              </div>
              <div class="conta-modal__acoes">
                <button type="button" class="botao botao--primario" data-acao="sync">Sincronizar agora</button>
                <button type="button" class="botao botao--secundario" data-acao="sair">Desconectar conta</button>
              </div>
            ` : `
              <div class="conta-modal__acoes">
                <button type="button" class="botao botao--primario" data-acao="entrar">Conectar com Google Drive</button>
              </div>
            `}
            ${st.erro ? `<p style="color:var(--cor-arteria);margin-top:10px">${esc(st.erro)}</p>` : ""}

            <div class="conta-modal__secao" style="display:flex;justify-content:flex-end">
              <button type="button" class="botao botao--secundario" data-acao="fechar">Fechar</button>
            </div>
          </div>`;

        const fechar = () => fundo.remove();
        fundo.addEventListener("mousedown", e => { if (e.target === fundo) fechar(); });
        fundo.querySelector('[data-acao="fechar"]').onclick = fechar;

        const btnEntrar = fundo.querySelector('[data-acao="entrar"]');
        if (btnEntrar) btnEntrar.onclick = async () => {
          btnEntrar.disabled = true;
          try {
            await window.EJStorageDrive.entrarComGoogle();
            window.mostrarToast("Conectado ao Google Drive!");
            fechar();
          } catch (e) {
            window.mostrarToast(e.message, "erro", 4500);
            btnEntrar.disabled = false;
          }
        };

        const btnSync = fundo.querySelector('[data-acao="sync"]');
        if (btnSync) btnSync.onclick = async () => {
          btnSync.disabled = true;
          btnSync.textContent = "Sincronizando...";
          const ok = await window.EJStorageDrive.sincronizarComDriveAgora();
          window.mostrarToast(ok ? "Sincronizado com o Google Drive!" : "Não foi possível sincronizar agora.", ok ? "sucesso" : "erro");
          fechar();
        };

        const btnSair = fundo.querySelector('[data-acao="sair"]');
        if (btnSair) btnSair.onclick = () => {
          window.EJStorageDrive.sairDoGoogle();
          window.mostrarToast("Conta Google desconectada.");
          fechar();
          mostrarBoasVindas();
        };

        document.body.appendChild(fundo);
      }
      $("btnContaGoogle").onclick = abrirModalConta;

      // ================= MODO ADMINISTRADOR (CANTO SUPERIOR DIREITO) =================
      const IC_CADEADO_FECHADO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
      const IC_CADEADO_ABERTO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>';

      function atualizarBotaoAdmin() {
        const b = $("btnModoAdmin");
        if (!b) return;
        const ativo = !!(window.EJStorageDrive && window.EJStorageDrive.ehAdmin());
        b.dataset.ativo = ativo ? "1" : "0";
        b.innerHTML = ativo ? `${IC_CADEADO_ABERTO}<span>Admin</span>` : IC_CADEADO_FECHADO;
        b.title = ativo ? "Modo Admin ativo (clique para configurar ou sair para Visão do Aluno)" : "Entrar como Administrador";
      }

      function abrirModalAdmin() {
        const ativo = !!(window.EJStorageDrive && window.EJStorageDrive.ehAdmin());
        const nomePastaPC = window.EJStorageDrive?.nomePastaPCConectada ? window.EJStorageDrive.nomePastaPCConectada() : "";
        const fundo = document.createElement("div");
        fundo.className = "conta-modal-fundo";
        if (!ativo) {
          fundo.innerHTML = `
            <div class="conta-modal" role="dialog" aria-modal="true" aria-labelledby="admTit">
              <h2 id="admTit">Acesso do Administrador</h2>
              <p>Digite a senha de administrador para liberar a criação de pastas, personalização de capas e adição de apostilas.</p>
              <div style="position:relative;display:flex;align-items:center">
                <input class="campo" type="password" data-senha-adm placeholder="Senha de administrador" autocomplete="off" style="padding-right:42px">
                <button type="button" data-ver-senha title="Mostrar/ocultar senha" style="position:absolute;right:8px;border:0;background:transparent;color:var(--cor-suave);cursor:pointer;padding:4px;display:grid;place-items:center">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
              <p data-erro-adm style="color:var(--cor-arteria);margin:8px 0 0;font-size:13px" hidden>Senha incorreta.</p>
              <div class="conta-modal__acoes" style="justify-content:flex-end;margin-top:16px">
                <button type="button" class="botao botao--secundario" data-acao="fechar">Cancelar</button>
                <button type="button" class="botao botao--primario" data-acao="entrar-adm">Entrar como Admin</button>
              </div>
            </div>`;
        } else {
          fundo.innerHTML = `
            <div class="conta-modal" role="dialog" aria-modal="true" aria-labelledby="admTit">
              <h2 id="admTit">Painel do Administrador</h2>
              <p>O modo de edição está <b>ativo</b>. Você pode criar, renomear, mover e personalizar pastas e apostilas, ou adicionar novas apostilas.</p>
              <div class="conta-modal__secao">
                <b style="font-size:13.5px">Sincronizar com a pasta do seu PC (GitHub / Vercel)</b>
                <p style="margin:4px 0 10px">Salva todas as pastas, cores, GIFs e apostilas direto em <code>catalogo.json</code> dentro da sua pasta <b>Apostilas-Vercel</b> no computador. Depois é só rodar o <code>atualizar.bat</code>.</p>
                <div class="conta-modal__acoes">
                  <button type="button" class="botao botao--primario" data-acao="salvar-pc">${nomePastaPC ? `Atualizar pasta "${esc(nomePastaPC)}" agora` : "Vincular e salvar na pasta do PC"}</button>
                </div>
              </div>
              <div class="conta-modal__secao" style="display:flex;justify-content:space-between;align-items:center">
                <button type="button" class="botao botao--secundario" data-acao="sair-adm">Voltar para Visão do Aluno</button>
                <button type="button" class="botao botao--secundario" data-acao="fechar">Fechar</button>
              </div>
            </div>`;
        }

        const fechar = () => fundo.remove();
        fundo.addEventListener("mousedown", e => { if (e.target === fundo) fechar(); });
        fundo.querySelector('[data-acao="fechar"]').onclick = fechar;

        const inpSenha = fundo.querySelector("[data-senha-adm]");
        const btnVerSenha = fundo.querySelector("[data-ver-senha]");
        if (btnVerSenha && inpSenha) {
          btnVerSenha.onclick = () => {
            inpSenha.type = inpSenha.type === "password" ? "text" : "password";
            inpSenha.focus();
          };
        }
        const erroEl = fundo.querySelector("[data-erro-adm]");
        const btnEntrarAdm = fundo.querySelector('[data-acao="entrar-adm"]');
        if (btnEntrarAdm && inpSenha) {
          const tentar = () => {
            if (window.EJStorageDrive.entrarModoAdmin(inpSenha.value)) {
              window.mostrarToast("Modo Administrador ativado!");
              fechar();
            } else {
              erroEl.hidden = false;
              inpSenha.select();
            }
          };
          btnEntrarAdm.onclick = tentar;
          inpSenha.addEventListener("keydown", e => {
            if (e.key === "Enter") { e.preventDefault(); tentar(); }
            else if (e.key === "Escape") { e.preventDefault(); fechar(); }
          });
          setTimeout(() => inpSenha.focus(), 30);
        }

        const btnSalvarPC = fundo.querySelector('[data-acao="salvar-pc"]');
        if (btnSalvarPC) {
          btnSalvarPC.onclick = async () => {
            btnSalvarPC.disabled = true;
            try {
              const r = await window.EJStorageDrive.salvarNaPastaDoPC(true);
              if (r && r.ok) {
                window.mostrarToast(`Salvo na pasta "${r.pasta}" do PC!`);
                fechar();
              }
            } catch (e) {
              if (e && e.name !== "AbortError") window.mostrarToast(e.message || "Erro ao salvar na pasta.", "erro", 4500);
              btnSalvarPC.disabled = false;
            }
          };
        }

        const btnSairAdm = fundo.querySelector('[data-acao="sair-adm"]');
        if (btnSairAdm) {
          btnSairAdm.onclick = () => {
            window.EJStorageDrive.sairModoAdmin();
            window.mostrarToast("Visão do Aluno ativada.");
            fechar();
          };
        }

        document.body.appendChild(fundo);
      }

      $("btnModoAdmin").onclick = abrirModalAdmin;
      window.addEventListener("ej-admin-mudou", atualizarBotaoAdmin);
      atualizarBotaoAdmin();

      // ================= BUSCA GLOBAL EM TODAS AS APOSTILAS =================
      const campoBusca = $("campoBuscaGlobal"), listaBusca = $("listaBuscaGlobal");
      let timerBusca = 0;

      function destacarTrecho(trecho, inicio, tamanho) {
        if (typeof inicio !== "number" || !tamanho || inicio < 0 || inicio >= trecho.length) return esc(trecho);
        return esc(trecho.slice(0, inicio)) + "<mark>" + esc(trecho.slice(inicio, inicio + tamanho)) + "</mark>" + esc(trecho.slice(inicio + tamanho));
      }

      async function executarBuscaGlobal(termo) {
        const q = (termo || "").trim();
        if (q.length < 2) {
          listaBusca.hidden = true;
          listaBusca.innerHTML = "";
          return;
        }
        try {
          const r = await fetch(`/api/interativos-buscar?q=${encodeURIComponent(q)}`);
          const d = await r.json();
          const res = d.resultados || [];
          if (!res.length) {
            listaBusca.innerHTML = `<li class="busca-vazio">Nenhum resultado para "<b>${esc(q)}</b>" nas apostilas.</li>`;
            listaBusca.hidden = false;
            return;
          }
          let html = "";
          for (const ap of res) {
            html += `<li class="busca-grupo-tit">${esc(ap.titulo)} (${ap.total} ${ap.total === 1 ? "ocorrência" : "ocorrências"})</li>`;
            for (const tr of (ap.trechos || [])) {
              html += `<li class="busca-item" data-pasta="${esc(ap.pasta)}" data-hash="${esc(tr.hash || "")}" data-termo="${esc(q)}">
                <span class="busca-item__secao"><span>${esc(tr.secao || ap.titulo)}</span><small>${tr.vezes}×</small></span>
                <span class="busca-item__trecho">${destacarTrecho(tr.trecho || "", tr.inicio, tr.tamanho)}</span>
              </li>`;
            }
          }
          listaBusca.innerHTML = html;
          listaBusca.hidden = false;
          listaBusca.querySelectorAll(".busca-item").forEach(li => {
            li.onclick = () => {
              listaBusca.hidden = true;
              campoBusca.value = "";
              alternarAbaPrincipal("apostilas");
              if (window.interativos) {
                window.interativos.abrir(li.dataset.pasta, { hash: li.dataset.hash, termo: li.dataset.termo });
              }
            };
          });
        } catch (e) {
          listaBusca.hidden = true;
        }
      }

      campoBusca.addEventListener("input", () => {
        clearTimeout(timerBusca);
        timerBusca = setTimeout(() => executarBuscaGlobal(campoBusca.value), 160);
      });
      campoBusca.addEventListener("focus", () => {
        if (campoBusca.value.trim().length >= 2) executarBuscaGlobal(campoBusca.value);
      });
      document.addEventListener("mousedown", e => {
        if (!e.target.closest(".shell-header-center")) listaBusca.hidden = true;
      });
      document.addEventListener("keydown", e => {
        if (e.key === "/" && telaBV.hidden && document.activeElement !== campoBusca && !["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName)) {
          e.preventDefault();
          campoBusca.focus();
        } else if (e.key === "Escape" && !listaBusca.hidden) {
          listaBusca.hidden = true;
        }
      });
    })();
  </script>
</body>
</html>
