<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ribossomo bacteriano interativo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fbfbfa;color:#203843;font:15px system-ui,sans-serif}
main{max-width:1000px;margin:auto;padding:16px}h1{font-size:21px;margin:0 0 7px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}button{background:white;color:#203843;border:1px solid #a4b8bc;border-radius:7px;padding:7px 10px;cursor:pointer}
button:focus-visible,[role=button]:focus-visible{outline:3px solid #d68426}
button[aria-pressed=true]{background:#dceeee}.layout{display:grid;grid-template-columns:1.25fr 1fr;gap:15px}
svg{width:100%;height:325px;background:#f1f5f4;border-radius:12px}
.layer{cursor:pointer;transition:transform .45s,opacity .3s}.layer polygon{stroke:#315d67;stroke-width:1.5}
.layer.active polygon{stroke:#bb6217;stroke-width:4}.layer:hover{opacity:.85}
text{font:16px system-ui;fill:#173b45;pointer-events:none}
aside{background:white;border:1px solid #d2dedd;border-radius:12px;padding:16px;min-height:240px}
h2{font-size:18px;margin-top:0}small{display:block;color:#526b73}
@media(max-width:650px){.layout{grid-template-columns:1fr}svg{height:285px}}
@media(prefers-reduced-motion:reduce){.layer{transition:none}}
</style>
</head>
<body>
<main>
<h1>Ribossomo bacteriano: alvos da síntese proteica</h1>
<small>Modelo funcional isométrico, não representa escala molecular. Teclas 1-5 selecionam; E explode; 0 restaura.</small>
<div class="tools" id="tools"></div>
<div class="layout">
<svg viewBox="0 0 500 380" role="img" aria-label="Cinco camadas funcionais do ribossomo bacteriano">
<g id="layers">
<g class="layer" data-i="0" tabindex="0" role="button" aria-label="1 RNAm">
<polygon fill="#dce6ed" points="65,260 290,190 440,260 215,330"/>
<text x="180" y="282">1 · RNAm</text></g>
<g class="layer" data-i="1" tabindex="0" role="button" aria-label="2 Subunidade 30S">
<polygon fill="#a7d6d2" points="80,225 290,160 425,225 215,290"/>
<text x="170" y="242">2 · 30S</text></g>
<g class="layer" data-i="2" tabindex="0" role="button" aria-label="3 RNAt">
<polygon fill="#f1dfad" points="110,190 290,135 395,190 215,245"/>
<text x="180" y="205">3 · RNAt</text></g>
<g class="layer" data-i="3" tabindex="0" role="button" aria-label="4 Subunidade 50S">
<polygon fill="#b8cadf" points="80,150 290,85 425,150 215,215"/>
<text x="170" y="166">4 · 50S</text></g>
<g class="layer" data-i="4" tabindex="0" role="button" aria-label="5 Proteína nascente">
<polygon fill="#e8c9b6" points="125,110 290,60 380,110 215,160"/>
<text x="160" y="121">5 · Proteína</text></g>
</g>
</svg>
<aside aria-live="polite" aria-atomic="true">
<h2 id="heading"></h2><p id="reading"></p><small id="clinical"></small>
</aside>
</div>
</main>
<script>
const data=[
['RNAm: a sequência','O RNAm fornece os códons usados na tradução. O modelo acompanha apenas a síntese proteica bacteriana.','A sequência é lida pelo ribossomo; os fármacos estudados atuam no aparelho de tradução.'],
['30S: tetraciclinas','Tetraciclinas dificultam a entrada do aminoacil-RNAt no sítio A. A atividade é predominantemente bacteriostática.','Doxiciclina: atenção à quelação com cátions, esofagite e fotossensibilidade.'],
['RNAt: entrega de aminoácidos','O RNAt transporta aminoácidos. O bloqueio da entrada do aminoacil-RNAt explica a interrupção da tradução pelas tetraciclinas.','Efluxo e proteção ribossomal podem conferir resistência às tetraciclinas.'],
['50S: etapas diferentes','Macrolídeos interferem na elongação e translocação; clindamicina interfere na elongação; cloranfenicol inibe a atividade peptidiltransferase. Linezolida bloqueia a formação adequada do complexo de iniciação.','Compartilhar a 50S não significa compartilhar o mesmo sítio, espectro ou perfil de segurança.'],
['Proteína nascente: resultado do bloqueio','A inibição da tradução reduz a produção de proteínas bacterianas. O efeito clínico ainda depende de exposição, sensibilidade e sítio da infecção.','Clindamicina: colite. Linezolida: hemograma e serotonina. Cloranfenicol: medula e acúmulo neonatal.']
];
let selected=0,exploded=false;
const groups=[...document.querySelectorAll('.layer')],tools=document.getElementById('tools');
data.forEach((d,i)=>{
 const b=document.createElement('button');b.textContent=(i+1)+' · '+['RNAm','30S','RNAt','50S','Proteína'][i];
 b.onclick=()=>select(i);b.dataset.n=i;tools.appendChild(b);
});
const e=document.createElement('button');e.textContent='E · Explodir';e.onclick=()=>explode();tools.appendChild(e);
const z=document.createElement('button');z.textContent='0 · Restaurar';z.onclick=()=>reset();tools.appendChild(z);
function height(){parent.postMessage({type:'anatomy-height',id:'modelo-principal',height:Math.ceil(document.documentElement.getBoundingClientRect().height)},'*')}
function select(i){
 selected=i;groups.forEach((g,n)=>g.classList.toggle('active',n===i));
 document.querySelectorAll('[data-n]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.n)===i?'true':'false'));
 document.getElementById('heading').textContent=data[i][0];
 document.getElementById('reading').textContent=data[i][1];
 document.getElementById('clinical').textContent=data[i][2];requestAnimationFrame(height);
}
function explode(){
 exploded=!exploded;
 groups.forEach((g,i)=>g.style.transform=exploded?`translate(${(i-2)*9}px,${(2-i)*23}px)`:'');
 e.setAttribute('aria-pressed',String(exploded));e.textContent=exploded?'E · Reunir':'E · Explodir';height();
}
function reset(){if(exploded)explode();select(0)}
groups.forEach((g,i)=>{
 g.onclick=()=>select(i);
 g.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();select(i)}};
});
document.addEventListener('keydown',ev=>{
 if(ev.ctrlKey||ev.metaKey||ev.altKey)return;
 if(/^[1-5]$/.test(ev.key)){ev.preventDefault();select(Number(ev.key)-1)}
 else if(ev.key.toLowerCase()==='e'){ev.preventDefault();explode()}
 else if(ev.key==='0'){ev.preventDefault();reset()}
});
select(0);window.addEventListener('load',height);
if(window.ResizeObserver)new ResizeObserver(height).observe(document.body);
</script>
</body>
</html>
