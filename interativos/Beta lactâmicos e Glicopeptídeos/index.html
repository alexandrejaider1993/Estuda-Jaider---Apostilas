<footer class="gut"><div class="rod-in"><div><p><b>β-lactâmicos e glicopeptídeos</b></p><p>Farmacoterapia · 2026.2 · FASM · Aula de 15/10, 22/10 e 29/10/2026</p><p>Fontes: aulas de Antimicrobianos (Partes I e II), slides de Farmacologia dos Antimicrobianos (Partes I, II e III) e Banco de Questões de Farmacoterapia (cap. 8.2)</p></div><div><a href="#mapa">Início</a><a href="#revisar">Revisar</a><a href="#revisao">Revisão</a></div></div></footer>
<script>
const D={"capitulos": [{"id": "c1", "titulo": "Parede celular, PBPs e Penicilinas", "abertura": "Todo β-lactâmico e todo glicopeptídeo atacam a mesma fortaleza bacteriana: a parede celular de peptidoglicano. Entender como essa parede se monta explica por que esses fármacos são bactericidas, por que a alergia pode ser cruzada e por que a resistência à oxacilina muda completamente a conduta clínica.", "slides": "Parte I: slides 11, 20, 21, 26, 29, 31 a 34 · Parte II: slides 28 a 37, 52 e 53", "provas": "Banco de Farmacoterapia: Q393 (prova antiga) e Q325 (simulado)"}, {"id": "c2", "titulo": "Cefalosporinas e β-lactâmicos não clássicos", "abertura": "Neste capítulo você vai entender por que o espectro das cefalosporinas muda de Gram-positivos para Gram-negativos ao avançar das gerações, como os inibidores de β-lactamases resgatam penicilinas antigas, quando escolher o aztreonam e por que a falha de um carbapenêmico acende o alerta de KPC.", "slides": "Parte II: slides 38 a 51 e 62 · Parte III: slides 64, 65, 69 a 71, 74 a 76", "provas": "Banco de Farmacoterapia: Q316 e Q396 (provas antigas), Q318, Q326 e Q331 (simulados)"}, {"id": "c3", "titulo": "Glicopeptídeos: Vancomicina, Teicoplanina e Segurança Clínica", "abertura": "Quando um Staphylococcus aureus resiste à oxacilina, os β-lactâmicos clássicos saem de cena e entram os glicopeptídeos. Aqui você vai entender por que a vancomicina não sofre resistência cruzada com penicilinas, quando preferir a teicoplanina, como evitar a Síndrome do Pescoço Vermelho e por que associar vancomicina com gentamicina multiplica a toxicidade.", "slides": "Parte I: slides 10, 12, 29, 35 e 37 · Parte II: slides 54 a 61 · Parte III: slides 73, 75 e 76", "provas": "Banco de Farmacoterapia: Q315, Q317 e Q329 (provas antigas), Q319, Q321, Q322, Q324, Q327, Q328 e Q382 (simulados)"}], "conceitos": [{"id": "parede-bactericida", "nome": "Inibição da parede e ação bactericida", "definicao": "β-lactâmicos e glicopeptídeos são as duas classes mais importantes de inibidores da parede celular e exercem efeito bactericida."}, {"id": "pbp-transpeptidacao", "nome": "PBPs e transpeptidação", "definicao": "Os β-lactâmicos ligam-se e inativam as proteínas ligadoras de penicilina (PBP), bloqueiam a transpeptidação do peptidoglicano e ativam enzimas autolíticas."}, {"id": "anel-beta-resistencia", "nome": "Anel β-lactâmico, alergia cruzada e β-lactamases", "definicao": "O compartilhamento do anel β-lactâmico explica a alergia cruzada entre classes e torna a produção de β-lactamases o mecanismo de resistência mais comum."}, {"id": "penicilinas-subclasses", "nome": "Classificação e espectro das penicilinas", "definicao": "Penicilinas dividem-se em naturais, antiestafilocócicas (oxacilina), aminopenicilinas (amoxicilina/ampicilina), carboxipenicilinas e ureidopenicilinas (piperacilina)."}, {"id": "oxacilina-mrsa", "nome": "Oxacilina e alerta de MRSA", "definicao": "A oxacilina resiste às penicilinases estafilocócicas; se S. aureus for resistente à oxacilina (MRSA), infere-se resistência aos demais β-lactâmicos e escolhe-se vancomicina."}, {"id": "penicilinas-pk-interacoes", "nome": "Farmacocinética, efeitos adversos e interações das penicilinas", "definicao": "Eliminadas por secreção tubular (reduzida pela probenecida), seguras na gestação, causam hipersensibilidade e sofrem antagonismo com bacteriostáticos (tetraciclinas)."}, {"id": "cefalosporinas-geracoes", "nome": "Mudança de espectro da 1ª à 5ª geração", "definicao": "Nas cefalosporinas, a 1ª geração foca Gram-positivos, a 2ª equilibra Gram+ e Gram-, a 3ª e a 4ª focam Gram-negativos (ceftazidima e cefepime cobrem Pseudomonas) e a 5ª (ceftarolina) cobre MRSA."}, {"id": "cefalosporinas-bhe-pk", "nome": "Passagem pela BHE, eliminação biliar e toxicidade", "definicao": "Ceftriaxona e cefotaxima atravessam a BHE (meningite exige dose dobrada); ceftriaxona e cefoperazona têm eliminação biliar; evitar cefalotina na insuficiência renal."}, {"id": "inibidores-bl", "nome": "Associações com inibidores de β-lactamases", "definicao": "Ácido clavulânico, sulbactam e tazobactam inibem β-lactamases e restauram a ação de penicilinas; ampicilina-sulbactam é a única com ação contra Acinetobacter spp."}, {"id": "monobactamicos", "nome": "Monobactâmicos (Aztreonam)", "definicao": "O aztreonam atua apenas contra bacilos Gram-negativos aeróbios, resiste a β-lactamases e tem pouca reatividade cruzada alérgica com outros β-lactâmicos."}, {"id": "carbapenemicos-kpc", "nome": "Carbapenêmicos, cilastatina e resistência por KPC", "definicao": "Imipenem (+ cilastatina), meropenem e ertapenem são β-lactâmicos de amplo espectro e tempo-dependentes; falha de meropenem em K. pneumoniae sugere carbapenemase tipo KPC."}, {"id": "glicopeptideos-mecanismo", "nome": "Mecanismo, espectro e ausência de resistência cruzada", "definicao": "A vancomicina é um glicopeptídeo bactericida que inibe a parede celular de Gram-positivos sem relação química com outros antibióticos, não havendo resistência cruzada com β-lactâmicos."}, {"id": "vanco-vs-teico", "nome": "Vancomicina versus Teicoplanina e outros polipeptídeos", "definicao": "Ambas cobrem Gram-positivos resistentes (MRSA); vancomicina exige IV lenta (VO só para C. difficile), enquanto teicoplanina tem ação longa e pode ser feita IM."}, {"id": "pescoco-vermelho", "nome": "Síndrome do Pescoço Vermelho e infusão lenta", "definicao": "A infusão venosa rápida de vancomicina libera histamina e causa a Síndrome do Pescoço Vermelho (prurido, eritema, angioedema e hipotensão), prevenida com infusão lenta de 60 minutos."}, {"id": "vanco-toxicidade-interacoes", "nome": "Ototoxicidade, nefrotoxicidade e interação com aminoglicosídeos", "definicao": "A vancomicina tem índice terapêutico muito estreito (oto e nefrotoxicidade); associada à gentamicina (aminoglicosídeo), potencializa fortemente ambas as toxicidades (1+1=10)."}], "blocos": [{"id": "b1", "capitulo": "c1", "titulo": "Alvo farmacológico: parede celular, PBP e anel β-lactâmico", "onde": "Aula Parte I (resistência e Gram+/Gram-) e Parte II (slides 28, 29, 31 e 53)", "ensina": ["parede-bactericida", "pbp-transpeptidacao", "anel-beta-resistencia"], "seq": [["cx", "gancho", "Caso para começar", "Um paciente internado recebe prescrição de penicilina G para infecção grave por estreptococo, mas relata alergia intensa após uso prévio de amoxicilina. O plantonista pergunta se pode trocar direto por uma cefalosporina sem avaliar o risco.\n**Antes de seguir:** por que fármacos de famílias diferentes dentro dos β-lactâmicos podem provocar a mesma reação alérgica?", null], ["cx", "ideia", "A ideia em uma frase", "Os β-lactâmicos matam a bactéria ao bloquear as enzimas PBPs que fecham a parede de peptidoglicano, e todos compartilham o mesmo anel β-lactâmico, o que explica tanto a alergia cruzada quanto a destruição pelas β-lactamases.", null], ["passo", "Por que a parede celular é o alvo mais seletivo"], ["p", "As células humanas não possuem parede celular de **peptidoglicano**; apenas as bactérias constroem essa malha rígida ao redor da membrana plasmática para suportar a pressão osmótica interna. Por isso, como destacou a professora, os **β-lactâmicos** formam a maior classe de antimicrobianos e apresentam uma das janelas terapêuticas mais amplas e seguras da farmacologia.", [["Peptidoglicano", "Polímero de açúcares e peptídeos que forma a parede rígida das bactérias, ausente nas células humanas."]]], ["p", "As duas classes mais importantes que inibem a síntese da parede celular são os **β-lactâmicos** (penicilinas, cefalosporinas, carbapenêmicos e monobactâmicos) e os **glicopeptídeos** (vancomicina e teicoplanina). A arquitetura da parede também separa o espectro: bactérias **Gram-positivas** exibem uma parede espessa e exposta de peptidoglicano, enquanto bactérias **Gram-negativas** possuem camada fina protegida por uma membrana externa com lipopolissacarídeos (LPS) e canais hidrofílicos chamados **porinas**.", []], ["passo", "Como os β-lactâmicos matam a bactéria: PBPs e autolisinas"], ["p", "Responda antes de ler: **o que acontece quando o antimicrobiano impede a bactéria de fechar as ligações cruzadas da sua parede durante o crescimento?**", []], ["p", "Para construir a parede, a bactéria depende de enzimas chamadas **proteínas ligadoras de penicilina (PBP)**, que atuam na reação de **transpeptidação** (costurando as cadeias de peptidoglicano). Os β-lactâmicos agem em duas frentes complementares: primeiro, ligam-se e inativam as PBPs, impedindo a síntese de peptidoglicano; segundo, inibem um inativador de **enzimas autolíticas** da parede celular, liberando a autodigestão da parede e causando **lise bacteriana**.", [["PBP", "Do inglês Penicillin-Binding Protein: enzima transpeptidase responsável pela etapa final da síntese da parede bacteriana."]]], ["p", "Como dependem da bactéria estar sintetizando parede ativamente, os β-lactâmicos são **bactericidas** e **tempo-dependentes**: o sucesso terapêutico exige manter a concentração plasmática acima da concentração inibitória mínima (CIM) pelo maior tempo possível, respeitando rigorosamente os intervalos de dose.", []], ["fig", "fig_parede_pbp.png", "Parede celular, PBPs e cascata bactericida", "Comparação entre a parede Gram-positiva e a Gram-negativa com porinas, seguida das quatro etapas da ação bactericida dos β-lactâmicos.", "Elaborado a partir dos slides 26 e 29 (Parte I) e slides 28 e 31 (Parte II).", "larga"], ["passo", "O anel β-lactâmico: famílias, alergia cruzada e β-lactamases"], ["p", "Todas as famílias de β-lactâmicos compartilham um núcleo químico comum: o **anel β-lactâmico**. A disciplina divide esse grande grupo em **clássicos** (penicilinas e cefalosporinas) e **não clássicos** (carbapenêmicos, monobactâmicos e inibidores de β-lactamases).", []], ["cx", "atencao", "Atenção · Slide 29 (Parte II)", "Por compartilharem o anel β-lactâmico, efeitos adversos sérios de hipersensibilidade podem ocorrer mesmo quando se troca de uma classe para outra (por exemplo, entre penicilinas e cefalosporinas). Quem é alérgico a β-lactâmicos perde a maior classe terapêutica disponível, exigindo alternativas como macrolídeos (para Gram-positivos) ou aztreonam (para Gram-negativos, pois tem pouca reatividade cruzada).", null], ["p", "Esse mesmo anel é o ponto fraco explorado pelas bactérias. O mecanismo de resistência mais comum contra os β-lactâmicos é a **inativação enzimática** por **β-lactamases** (como penicilinases, cefalosporinases e carbapenemases), que rompem o anel β-lactâmico antes que o fármaco alcance a PBP. Outros mecanismos importantes incluem a **alteração das PBPs** (mudança do alvo farmacológico, como ocorre em estafilococos resistentes à oxacilina) e a **redução da permeabilidade das porinas** nos Gram-negativos.", []], ["tab", "Os quatro mecanismos de resistência aplicados aos β-lactâmicos", ["Mecanismo", "Como bloqueia o β-lactâmico", "Exemplo clássico da aula"], [["**Inativação enzimática**", "Enzima hidrolisa o anel β-lactâmico (mais comum)", "Penicilinase em *Neisseria gonorrhoeae* e *S. aureus*; KPC em *Klebsiella*"], ["**Alteração do alvo (PBP)**", "PBP modificada perde afinidade pelo fármaco", "*Staphylococcus aureus* resistente à oxacilina"], ["**Redução de permeabilidade**", "Alteração dos canais de porina impede a entrada", "*Enterobacter* resistente a cefalosporinas"], ["**Bomba de efluxo**", "Expulsão ativa do fármaco para fora da bactéria", "Reduz concentração periplasmática em Gram-negativos"]]], ["cx", "erros", "Erros que derrubam", "Classificar os β-lactâmicos como bacteriostáticos: por causarem lise da parede em formação, são bactericidas.\nAchar que apenas penicilinas possuem anel β-lactâmico: cefalosporinas, carbapenêmicos e monobactâmicos também são β-lactâmicos.\nEsquecer que a produção de β-lactamases é o mecanismo de resistência mais frequente contra essa classe.", null], ["cx", "guardar", "Para guardar", "β-lactâmicos = anel β-lactâmico + ligação às PBPs + bloqueio da transpeptidação + lise (bactericidas e tempo-dependentes).\nResistência mais comum aos β-lactâmicos: enzimas β-lactamases que abrem o anel.", null], ["cx", "sintese", "Síntese", "**Alvo:** parede de peptidoglicano (PBPs / transpeptidação) e ativação de autolisinas, levando à lise bacteriana.\n**Efeito e PK/PD:** bactericidas e tempo-dependentes (manter concentração acima da CIM).\n**Anel β-lactâmico:** une clássicos e não clássicos, explica alergia cruzada e é o alvo das β-lactamases.", null]]}, {"id": "b2", "capitulo": "c1", "titulo": "Penicilinas: subclasses, espectro, oxacilina e interações", "onde": "Aula Parte I (histórico, alergia, associação com aminoglicosídeos) e Parte II (slides 30 a 37, 52 e 53)", "ensina": ["penicilinas-subclasses", "oxacilina-mrsa", "penicilinas-pk-interacoes"], "seq": [["cx", "gancho", "Caso para começar", "Um paciente internado apresenta infecção de pele por Staphylococcus aureus. O antibiograma revela resistência à oxacilina. O residente sugere prescrever ceftriaxona ou meropenem para ampliar a cobertura.\n**Antes de seguir:** por que trocar a oxacilina por outro β-lactâmico clássico ou carbapenêmico não resolve esse caso?", null], ["cx", "ideia", "A ideia em uma frase", "Cada subclasse de penicilina foi desenhada para vencer uma limitação da anterior (ácido gástrico, penicilinase ou Gram-negativos), mas quando surge S. aureus resistente à oxacilina (MRSA), toda a lógica dos β-lactâmicos tradicionais falha.", null], ["passo", "Do fungo Penicillium às cinco subclasses de penicilinas"], ["p", "Alexander Fleming observou em 1928 a inibição de estafilococos pelo fungo *Penicillium*, e a produção em larga escala começou em 1941, na Segunda Guerra Mundial. As penicilinas tornaram-se os antibióticos mais utilizados por combinarem **alta eficácia**, **baixa toxicidade** e segurança na gestação (atravessam a placenta, mas são aparentemente não teratogênicas ao ser humano).", []], ["p", "Para não decorar nomes soltos, organize as penicilinas em uma escada de cinco degraus segundo a estabilidade ao ácido gástrico, a resistência às penicilinases e o espectro de ação:", []], ["fig", "fig_penicilinas_espectro.png", "Escada de espectro das cinco subclasses de penicilinas", "Progressão das penicilinas naturais até as ureidopenicilinas hospitalares antipseudomonas, destacando o alerta clínico da oxacilina.", "Elaborado a partir dos slides 30 a 37 (Parte II).", "larga"], ["tab", "Resumo das cinco subclasses de penicilinas", ["Subclasse", "Exemplos da aula", "Espectro e indicação central"], [["**Naturais**", "Benzilpenicilina (G) e fenoximetilpenicilina (V)", "Gram-positivos (estreptococos), *Neisseria*, *Clostridium* spp., *Treponema pallidum* (sífilis), febre reumática (G benzatina). Destruídas por penicilinases."], ["**Antiestafilocócicas**", "Oxacilina", "Resistente à penicilinase estafilocócica e ao meio ácido. Foco em *Staphylococcus* produtor de penicilinase (MSSA)."], ["**Aminopenicilinas**", "Amoxicilina e ampicilina", "Semissintéticas resistentes ao ácido gástrico; amplo espectro: Gram+ e Gram- (*H. influenzae*, *E. coli*, *Proteus mirabilis*, *Salmonella*, *Shigella*)."], ["**Carboxipenicilinas**", "Carbenicilina e ticarcilina", "Espectro ampliado hospitalar: *Pseudomonas aeruginosa*, *Enterobacter*, *Acinetobacter*, *Serratia*, *Bacteroides fragilis* (menor eficácia em Gram+ que aminopenicilinas)."], ["**Ureidopenicilinas**", "Piperacilina (azlocilina, mezlocilina)", "Principal indicação: *Pseudomonas aeruginosa* e enterobactérias multirresistentes em ambiente hospitalar."]]], ["passo", "O ponto de virada clínico: oxacilina e MRSA"], ["cx", "destaque", "Destaque da professora e Slide 34 (Parte II)", "A oxacilina resiste às penicilinases comuns dos estafilococos. Porém, quando o antibiograma mostra que a cepa de *Staphylococcus aureus* é resistente à oxacilina (MRSA ou ORSA), infere-se resistência a todos os demais β-lactâmicos, incluindo cefalosporinas (1ª a 4ª geração) e carbapenêmicos. Nesses casos, não adianta trocar para outro β-lactâmico: a **vancomicina** é o antibiótico de escolha.", "forte"], ["cx", "livro", "Nota do livro: exceção anti-MRSA|Goodman & Gilman / Slide 38 (Parte II)", "O slide 34 afirma de modo geral que cepas resistentes à oxacilina são resistentes a todos os demais β-lactâmicos. A exceção moderna, registrada no próprio slide 38 da disciplina, é a **ceftarolina** (cefalosporina de 5ª geração), que possui afinidade pela PBP2a alterada e tem atividade contra MRSA.\n**Na prova desta disciplina:** para *S. aureus* resistente à oxacilina, inferir resistência aos demais β-lactâmicos (cefalosporinas de 1ª a 4ª geração e carbapenêmicos) e indicar **vancomicina** como escolha clássica.\n**Em outras provas:** lembrar que a ceftarolina (5ª geração) é a única cefalosporina com ação anti-MRSA.", null], ["passo", "Farmacocinética, reações adversas e interações medicamentosas"], ["p", "As penicilinas são insolúveis em lipídeos: apresentam ampla distribuição nos líquidos extracelulares, mas não penetram nas células de mamíferos nem atravessam barreiras íntegras com facilidade (na meningite inflamada, a passagem aumenta). A eliminação ocorre principalmente por **secreção tubular renal**, com meia-vida curta.", []], ["p", "As reações adversas incluem **hipersensibilidade** causada pelos metabólitos (de rash cutâneo a anafilaxia), diarreia e superinfecção (como candidíase ou colite), nefrite, toxicidade hematológica, toxicidade catiônica (Na+ e K+) e **neurotoxicidade** (convulsões em altas doses, especialmente penicilinas e imipenem).", []], ["tab", "Interações medicamentosas das penicilinas (Slide 52, Parte II)", ["Fármaco associado", "O que acontece", "Explicação farmacológica"], [["**Probenecida e uricosúricos**", "Aumentam o nível sérico da penicilina", "Competem pela secreção tubular renal, diminuindo a eliminação da penicilina"], ["**Aminoglicosídeos (mesma solução)**", "Inativação química recíproca", "Penicilinas de espectro expandido interagem quimicamente com aminoglicosídeos no mesmo frasco; em vias separadas há sinergismo"], ["**Anticoncepcionais orais (ACO)**", "Efeito do ACO diminuído", "Alteração da flora intestinal reduz a clivagem e recirculação êntero-hepática dos estrogênios"], ["**Tetraciclinas (bacteriostáticos)**", "Diminuem a ação das penicilinas", "Bacteriostáticos freiam a proliferação bacteriana; bactericidas de parede exigem multiplicação ativa para lisar a bactéria"]]], ["cx", "erros", "Erros que derrubam", "Misturar penicilinas de espectro expandido e aminoglicosídeos na mesma seringa ou frasco de infusão: inativam-se quimicamente, embora tenham sinergismo quando administrados separadamente.\nAssociar penicilina (bactericida) com tetraciclina ou cloranfenicol (bacteriostáticos): o bacteriostático impede a multiplicação celular necessária para o β-lactâmico agir.\nPrescrever cefalosporina de 1ª a 4ª geração ou carbapenêmico para MRSA resistente à oxacilina.", null], ["cx", "guardar", "Para guardar", "Oxacilina falhou em S. aureus (MRSA)? Não troque por outro β-lactâmico clássico: vá para vancomicina.\nProbenecida segura a penicilina no túbulo; tetraciclina atrapalha a penicilina porque freia a parede em crescimento.", null], ["cx", "sintese", "Síntese", "**Subclasses:** naturais (G/V), oxacilina (antiestafilo), amoxicilina/ampicilina (amino), carbenicilina/ticarcilina (carboxi) e piperacilina (ureido, *Pseudomonas*).\n**MRSA:** resistência à oxacilina invalida os β-lactâmicos tradicionais e indica vancomicina.\n**Interações:** probenecida reduz excreção; tetraciclinas antagonizam; aminoglicosídeos inativam no mesmo frasco, mas sinergizam sistemicamente.", null]]}, {"id": "b3", "capitulo": "c2", "titulo": "Cefalosporinas (1ª a 5ª geração): espectro, BHE e farmacocinética", "onde": "Aula Parte I (gerações, profilaxia cirúrgica) e Parte II (dose na meningite; slides 38 a 41)", "ensina": ["cefalosporinas-geracoes", "cefalosporinas-bhe-pk"], "seq": [["cx", "gancho", "Caso para começar", "Um paciente chega ao pronto-socorro com suspeita de meningite bacteriana. O interno pergunta se pode iniciar cefalexina ou cefalotina, já que são cefalosporinas muito usadas na rotina.\n**Antes de seguir:** por que uma cefalosporina de 1ª geração falha na meningite e qual geração atravessa a barreira hematoencefálica?", null], ["cx", "ideia", "A ideia em uma frase", "Ao contrário das quinolonas, que apenas ampliam o espectro a cada geração, as cefalosporinas mudam de perfil: saem do foco em Gram-positivos (1ª) para Gram-negativos e SNC (3ª/4ª), até alcançar o MRSA na 5ª geração.", null], ["passo", "A lógica das cinco gerações: espectro que muda"], ["cx", "destaque", "Destaque da professora · Aula Parte I", "Cuidado para não confundir quinolonas com cefalosporinas: nas quinolonas, cada geração vai ampliando o espectro; nas **cefalosporinas**, cada geração **muda** o espectro. A 1ª geração pega muito bem Gram-positivos; a 3ª e a 4ª gerações focam Gram-negativos.", "forte"], ["p", "As cefalosporinas são isoladas dos fungos *Cephalosporium* e *Streptomyces*, hidrossolúveis e relativamente estáveis em pH ácido. Como compartilham o mecanismo dos β-lactâmicos (inibição de PBPs), todas são **bactericidas**. Apenas a **5ª geração (ceftarolina)** vence o MRSA; cepas de *S. aureus* resistentes à oxacilina são igualmente resistentes às cefalosporinas de **1ª, 2ª, 3ª e 4ª gerações**.", []], ["fig", "fig_cefalosporinas_geracoes.png", "Evolução das cefalosporinas da 1ª à 5ª geração", "Exemplos orais e parenterais, mudança de cobertura entre Gram-positivos, Gram-negativos, Pseudomonas e MRSA, além da passagem pela barreira hematoencefálica.", "Elaborado a partir dos slides 38 a 41 (Parte II).", "larga"], ["tab", "Cefalosporinas por geração: exemplos, via e foco clínico", ["Geração", "Representantes (via)", "Cobertura principal e pontos de prova"], [["**1ª geração**", "Cefalexina (VO), cefadroxil (VO), cefalotina (IV), cefazolina (IV)", "Predomínio Gram+ (estafilococos MSSA e estreptococos). Não atravessa BHE. **Cefazolina** é usada em profilaxia cirúrgica (não usar o profilático para tratar!). Uso indiscriminado associa-se a MRSA."], ["**2ª geração**", "Cefuroxima (IV/IM; axetil VO), cefoxitina (IV), cefaclor (VO)", "Gram+ e Gram- (*H. influenzae* e enterobactérias). Boa opção em bronquites e pneumonias comunitárias."], ["**3ª geração**", "Ceftriaxona (IV), cefotaxima (IV), ceftazidima (IV), cefixima/cefdinir (VO)", "Fortemente Gram- (menor força Gram+). **Ceftriaxona** e **cefotaxima** atravessam a BHE (meningite). **Ceftazidima** cobre *Pseudomonas aeruginosa*, mas é forte indutora de resistência."], ["**4ª geração**", "Cefepime (IV)", "Gram+, Gram- e *Pseudomonas*; maior estabilidade a β-lactamases. Reservada para Gram- hospitalares multirresistentes, como etapa prévia aos carbapenêmicos."], ["**5ª geração**", "Ceftarolina (IV)", "Atividade contra **MRSA**, VISA e VRSA. Pouca atividade contra enterococos e **sem ação contra *Pseudomonas***."]]], ["passo", "Barreira hematoencefálica, eliminação biliar e cuidados de prescrição"], ["p", "Na farmacocinética das cefalosporinas, a maioria dos representantes de maior potência é de uso parenteral (IM ou IV), enquanto **cefalexina, cefadroxil, cefaclor e axetil-cefuroxima** estão disponíveis por via oral. A eliminação principal é renal por secreção tubular, mas duas exceções importantes têm eliminação **biliar**: **ceftriaxona** e **cefoperazona** (por isso a ceftriaxona pode ser usada em pacientes com insuficiência renal sem acúmulo importante e tem meia-vida longa de 6 a 8 horas, permitindo dose única diária).", []], ["p", "Em infecções do sistema nervoso central, como a meningite bacteriana, a professora destacou um ajuste essencial: **usa-se o dobro da dose de ceftriaxona** em comparação com a dose usada na pneumonia, justamente para garantir concentração terapêutica adequada após atravessar a barreira hematoencefálica.", []], ["cx", "livro", "Nota do livro: cefuroxima e BHE|Conferência dos Slides 39, 40 e 41 (Parte II)", "Há uma pequena divergência interna nos slides sobre a cefuroxima: o quadro do slide 40 afirma que a 2ª geração não atravessa a BHE, enquanto os slides 39 e 41 (Figura 38.12) citam a **cefuroxima sódica** entre as cefalosporinas que atravessam a BHE. Na prática clínica atual, para meningite, as escolhas de referência são as de 3ª geração (**ceftriaxona** e **cefotaxima**).\n**Na prova desta disciplina:** para meningite bacteriana, responder **ceftriaxona** ou **cefotaxima** (3ª geração) em dose dobrada; lembrar que a 1ª geração não atravessa a BHE.\n**Em outras provas:** saber que a cefuroxima atravessa a BHE em menor grau, mas não é recomendada para meningite devido a falhas clínicas frente à 3ª geração.", null], ["p", "Entre os efeitos adversos das cefalosporinas destacam-se **hipersensibilidade** (com possibilidade de reação cruzada em alérgicos à penicilina), **nefrotoxicidade** (o slide 37 da Parte I manda evitar **cefalotina** e cefaloridina na insuficiência renal) e **intolerância ao álcool** (efeito tipo dissulfiram descrito para algumas cefalosporinas).", []], ["cx", "erros", "Erros que derrubam", "Achar que ceftriaxona cobre Pseudomonas aeruginosa: dentro da 3ª geração, a representante antipseudomonas é a ceftazidima (e na 4ª geração, o cefepime).\nAchar que a ceftarolina (5ª geração) cobre Pseudomonas: a ceftarolina ganha cobertura para MRSA, mas não tem ação contra Pseudomonas.\nPrescrever cefalosporina de 1ª geração (cefalexina/cefalotina) para meningite: não atravessa a barreira hematoencefálica.", null], ["cx", "guardar", "Para guardar", "Cefalosporinas: 1ª = Gram+ (sem BHE); 3ª = Gram- + BHE (ceftriaxona tem eliminação biliar; ceftazidima = Pseudomonas); 4ª = cefepime (Gram- MDR + Pseudomonas); 5ª = ceftarolina (MRSA, sem Pseudomonas).", null], ["cx", "sintese", "Síntese", "**Gerações:** 1ª (cefalexina/cefalotina/cefazolina, Gram+), 2ª (cefuroxima/cefoxitina/cefaclor), 3ª (ceftriaxona/cefotaxima na BHE; ceftazidima em *Pseudomonas*), 4ª (cefepime), 5ª (ceftarolina em MRSA).\n**PK e segurança:** ceftriaxona tem eliminação biliar e dose dobrada na meningite; evitar cefalotina na IR; atenção à alergia cruzada e intolerância ao álcool.", null]]}, {"id": "b4", "capitulo": "c2", "titulo": "Inibidores de β-lactamases, Monobactâmicos e Carbapenêmicos", "onde": "Aula Parte II (slides 42 a 51 e 62) e Parte III (KPC, novas combinações 2025 e stewardship, slides 65, 69 a 71 e 75)", "ensina": ["inibidores-bl", "monobactamicos", "carbapenemicos-kpc"], "seq": [["cx", "gancho", "Caso para começar", "Uma paciente internada na UTI desenvolve pneumonia por Klebsiella pneumoniae resistente à ceftriaxona. A equipe inicia meropenem venoso, mas após alguns dias há falha clínica evidente.\n**Antes de seguir:** qual mecanismo enzimático explica a falha de um carbapenêmico nesse cenário e qual nova associação já tem registro no Brasil para enfrentá-lo?", null], ["cx", "ideia", "A ideia em uma frase", "Os β-lactâmicos não clássicos existem para contornar três barreiras clínicas: bactérias produtoras de β-lactamases (IBL), pacientes alérgicos com infecção por Gram-negativos (aztreonam) e infecções hospitalares graves (carbapenêmicos).", null], ["passo", "Inibidores de β-lactamases: protegendo o anel"], ["p", "Quando uma bactéria produz β-lactamase, o anel da amoxicilina ou da piperacilina é destruído antes de alcançar a PBP. A solução farmacológica não é inventar uma classe nova, mas associar um **inibidor de β-lactamase** (ácido clavulânico, sulbactam ou tazobactam): essa molécula se liga à enzima bacteriana e a inativa, deixando o caminho livre para a penicilina destruir a parede celular.", []], ["tab", "Associações clássicas de penicilina + inibidor de β-lactamase (Slide 43, Parte II)", ["Associação", "Cobertura destacada", "Alerta de uso racional (Stewardship)"], [["**Amoxicilina + ácido clavulânico**", "*H. influenzae*, *S. aureus* (MSSA), *Bacteroides fragilis*; infecções respiratórias superiores e inferiores", "Evitar uso sem necessidade em infecções virais; atenção à diarreia e superinfecção"], ["**Ampicilina + sulbactam**", "*H. influenzae*, *S. aureus*, *B. fragilis*, pneumonia aspirativa e ***Acinetobacter* spp.**", "Restringir o uso: única penicilina com IBL ativa contra *Acinetobacter* spp. (Slide 75)"], ["**Ticarcilina + clavulanato**", "Boa cobertura antipseudomonas e anaeróbios", "Uso hospitalar"], ["**Piperacilina + tazobactam**", "Excelente cobertura contra ***Pseudomonas aeruginosa*** e Gram- hospitalares", "Estimular uso (ou cefepime) em etapa prévia aos carbapenêmicos (Slide 75)"]]], ["cx", "clinica", "Correlação clínica · Caso do Slide 62 (Parte II)", "Homem de 48 anos, tabagista, chega com pneumonia comunitária por *Streptococcus pneumoniae* tratada com **amoxicilina + ácido clavulânico**. A **amoxicilina** inibe as PBPs e a síntese do peptidoglicano; o **ácido clavulânico** inibe β-lactamases que degradariam a amoxicilina. Os riscos dessa escolha incluem ampliar o espectro além do necessário (seleção de resistência e impacto no microbioma), e as RAMs esperadas são hipersensibilidade, diarreia/distúrbios gastrointestinais e superinfecção (como candidíase ou *C. difficile*).", null], ["passo", "Monobactâmicos: o papel estratégico do Aztreonam"], ["p", "O **aztreonam** é o representante clínico dos monobactâmicos (anel β-lactâmico monocíclico). Seu espectro é estritamente direcionado a **bacilos Gram-negativos aeróbios**, incluindo *Pseudomonas* e enterobactérias resistentes a cefalosporinas, sem ação contra Gram-positivos ou anaeróbios.", []], ["p", "Por que o aztreonam é tão cobrado em prova? Por duas vantagens decisivas: primeiro, apresenta **pouca reatividade cruzada alérgica** com os demais β-lactâmicos (sendo muito útil em pacientes alérgicos à penicilina com infecção grave por Gram-negativo); segundo, serve como **alternativa à oto e nefrotoxicidade dos aminoglicosídeos**. Seu uso é restrito a hospitais, é bem tolerado (pode causar flebite local, superinfecção por Gram-positivos e raramente nefrite intersticial ou convulsões) e é **quimicamente incompatível no mesmo frasco de infusão com metronidazol e vancomicina**.", []], ["passo", "Carbapenêmicos, cilastatina e a ameaça da KPC"], ["p", "Os **carbapenêmicos** (**imipenem, meropenem e ertapenem**) são **β-lactâmicos não clássicos** bactericidas, de espectro ultramplo (Gram-positivos, Gram-negativos aeróbios e anaeróbios) e **tempo-dependentes**: quanto maior o tempo de infusão mantendo a concentração acima da CIM, melhor o desfecho clínico. Atingem altas concentrações teciduais, inclusive no sistema nervoso central. **Exceções que carbapenêmicos NÃO cobrem:** *Staphylococcus aureus* resistente à meticilina (MRSA), *Enterococcus faecium* e *Enterococcus faecalis* (Slide 47).", []], ["fig", "fig_nao_classicos.png", "β-lactâmicos não clássicos e resistência por KPC", "Comparação prática entre associações com IBL, aztreonam, carbapenêmicos (ertapenem, imipenem+cilastatina, meropenem) e novas associações contra KPC.", "Elaborado a partir dos slides 42 a 51 (Parte II) e slides 65, 69 a 71 (Parte III).", "larga"], ["tab", "Diferenças entre os três carbapenêmicos da aula (Slides 48 a 51, Parte II)", ["Fármaco", "Espectro e característica central", "Cuidados e interações"], [["**Ertapenem**", "Gram+ e Gram- aeróbios e anaeróbios, mas espectro mais estreito: **pouca ou nenhuma atividade contra *P. aeruginosa* e *Acinetobacter***", "Agitação, complicações venosas de infusão e diarreia"], ["**Imipenem + cilastatina**", "Amplíssimo espectro (incluindo *Pseudomonas*); uso em septicemia e endocardites. A **cilastatina** inibe a **desidropeptidase-I** do túbulo contorcido proximal, impedindo a hidrólise renal do imipenem (70% recuperado ativo na urina)", "Maior risco de **convulsões**; não misturar no mesmo frasco com aminoglicosídeos (inativa ambos); nefrite intersticial"], ["**Meropenem**", "Maior resistência à desidropeptidase-I renal (não precisa de cilastatina) e maior atividade contra *P. aeruginosa* e outros Gram-", "Menor atividade pró-convulsivante que o imipenem; não associar com probenecida (competição tubular)"]]], ["p", "O uso indiscriminado de carbapenêmicos (como imipenem e meropenem) seleciona *Pseudomonas* multirresistentes e enterobactérias produtoras de **carbapenemase tipo KPC** (*Klebsiella pneumoniae* carbapenemase). Diante de uma *Klebsiella* resistente à ceftriaxona que falha ao meropenem, a explicação clássica de prova é a **produção de carbapenemase tipo KPC**.", []], ["p", "Nos slides de atualização (2025), a professora mostrou as novas associações que atuam na parede celular contra KPC e Gram-negativos multirresistentes: **ceftazidima-avibactam** (única registrada e disponível no Brasil segundo o slide 71, alternativa menos tóxica à colistina contra KPC e OXA-48), **meropenem-vaborbactam** (eficaz contra KPC), **imipenem-relebactam** e **cefiderocol** (cefalosporina sideróforo de alto custo).", []], ["cx", "erros", "Erros que derrubam", "Achar que o imipenem não faz parte do grupo dos β-lactâmicos: carbapenêmicos são β-lactâmicos não clássicos.\nEsquecer que o ertapenem não cobre Pseudomonas aeruginosa nem Acinetobacter.\nAchar que a cilastatina é um antibiótico que amplia o espectro: a cilastatina apenas bloqueia a desidropeptidase-I renal para proteger o imipenem.\nConfundir a alergia cruzada do aztreonam: o aztreonam tem pouca reatividade cruzada com os demais β-lactâmicos.", null], ["cx", "guardar", "Para guardar", "Clavulanato/sulbactam/tazobactam = escudos contra β-lactamases; ampicilina-sulbactam = Acinetobacter.\nCilastatina protege o imipenem da desidropeptidase-I do túbulo proximal; falha de meropenem em K. pneumoniae = KPC.", null], ["cx", "sintese", "Síntese", "**IBL:** protegem penicilinas das β-lactamases (amoxicilina+clavulanato; ampicilina+sulbactam para *Acinetobacter*; piperacilina+tazobactam para *Pseudomonas*).\n**Aztreonam:** só Gram- aeróbios, pouca alergia cruzada, alternativa a aminoglicosídeos.\n**Carbapenêmicos:** β-lactâmicos tempo-dependentes de reserva (ertapenem sem *Pseudomonas*; imipenem precisa de cilastatina; meropenem dá menos convulsão); falha sugere **KPC**.", null]]}, {"id": "b5", "capitulo": "c3", "titulo": "Glicopeptídeos: mecanismo, espectro, MRSA e Vancomicina vs. Teicoplanina", "onde": "Aula Parte I (vanco, teicoplanina e C. difficile) e Parte II (slides 54 a 59)", "ensina": ["glicopeptideos-mecanismo", "vanco-vs-teico"], "seq": [["cx", "gancho", "Caso para começar", "Um paciente idoso está internado tratando uma infecção por MRSA. A evolução clínica é boa, mas o médico receia mantê-lo no hospital por mais dias devido ao risco de pneumonia nosocomial.\n**Antes de seguir:** qual glicopeptídeo tem o mesmo espectro da vancomicina, mas permite via intramuscular e alta para casa?", null], ["cx", "ideia", "A ideia em uma frase", "Os glicopeptídeos bloqueiam a parede celular de Gram-positivos por um sítio diferente das PBPs (extremidade D-alanil), o que garante ação contra MRSA sem resistência cruzada com β-lactâmicos.", null], ["passo", "Mecanismo de ação, espectro exclusivo Gram+ e resistência dos enterococos"], ["p", "A **vancomicina** e a **teicoplanina** pertencem à classe dos **glicopeptídeos** (agrupados nos slides dentro dos polipeptídeos inibidores da parede celular). A vancomicina é um glicopeptídeo tricíclico **bactericida** que inibe a síntese da parede celular de bactérias sensíveis ao se ligar à porção **D-alanil-D-alanina** dos precursores do peptidoglicano, bloqueando o alongamento da parede.", []], ["p", "Por que a vancomicina é a droga de eleição para infecções graves por *Staphylococcus aureus* resistente à meticilina/oxacilina (**MRSA**) e pneumococos com alto grau de resistência à penicilina? A resposta está no slide 58 e cai literalmente na prova: **por não apresentar relação química com outros antibióticos (como os β-lactâmicos), não ocorre resistência cruzada entre esses grupos**.", []], ["p", "Seu espectro é estritamente voltado a **bactérias Gram-positivas**: altamente eficaz contra *Staphylococcus aureus* (incluindo MRSA) e *S. epidermidis*, atuando também contra estreptococos, enterococos, *Clostridioides difficile* (por via oral) e *Corynebacterium* spp. **Não tem atividade contra bacilos Gram-negativos nem micobactérias**, pois sua molécula volumosa não atravessa as porinas da membrana externa Gram-negativa.", []], ["p", "Nos **enterococos resistentes à vancomicina (VRE)**, o mecanismo de resistência destacado no slide 59 é a **alteração da molécula de D-alanil da parede** (trocando D-Ala-D-Ala por D-Ala-D-Lactato, o que impede o encaixe da vancomicina).", []], ["cx", "livro", "Nota do livro: origem da vancomicina|Goodman & Gilman / Katzung (Slide 59, Parte II)", "O slide 59 cita a origem da vancomicina como produzida pelo \"Streptococos orientalis\". Na taxonomia microbiológica dos livros-texto, o microrganismo produtor é o actinomiceto ***Amycolatopsis orientalis*** (antigamente chamado *Streptomyces orientalis*).\n**Na prova desta disciplina:** lembrar que a vancomicina é um glicopeptídeo tricíclico bactericida inibidor da parede de Gram-positivos, e que a resistência dos enterococos decorre da alteração da molécula de D-alanil.\n**Em outras provas:** reconhecer *Amycolatopsis orientalis* (antigo *Streptomyces orientalis*) como a origem natural correta.", null], ["passo", "Vancomicina versus Teicoplanina: escolha clínica e custo real"], ["cx", "destaque", "Destaque da professora · Aula Partes I e II", "Vancomicina e teicoplanina têm o mesmo espectro de ação. O que muda é a **via de administração** e a **conta real do hospital**: a vancomicina exige infusão venosa lenta no hospital (é mais barata na nota fiscal do medicamento, mas prende o paciente no leito). A **teicoplanina** tem duração de ação mais longa e pode ser dada **intramuscular**, permitindo mandar o paciente idoso para casa e evitar infecção hospitalar. Por outro lado, se o paciente já está internado, prefere-se a vancomicina pelo menor custo do fármaco.", "forte"], ["fig", "fig_glicopeptideos.png", "Glicopeptídeos: mecanismo, MRSA e Vancomicina vs. Teicoplanina", "Comparação prática entre vancomicina e teicoplanina, indicações clínicas clássicas (incluindo C. difficile VO) e diferenciação frente a bacitracina e quinupristina-dalfopristina.", "Elaborado a partir dos slides 54 a 59 (Parte II) e fala da Profa. Soraia.", "larga"], ["tab", "Vancomicina vs. Teicoplanina e outros polipeptídeos da aula", ["Fármaco", "Via e PK", "Indicação clínica e observação"], [["**Vancomicina**", "IV em infusão lenta (60 min), t½ 6 h, excreção glomerular; VO não absorvida", "Escolha para **MRSA** em osteomielite, endocardite, pneumonia e abscessos graves; **VO apenas para colite por *C. difficile*** (ação local no intestino)"], ["**Teicoplanina**", "IV ou **IM**, duração de ação mais longa", "Alternativa à vancomicina em Gram+ graves quando se busca via IM/alta hospitalar ou menor toxicidade; custo mais alto do fármaco"], ["**Bacitracina**", "Uso estritamente **tópico** (altamente nefrotóxica se sistêmica)", "Inibe parede de Gram+; usada em pomada com neomicina (Nebacetin: Gram+ + Gram-); não cobre *Pseudomonas*"], ["**Quinupristina + Dalfopristina**", "Parenteral (Synercid)", "Usada em ***Enterococcus faecium* resistente à vancomicina (VRE)**; atenção: age no **ribossomo** (síntese proteica), não na parede"]]], ["cx", "erros", "Erros que derrubam", "Achar que a vancomicina cobre bacilos Gram-negativos ou micobactérias: o espectro é exclusivo para Gram-positivos.\nPrescrever vancomicina oral para infecção sistêmica (endocardite ou pneumonia): a vancomicina oral não é absorvida e serve apenas para ação local na colite por Clostridioides difficile.\nEsquecer que a resistência dos enterococos à vancomicina decorre da alteração da molécula D-alanil da parede.", null], ["cx", "guardar", "Para guardar", "Vancomicina = glicopeptídeo, parede celular (D-Ala-D-Ala), só Gram+ (MRSA), sem resistência cruzada com β-lactâmicos.\nVanco IV = internado; Vanco VO = só C. difficile; Teicoplanina = IM/IV de ação longa (permite alta).", null], ["cx", "sintese", "Síntese", "**Mecanismo e espectro:** glicopeptídeos bactericidas que inibem a síntese da parede de Gram+ (MRSA, estreptococos, enterococos, *C. difficile* VO); sem ação em Gram- e sem resistência cruzada com β-lactâmicos.\n**Resistência (VRE):** alteração da molécula D-alanil da parede.\n**Vanco vs. Teico:** mesmo espectro; vancomicina é IV lenta (menor custo do frasco), teicoplanina pode ser IM e permite alta.", null]]}, {"id": "b6", "capitulo": "c3", "titulo": "Toxicidades da Vancomicina, Síndrome do Pescoço Vermelho e Stewardship", "onde": "Aula Parte I (índice terapêutico e nefrotoxicidade), Parte II (slides 60 e 61) e Parte III (stewardship, slides 72 a 76)", "ensina": ["pescoco-vermelho", "vanco-toxicidade-interacoes"], "seq": [["cx", "gancho", "Caso para começar", "Dez minutos após iniciar uma infusão venosa acelerada de vancomicina, o paciente apresenta vermelhidão intensa em face, pescoço e tronco, prurido e queda da pressão arterial.\n**Antes de seguir:** o que desencadeou essa reação e qual conduta simples de administração evita que o quadro ocorra?", null], ["cx", "ideia", "A ideia em uma frase", "A vancomicina exige dois cuidados vitais à beira do leito: correr lentamente em pelo menos 60 minutos (para evitar a Síndrome do Pescoço Vermelho) e monitorar função renal e audição, especialmente quando combinada a aminoglicosídeos.", null], ["passo", "Síndrome do Pescoço Vermelho (Red Man Syndrome)"], ["p", "A vancomicina deve ser administrada por via intravenosa em **infusão lenta de pelo menos 60 minutos** (meia-vida de 6 horas, 30% ligada a proteínas plasmáticas e excreção glomerular).", []], ["p", "Quando a infusão venosa é feita **rapidamente**, a vancomicina provoca **liberação direta de histamina** pelos mastócitos, desencadeando a clássica **Síndrome do Pescoço Vermelho** (também chamada nas provas de **Síndrome do Homem Vermelho** ou *Red Man Syndrome*): cursa com **prurido, eritema em face, pescoço e tronco, angioedema, congestão, hipotensão, taquicardia e raramente choque**.", []], ["cx", "atencao", "Não confunda na prova!", "A Síndrome do Pescoço Vermelho está ligada à **velocidade de infusão da vancomicina** (liberação de histamina). Não a confunda com **Síndrome de Stevens-Johnson** (sulfonamidas e clindamicina), **Kernicterus** (sulfonamidas em recém-nascidos) ou **Síndrome do Bebê Cinzento** (cloranfenicol).", null], ["passo", "Ototoxicidade, nefrotoxicidade e o sinergismo tóxico 1 + 1 = 10"], ["p", "Nos slides de toxicidade dos antibióticos (Parte I, slide 35), a vancomicina aparece no grupo de **índice terapêutico muito baixo (↓↓ IT)**, ao lado de polimixina B e anfotericina B. Suas duas toxicidades sistêmicas mais graves são a **nefrotoxicidade** (lesão renal, exigindo redução de dose já na insuficiência renal leve) e a **ototoxicidade** (perda auditiva). Outros efeitos descritos incluem flebite, hipersensibilidade, leucopenia e eosinofilia.", []], ["fig", "fig_vanco_seguranca.png", "Segurança clínica da vancomicina e stewardship", "Síndrome do Pescoço Vermelho por infusão rápida, efeito sinérgico de nefro e ototoxicidade com aminoglicosídeos (1+1=10) e regras de ouro para preservar β-lactâmicos e glicopeptídeos.", "Elaborado a partir dos slides 35 e 37 (Parte I), slides 60 e 61 (Parte II) e slides 72 a 76 (Parte III).", "larga"], ["tab", "Interações medicamentosas críticas da vancomicina (Slide 61, Parte II)", ["Associação", "Consequência clínica", "Por que exige vigilância"], [["**Vancomicina + Aminoglicosídeos (ex.: gentamicina)**", "**Sinergismo tóxico (1+1=10):** potencializa **ototoxicidade e nefrotoxicidade** (embora haja sinergismo antimicrobiano)", "Cobra-se diretamente em prova antiga (Q317): monitorar creatinina e audição rigorosamente"], ["**Vancomicina + AINEs**", "Aumento da meia-vida (t½) de diversos AINEs", "Pode elevar os efeitos tóxicos dos anti-inflamatórios"], ["**Vancomicina + Polimixinas, anfotericina B, cefalosporinas, diuréticos de alça**", "Risco aumentado de nefrotoxicidade e ototoxicidade", "Sobreposição de toxicidade renal e auditiva"]]], ["passo", "Stewardship: como preservar β-lactâmicos e glicopeptídeos"], ["p", "A professora encerrou a aula de antimicrobianos reforçando as regras de **Antimicrobial Stewardship** (gerenciamento racional pela CCIH) aplicadas diretamente a essas classes:", []], ["tab", "Regras de ouro de prescrição (Parte III, slides 72 a 76)", ["Regra", "Aplicação prática em β-lactâmicos e glicopeptídeos"], [["**Cultura e reavaliação em 48 h**", "Colher cultura antes de iniciar em infecções graves e reavaliar resposta clínica em 48 horas"], ["**Tempo-dependência**", "β-lactâmicos e vancomicina dependem do tempo acima da CIM: respeitar rigorosamente os intervalos de dose"], ["**Preservar a vancomicina**", "Restringir vancomicina para MRSA e evitar seleção de *Enterococcus* e *Staphylococcus* resistentes ou intermediários (VRE/VISA/VRSA)"], ["**Evitar indutores de resistência**", "Evitar uso indiscriminado de cefalosporinas de 1ª geração (associadas a MRSA), de 3ª geração (especialmente ceftazidima) e de carbapenêmicos (selecionam *Pseudomonas* MDR e KPC)"]]], ["cx", "erros", "Erros que derrubam", "Achar que a Síndrome do Pescoço Vermelho ocorre apenas por alergia independente da velocidade de infusão: o gatilho clássico é a infusão IV rápida.\nEsquecer que gentamicina + vancomicina potencializa TANTO a nefrotoxicidade QUANTO a ototoxicidade.\nUsar vancomicina empiricamente em qualquer infecção comunitária leve por Gram-positivo, acelerando a seleção de VRE e VISA/VRSA.", null], ["cx", "guardar", "Para guardar", "Vancomicina rápida = Síndrome do Pescoço Vermelho (histamina) -> infundir lentamente em 60 minutos.\nVancomicina + Gentamicina = 1 + 1 = 10 em ototoxicidade e nefrotoxicidade.", null], ["cx", "sintese", "Síntese", "**Infusão rápida:** libera histamina e causa Síndrome do Pescoço Vermelho (prevenir com infusão IV em 60 min).\n**Toxicidades:** índice terapêutico estreito com **ototoxicidade** e **nefrotoxicidade**, fortemente potencializadas pela associação com **gentamicina** (aminoglicosídeos).\n**Stewardship:** respeitar intervalos (tempo-dependentes), colher cultura antes e restringir vancomicina, ceftazidima e carbapenêmicos.", null]]}], "testes": [{"id": "t1", "bloco": "b1", "tema": "Mecanismo de ação", "conceito": "pbp-transpeptidacao", "nivel": 1, "papel": "checagem", "enunciado": "Qual alvo enzimático bacteriano é ligado e inativado diretamente pelos antibióticos β-lactâmicos?", "alternativas": ["Proteínas ligadoras de penicilina (PBP)", "Subunidade ribossômica 30S", "Enzima DNA girase bacteriana", "Di-hidropteroato sintetase"], "correta": 0, "porque": "Os β-lactâmicos ligam-se e inativam as proteínas ligadoras de penicilina (PBP), que atuam como enzimas de transpeptidação na síntese do peptidoglicano.", "errados": {"1": "A subunidade ribossômica 30S é alvo de inibidores da síntese proteica, não da parede celular.", "2": "A DNA girase é o alvo de fármacos que bloqueiam a replicação do DNA bacteriano.", "3": "A di-hidropteroato sintetase participa da síntese de folato, bloqueada por sulfonamidas."}, "passo": 2}, {"id": "t2", "bloco": "b1", "tema": "Classes e efeito", "conceito": "parede-bactericida", "nivel": 1, "papel": "checagem", "enunciado": "Quais são as duas classes mais importantes de antimicrobianos inibidores da síntese da parede celular?", "alternativas": ["β-lactâmicos e glicopeptídeos", "Aminoglicosídeos e macrolídeos", "Sulfonamidas e quinolonas", "Tetraciclinas e lincosamidas"], "correta": 0, "porque": "β-lactâmicos (penicilinas, cefalosporinas, carbapenêmicos, monobactâmicos) e glicopeptídeos (vancomicina, teicoplanina) são os dois grandes grupos inibidores da síntese da parede celular.", "errados": {"1": "Aminoglicosídeos e macrolídeos atuam nos ribossomos bacterianos (30S e 50S), inibindo a síntese proteica.", "2": "Sulfonamidas bloqueiam a síntese de folato e quinolonas bloqueiam a síntese de DNA.", "3": "Tetraciclinas e lincosamidas também são inibidores da síntese proteica ribossomal."}, "passo": 1}, {"id": "t3", "bloco": "b1", "tema": "Resistência e alergia", "conceito": "anel-beta-resistencia", "nivel": 2, "papel": "checagem", "enunciado": "Qual mecanismo explica a resistência bacteriana mais frequente aos β-lactâmicos e a alergia cruzada entre subclasses?", "alternativas": ["Hidrólise por β-lactamases e anel β-lactâmico comum", "Quelação de cálcio e alta lipossolubilidade", "Bloqueio do folato e excreção biliar exclusiva", "Ação na membrana externa e ligação ao ergosterol"], "correta": 0, "porque": "O anel β-lactâmico compartilhado explica a reatividade alérgica cruzada entre penicilinas e cefalosporinas, e sua clivagem enzimática por β-lactamases é o mecanismo de resistência mais comum.", "errados": {"1": "Quelação de cálcio é característica das tetraciclinas e quinolonas, sem relação com o anel da classe.", "2": "O bloqueio do folato pertence às sulfonamidas e trimetoprima, e a maioria dos β-lactâmicos tem eliminação renal.", "3": "A ligação ao ergosterol ocorre com antifúngicos poliênicos, não com antibacterianos de parede."}, "passo": 3}, {"id": "t4", "bloco": "b2", "tema": "Subclasses de penicilinas", "conceito": "penicilinas-subclasses", "nivel": 1, "papel": "checagem", "enunciado": "Qual penicilina tem como principal indicação clínica o tratamento hospitalar de Pseudomonas aeruginosa e enterobactérias multirresistentes?", "alternativas": ["Piperacilina", "Benzilpenicilina G", "Fenoximetilpenicilina V", "Oxacilina"], "correta": 0, "porque": "A piperacilina é uma ureidopenicilina de uso hospitalar cuja principal indicação clínica é cobrir Pseudomonas aeruginosa e enterobactérias multirresistentes.", "errados": {"1": "A benzilpenicilina G é natural, com espectro voltado a Gram-positivos, Neisseria e Treponema, sem ação antipseudomonas.", "2": "A fenoximetilpenicilina V é uma penicilina natural de uso oral com espectro estreito semelhante ao da penicilina G.", "3": "A oxacilina é uma penicilina antiestafilocócica de espectro estreito voltada a Staphylococcus produtores de penicilinase."}, "passo": 1}, {"id": "t5", "bloco": "b2", "tema": "MRSA e oxacilina", "conceito": "oxacilina-mrsa", "nivel": 2, "papel": "checagem", "enunciado": "O antibiograma de uma infecção grave por S. aureus mostra resistência à oxacilina. Qual conduta está alinhada à aula?", "alternativas": ["Indicar vancomicina, pois há resistência aos β-lactâmicos", "Substituir por cefalexina oral em dose dobrada", "Prescrever meropenem por ser um carbapenêmico", "Associar ampicilina com probenecida venosa"], "correta": 0, "porque": "Quando S. aureus é resistente à oxacilina (MRSA), infere-se resistência aos demais β-lactâmicos (cefalosporinas de 1ª a 4ª geração e carbapenêmicos), sendo a vancomicina a escolha clássica.", "errados": {"1": "Cefalosporinas de primeira geração não vencem a resistência à oxacilina, mesmo com aumento de dose.", "2": "Carbapenêmicos como o meropenem não cobrem Staphylococcus aureus resistente à oxacilina.", "3": "Aumentar a meia-vida da ampicilina não supera a alteração de PBP que confere resistência no MRSA."}, "passo": 2}, {"id": "t6", "bloco": "b2", "tema": "Interações", "conceito": "penicilinas-pk-interacoes", "nivel": 3, "papel": "checagem", "enunciado": "Por que a associação de penicilinas com tetraciclinas não é recomendada na prática clínica?", "alternativas": ["Bacteriostáticos reduzem a proliferação exigida pelo bactericida", "Tetraciclinas aceleram a secreção tubular renal da penicilina", "Penicilinas quelam íons cálcio e impedem a ação da tetraciclina", "Ambas competem pela ligação à subunidade ribossomal 50S"], "correta": 0, "porque": "As penicilinas precisam que a bactéria esteja em proliferação ativa sintetizando parede celular para provocar lise; as tetraciclinas, por serem bacteriostáticas, freiam esse crescimento e diminuem a ação da penicilina.", "errados": {"1": "A secreção tubular das penicilinas é reduzida por probenecida e uricosúricos, não acelerada por tetraciclinas.", "2": "A quelação de cátions divalentes como cálcio ocorre com tetraciclinas e quinolonas, não com penicilinas.", "3": "Nenhuma das duas classes atua na subunidade 50S: penicilinas agem na parede e tetraciclinas na 30S."}, "passo": 3}, {"id": "t7", "bloco": "b3", "tema": "Gerações e espectro", "conceito": "cefalosporinas-geracoes", "nivel": 1, "papel": "checagem", "enunciado": "Qual cefalosporina de 3ª geração é destacada na aula por possuir cobertura contra Pseudomonas aeruginosa e ser forte indutora de resistência?", "alternativas": ["Ceftazidima", "Cefalexina", "Ceftriaxona", "Ceftarolina"], "correta": 0, "porque": "Entre as cefalosporinas de 3ª geração, a ceftazidima destaca-se pela atividade antipseudomonas e pelo alerta de stewardship por ser forte indutora de resistência bacteriana.", "errados": {"1": "A cefalexina é de 1ª geração, com foco em Gram-positivos e sem atividade contra Pseudomonas.", "2": "A ceftriaxona é de 3ª geração excelente para meningite e pneumonias, mas não cobre Pseudomonas.", "3": "A ceftarolina é de 5ª geração voltada para MRSA e não possui ação contra Pseudomonas."}, "passo": 1}, {"id": "t8", "bloco": "b3", "tema": "Farmacocinética e BHE", "conceito": "cefalosporinas-bhe-pk", "nivel": 2, "papel": "checagem", "enunciado": "Por que a ceftriaxona é empregada na meningite bacteriana com o dobro da dose usada na pneumonia, e qual sua particularidade de excreção?", "alternativas": ["Atravessa a BHE em dose plena e tem eliminação biliar", "É lipossolúvel pura e sofre excreção exclusiva pelo suor", "Não atravessa a BHE e exige infusão intratecal obrigatória", "Tem meia-vida de 30 minutos e eliminação apenas gástrica"], "correta": 0, "porque": "A ceftriaxona atravessa a barreira hematoencefálica, mas exige dose dobrada para atingir concentração adequada no SNC; além disso, é excretada na bile, podendo ser usada na insuficiência renal.", "errados": {"1": "Cefalosporinas são hidrossolúveis e não são eliminadas pelo suor.", "2": "A administração intratecal exclusiva na meningite foi citada nos slides para a polimixina B, não para cefalosporinas de 3ª geração.", "3": "A ceftriaxona tem a meia-vida mais longa entre as cefalosporinas (6 a 8 horas), permitindo dose única diária."}, "passo": 2}, {"id": "t9", "bloco": "b4", "tema": "Inibidores de β-lactamase", "conceito": "inibidores-bl", "nivel": 1, "papel": "checagem", "enunciado": "Qual associação de penicilina com inibidor de β-lactamase deve ter seu uso restrito por ser a única do grupo com atividade contra Acinetobacter spp.?", "alternativas": ["Ampicilina + sulbactam", "Amoxicilina + ácido clavulânico", "Piperacilina + tazobactam", "Ticarcilina + ácido clavulânico"], "correta": 0, "porque": "Os slides de Princípios Gerais de Uso (Parte III, slide 75) destacam que a ampicilina-sulbactam deve ser restringida por ser a única penicilina com inibidor de β-lactamase ativa contra Acinetobacter spp.", "errados": {"1": "Amoxicilina com clavulanato é voltada a infecções comunitárias respiratórias, H. influenzae, S. aureus e B. fragilis.", "2": "Piperacilina com tazobactam tem destaque hospitalar contra Pseudomonas aeruginosa, não sendo a exceção citada para Acinetobacter.", "3": "Ticarcilina com clavulanato destaca-se pela ação antipseudomonas, sem ser a associação única contra Acinetobacter destacada nas diretrizes da aula."}, "passo": 1}, {"id": "t10", "bloco": "b4", "tema": "Monobactâmicos", "conceito": "monobactamicos", "nivel": 2, "papel": "checagem", "enunciado": "Um paciente com alergia grave à penicilina apresenta sepse por bacilo Gram-negativo aeróbio e disfunção renal que desaconselha aminoglicosídeo. Qual β-lactâmico não clássico é a opção mais adequada?", "alternativas": ["Aztreonam", "Ertapenem", "Oxacilina", "Cefalexina"], "correta": 0, "porque": "O aztreonam (monobactâmico) atua exclusivamente contra Gram-negativos aeróbios, apresenta pouca reatividade cruzada alérgica com os demais β-lactâmicos e serve como alternativa à oto e nefrotoxicidade dos aminoglicosídeos.", "errados": {"1": "Carbapenêmicos têm espectro amplo, mas não são a escolha de menor reatividade cruzada destacada para substituir aminoglicosídeos em alérgicos.", "2": "A oxacilina é uma penicilina voltada apenas a Gram-positivos (MSSA) e contraindicada em alérgicos à penicilina.", "3": "A cefalexina é uma cefalosporina oral de 1ª geração voltada a Gram-positivos e sujeita à reação cruzada com penicilinas."}, "passo": 2}, {"id": "t11", "bloco": "b4", "tema": "Carbapenêmicos e cilastatina", "conceito": "carbapenemicos-kpc", "nivel": 2, "papel": "checagem", "enunciado": "Qual é a função farmacológica da cilastatina quando administrada em associação fixa com o imipenem?", "alternativas": ["Inibir a desidropeptidase-I renal que hidrolisa o imipenem", "Bloquear carbapenemases tipo KPC produzidas por Klebsiella", "Aumentar a penetração do imipenem contra cepas de MRSA", "Reduzir a ligação do imipenem às proteínas plasmáticas"], "correta": 0, "porque": "O imipenem sofre rápida hidrólise pela desidropeptidase-I na borda em escova do túbulo contorcido proximal; a cilastatina inibe essa enzima, permitindo recuperar cerca de 70% do imipenem ativo na urina.", "errados": {"1": "A cilastatina atua em uma enzima tubular renal humana, não em enzimas bacterianas como a KPC.", "2": "Nem o imipenem nem a cilastatina conferem atividade contra Staphylococcus aureus resistente à meticilina (MRSA).", "3": "A função da cilastatina é bloquear degradação enzimática renal, sem relação com deslocamento proteico no plasma."}, "passo": 3}, {"id": "t12", "bloco": "b5", "tema": "Espectro e MRSA", "conceito": "glicopeptideos-mecanismo", "nivel": 1, "papel": "checagem", "enunciado": "Por que a vancomicina mantém eficácia em infecções por Staphylococcus aureus resistente à oxacilina (MRSA)?", "alternativas": ["Não tem relação química com β-lactâmicos, evitando resistência cruzada", "Inibe a subunidade ribossomal 50S com alta afinidade", "Penetra facilmente pelas porinas de bacilos Gram-negativos", "Bloqueia a enzima DNA girase sem depender da parede celular"], "correta": 0, "porque": "Por não apresentar relação química com os β-lactâmicos e atuar na extremidade D-alanil do peptidoglicano (e não nas PBPs), não ocorre resistência cruzada entre vancomicina e β-lactâmicos.", "errados": {"1": "A vancomicina não atua em ribossomos (50S é alvo de macrolídeos, clindamicina e cloranfenicol).", "2": "A vancomicina não atravessa as porinas de bacilos Gram-negativos e não possui ação contra Gram-negativos.", "3": "A inibição da DNA girase pertence às quinolonas, enquanto a vancomicina atua na parede celular."}, "passo": 1}, {"id": "t13", "bloco": "b5", "tema": "Vancomicina vs. Teicoplanina", "conceito": "vanco-vs-teico", "nivel": 2, "papel": "checagem", "enunciado": "Qual característica farmacocinética diferencia a teicoplanina da vancomicina e pode evitar a manutenção de um idoso internado?", "alternativas": ["Duração mais longa e possibilidade de administração intramuscular", "Absorção oral completa com excelente penetração no SNC", "Cobertura ampliada contra bacilos Gram-negativos e Pseudomonas", "Eliminação exclusiva pela bile sem qualquer risco de ototoxicidade"], "correta": 0, "porque": "A teicoplanina compartilha o espectro Gram-positivo da vancomicina, mas apresenta duração de ação mais longa e pode ser administrada por via intramuscular (além da IV), permitindo tratamento ambulatorial.", "errados": {"1": "A via oral não é utilizada para infecções sistêmicas pelos glicopeptídeos, e a absorção gastrointestinal é desprezível.", "2": "Nenhum glicopeptídeo cobre bacilos Gram-negativos ou Pseudomonas aeruginosa.", "3": "A teicoplanina ainda pode causar ototoxicidade, febre, tontura e tromboflebite segundo o slide 58."}, "passo": 2}, {"id": "t14", "bloco": "b6", "tema": "Infusão e reação adversa", "conceito": "pescoco-vermelho", "nivel": 1, "papel": "checagem", "enunciado": "Qual conduta de administração previne a Síndrome do Pescoço Vermelho associada à vancomicina?", "alternativas": ["Administrar por infusão intravenosa lenta em 60 minutos", "Administrar em bolus rápido para reduzir o tempo de exposição", "Substituir a via venosa pela via oral em infecções sistêmicas", "Misturar vancomicina e aztreonam no mesmo frasco de soro"], "correta": 0, "porque": "A Síndrome do Pescoço Vermelho decorre da liberação de histamina induzida pela infusão rápida; a administração IV lenta por no mínimo 60 minutos previne essa reação.", "errados": {"1": "A infusão em bolus rápido é exatamente o gatilho que libera histamina e provoca o quadro.", "2": "A vancomicina oral não é absorvida no trato gastrointestinal e não trata infecções sistêmicas.", "3": "Vancomicina e aztreonam são quimicamente incompatíveis quando diluídos no mesmo frasco de infusão."}, "passo": 1}, {"id": "t15", "bloco": "b6", "tema": "Interação tóxica", "conceito": "vanco-toxicidade-interacoes", "nivel": 2, "papel": "checagem", "enunciado": "Um paciente internado recebe gentamicina associada à vancomicina. Qual risco tóxico exige monitorização prioritária segundo a aula?", "alternativas": ["Potencialização de ototoxicidade e nefrotoxicidade", "Desenvolvimento de síndrome cinzenta do recém-nascido", "Aumento agudo do risco de kernicterus neonatal", "Inibição do citocromo P450 com hipoglicemia grave"], "correta": 0, "porque": "A associação de glicopeptídeos (vancomicina) com aminoglicosídeos (gentamicina) produz sinergismo tóxico (1+1=10), potencializando tanto a nefrotoxicidade quanto a ototoxicidade.", "errados": {"1": "A síndrome do bebê cinzento é um efeito adverso clássico do cloranfenicol em recém-nascidos.", "2": "O kernicterus por deslocamento de bilirrubina da albumina está associado às sulfonamidas.", "3": "A principal preocupação clínica da dupla gentamicina + vancomicina é lesão renal e auditiva, não hipoglicemia via CYP450."}, "passo": 2}], "microtestes": [{"tipo": "vf", "questao": "q1", "alvo": ["Classes inibidoras da parede"], "conceito": "parede-bactericida", "bloco": "b1", "enunciado": "Aminoglicosídeos e macrolídeos atuam bloqueando a síntese do peptidoglicano da parede bacteriana.", "resposta": false, "explicacao": "Aminoglicosídeos (30S) e macrolídeos (50S) são inibidores da síntese proteica ribossomal, não da parede celular.", "passo": 1, "id": "m1"}, {"tipo": "multipla", "questao": "q1", "alvo": ["Classes inibidoras da parede"], "conceito": "pbp-transpeptidacao", "bloco": "b1", "enunciado": "Qual processo bacteriano é diretamente bloqueado pelos β-lactâmicos ao inativar as PBPs?", "alternativas": ["Transpeptidação do peptidoglicano", "Síntese de ácido tetra-hidrofólico", "Replicação do DNA pela DNA girase", "Tradução proteica na subunidade ribossômica 30S"], "correta": 0, "explicacao": "As PBPs catalisam a transpeptidação que fecha a malha de peptidoglicano da parede celular.", "passo": 2, "id": "m2"}, {"tipo": "lacuna", "questao": "q2", "alvo": ["Resistência aos β-lactâmicos"], "conceito": "anel-beta-resistencia", "bloco": "b1", "enunciado": "As enzimas bacterianas que rompem o anel β-lactâmico e inativam penicilinas e cefalosporinas chamam-se ____.", "resposta": "beta-lactamases", "explicacao": "Penicilinases, cefalosporinases e carbapenemases pertencem à grande família das β-lactamases.", "passo": 3, "id": "m3"}, {"tipo": "vf", "questao": "q2", "alvo": ["Resistência aos β-lactâmicos"], "conceito": "anel-beta-resistencia", "bloco": "b1", "enunciado": "A modificação de ergosterol na membrana explica a resistência bacteriana às penicilinas.", "resposta": false, "explicacao": "Ergosterol é um esterol da membrana de fungos, não de bactérias.", "passo": 3, "id": "m4"}, {"tipo": "vf", "questao": "q3", "alvo": ["Função do ácido clavulânico"], "conceito": "inibidores-bl", "bloco": "b4", "enunciado": "O ácido clavulânico protege a amoxicilina ao bloquear a secreção tubular renal da penicilina.", "resposta": false, "explicacao": "Quem bloqueia a secreção tubular renal das penicilinas é a probenecida; o ácido clavulânico bloqueia β-lactamases bacterianas.", "passo": 1, "id": "m5"}, {"tipo": "lacuna", "questao": "q3", "alvo": ["Função do ácido clavulânico"], "conceito": "inibidores-bl", "bloco": "b4", "enunciado": "Na associação com amoxicilina, o ácido clavulânico impede a destruição do antibiótico ao inibir enzimas chamadas ____.", "resposta": "beta-lactamases", "explicacao": "Ao inibir as β-lactamases, o clavulanato preserva o anel β-lactâmico da amoxicilina.", "passo": 1, "id": "m6"}, {"tipo": "multipla", "questao": "q4", "alvo": ["Falha de meropenem e KPC"], "conceito": "carbapenemicos-kpc", "bloco": "b4", "enunciado": "Qual enzima bacteriana inativa carbapenêmicos como o meropenem em cepas hospitalares de Klebsiella pneumoniae?", "alternativas": ["Carbapenemase tipo KPC", "Desidropeptidase-I renal", "DNA girase mutada", "Di-hidropteroato sintase"], "correta": 0, "explicacao": "KPC significa Klebsiella pneumoniae carbapenemase, enzima que destrói o anel β-lactâmico dos carbapenêmicos.", "passo": 3, "id": "m7"}, {"tipo": "vf", "questao": "q4", "alvo": ["Falha de meropenem e KPC"], "conceito": "carbapenemicos-kpc", "bloco": "b4", "enunciado": "Mutações na topoisomerase IV explicam a resistência de Klebsiella pneumoniae aos carbapenêmicos.", "resposta": false, "explicacao": "Topoisomerase IV e DNA girase são alvos das fluoroquinolonas, não dos β-lactâmicos.", "passo": 3, "id": "m8"}, {"tipo": "vf", "questao": "q5", "alvo": ["Mecanismo dos carbapenêmicos"], "conceito": "carbapenemicos-kpc", "bloco": "b4", "enunciado": "Os carbapenêmicos atuam bloqueando a síntese da parede celular bacteriana por pertencerem à família dos β-lactâmicos.", "resposta": true, "explicacao": "Como β-lactâmicos não clássicos, carbapenêmicos inibem as PBPs e bloqueiam a parede de peptidoglicano.", "passo": 3, "id": "m9"}, {"tipo": "multipla", "questao": "q5", "alvo": ["Mecanismo dos carbapenêmicos"], "conceito": "pbp-transpeptidacao", "bloco": "b1", "enunciado": "Qual é o efeito resultante da ação dos carbapenêmicos sobre bactérias sensíveis?", "alternativas": ["Bactericida", "Bacteriostático exclusivo", "Antifúngico por poros de ergosterol", "Antiviral por inibição da transcriptase reversa"], "correta": 0, "explicacao": "Os β-lactâmicos, incluindo os carbapenêmicos, provocam lise da parede celular e têm ação bactericida.", "passo": 2, "id": "m10"}, {"tipo": "vf", "questao": "q6", "alvo": ["Cefalosporinas orais"], "conceito": "cefalosporinas-geracoes", "bloco": "b3", "enunciado": "Cefalexina, cefadroxil e cefaclor são exemplos de cefalosporinas que podem ser administradas por via oral.", "resposta": true, "explicacao": "Cefalexina e cefadroxil (1ª geração) e cefaclor (2ª geração) estão disponíveis por via oral.", "passo": 1, "id": "m11"}, {"tipo": "vf", "questao": "q6", "alvo": ["Ceftriaxona e cefotaxima na BHE"], "conceito": "cefalosporinas-bhe-pk", "bloco": "b3", "enunciado": "Ceftriaxona e cefotaxima atravessam a barreira hematoencefálica e são empregadas no tratamento da meningite bacteriana.", "resposta": true, "explicacao": "São cefalosporinas parenterais de 3ª geração com boa penetração no líquor.", "passo": 2, "id": "m12"}, {"tipo": "vf", "questao": "q6", "alvo": ["Imipenem é β-lactâmico"], "conceito": "carbapenemicos-kpc", "bloco": "b4", "enunciado": "O imipenem pertence à classe dos carbapenêmicos, que faz parte dos antibióticos β-lactâmicos não clássicos.", "resposta": true, "explicacao": "Carbapenêmicos possuem anel β-lactâmico e integram os β-lactâmicos não clássicos.", "passo": 3, "id": "m13"}, {"tipo": "vf", "questao": "q6", "alvo": ["Penicilinas com IBL"], "conceito": "inibidores-bl", "bloco": "b4", "enunciado": "Amoxicilina + clavulanato e ampicilina + sulbactam são úteis em infecções respiratórias por bactérias produtoras de β-lactamases.", "resposta": true, "explicacao": "O inibidor de β-lactamase protege a aminopenicilina contra enzimas de H. influenzae e S. aureus.", "passo": 1, "id": "m14"}, {"tipo": "vf", "questao": "q7", "alvo": ["Ausência de resistência cruzada"], "conceito": "glicopeptideos-mecanismo", "bloco": "b5", "enunciado": "A vancomicina apresenta atividade eficaz contra bacilos Gram-negativos aeróbios e micobactérias.", "resposta": false, "explicacao": "A vancomicina tem espectro restrito a bactérias Gram-positivas e não age contra bacilos Gram-negativos nem micobactérias.", "passo": 1, "id": "m15"}, {"tipo": "multipla", "questao": "q7", "alvo": ["Ausência de resistência cruzada"], "conceito": "glicopeptideos-mecanismo", "bloco": "b5", "enunciado": "Qual característica química explica a ausência de resistência cruzada entre vancomicina e penicilinas?", "alternativas": ["Não possui relação química estrutural com outros antibióticos como os β-lactâmicos", "Contém o mesmo anel β-lactâmico protegido por clavulanato", "Liga-se à subunidade ribossômica 50S das bactérias", "Atua exclusivamente por inibição competitiva da síntese de folato"], "correta": 0, "explicacao": "Por ser um glicopeptídeo sem relação química com os β-lactâmicos, a resistência à oxacilina não confere resistência cruzada à vancomicina.", "passo": 1, "id": "m16"}, {"tipo": "lacuna", "questao": "q8", "alvo": ["Interação gentamicina + vancomicina"], "conceito": "vanco-toxicidade-interacoes", "bloco": "b6", "enunciado": "Quando associada à gentamicina, a vancomicina potencializa duas toxicidades graves: a nefrotoxicidade e a ____.", "resposta": "ototoxicidade", "explicacao": "Aminoglicosídeos e vancomicina apresentam sinergismo para lesão renal e auditiva.", "passo": 2, "id": "m17"}, {"tipo": "vf", "questao": "q8", "alvo": ["Interação gentamicina + vancomicina"], "conceito": "vanco-toxicidade-interacoes", "bloco": "b6", "enunciado": "O principal risco da associação gentamicina + vancomicina é a inibição do metabolismo hepático de ambos os fármacos.", "resposta": false, "explicacao": "Ambos são eliminados principalmente por filtração glomerular renal; o risco crítico é a potencialização de oto e nefrotoxicidade.", "passo": 2, "id": "m18"}, {"tipo": "multipla", "questao": "q9", "alvo": ["Infusão rápida de vancomicina"], "conceito": "pescoco-vermelho", "bloco": "b6", "enunciado": "Qual mediador é liberado durante a infusão venosa rápida de vancomicina, desencadeando eritema e prurido?", "alternativas": ["Histamina", "Aldosterona", "Bilirrubina indireta", "Eritropoetina"], "correta": 0, "explicacao": "A infusão rápida de vancomicina causa liberação direta de histamina, levando à Síndrome do Pescoço Vermelho.", "passo": 1, "id": "m19"}, {"tipo": "vf", "questao": "q9", "alvo": ["Infusão rápida de vancomicina"], "conceito": "pescoco-vermelho", "bloco": "b6", "enunciado": "A administração rápida de vancomicina provoca crise hipertensiva grave como reação clássica.", "resposta": false, "explicacao": "A liberação de histamina na Síndrome do Pescoço Vermelho tende a provocar vasodilatação e hipotensão, não crise hipertensiva.", "passo": 1, "id": "m20"}, {"tipo": "lacuna", "questao": "q10", "alvo": ["Classe da vancomicina"], "conceito": "glicopeptideos-mecanismo", "bloco": "b5", "enunciado": "A vancomicina e a teicoplanina pertencem à classe dos ____.", "resposta": "glicopeptídeos", "explicacao": "São glicopeptídeos (polipeptídeos) ativos exclusivamente contra Gram-positivos.", "passo": 1, "id": "m21"}, {"tipo": "vf", "questao": "q10", "alvo": ["Mecanismo de ação"], "conceito": "glicopeptideos-mecanismo", "bloco": "b5", "enunciado": "A vancomicina exerce efeito bactericida ao inibir a síntese da parede celular bacteriana.", "resposta": true, "explicacao": "A vancomicina bloqueia a síntese do peptidoglicano na parede de Gram-positivos, causando morte celular.", "passo": 1, "id": "m22"}, {"tipo": "vf", "questao": "q10", "alvo": ["Reações adversas"], "conceito": "pescoco-vermelho", "bloco": "b6", "enunciado": "A infusão venosa rápida de vancomicina pode desencadear a Síndrome do Pescoço Vermelho por liberação de histamina.", "resposta": true, "explicacao": "A infusão lenta em pelo menos 60 minutos previne a Síndrome do Pescoço Vermelho.", "passo": 1, "id": "m23"}, {"tipo": "vf", "questao": "q10", "alvo": ["Reações adversas"], "conceito": "vanco-toxicidade-interacoes", "bloco": "b6", "enunciado": "Nefrotoxicidade e ototoxicidade estão entre as toxicidades sistêmicas clássicas da vancomicina.", "resposta": true, "explicacao": "A vancomicina possui índice terapêutico estreito com risco de lesão renal e auditiva.", "passo": 2, "id": "m24"}], "questoes": [{"id": "q1", "capitulo": "c1", "ref": "Banco de Farmacoterapia · Q393 (Prova antiga)", "enunciado": "(Início do enunciado incompleto no original) … constitutivamente resistentes aos antibióticos inibidores da síntese da parede celular. Assinale a alternativa que apresenta as duas classes mais importantes de inibidores da parede celular:", "itens": [], "tabela": null, "resposta_esperada": "Alternativa B: Beta-lactâmicos e glicopeptídeos. Os β-lactâmicos inibem as PBPs (transpeptidação do peptidoglicano) e os glicopeptídeos (vancomicina, teicoplanina) ligam-se à D-Ala-D-Ala da parede celular. Aminoglicosídeos, macrolídeos e oxazolidinonas inibem a síntese proteica ribossomal; sulfonamidas inibem a síntese de folato.", "comentario": "Separe os fármacos por alvo celular: parede (β-lactâmicos e glicopeptídeos), ribossomo (aminoglicosídeos, macrolídeos, oxazolidinonas) e folato (sulfonamidas).", "figuras": [], "alvos": {"Classes inibidoras da parede": ["parede-bactericida", "pbp-transpeptidacao"]}, "objetiva": {"alts": ["Aminoglicosídeos e macrolídeos", "Beta-lactâmicos e glicopeptídeos", "Macrolídeos e oxazolidinonas", "Beta-lactâmicos e aminoglicosídeos", "Sulfonamidas e glicopeptídeos"], "correta": 1}}, {"id": "q2", "capitulo": "c1", "ref": "Banco de Farmacoterapia · Q325 (Simulado · Bloco 5.1, Q9)", "enunciado": "O mecanismo de resistência bacteriana mais comum contra beta-lactâmicos envolve:", "itens": [], "tabela": null, "resposta_esperada": "Alternativa A: produção de beta-lactamases. Essas enzimas hidrolisam o anel β-lactâmico e inativam o antimicrobiano antes de atingir a PBP. As demais opções misturam alvos de sulfonamidas (folato), aminoglicosídeos/tetraciclinas (30S), antifúngicos (ergosterol) e mediadores inflamatórios humanos (prostaglandinas).", "comentario": "Ligue o nome da classe ao núcleo químico atacado: anel β-lactâmico é hidrolisado por β-lactamases.", "figuras": [], "alvos": {"Resistência aos β-lactâmicos": ["anel-beta-resistencia"]}, "objetiva": {"alts": ["produção de beta-lactamases", "aumento da síntese de folato", "mutação ribossomal 30S exclusivamente", "aumento de ergosterol", "produção de prostaglandinas"], "correta": 0}}, {"id": "q3", "capitulo": "c2", "ref": "Banco de Farmacoterapia · Q326 e Q331 (Simulado · Bloco 5.1, Q11 e Q18)", "enunciado": "A associação amoxicilina + clavulanato existe porque o clavulanato:", "itens": ["(Na versão dissertativa Q331: Explique a importância clínica do ácido clavulânico quando associado à amoxicilina.)"], "tabela": null, "resposta_esperada": "Alternativa C: inibe beta-lactamases. O ácido clavulânico não possui grande atividade antibacteriana isolada, mas se liga e inibe as enzimas β-lactamases produzidas por bactérias como H. influenzae, S. aureus (MSSA) e Bacteroides fragilis, protegendo o anel β-lactâmico da amoxicilina e restaurando sua eficácia clínica.", "comentario": "Diferencie o papel de cada fármaco da dupla: a amoxicilina bloqueia a PBP; o ácido clavulânico neutraliza as β-lactamases que destruiriam a amoxicilina.", "figuras": [], "alvos": {"Função do ácido clavulânico": ["inibidores-bl"]}, "objetiva": {"alts": ["aumenta absorção intestinal", "reduz eliminação renal", "inibe beta-lactamases", "aumenta ligação ao ribossomo", "atua no DNA bacteriano"], "correta": 2}}, {"id": "q4", "capitulo": "c2", "ref": "Banco de Farmacoterapia · Q316 (Prova antiga)", "enunciado": "Uma cepa de Klebsiella pneumoniae resistente a ceftriaxona é tratada com meropenem. Após dias, há falha clínica. Uma possível explicação é:", "itens": [], "tabela": null, "resposta_esperada": "Alternativa A: Produção de carbapenemase tipo KPC. O meropenem é um carbapenêmico; quando há falha clínica em K. pneumoniae multirresistente, a principal explicação enzimática é a produção de carbapenemase tipo KPC (Klebsiella pneumoniae carbapenemase), que hidrolisa inclusive carbapenêmicos. Topoisomerase IV é alvo de quinolonas e di-hidropteroato sintase é alvo de sulfonamidas.", "comentario": "Relacione o fármaco que falhou (meropenem = carbapenêmico) à enzima que inativa essa classe em Klebsiella pneumoniae (KPC).", "figuras": [], "alvos": {"Falha de meropenem e KPC": ["carbapenemicos-kpc"]}, "objetiva": {"alts": ["Produção de carbapenemase tipo KPC", "Mutação da topoisomerase IV", "Inativação da di-hidropteroato sintase", "Aumento da resistência ao fluxo biliar"], "correta": 0}}, {"id": "q5", "capitulo": "c2", "ref": "Banco de Farmacoterapia · Q318 (Simulado Final · Q16)", "enunciado": "Qual mecanismo explica a ação bactericida dos carbapenêmicos?", "itens": [], "tabela": null, "resposta_esperada": "Alternativa B: Inibição da parede celular. Os carbapenêmicos (imipenem, meropenem, ertapenem) pertencem à família dos β-lactâmicos não clássicos; portanto, ligam-se às PBPs, inibem a síntese de peptidoglicano da parede celular e provocam lise bacteriana.", "comentario": "Lembre sempre que carbapenêmicos são β-lactâmicos: todo β-lactâmico inibe a síntese da parede celular.", "figuras": [], "alvos": {"Mecanismo dos carbapenêmicos": ["carbapenemicos-kpc", "pbp-transpeptidacao"]}, "objetiva": {"alts": ["Inibição da síntese proteica 30S", "Inibição da parede celular", "Inibição da topoisomerase IV", "Inibição da síntese de folato"], "correta": 1}}, {"id": "q6", "capitulo": "c2", "ref": "Banco de Farmacoterapia · Q396 (Prova antiga)", "enunciado": "Atualme
