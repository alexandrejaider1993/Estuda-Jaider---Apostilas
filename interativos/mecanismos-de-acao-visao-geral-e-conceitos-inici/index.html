<script>
const D={"capitulos": [{"id": "c1", "titulo": "Conceitos e classificações iniciais", "abertura": "Antes de decorar famílias, separe quatro perguntas: o que é o agente, quais microrganismos são atingidos, qual efeito ocorre e qual alvo explica a ação.", "slides": "Parte I, slides 6 a 14 e 22 a 23", "provas": "Questões autorais do recorte introdutório"}, {"id": "c2", "titulo": "Mapa dos mecanismos de ação", "abertura": "Organize as famílias por cinco grandes alvos. O objetivo é reconhecer a ligação entre alvo, processo interrompido e consequência, sem avançar para protocolos de tratamento.", "slides": "Parte I, slides 29 e 30; Parte II, slides 5, 15 e 31", "provas": "Questões autorais de integração dos mecanismos"}], "conceitos": [{"id": "terminologia", "nome": "Termos fundamentais", "definicao": "Antimicrobiano é o termo abrangente; antibiótico tem uso histórico e uso clínico atual."}, {"id": "aplicacao", "nome": "Tecido vivo e material inanimado", "definicao": "Antissepsia é aplicada a tecidos vivos; desinfecção é aplicada a materiais e superfícies."}, {"id": "classificacoes", "nome": "Eixos independentes", "definicao": "Origem, estrutura, espectro e mecanismo não são sinônimos."}, {"id": "efeito", "nome": "Bactericida e bacteriostático", "definicao": "Morte e inibição do crescimento são efeitos distintos e dependentes das condições avaliadas."}, {"id": "medidas", "nome": "CIM e CBM", "definicao": "CIM avalia inibição visível; CBM avalia redução de viabilidade."}, {"id": "parede", "nome": "Síntese do peptidoglicano", "definicao": "Beta-lactâmicos e glicopeptídeos interferem na construção da parede por alvos diferentes."}, {"id": "membrana", "nome": "Integridade da membrana", "definicao": "Polimixinas desorganizam membranas bacterianas e alteram a permeabilidade."}, {"id": "proteinas", "nome": "Síntese proteica", "definicao": "30S e 50S são alvos de famílias que interferem na tradução."}, {"id": "nucleicos", "nome": "DNA e RNA", "definicao": "Quinolonas atingem topoisomerases; rifampicina atinge RNA polimerase."}, {"id": "folatos", "nome": "Bloqueio metabólico", "definicao": "Sulfonamidas e trimetoprima bloqueiam etapas diferentes da via dos folatos."}], "blocos": [{"id": "b1", "capitulo": "c1", "titulo": "Antimicrobiano, antibiótico e controle de microrganismos", "onde": "Parte I, slides 6 e 7; transcrição 2, 26:25 a 29:50", "ensina": ["terminologia", "aplicacao"], "seq": [["cx", "gancho", "Caso para começar", "Antes de uma punção, a pele recebe uma solução antisséptica.\n**Antes de seguir:** o procedimento esteriliza a pele ou reduz a carga microbiana?", null], ["cx", "ideia", "A ideia em uma frase", "Antimicrobiano descreve atividade contra microrganismos; antissepsia, desinfecção e esterilização descrevem contextos ou objetivos de controle.", null], ["passo", "Primeiro, o que é um antimicrobiano e onde os fármacos agem?"], ["p", "Para começar sem confusão, pense em **antimicrobiano** como o guarda-chuva mais amplo: é qualquer substância capaz de inibir o crescimento ou destruir microrganismos, seja de origem natural, semissintética ou sintética.", []], ["p", "No modelo interativo logo abaixo, explore os cinco grandes pontos onde os antimicrobianos atacam a bactéria: parede, membrana, ribossomos, ácidos nucleicos e metabolismo dos folatos. Essas camadas são um recurso didático para organizar o raciocínio.", []], ["p", "Dentro desse guarda-chuva, cada grupo tem seu próprio alvo. Um **antibacteriano** age contra bactérias; antifúngicos agem contra fungos e antivirais contra vírus.", []], ["p", "Por isso, esses termos não são intercambiáveis. Uma infecção viral, sozinha, não oferece alvo para um antibacteriano agir.", []], ["passo", "Antimicrobiano e antibiótico são a mesma coisa?"], ["p", "Aqui, vale atenção a uma diferença de vocabulário que aparece entre a fala da aula e o slide 6.", []], ["cx", "conceito", "Vamos separar as duas convenções de \"antibiótico\"", "**Definição histórica (restrita):** substância produzida por um microrganismo com atividade contra outros microrganismos (essa é a convenção usada na transcrição).\n**Uso clínico atual (ampliado):** engloba também os antibacterianos semissintéticos e sintéticos (essa é a convenção usada no slide 6).", null], ["p", "Essa diferença não muda o mecanismo de ação de nenhum medicamento. Em uma prova ou questão dissertativa, basta deixar clara qual convenção está sendo usada.", []], ["passo", "Antissepsia, desinfecção ou esterilização: como escolher o termo certo?"], ["p", "Agora volte à cena do início do bloco: passar solução na pele antes de uma punção esteriliza a pele?", []], ["p", "Não. A pele é um **tecido vivo** e não suportaria um processo de esterilização. O que se faz na pele é **antissepsia**, reduzindo ou inibindo a carga de microrganismos no local.", []], ["cx", "conceito", "Vamos separar os três procedimentos de controle", "**Antissepsia:** reduz ou inibe microrganismos em **tecido vivo**, como no preparo da pele.\n**Desinfecção:** atua em **objetos e superfícies inanimadas**, sem garantir a eliminação de esporos bacterianos.\n**Esterilização:** processo validado que elimina **todas as formas de vida microbiana**, inclusive esporos resistentes.", null], ["tab", "Termos em contexto", ["Termo", "Referência principal", "Exemplo conceitual"], [["**Antimicrobiano**", "Atividade contra microrganismos", "Inibição ou destruição"], ["**Antissepsia**", "Tecido vivo", "Preparo da pele"], ["**Desinfecção**", "Material inanimado", "Tratamento de superfície"], ["**Esterilização**", "Eliminação inclusive de esporos", "Processamento validado de instrumental"]]], ["cx", "erros", "Erros que derrubam", "Chamar o preparo da pele de esterilização.\nConcluir que qualquer antimicrobiano trata qualquer tipo de microrganismo.", null], ["cx", "guardar", "Para guardar", "Pele: antissepsia. Superfície: desinfecção. Eliminação inclusive de esporos: esterilização.", null], ["cx", "sintese", "Síntese", "O termo antimicrobiano é abrangente. O uso de antibiótico depende da convenção histórica ou clínica adotada.", null]]}, {"id": "b2", "capitulo": "c1", "titulo": "Origem, espectro, efeito e medidas de atividade", "onde": "Parte I, slides 10 a 14; estudo dirigido, slide 47", "ensina": ["classificacoes", "efeito", "medidas"], "seq": [["cx", "gancho", "Caso para começar", "Um agente é descrito como sintético, de amplo espectro e bacteriostático.\n**Antes de seguir:** essas três informações identificam o mesmo aspecto?", null], ["cx", "ideia", "A ideia em uma frase", "Origem informa a produção; espectro informa os microrganismos atingidos; efeito informa inibição ou morte; mecanismo informa o processo atingido.", null], ["passo", "Por que um mesmo antibiótico recebe várias classificações diferentes?"], ["p", "Volte ao exemplo do gancho: dizer que um fármaco é sintético, de amplo espectro e bacteriostático não é repetição. Cada palavra responde a uma pergunta diferente.", []], ["p", "O primeiro eixo é a **origem**, que conta como o medicamento foi produzido.", []], ["cx", "conceito", "Os três tipos de origem", "**Natural:** produzido diretamente por microrganismos, como a penicilina G.\n**Semissintético:** parte de uma molécula natural modificada quimicamente em laboratório, como a amoxicilina.\n**Sintético:** fabricado inteiramente por síntese química, como o sulfametoxazol.", null], ["p", "Outro eixo é a **estrutura química**, que agrupa moléculas parecidas em famílias, como os beta-lactâmicos e os macrolídeos.", []], ["passo", "O que significa \"espectro de ação\" e por que amplo não quer dizer melhor?"], ["p", "O **espectro** responde à pergunta: *quais microrganismos esse medicamento consegue atingir?*", [["Espectro", "Conjunto de microrganismos suscetíveis à atividade de um antimicrobiano."]]], ["p", "Um erro muito comum é achar que \"amplo espectro\" significa medicamento mais forte ou escolha superior. Espectro amplo indica apenas abrangência maior, não maior potência nem ação contra todas as bactérias.", []], ["p", "Da mesma forma, a coloração de **Gram** ajuda a descrever características do envoltório bacteriano, mas não substitui a verificação de sensibilidade daquela cepa específica.", []], ["tab", "Pergunta e classificação", ["Pergunta", "Eixo", "Exemplo"], [["Como foi produzido?", "Origem", "Natural ou sintético"], ["Qual estrutura compartilha?", "Família química", "Beta-lactâmico"], ["Quais microrganismos atinge?", "Espectro", "Estreito ou amplo"], ["Qual resultado produz?", "Efeito", "Bacteriostase ou morte"], ["Qual processo interfere?", "Mecanismo", "Síntese da parede"]]], ["passo", "Qual a diferença entre bacteriostático e bactericida?"], ["p", "Aqui, olhamos para o **resultado** da ação do antibiótico sobre a bactéria.", []], ["cx", "conceito", "Vamos separar os dois efeitos", "**Bacteriostático:** freia a multiplicação bacteriana, impedindo que a população cresça.\n**Bactericida:** provoca diretamente a morte das bactérias.", null], ["p", "Mas atenção: essa etiqueta não é fixa para sempre. O efeito depende do par fármaco-bactéria, da exposição e das condições avaliadas.", []], ["p", "Por isso, aumentar a dose por conta própria não transforma obrigatoriamente um agente bacteriostático em bactericida; muitas vezes, apenas eleva o risco de toxicidade.", []], ["passo", "CIM e CBM: por que \"não crescer\" não prova que a bactéria morreu?"], ["p", "Imagine um tubo de laboratório onde o meio de cultura ficou transparente depois de adicionar um antibiótico. A bactéria morreu ou só parou de se multiplicar?", []], ["p", "É exatamente para separar essas duas situações que existem a **CIM** e a **CBM**.", [["Inóculo", "Quantidade inicial padronizada de bactérias colocada no teste laboratorial."]]], ["cx", "conceito", "Vamos separar CIM e CBM", "**CIM (Concentração Inibitória Mínima):** menor concentração do fármaco que impede o crescimento visível da bactéria em condições padronizadas.\n**CBM (Concentração Bactericida Mínima):** menor concentração que reduz em pelo menos 99,9% as bactérias viáveis do inóculo inicial.", null], ["p", "Perceba a lógica: a ausência de crescimento visível na CIM mostra inibição, mas não prova morte bacteriana. Além disso, esses valores são medidas de laboratório e não equivalem diretamente à dose prescrita ao paciente.", []], ["cx", "erros", "Erros que derrubam", "Confundir amplo espectro com maior potência.\nInterpretar CIM como prova de morte bacteriana.\nUsar bactericida como garantia automática de superioridade clínica.", null], ["cx", "guardar", "Para guardar", "CIM: inibição visível. CBM: redução de viabilidade. Espectro não é mecanismo.", null], ["cx", "sintese", "Síntese", "Uma mesma substância recebe classificações complementares. Nenhum eixo isolado determina a escolha clínica.", null]]}, {"id": "b3", "capitulo": "c2", "titulo": "Parede e membrana: estruturas diferentes, mecanismos diferentes", "onde": "Parte I, slide 29; Parte II, slide 31; transcrição 1, 03:30 a 04:15", "ensina": ["parede", "membrana"], "seq": [["cx", "gancho", "Caso para começar", "Dois agentes comprometem o envelope bacteriano: um impede a construção da parede; outro desorganiza membranas.\n**Antes de seguir:** o alvo pode ser considerado idêntico?", null], ["cx", "ideia", "A ideia em uma frase", "Impedir a construção da parede não é o mesmo que romper a função de barreira da membrana.", null], ["passo", "Primeiro, por que a parede celular é um alvo seletivo?"], ["p", "Imagine a bactéria como uma célula sob alta pressão interna. O que impede essa célula de estourar é uma malha rígida externa feita de **peptidoglicano**.", [["Peptidoglicano", "Rede rígida de açúcares e peptídeos que dá sustentação mecânica à parede celular bacteriana."]]], ["p", "Quando um antibiótico atrapalha a montagem dessa rede durante o crescimento e a divisão, a parede fica frágil e a bactéria pode sofrer lise por desequilíbrio osmótico.", []], ["p", "As células humanas não fabricam peptidoglicano, o que explica a alta seletividade desse alvo. Mas atenção: seletividade ajuda na segurança, mas nunca significa ausência de efeitos adversos.", []], ["passo", "Beta-lactâmicos e glicopeptídeos atingem exatamente o mesmo ponto da parede?"], ["p", "Não. Embora as duas famílias impeçam a construção da parede de peptidoglicano, cada uma trava uma peça molecular diferente.", []], ["cx", "conceito", "Vamos separar os dois pontos de ataque na parede", "**Beta-lactâmicos (ex.: penicilinas e cefalosporinas):** ligam-se às enzimas **PBPs** e bloqueiam etapas da síntese da parede, sobretudo a transpeptidação.\n**Glicopeptídeos (ex.: vancomicina):** ligam-se à extremidade **D-Ala-D-Ala** dos precursores do peptidoglicano, impedindo o encaixe da rede.", null], ["p", "Guarde essa ideia: o processo final interrompido é parecido, mas o ponto de interação molecular não é o mesmo.", []], ["passo", "Como a membrana difere da parede e onde entram as polimixinas?"], ["p", "Volte ao gancho do início do bloco: parede e membrana não são sinônimos. Enquanto a parede dá sustentação mecânica, a **membrana** é uma barreira lipídica que controla permeabilidade, transporte e funções energéticas.", []], ["p", "As **polimixinas** interagem com componentes do envelope de bactérias Gram-negativas, como lipopolissacarídeos e fosfolipídios. Essa interação desorganiza as membranas e provoca perda de componentes internos da célula.", []], ["cx", "alerta", "Precisão conceitual sobre o slide 29", "O slide 29 usa a expressão \"alteração da permeabilidade da parede\". Para rigor conceitual, associe a alteração direta de permeabilidade às **membranas**.\nNistatina e anfotericina B, também citadas no slide, são **antifúngicos** que interagem com o **ergosterol** de membranas fúngicas; esse mecanismo não pertence à parede bacteriana.", null], ["tab", "Comparação estrutural", ["Critério", "Parede", "Membrana"], [["Função destacada", "Resistência mecânica", "Barreira seletiva"], ["Processo atingido", "Construção do peptidoglicano", "Integridade e permeabilidade"], ["Exemplos bacterianos", "Beta-lactâmicos e glicopeptídeos", "Polimixinas"]]], ["cx", "erros", "Erros que derrubam", "Usar parede e membrana como sinônimos.\nAfirmar que vancomicina e penicilina se ligam ao mesmo alvo molecular.\nAtribuir ergosterol à membrana bacteriana.", null], ["cx", "guardar", "Para guardar", "Beta-lactâmicos: PBPs. Vancomicina: precursor D-Ala-D-Ala. Polimixinas: membranas.", null], ["cx", "sintese", "Síntese", "O mesmo processo final pode ser atingido em pontos moleculares diferentes.", null]]}, {"id": "b4", "capitulo": "c2", "titulo": "Ribossomos, ácidos nucleicos e folatos", "onde": "Parte I, slides 29 e 30; Parte II, slides 5 e 15", "ensina": ["proteinas", "nucleicos", "folatos"], "seq": [["cx", "gancho", "Caso para começar", "Um agente bloqueia a tradução e outro interfere na replicação do DNA.\n**Antes de seguir:** ambos impedem funções vitais, mas o mecanismo é o mesmo?", null], ["cx", "ideia", "A ideia em uma frase", "A consequência pode ser comum, mas cada mecanismo exige reconhecer qual processo foi diretamente interrompido.", null], ["passo", "Como agem os antibióticos nos ribossomos (30S e 50S)?"], ["p", "O ribossomo é a fábrica de proteínas da bactéria. O processo de produzir proteínas lendo o RNA mensageiro recebe o nome de **tradução**.", []], ["p", "O ribossomo bacteriano é do tipo **70S**, formado pelas subunidades **30S** e **50S**. A letra S indica a velocidade de sedimentação em centrífuga, por isso 30S e 50S não se somam como números comuns.", [["Unidade S", "Svedberg: medida de velocidade de sedimentação de partículas; depende de massa e forma, não é soma aritmética."]]], ["cx", "conceito", "Quem age em cada subunidade ribossomal", "**Subunidade 30S:** aminoglicosídeos e tetraciclinas.\n**Subunidade 50S:** macrolídeos, clindamicina e cloranfenicol.", null], ["p", "Atenção a uma pegadinha clássica: inibir a síntese proteica não garante efeito bacteriostático. Enquanto tetraciclinas, macrolídeos, clindamicina e cloranfenicol são geralmente bacteriostáticos, os **aminoglicosídeos** são usualmente **bactericidas**.", []], ["cx", "alerta", "Cuidado com generalizações sobre competição no ribossomo", "A aula alerta para competição ao combinar fármacos de alvos parecidos. Porém, compartilhar a subunidade 30S ou 50S não prova que dois fármacos disputem o mesmo sítio molecular nem garante antagonismo obrigatório.\nA avaliação de uma associação depende sempre de evidência específica, não apenas do nome da subunidade.", null], ["passo", "Replicação, transcrição e tradução: como separar DNA de RNA?"], ["p", "Para não trocar os nomes na prova, separe os três verbos fundamentais da biologia celular.", []], ["cx", "conceito", "Vamos separar os três processos", "**Replicação:** produz cópias de **DNA**.\n**Transcrição:** produz **RNA** a partir do DNA.\n**Tradução:** produz **proteínas** nos ribossomos.", null], ["p", "Nos antibióticos que atingem os ácidos nucleicos, cada família bloqueia uma enzima diferente. As **quinolonas** atingem a **DNA girase** e a **topoisomerase IV**, travando a organização e a replicação do DNA bacteriano.", []], ["p", "Já a **rifampicina** inibe a **RNA polimerase** bacteriana dependente de DNA, bloqueando diretamente a **transcrição**.", []], ["passo", "Como o bloqueio dos folatos age em duas etapas (bloqueio sequencial)?"], ["p", "Para fabricar peças dos ácidos nucleicos, a bactéria depende de uma linha de montagem química chamada **via dos folatos**.", []], ["p", "Duas famílias atacam essa mesma linha de montagem, mas em estações diferentes, criando o chamado **bloqueio sequencial**.", []], ["cx", "conceito", "As duas enzimas da via dos folatos", "**Sulfonamidas:** competem com o PABA e bloqueiam a enzima **diidropteroato sintase**.\n**Trimetoprima:** bloqueia uma etapa seguinte, inibindo a **diidrofolato redutase** bacteriana.", null], ["p", "Como o bloqueio é metabólico, impede indiretamente a síntese de ácidos nucleicos. Usadas sozinhas, sulfonamidas e trimetoprima costumam ser **bacteriostáticas**; associadas, podem alcançar efeito **bactericida** contra bactérias suscetíveis.", []], ["cx", "livro", "Nota do livro: efeito isolado vs. associação|Conferência entre Parte I (slide 30) e Parte II", "O slide 30 da Parte I resume o grupo dos folatos como bactericida, enquanto a Parte II diferencia o uso isolado da associação.\n**Na prova desta disciplina:** reconhecer que sulfonamidas e trimetoprima isoladas são geralmente bacteriostáticas e que a associação produz bloqueio sequencial com potencial efeito bactericida.\n**Em outras provas:** evitar atribuir efeito bactericida universal a cada componente isolado.", null], ["tab", "Mapa final", ["Processo", "Alvo", "Exemplos"], [["Tradução", "30S", "Aminoglicosídeos; tetraciclinas"], ["Tradução", "50S", "Macrolídeos; clindamicina; cloranfenicol"], ["Organização e replicação do DNA", "Girase; topoisomerase IV", "Quinolonas"], ["Transcrição", "RNA polimerase", "Rifampicina"], ["Via dos folatos", "Diidropteroato sintase; diidrofolato redutase", "Sulfonamidas; trimetoprima"]]], ["cx", "erros", "Erros que derrubam", "Chamar tradução de replicação.\nColocar todo inibidor de síntese proteica entre os bacteriostáticos.\nAfirmar que sulfonamida e trimetoprima inibem a mesma enzima.", null], ["cx", "guardar", "Para guardar", "30S e 50S: proteínas. Girase e topoisomerase IV: DNA. RNA polimerase: RNA. Duas enzimas distintas: folatos.", null], ["cx", "sintese", "Síntese", "Reconheça o alvo direto antes de inferir a consequência final. Mecanismo não equivale a espectro ou efeito.", null]]}], "testes": [{"id": "t1", "bloco": "b1", "tema": "Aplicação", "conceito": "aplicacao", "nivel": 1, "papel": "checagem", "enunciado": "Qual termo descreve o preparo químico da pele antes de uma punção?", "alternativas": ["Antissepsia do tecido vivo", "Desinfecção do tecido vivo", "Esterilização do tecido vivo", "Esterilização do material vivo"], "correta": 0, "porque": "Antissepsia é o termo adequado para controle microbiano em tecido vivo.", "errados": {"1": "Desinfecção se refere a superfícies e materiais inanimados.", "2": "A pele não é esterilizada nesse procedimento.", "3": "O objetivo não é eliminar todas as formas microbianas."}, "passo": 3}, {"id": "t2", "bloco": "b1", "tema": "Definição", "conceito": "terminologia", "nivel": 2, "papel": "checagem", "enunciado": "Qual afirmação expressa corretamente o conceito de antimicrobiano?", "alternativas": ["Pode inibir crescimento ou destruir microrganismos", "Precisa ter origem exclusivamente em fungos", "Precisa atuar exclusivamente contra bactérias", "Pode tratar indistintamente qualquer infecção"], "correta": 0, "porque": "O conceito abrange inibição e destruição, com diferentes origens e alvos.", "errados": {"1": "A origem também pode ser sintética.", "2": "O termo inclui agentes contra outros grupos.", "3": "A atividade depende do agente e do microrganismo."}, "passo": 1}, {"id": "t3", "bloco": "b1", "tema": "Terminologia", "conceito": "terminologia", "nivel": 3, "papel": "checagem", "enunciado": "Como interpretar a diferença entre a transcrição e o slide sobre antibiótico?", "alternativas": ["Reconhecer a definição histórica e o uso clínico ampliado", "Reservar todo antimicrobiano a substâncias de origem natural", "Considerar todo antibiótico eficaz contra qualquer vírus", "Classificar os antibióticos apenas pelo local de aplicação"], "correta": 0, "porque": "A transcrição restringe a origem; o slide usa uma convenção clínica mais ampla.", "errados": {"1": "Antimicrobianos também podem ser sintéticos.", "2": "Antibacterianos não tratam vírus por essa classificação.", "3": "Local de aplicação não define origem nem mecanismo."}, "passo": 2}, {"id": "t4", "bloco": "b2", "tema": "Classificação", "conceito": "classificacoes", "nivel": 1, "papel": "checagem", "enunciado": "A expressão amplo espectro informa principalmente qual característica?", "alternativas": ["O conjunto de microrganismos suscetíveis", "O processo celular diretamente bloqueado", "O método industrial de produção utilizado", "O grau obrigatório de potência terapêutica"], "correta": 0, "porque": "Espectro descreve a abrangência da atividade contra microrganismos.", "errados": {"1": "O processo bloqueado corresponde ao mecanismo.", "2": "O método de produção corresponde à origem.", "3": "Abrangência não determina potência nem superioridade."}, "passo": 2}, {"id": "t5", "bloco": "b2", "tema": "Laboratório", "conceito": "medidas", "nivel": 2, "papel": "checagem", "enunciado": "Um ensaio identifica a menor concentração sem crescimento visível. Qual medida foi obtida?", "alternativas": ["CIM, medida de inibição do crescimento", "CBM, medida de redução da viabilidade", "Dose, medida de exposição do paciente", "Espectro, medida de origem da substância"], "correta": 0, "porque": "A CIM usa a ausência de crescimento visível como critério.", "errados": {"1": "A CBM exige avaliar viabilidade.", "2": "Concentração laboratorial não é uma dose.", "3": "Espectro não mede origem."}, "passo": 4}, {"id": "t6", "bloco": "b3", "tema": "Alvo", "conceito": "parede", "nivel": 1, "papel": "checagem", "enunciado": "Qual associação entre família e alvo está correta?", "alternativas": ["Beta-lactâmicos: proteínas ligadoras de penicilina", "Beta-lactâmicos: subunidade ribossomal bacteriana", "Glicopeptídeos: enzima DNA girase bacteriana", "Polimixinas: enzima de síntese dos folatos"], "correta": 0, "porque": "Beta-lactâmicos ligam-se às PBPs, interferindo na construção da parede.", "errados": {"1": "Ribossomos são alvos de outras famílias.", "2": "DNA girase não é o alvo dos glicopeptídeos.", "3": "Polimixinas atuam nas membranas."}, "passo": 2}, {"id": "t7", "bloco": "b3", "tema": "Distinção", "conceito": "membrana", "nivel": 2, "papel": "checagem", "enunciado": "A desorganização direta da barreira lipídica bacteriana caracteriza qual mecanismo?", "alternativas": ["Alteração da integridade da membrana", "Inibição da construção do peptidoglicano", "Bloqueio da tradução no ribossomo", "Inibição da replicação do cromossomo"], "correta": 0, "porque": "A barreira lipídica corresponde à membrana.", "errados": {"1": "Peptidoglicano é componente da parede.", "2": "Tradução ocorre nos ribossomos.", "3": "Replicação envolve ácidos nucleicos."}, "passo": 3}, {"id": "t8", "bloco": "b3", "tema": "Comparação", "conceito": "parede", "nivel": 3, "papel": "checagem", "enunciado": "Qual diferença distingue beta-lactâmicos de vancomicina na visão geral?", "alternativas": ["Interagem com PBPs ou com precursores, respectivamente", "Interagem com DNA ou com RNA, respectivamente", "Interagem com 30S ou com 50S, respectivamente", "Interagem com folatos ou com lipídios, respectivamente"], "correta": 0, "porque": "Beta-lactâmicos ligam-se a PBPs; vancomicina reconhece D-Ala-D-Ala dos precursores.", "errados": {"1": "A comparação envolve construção da parede.", "2": "Nenhum dos dois atua primariamente nessas subunidades.", "3": "Esses alvos não descrevem a comparação."}, "passo": 2}, {"id": "t9", "bloco": "b4", "tema": "Ribossomos", "conceito": "proteinas", "nivel": 1, "papel": "checagem", "enunciado": "Qual associação entre famílias e subunidade está correta?", "alternativas": ["Aminoglicosídeos e tetraciclinas: subunidade 30S", "Macrolídeos e clindamicina: subunidade 30S", "Quinolonas e rifampicina: subunidade 50S", "Sulfonamidas e trimetoprima: subunidade 50S"], "correta": 0, "porque": "Aminoglicosídeos e tetraciclinas têm a 30S como alvo.", "errados": {"1": "Macrolídeos e clindamicina atuam na 50S.", "2": "Quinolonas e rifampicina atingem processos dos ácidos nucleicos.", "3": "Sulfonamidas e trimetoprima atingem a via dos folatos."}, "passo": 1}, {"id": "t10", "bloco": "b4", "tema": "Integração", "conceito": "folatos", "nivel": 2, "papel": "checagem", "enunciado": "Qual descrição representa o bloqueio sequencial da via dos folatos?", "alternativas": ["Inibição de duas enzimas diferentes da mesma via", "Inibição de duas subunidades do mesmo ribossomo", "Desorganização de duas membranas do envelope", "Bloqueio de duas etapas da tradução proteica"], "correta": 0, "porque": "Sulfonamidas e trimetoprima atingem enzimas diferentes da via dos folatos.", "errados": {"1": "O mecanismo não é ribossomal.", "2": "O mecanismo não envolve ruptura de membranas.", "3": "A tradução não é o alvo direto dessa associação."}, "passo": 3}], "microtestes": [{"tipo": "vf", "questao": "q1", "alvo": ["Efeito e medidas"], "conceito": "medidas", "bloco": "b2", "enunciado": "A ausência de crescimento visível na determinação da CIM comprova que todas as bactérias morreram.", "resposta": false, "explicacao": "A CIM mede inibição; a viabilidade exige avaliação própria.", "passo": 4, "id": "m1"}, {"tipo": "vf", "questao": "q1", "alvo": ["Classificações"], "conceito": "classificacoes", "bloco": "b2", "enunciado": "Espectro descreve os microrganismos suscetíveis, enquanto mecanismo descreve o processo ou alvo atingido.", "resposta": true, "explicacao": "Espectro e mecanismo são eixos de classificação distintos.", "passo": 2, "id": "m2"}, {"tipo": "vf", "questao": "q1", "alvo": ["Efeito e medidas"], "conceito": "efeito", "bloco": "b2", "enunciado": "Bacteriostase significa inibição da multiplicação, enquanto ação bactericida significa morte bacteriana nas condições avaliadas.", "resposta": true, "explicacao": "O efeito distingue inibição da multiplicação de morte bacteriana.", "passo": 3, "id": "m3"}, {"tipo": "vf", "questao": "q2", "alvo": ["Informação celular"], "conceito": "nucleicos", "bloco": "b4", "enunciado": "Quinolonas e rifampicina interferem em processos dos ácidos nucleicos, mas não atingem a mesma enzima.", "resposta": true, "explicacao": "Quinolonas atingem topoisomerases; rifampicina atinge a RNA polimerase.", "passo": 2, "id": "m4"}, {"tipo": "vf", "questao": "q2", "alvo": ["Envelope"], "conceito": "parede", "bloco": "b3", "enunciado": "Beta-lactâmicos ligam-se às PBPs e interferem na construção do peptidoglicano.", "resposta": true, "explicacao": "As PBPs participam da síntese da parede bacteriana.", "passo": 2, "id": "m5"}, {"tipo": "vf", "questao": "q2", "alvo": ["Envelope"], "conceito": "membrana", "bloco": "b3", "enunciado": "Polimixinas atuam diretamente na construção do peptidoglicano, sem alterar membranas.", "resposta": false, "explicacao": "Polimixinas desorganizam membranas e alteram sua integridade e permeabilidade.", "passo": 3, "id": "m6"}, {"tipo": "vf", "questao": "q2", "alvo": ["Informação celular"], "conceito": "proteinas", "bloco": "b4", "enunciado": "Tetraciclinas atuam na subunidade 30S do ribossomo bacteriano, interferindo na tradução.", "resposta": true, "explicacao": "A tradução produz proteínas e é o processo atingido pelos inibidores ribossomais.", "passo": 1, "id": "m7"}, {"tipo": "vf", "questao": "q2", "alvo": ["Metabolismo"], "conceito": "folatos", "bloco": "b4", "enunciado": "Sulfonamidas e trimetoprima inibem a mesma enzima da via dos folatos.", "resposta": false, "explicacao": "Sulfonamidas inibem a diidropteroato sintase; trimetoprima inibe a diidrofolato redutase.", "passo": 3, "id": "m8"}], "questoes": [{"id": "q1", "capitulo": "c1", "ref": "Questão autoral baseada nos conceitos dos slides da Parte I; não transcrita do banco", "enunciado": "Diferencie espectro, mecanismo e efeito antimicrobiano. Explique por que ausência de crescimento visível não comprova morte bacteriana.", "itens": null, "tabela": null, "resposta_esperada": "Espectro é o conjunto de microrganismos suscetíveis; mecanismo é o processo ou alvo atingido; efeito é inibição da multiplicação ou morte. A ausência de crescimento visível define o critério da CIM, mas a demonstração de ação bactericida exige avaliação de viabilidade, como na CBM.", "comentario": "Espectro é o conjunto de microrganismos suscetíveis; mecanismo é o processo ou alvo atingido; efeito é inibição da multiplicação ou morte. A ausência de crescimento visível define o critério da CIM, mas a demonstração de ação bactericida exige avaliação de viabilidade, como na CBM.", "figuras": [], "alvos": {"Classificações": ["classificacoes"], "Efeito e medidas": ["efeito", "medidas"]}}, {"id": "q2", "capitulo": "c2", "ref": "Questão autoral de integração dos slides 29 e 30 da Parte I e dos mecanismos introdutórios da Parte II", "enunciado": "Organize os mecanismos antimicrobianos em cinco grandes alvos. Cite um exemplo por alvo e diferencie replicação, transcrição e tradução.", "itens": null, "tabela": null, "resposta_esperada": "Parede: beta-lactâmicos, que atingem PBPs; membrana: polimixinas, que alteram integridade e permeabilidade; ribossomos: tetraciclinas na 30S ou macrolídeos na 50S; ácidos nucleicos: quinolonas nas topoisomerases ou rifampicina na RNA polimerase; folatos: sulfonamidas na diidropteroato sintase e trimetoprima na diidrofolato redutase. Replicação produz DNA, transcrição produz RNA e tradução produz proteínas.", "comentario": "Parede: beta-lactâmicos, que atingem PBPs; membrana: polimixinas, que alteram integridade e permeabilidade; ribossomos: tetraciclinas na 30S ou macrolídeos na 50S; ácidos nucleicos: quinolonas nas topoisomerases ou rifampicina na RNA polimerase; folatos: sulfonamidas na diidropteroato sintase e trimetoprima na diidrofolato redutase. Replicação produz DNA, transcrição produz RNA e tradução produz proteínas.", "figuras": [], "alvos": {"Envelope": ["parede", "membrana"], "Informação celular": ["proteinas", "nucleicos"], "Metabolismo": ["folatos"]}}], "rev": {"c1": {"cornell": [[["Qual é o ponto central?", "Revise os blocos do capítulo."]], "Terminologia: Antimicrobiano é abrangente; antibiótico admite convenção histórica e clínica. Aplicação: Antissepsia em tecido vivo; desinfecção em material inanimado. Classificações: Origem, estrutura, espectro, efeito e mecanismo são eixos distintos."], "quadros": [], "topicos_html": "<ol class=\"outline\"><li><span class=\"it\">Terminologia<span class=\"frase\">Antimicrobiano é abrangente; ant if(qs.length)h+='<h3>Caiu em prova</h3>'+qs.map(q=>feitoQ(q.id)?`<p class="gb"><b>${esc(q.ref)}.</b> ${rt(q.resposta_esperada)}${q.comentario?' <b>Como chegar a essa resposta:</b> '+rt(q.comentario):''} Gabarito não oficial.</p>`:`<p class="gb"><b>${esc(q.ref)}.</b> ${S.q[q.id]?.env?'Você ainda não completou esta questão.':'Você ainda não fez esta questão.'} <a class="faca" href="#${q.id}">Faça essa questão agora</a></p>`).join('');

function migalha(){const h=location.hash.slice(1),m=modoAtual(),nm={tradicional:'Modelo tradicional',guiado:'Estudo guiado',reversa:'Engenharia reversa',revisao:'Revisão',revisar:'Revisar',mapa:'Trilha'}[m];const b=D.blocos.find(x=>x.id===h);let c=`<a href="#mapa">Início</a> / `;c+=['tradicional','guiado','reversa','revisao','revisar'].includes(h)?nm:h.startsWith('t-')?`<a href="#tradicional">${nm}</a> / ${esc(D.capitulos.find(x=>x.id===h.slice(2))?.titulo||'')}`:`<a href="#${m==='mapa'?'mapa':m}">${nm}</a> / ${esc(b?b.titulo:(D.questoes.find(x=>x.id===h.replace('g-',''))?.ref||''))}`;return `<div class="migalha">${c}</div>`}
