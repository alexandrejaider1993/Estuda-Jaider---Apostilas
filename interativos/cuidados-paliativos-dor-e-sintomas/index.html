<script>
const D={"capitulos": [{"id": "c1", "titulo": "Fundamentos da dor e escada analgésica", "abertura": "Antes de prescrever qualquer analgésico, o médico precisa saber escutar, quantificar e classificar a dor. Neste capítulo, você vai entender por que a dor é subjetiva, como o conceito de dor total muda o tratamento, como diferenciar dor somática, visceral, neuropática e mista e como aplicar a escada analgésica atual da OMS.", "slides": "Aula de Manejo da Dor (00:00 a 00:30)", "provas": "Questões 11 (dissertativa), 38, 39, 47 e 50 do banco da disciplina"}, {"id": "c2", "titulo": "Hipodermóclise e drogas adjuvantes no manejo da dor", "abertura": "Quando a via oral deixa de ser viável, a hipodermóclise oferece conforto e segurança sem sacrificar acessos venosos. Além da via, o controle fino da dor neuropática e da dor óssea depende da escolha correta dos fármacos adjuvantes.", "slides": "Aula de Manejo da Dor (00:30 a 00:51)", "provas": "Questões 19, 37, 43 e 48 do banco da disciplina"}, {"id": "c3", "titulo": "Opioides, cálculos de morfina, rotação e efeitos adversos", "abertura": "Prescrever morfina com segurança exige dominar poucos números e regras muito claras: metabólitos renais, cálculo da dose de resgate, ajuste da dose basal, conversão entre vias, rotação de opioides e manejo dos efeitos adversos.", "slides": "Aula de Manejo da Dor (00:51 a 01:43)", "provas": "Questões 20, 36, 40, 41, 42, 44, 45, 46 e 49 do banco da disciplina"}, {"id": "c4", "titulo": "Controle de sintomas prevalentes e sinais de alarme", "abertura": "Além da dor, pacientes em cuidados paliativos enfrentam dispneia, náuseas, constipação, delirium, fadiga, caquexia, ansiedade e depressão. Neste capítulo, você vai dominar as escalas de avaliação, o tratamento baseado em evidências de cada sintoma e os critérios exatos para acionar o pronto-socorro.", "slides": "Slides Controle de Sintomas em Cuidados Paliativos (29 slides)", "provas": "Questões 8, 9, 14, 15, 16, 17, 21, 22 (dissertativa), 24 e 35 do banco da disciplina"}, {"id": "c5", "titulo": "Ética, espiritualidade, comunicação, luto e DAV", "abertura": "Técnica farmacológica sem base ética, comunicação empática e respeito à autonomia deixa o cuidado incompleto. Este capítulo sintetiza os princípios dos cuidados paliativos, a abordagem da espiritualidade na APS, o protocolo SPIKES, o trabalho em equipe, o manejo do luto e a força das Diretivas Antecipadas de Vontade.", "slides": "Aulas 1 a 4, 6, 8, 9, 13 e 15 da disciplina", "provas": "Questões 2, 4, 12, 26, 29, 31 (dissertativa) e 32 do banco da disciplina"}], "conceitos": [{"id": "dor-subjetiva", "nome": "Subjetividade da dor", "definicao": "A dor é experiência pessoal cuja intensidade é definida pelo relato do paciente, não pela aparência externa."}, {"id": "dor-total", "nome": "Dor total", "definicao": "Sofrimento resultante da interação das dimensões física, psicológica, social e espiritual."}, {"id": "avaliacao-dor", "nome": "Avaliação sistemática da dor", "definicao": "Quantificação por EVA ou ESAS e caracterização completa no prontuário para guiar condutas."}, {"id": "dor-nociceptiva", "nome": "Dor nociceptiva somática e visceral", "definicao": "Dor por ativação de nociceptores teciduais: bem localizada na somática e difusa/em cólica na visceral."}, {"id": "dor-neuropatica", "nome": "Dor neuropática e seus sinais", "definicao": "Dor por lesão do sistema nervoso central ou periférico, marcada por queimação, choque, parestesia, alodínia e hiperalgesia."}, {"id": "escada-oms", "nome": "Escada analgésica proporcional da OMS", "definicao": "Guia de proporcionalidade entre intensidade da dor e potência analgésica, com preferência pela via oral e horário fixo."}, {"id": "hipodermoclise-tecnica", "nome": "Técnica e indicações da hipodermóclise", "definicao": "Infusão no tecido celular subcutâneo com direção centrípeta, até 1.500 mL/dia, ideal para domicílio e preservação venosa."}, {"id": "hipodermoclise-farmacos", "nome": "Fármacos permitidos e proibidos na hipodermóclise", "definicao": "Morfina, haloperidol, metoclopramida e ceftriaxona são permitidos; KCl concentrado, vasoativas, nutrição parenteral e quimioterápicos são proibidos."}, {"id": "adjuvantes-neuropatica", "nome": "Anticonvulsivantes e antidepressivos na dor neuropática", "definicao": "Pregabalina e gabapentina (com ajuste renal) e antidepressivos duais (duloxetina) modulam dor neuropática; carbamazepina é exclusiva da neuralgia do trigêmeo."}, {"id": "adjuvantes-ossea", "nome": "Bisfosfonatos e corticoides na dor óssea", "definicao": "Ácido zoledrônico previne fraturas e reduz dor em metástases osteolíticas; corticoides diminuem o edema do periósteo e edema cerebral."}, {"id": "benzodiazepinicos-dor", "nome": "Cautela com benzodiazepínicos associados a opioides", "definicao": "Risco aditivo de depressão do sistema nervoso central exige menor dose possível e indicação criteriosa."}, {"id": "opioides-fracos", "nome": "Opioides fracos e interação tramadol-ondansetrona", "definicao": "Codeína tem maior segurança que tramadol; ondansetrona reduz a eficácia analgésica do tramadol."}, {"id": "morfina-farmacocinetica", "nome": "Farmacocinética da morfina (M6G e M3G)", "definicao": "M6G promove analgesia e M3G causa neurotoxicidade; ambos têm excreção renal e a morfina não possui dose teto."}, {"id": "calculo-resgate-ajuste", "nome": "Cálculo de dose de resgate e ajuste da dose basal", "definicao": "Resgate de 1/6 a 1/10 da dose diária total usando morfina de liberação imediata; mais de 3 resgates/dia persistentes indica recalcular a basal."}, {"id": "conversao-vias", "nome": "Conversão de morfina entre vias (Regra do 3)", "definicao": "Via subcutânea ou intravenosa é 3 vezes mais potente que a via oral (VO -> SC/IV divide por 3; SC/IV -> VO multiplica por 3)."}, {"id": "rotacao-opioides", "nome": "Rotação de opioides e redução por tolerância cruzada", "definicao": "Ao trocar o opioide por falha ou toxicidade, reduz-se 25% a 50% da dose equipotente calculada devido à tolerância cruzada incompleta."}, {"id": "efeitos-adversos-opioides", "nome": "Efeitos adversos, profilaxia da constipação e naloxona", "definicao": "Constipação exige laxativo profilático obrigatório; náusea por morfina trata-se com haloperidol; naloxona é indicada se FR < 8 + sedação + miose."}, {"id": "canabinoides-sedacao", "nome": "Canabinoides (MBE) e sedação paliativa vs. eutanásia", "definicao": "Canabinoides têm baixa evidência (apenas 4ª linha); sedação paliativa alivia sintoma refratário sem intenção de acelerar a morte."}, {"id": "esas-avaliacao", "nome": "Avaliação sistemática com ESAS-r", "definicao": "A Escala de Avaliação de Sintomas de Edmonton (0 a 10) captura a percepção subjetiva real e orienta a priorização de múltiplos sintomas."}, {"id": "manejo-dispneia", "nome": "Avaliação e manejo da dispneia", "definicao": "Sensação subjetiva sem relação obrigatória com SpO2; ventilação facial e morfina 2,5 a 5 mg 4/4h são 1ª linha; O2 apenas se hipoxemia."}, {"id": "manejo-nauseas", "nome": "Manejo de náuseas e vômitos por etiologia", "definicao": "Haloperidol (opioides/metabólico), metoclopramida (gastroparesia), ondansetrona (QT/RT), dexametasona (HIC/obstrução parcial) e dimenidrinato/meclizina (vestibular)."}, {"id": "manejo-constipacao", "nome": "Avaliação e manejo da constipação", "definicao": "Escala de Bristol (1 a 2), toque retal obrigatório se suspeita de fecaloma; macrogol ou lactulose + bisacodil ou sene."}, {"id": "manejo-delirium", "nome": "Delirium: subtipos, CAM/RASS, WHHHIMP e tratamento", "definicao": "Distúrbio agudo e flutuante; subtipo hipoativo é o mais comum; avaliar com CAM/RASS, checar WHHHIMP; haloperidol 1ª linha e midazolam se refratário."}, {"id": "fadiga-caquexia", "nome": "Fadiga relacionada ao câncer e caquexia", "definicao": "Fadiga (exercício físico 1ª linha, metilfenidato/dexametasona); caquexia (estadiamento Fearon, suporte nutricional, megestrol/dexametasona)."}, {"id": "ansiedade-depressao", "nome": "Ansiedade e depressão em cuidados paliativos", "definicao": "Excluir causas orgânicas na ansiedade; na depressão valorizar anedonia e desesperança (PHQ-9/HADS); sertralina, mirtazapina ou metilfenidato."}, {"id": "sinais-alarme-ps", "nome": "Sinais de alarme para encaminhamento ao pronto-socorro", "definicao": "Critérios objetivos de urgência hospitalar em dispneia, náuseas, constipação, delirium, fadiga e saúde mental."}, {"id": "principios-cp-etica", "nome": "Princípios dos CP e bioética (autonomia e justiça)", "definicao": "Alívio do sofrimento nas 4 dimensões, rejeição à distanásia, respeito à recusa autônoma do paciente capaz e equidade no acesso."}, {"id": "espiritualidade-aps", "nome": "Abordagem da espiritualidade na APS", "definicao": "Espiritualidade independe de religião; exige escuta qualificada, exploração de sentidos/valores e suporte interdisciplinar sem impor crenças."}, {"id": "spikes-equipe", "nome": "Protocolo SPIKES e papel do médico na equipe interdisciplinar", "definicao": "Comunicação estruturada de más notícias (SPIKES) e liderança médica na comunicação de prognóstico e atos privativos, articulando a equipe."}, {"id": "luto-cuidador", "nome": "Luto normal, antecipatório, prolongado e sobrecarga do cuidador", "definicao": "Luto é processo não linear; luto antecipatório ocorre antes da morte; transtorno de luto prolongado exige > 12 meses com prejuízo funcional (DSM-5-TR); ZBI mede sobrecarga do cuidador."}, {"id": "pncp-sus", "nome": "Política Nacional de Cuidados Paliativos (PNCP)", "definicao": "Integra cuidados paliativos em toda a rede do SUS com equipes matriciais/assistenciais, financiamento e pactuação federativa."}, {"id": "dav-cfm", "nome": "Diretivas Antecipadas de Vontade (Resolução CFM nº 1.995/2012)", "definicao": "A vontade previamente manifestada por paciente capaz prevalece sobre o desejo dos familiares, com acolhimento e diálogo contínuo."}], "blocos": [{"id": "b1", "capitulo": "c1", "titulo": "Subjetividade, dor total e avaliação clínica", "onde": "Aula de Manejo da Dor (00:00 a 00:09 e 00:25 a 00:27)", "ensina": ["dor-subjetiva", "dor-total", "avaliacao-dor"], "seq": [["cx", "gancho", "Caso para começar", "Um paciente internado em cuidados paliativos oncológicos conversa calmamente com a família, mas relata dor nota 9 na escala de 0 a 10. No leito ao lado, outro paciente com tumor avançado está sedado, não reclama verbalmente, mas geme e franze a testa quando a enfermagem realiza a mudança de decúbito.\n**Antes de seguir:** Podemos desconfiar da nota 9 do primeiro paciente por estar calmo? E a ausência de queixa verbal do segundo paciente garante ausência de dor?", null], ["cx", "ideia", "A ideia em uma frase", "A dor é sempre o que o paciente relata sentir, e a ausência de queixa verbal nunca exclui sofrimento físico ou existencial.", null], ["passo", "Qual é a frequência e o papel da dor nos cuidados paliativos?"], ["p", "A dor é uma experiência universal que acompanha o ser humano desde o nascimento até o fim da vida. Em situações agudas, funciona como mecanismo de defesa contra agressões teciduais.", []], ["p", "Nos cuidados paliativos, cerca de **70% dos pacientes** apresentam dor em algum momento da doença, percentual que pode chegar a **90% a 95% nos últimos dias de vida**, independentemente da doença de base.", []], ["p", "Tratar a dor não é um favor da equipe de saúde: trata-se de um **direito fundamental**. Deixar um paciente sofrendo com dor tratável fere a dignidade humana.", []], ["passo", "Por que a dor é diferente dos sinais vitais objetivos?"], ["p", "Frequência cardíaca, frequência respiratória e temperatura são parâmetros objetivos. Valores muito altos ou muito baixos indicam risco fisiológico mensurável por aparelhos.", []], ["p", "A dor, por outro lado, é um dado **exclusivamente subjetivo**. O médico não consegue sentir a dor do paciente nem medi-la com um monitor.", []], ["p", "Por esse motivo, o profissional nunca deve julgar a dor pela postura ou expressão externa do paciente. Se o paciente refere nota 10, a dor é 10; se refere nota 2, a dor é 2.", []], ["cx", "alerta", "Cuidado com pacientes sedados ou sem fala", "A dor não precisa de comportamento dramático para ser real. Em cuidados paliativos, a ausência de queixa verbal não significa ausência de dor, especialmente em pacientes sedados, confusos ou com dificuldade de comunicação.", null], ["passo", "O que significa o conceito de dor total?"], ["p", "Nocicepção e dor são fenômenos independentes. Um paciente pode sentir dor intensa mesmo sem uma lesão tecidual proporcional, porque o sofrimento sofre modulação emocional, social e existencial.", []], ["p", "Nos cuidados paliativos, esse fenômeno recebe o nome de **dor total**, conhecida como a dor da alma, proposta por Cicely Saunders.", [["Dor total", "Integração das dimensões física, psicológica, social e espiritual na percepção do sofrimento."]]], ["tab", "As quatro dimensões da dor total", ["Dimensão", "O que amplifica o sofrimento"], [["**Física**", "Invasão tumoral, metástases, espasmos, dispneia e constipação"], ["**Psicológica**", "Medo da morte, ansiedade, depressão e perda de controle"], ["**Social**", "Abandono, isolamento, conflitos familiares e insegurança financeira"], ["**Espiritual**", "Perda de sentido da vida, culpa e angústia existencial"]]], ["passo", "Como registrar e quantificar a dor no prontuário?"], ["p", "Escrever apenas \"refere dor\" no prontuário é uma evolução clínica insuficiente. Outros membros da equipe precisam entender exatamente qual dor estão acompanhando ao longo do tempo.", []], ["p", "A avaliação prática inclui intensidade, tempo de evolução, localização, qualidade da dor, fatores desencadeantes e padrão temporal (contínua ou em crises).", []], ["p", "Para transformar a sensação subjetiva em dado acompanhável, utilizamos a **Escala Visual Analógica (EVA)** de 0 a 10, a **Escala de Avaliação de Sintomas de Edmonton (ESAS)** ou a **escala de faces** para pacientes com limitação cognitiva.", []], ["cx", "destaque", "Destaque do professor", "Antes de perguntar a nota da dor para todo paciente, a equipe precisa estar preparada para agir diante da resposta. Medir a dor e não modificar a conduta não resolve o sofrimento.", "forte"], ["cx", "erros", "Erros que derrubam", "Desvalorizar a dor de um paciente que parece tranquilo ou consegue conversar.\nAssumir que um paciente sedado ou silencioso está sem dor apenas por não pedir analgésico.\nRegistrar somente \"refere dor\" sem intensidade, localização, caráter e padrão temporal.", null], ["cx", "guardar", "Para guardar", "Dor é o que o paciente diz que é: se o paciente refere 10, a dor é 10.\nDor total soma as dimensões física, psicológica, social e espiritual.", null], ["cx", "sintese", "Síntese", "A dor atinge até 95% dos pacientes no fim da vida. A avaliação exige escuta sem julgamento, uso de escalas padronizadas (EVA ou ESAS) e olhar atento às quatro dimensões da dor total.", null]]}, {"id": "b2", "capitulo": "c1", "titulo": "Classificação da dor e escada analgésica da OMS", "onde": "Aula de Manejo da Dor (00:09 a 00:30)", "ensina": ["dor-nociceptiva", "dor-neuropatica", "escada-oms"], "seq": [["cx", "gancho", "Caso para começar", "Dois pacientes oncológicos chegam ao ambulatório com dor nota 8. O primeiro tem câncer de pâncreas e descreve dor profunda, mal localizada no epigástrio, sem sensibilidade alterada na pele. O segundo tem metástase de próstata na coluna e refere queimação na perna direita tão intensa que não suporta vestir uma meia.\n**Antes de seguir:** Essas duas dores têm o mesmo mecanismo fisiopatológico? E o médico deve começar tratando a dor nota 8 apenas com dipirona?", null], ["cx", "ideia", "A ideia em uma frase", "Classificar o mecanismo da dor define o adjuvante correto, e a escada da OMS segue a proporcionalidade da dor, não uma subida obrigatória degrau por degrau.", null], ["passo", "Como diferenciar dor aguda de dor crônica?"], ["p", "De forma clássica, a **dor aguda** dura menos de três meses, enquanto a **dor crônica** persiste por três meses ou mais.", []], ["p", "Mais importante do que contar dias exatos sem interrupção é observar o padrão clínico: se a dor permanece recorrente no mesmo sítio e impacta as atividades diárias, comporta-se como dor crônica.", []], ["passo", "Qual é a diferença entre dor nociceptiva somática e dor visceral?"], ["p", "Na **dor nociceptiva**, a lesão ocorre nos tecidos e ativa terminações nervosas chamadas nociceptores. Essa dor divide-se em dois grandes grupos.", []], ["p", "A **dor somática** origina-se em pele, músculos, tendões e ossos. A principal característica da dor somática é a **localização exata**: o paciente aponta exatamente o osso ou músculo doloroso.", []], ["p", "A **dor visceral** origina-se nos órgãos internos, inervados pelo sistema nervoso autônomo. A dor visceral é **mal localizada e difusa**, frequentemente em cólica ou pressão, sem alodínia ou hiperalgesia.", []], ["passo", "Como reconhecer a dor neuropática e a dor mista?"], ["p", "Na **dor neuropática**, a lesão está diretamente em uma estrutura do sistema nervoso periférico ou central, como o neurônio, a bainha de mielina ou o córtex cerebral.", []], ["p", "O paciente descreve a dor neuropática com palavras características: **queimação**, **choque elétrico**, **agulhada** ou **formigamento (parestesia)**.", []], ["cx", "conceito", "Vamos separar dois conceitos clássicos de prova", "**Alodínia:** dor desencadeada por um estímulo que normalmente não deveria doer, como o toque do lençol no pé ou o ato de vestir uma meia.\n**Hiperalgesia:** resposta dolorosa exagerada e prolongada diante de um estímulo que normalmente causaria apenas uma dor leve, como uma pequena picada.", null], ["p", "Entre as principais causas de dor neuropática estão neuropatia diabética (causa mais frequente), neuralgia pós-herpética, compressão tumoral de nervos, doenças desmielinizantes (esclerose múltipla e esclerose lateral amiotrófica), dor do membro fantasma e neuralgia do trigêmeo.", []], ["p", "Quando existe lesão tecidual e lesão nervosa no mesmo local, falamos em **dor mista**. Exemplos clássicos incluem metástase vertebral comprimindo raiz nervosa, hérnia de disco e síndrome do músculo piriforme inflamando o nervo isquiático.", []], ["tab", "Comparação dos mecanismos da dor", ["Tipo de dor", "Onde está a lesão", "Como o paciente descreve"], [["**Nociceptiva somática**", "Pele, músculo, osso, periósteo", "Bem localizada, contínua ou em pontada"], ["**Nociceptiva visceral**", "Órgãos internos (SNA)", "Difusa, profunda, em cólica ou aperto, sem alodínia"], ["**Neuropática**", "Sistema nervoso periférico ou central", "Queimação, choque, parestesia, alodínia e hiperalgesia"], ["**Mista**", "Tecido + estrutura nervosa", "Combina sintomas nociceptivos e neuropáticos"]]], ["passo", "Como funciona a escada analgésica da OMS na concepção atual?"], ["p", "A escada analgésica da Organização Mundial da Saúde organiza os analgésicos em degraus de potência crescente, com **drogas adjuvantes** presentes em todos os degraus.", []], ["p", "Na visão atualizada desde 2018, a lógica da escada é de **proporcionalidade**, e não de obrigatoriedade de subir um degrau por vez. Se o paciente abre o quadro com dor nota 9 ou 10, o médico já inicia no **terceiro degrau (opioide forte)**.", []], ["fig", "escada_oms.png", "Escada Analgésica Proporcional da OMS.", "A escolha do degrau segue a intensidade da dor (proporcionalidade), com preferência pela via oral e prescrição pelo relógio.", "Esquema didático baseado na aula de Manejo da Dor.", ""], ["passo", "Quais são as três regras de ouro ao prescrever analgésicos?"], ["p", "Primeira regra: **preferência pela via oral** sempre que o paciente conseguir engolir com segurança. Segunda regra: **pelo relógio (horário fixo)**, pois a dor prevenida é mais fácil de controlar do que a dor em crise.", []], ["p", "Terceira regra: **otimizar a dose e o intervalo antes de declarar falha terapêutica**. Um paciente tomando morfina de 12 em 12 horas não falhou ao tratamento; recebeu um intervalo inadequado para morfina de liberação imediata.", []], ["cx", "destaque", "Destaque do professor", "Nunca encaminhe o paciente para procedimento intervencionista do quarto degrau sem antes conferir adesão, via, dose máxima e intervalo correto do analgésico.", "forte"], ["cx", "erros", "Erros que derrubam", "Insistir em começar no primeiro degrau da escada quando o paciente já apresenta dor intensa nota 8 a 10.\nPrescrever analgésico apenas \"se dor\" para pacientes com dor crônica diária.\nConfundir dor visceral (epigástrica difusa sem alodínia) com dor neuropática.", null], ["cx", "guardar", "Para guardar", "Alodínia = dor a estímulo não doloroso; Hiperalgesia = dor exagerada a estímulo doloroso.\nEscada da OMS é proporcionalidade; via oral e horário fixo são o padrão.", null], ["cx", "sintese", "Síntese", "Identificar se a dor é somática, visceral, neuropática ou mista direciona os adjuvantes. A escada analgésica guia a potência proporcional à intensidade, sempre priorizando via oral, horário fixo e otimização prévia das doses.", null]]}, {"id": "b3", "capitulo": "c2", "titulo": "Hipodermóclise: técnica, indicações e restrições", "onde": "Aula de Manejo da Dor (00:30 a 00:42)", "ensina": ["hipodermoclise-tecnica", "hipodermoclise-farmacos"], "seq": [["cx", "gancho", "Caso para começar", "Um paciente de 74 anos em cuidados paliativos domiciliares apresenta tumor de cabeça e pescoço com disfagia grave e veias periféricas frágeis após meses de quimioterapia. A equipe precisa administrar morfina, metoclopramida e hidratação leve sem internar o paciente nem manter acesso venoso central.\n**Antes de seguir:** Qual via de administração resolve esse cenário em casa com segurança, e quais medicamentos nunca podem ser aplicados por essa via?", null], ["cx", "ideia", "A ideia em uma frase", "A hipodermóclise poupa veias e garante conforto no domicílio, mas exige respeitar a direção da drenagem linfática e nunca infundir substâncias vesicantes ou hipertônicas.", null], ["passo", "O que é hipodermóclise e por que essa via é tão valiosa?"], ["p", "A **hipodermóclise** é a infusão de fluidos e medicamentos diretamente no **tecido celular subcutâneo**, abaixo da derme.", []], ["p", "Como a maioria das terminações nervosas dolorosas concentra-se na derme, o espaço subcutâneo gera mínimo desconforto. A via preserva acessos venosos nobres, reduz o risco de infecção e facilita o manejo em **domicílio e instituições de longa permanência (ILPI)**.", []], ["p", "Outra vantagem importante é a mobilidade: o paciente pode caminhar e alimentar-se sem carregar suportes venosos pesados nem correr risco de perder o acesso ao dobrar o braço.", []], ["passo", "Quais são os locais de punção, volumes e cuidados técnicos?"], ["p", "Os principais sítios de punção são região **infraclavicular**, **abdômen**, **face anterior ou lateral da coxa**, **região escapular (posterior)** e **deltoide**.", []], ["p", "A inserção da agulha deve seguir sempre a **direção centrípeta** da drenagem linfática, ou seja, apontando em direção ao coração. Antes de infundir qualquer solução, é obrigatório aspirar para confirmar que não há retorno de sangue.", []], ["p", "O dispositivo preferido é o cateter flexível (Jelco), embora o scalp também possa ser utilizado. O curativo transparente com data permite inspecionar diariamente sinais de hiperemia, dor ou necrose.", []], ["cx", "conceito", "Parâmetros práticos da hipodermóclise", "**Volume máximo:** até 1.500 mL por dia, em velocidade de 20 a 125 mL/h.\n**Rodízio do sítio:** a cada 3 a 7 dias, podendo permanecer até uma semana se a pele estiver íntegra.\n**Sítios separados:** manter um sítio exclusivo para infusão contínua (como bomba de morfina) e outro para medicações intermitentes.\n**Hialuronidase:** enzima capaz de aumentar a velocidade de absorção, raramente utilizada na rotina do SUS.", null], ["passo", "Quais são as contraindicações da hipodermóclise?"], ["p", "Como a punção depende da integridade da pele e da perfusão capilar, a hipodermóclise não deve ser realizada em áreas com **celulite, infecção local, queimadura ou anasarca grave**.", []], ["p", "Também é contraindicada em **coagulopatias graves** e em **emergências com instabilidade hemodinâmica**, pois a absorção subcutânea é mais lenta do que a via intravenosa.", []], ["passo", "Quais fármacos podem e quais nunca podem ir na hipodermóclise?"], ["p", "A maioria das medicações essenciais em cuidados paliativos é compatível com a via subcutânea. Porém, substâncias hipertônicas, vasoativas ou irritantes causam **necrose tecidual** grave.", []], ["fig", "hipodermoclise_locais.png", "Hipodermóclise: técnica, sítios e compatibilidade.", "Resumo prático dos locais de punção, parâmetros de infusão e fármacos permitidos versus proibidos na via subcutânea.", "Esquema didático baseado na aula de Manejo da Dor.", ""], ["cx", "destaque", "Destaque do professor", "Cloreto de potássio (KCl) concentrado, drogas vasoativas, nutrição parenteral e quimioterápicos são absolutamente proibidos na hipodermóclise pelo risco direto de necrose do tecido subcutâneo.", "forte"], ["cx", "erros", "Erros que derrubam", "Infundir KCl concentrado ou droga vasoativa no tecido subcutâneo.\nMisturar várias drogas incompatíveis ou contínuas no mesmo sítio de punção.\nUsar hipodermóclise em situações de choque hemodinâmico que exigem ação imediata.", null], ["cx", "guardar", "Para guardar", "Hipodermóclise: até 1.500 mL/dia, rodízio de 3 a 7 dias, punção centrípeta sem retorno sanguíneo.\nProibidos na via subcutânea: KCl concentrado, vasoativas, nutrição parenteral e quimioterápicos.", null], ["cx", "sintese", "Síntese", "A hipodermóclise é a alternativa de escolha quando a via oral falha em cuidados paliativos. É segura para morfina, metoclopramida, haloperidol e ceftriaxona, mas nunca admite soluções hipertônicas ou vesicantes.", null]]}, {"id": "b4", "capitulo": "c2", "titulo": "Analgésicos simples e drogas adjuvantes", "onde": "Aula de Manejo da Dor (00:42 a 00:51)", "ensina": ["adjuvantes-neuropatica", "adjuvantes-ossea", "benzodiazepinicos-dor"], "seq": [["cx", "gancho", "Caso para começar", "Uma paciente de 45 anos com mieloma múltiplo e lesões osteolíticas refere dor contínua em ossos longos (6/10) com alívio apenas parcial usando dipirona. No consultório ao lado, um paciente com câncer de próstata metastático na coluna apresenta dor em queimação e alodínia na perna direita mesmo usando codeína e dipirona.\n**Antes de seguir:** Os dois pacientes precisam do mesmo adjuvante? E qual erro comum acontece quando o médico prescreve carbamazepina para dor neuropática fora da face?", null], ["cx", "ideia", "A ideia em uma frase", "Drogas adjuvantes não são analgésicos primários, mas atacam o mecanismo específico da dor: anticonvulsivantes e duais na neuropatia, bisfosfonatos e corticoides na dor óssea.", null], ["passo", "Como otimizar os analgésicos simples antes de subir o degrau?"], ["p", "Os analgésicos simples, **dipirona** e **paracetamol**, compõem o primeiro degrau da escada para dor leve (EVA 1 a 3) e podem permanecer associados aos opioides para reduzir a dose necessária de morfina.", []], ["p", "Antes de afirmar que a dipirona falhou, confira a dose: um paciente tomando 500 mg de 12 em 12 horas está subtratado. O primeiro passo é otimizar para **1 g de 6 em 6 horas** de forma regular.", []], ["passo", "Qual anticonvulsivante escolher na dor neuropática?"], ["p", "Anticonvulsivantes estabilizam a membrana neuronal hiperexcitada na dor neuropática. Os dois representantes principais para neuropatias periféricas em geral são **pregabalina** e **gabapentina**.", []], ["p", "Tanto a pregabalina quanto a gabapentina são eliminadas pelos rins e **exigem ajuste de dose conforme a função renal** (atenção especial para clearance abaixo de 60 e abaixo de 30 mL/min).", []], ["cx", "alerta", "Regra de ouro da carbamazepina", "A **carbamazepina** tem apenas uma indicação de primeira escolha em dor neuropática: a **neuralgia do trigêmeo**. Para neuropatia diabética, túnel do carpo ou compressão radicular em membros, escolha pregabalina ou gabapentina.", null], ["passo", "Como atuam os antidepressivos na modulação da dor crônica?"], ["p", "Dor crônica e depressão potencializam-se mutuamente. Além disso, os antidepressivos fortalecem a via descendente inibitória da dor no corno posterior da medula.", []], ["p", "Os fármacos preferidos são os **antidepressivos duais (inibidores da recaptação de serotonina e noradrenalina)**: **duloxetina** (com maior corpo de evidência em dor oncológica, neuropática e fibromialgia) e **venlafaxina**.", []], ["p", "Os **tricíclicos** (**amitriptilina** e **nortriptilina**, disponível no SUS) também funcionam, mas exigem cuidado redobrado em **idosos** (ação anticolinérgica que piora a cognição e precipita confusão mental) e em **cardiopatas** (prolongamento do intervalo QT com risco de arritmia do tipo torção de pontas).", []], ["passo", "Quais adjuvantes atacam a dor óssea metastática e o edema periósteo?"], ["p", "Ossos são sítios muito frequentes de metástases de próstata, mama, pulmão e mieloma múltiplo. Lesões osteolíticas enfraquecem a arquitetura óssea e elevam o risco de fraturas patológicas.", []], ["p", "Os **bisfosfonatos**, como o **ácido zoledrônico 4 mg IV a cada 4 semanas**, reorganizam a atividade osteoclástica, reduzem a dor óssea e têm maior evidência quando iniciados precocemente na **profilaxia de fraturas**. Após a fratura já instalada, o benefício estrutural é bem menor.", []], ["p", "Os **corticosteroides** (como a dexametasona) têm papel valioso porque reduzem a inflamação tumoral e o **edema do periósteo**, que é a fina membrana altamente inervada responsável pela dor óssea. Também reduzem edema cerebral em metástases do sistema nervoso central.", []], ["passo", "Qual o cuidado obrigatório com benzodiazepínicos no paciente com dor?"], ["p", "Benzodiazepínicos deprimem o sistema nervoso central, efeito que se soma ao dos opioides. Por isso, não devem ser usados rotineiramente como analgésicos.", []], ["p", "Mantém-se o benzodiazepínico em pacientes que já faziam uso crônico contínuo (para evitar síndrome de abstinência), sempre iniciando o opioide com cautela, na menor dose possível e monitorando sonolência.", []], ["tab", "Guia rápido de adjuvantes por mecanismo da dor", ["Cenário clínico", "Adjuvante de escolha", "Cuidado principal"], [["**Dor neuropática em membros/tronco**", "Pregabalina ou Gabapentina", "Ajustar pela função renal (ClCr < 60 e < 30)"], ["**Neuralgia do trigêmeo**", "Carbamazepina", "Não usar como 1ª escolha fora do trigêmeo"], ["**Dor crônica / neuropática / depressão**", "Duloxetina (ou Nortriptilina no SUS)", "Tricíclicos: risco cognitivo em idosos e QT longo"], ["**Dor óssea / mieloma / metástase lítica**", "Ácido zoledrônico 4 mg IV (4/4 sem)", "Maior eficácia na profilaxia de fraturas"], ["**Edema periósteo ou metástase cerebral**", "Dexametasona (corticoide)", "Avaliar tempo de uso e efeitos metabólicos"]]], ["cx", "erros", "Erros que derrubam", "Prescrever carbamazepina para dor neuropática periférica em mãos ou pernas em vez de pregabalina ou gabapentina.\nEsquecer o ajuste renal ao prescrever pregabalina ou gabapentina.\nManter codeína em paciente com dor intensa já refratária ao segundo degrau, em vez de trocar por morfina.", null], ["cx", "guardar", "Para guardar", "Carbamazepina = só neuralgia do trigêmeo; resto da neuropatia = pregabalina, gabapentina ou duloxetina.\nDor óssea osteolítica = ácido zoledrônico (profilaxia) + corticoide (edema do periósteo).", null], ["cx", "sintese", "Síntese", "O controle fino da dor combina analgésicos otimizados e adjuvantes dirigidos ao mecanismo: pregabalina/gabapentina e duloxetina para dor neuropática, ácido zoledrônico e corticoides para dor óssea e máxima cautela ao associar benzodiazepínicos com opioides.", null]]}, {"id": "b5", "capitulo": "c3", "titulo": "Opioides fracos, farmacocinética da morfina e cálculos de resgate e ajuste", "onde": "Aula de Manejo da Dor (00:51 a 01:09 e 01:14 a 01:17)", "ensina": ["opioides-fracos", "morfina-farmacocinetica", "calculo-resgate-ajuste"], "seq": [["cx", "gancho", "Caso para começar", "Um paciente de 64 anos com câncer de pulmão toma morfina de liberação imediata 10 mg VO a cada 4 horas (60 mg/dia). Nos últimos três dias, precisou de 4 doses de resgate de 10 mg por dia para suportar a dor.\n**Antes de seguir:** Como saber se a dose basal está insuficiente? E qual deve ser a nova prescrição fixa e a nova dose de resgate?", null], ["cx", "ideia", "A ideia em uma frase", "A morfina não tem dose teto, exige intervalo fixo de 4 em 4 horas na liberação imediata e é ajustada somando-se os resgates utilizados ao longo do dia.", null], ["passo", "Qual o papel atual dos opioides fracos e o perigo da associação tramadol + ondansetrona?"], ["p", "Com a atualização da escada analgésica, os opioides fracos perderam protagonismo, pois muitas vezes é mais seguro iniciar morfina em dose baixa (2,5 mg a 5 mg) do que usar opioides sintéticos fracos.", []], ["p", "Quando há necessidade de opioide fraco (por exemplo, indisponibilidade do receituário amarelo tipo A para morfina), a **codeína** é preferida ao **tramadol** por apresentar melhor perfil de segurança.", []], ["p", "O tramadol apresenta risco de **síndrome serotoninérgica** quando associado a antidepressivos e tem metabolismo variável entre pacientes.", []], ["cx", "alerta", "Interação clássica de prova: Tramadol + Ondansetrona", "Nunca associe tramadol e ondansetrona simultaneamente. A ondansetrona bloqueia receptores serotoninérgicos 5-HT3 e **diminui a eficácia analgésica do tramadol**.", null], ["passo", "Como a morfina funciona no organismo e por que a função renal importa?"], ["p", "A morfina é o opioide padrão-ouro em cuidados paliativos. Possui baixa biodisponibilidade oral devido ao metabolismo hepático de primeira passagem, gerando dois metabólitos principais eliminados pelos **rins**.", []], ["cx", "conceito", "Os dois metabólitos da morfina", "**M6G (morfina-6-glicuronídeo):** metabólito ativo responsável pelo efeito analgésico.\n**M3G (morfina-3-glicuronídeo):** não faz analgesia e é **neurotóxico/neuroexcitatório**; quando acumula na insuficiência renal (ClCr < 30 mL/min), provoca confusão mental aguda, mioclonias e hiperalgesia.", null], ["p", "A morfina **não tem dose teto**. O limite da prescrição não é um número fixo de miligramas, mas sim a resposta do paciente: alívio da dor versus efeitos colaterais intoleráveis ou depressão respiratória.", []], ["passo", "Como iniciar a morfina com segurança?"], ["p", "Siga a regra geriátrica e paliativa: **\"start slow, go slow, but go\"** (comece devagar, aumente devagar, mas comece e reavalie em 3 a 4 dias).", []], ["p", "A **morfina de liberação imediata** (comprimidos sulcados de 5 mg ou 10 mg) tem meia-vida de 4 horas e pico de ação em 1 a 2 horas. Por isso, a posologia padrão fixa é **de 4 em 4 horas** (6 tomadas ao dia).", []], ["p", "Em pacientes idosos, frágeis ou caquéticos, inicia-se com **2,5 mg a 5 mg VO de 4/4h**. Já a morfina de **liberação prolongada** é prescrita de 12 em 12 horas e nunca deve ser usada como resgate.", []], ["passo", "Como calcular a dose de resgate da morfina?"], ["p", "A **dose de resgate** serve para crises de dor nos intervalos ou 1 hora antes de procedimentos dolorosos (como banho, curativo ou fisioterapia). Usa-se sempre **morfina de liberação imediata**.", []], ["p", "Calcula-se a dose de resgate como **1/6 a 1/10 da dose diária total (DDT)** de morfina oral: usa-se **1/6** para pacientes mais estáveis e **1/10** para idosos, frágeis ou vulneráveis.", []], ["tab", "Exemplo passo a passo: dose de resgate", ["Etapa", "Cálculo (exemplo: 10 mg VO 4/4h)"], [["**1. Dose Diária Total (DDT)**", "10 mg x 6 tomadas = **60 mg/dia**"], ["**2. Resgate 1/6 (paciente estável)**", "60 / 6 = **10 mg VO** (liberação imediata)"], ["**3. Resgate 1/10 (paciente frágil)**", "60 / 10 = 6 mg -> arredondar para **5 mg VO** (meio comprimido de 10 mg)"]]], ["passo", "Quando e como ajustar a dose basal usando os resgates?"], ["p", "Se o paciente precisa de **mais de 3 doses de resgate por dia de forma persistente** (durante 2 a 3 dias seguidos), a dose basal está baixa. Antes de aumentar, confira sempre se o paciente está tomando no intervalo correto de 4/4h.", []], ["p", "Para recalcular a dose fixa: some a **DDT atual + soma dos resgates do dia**, divida o novo total por **6** (intervalo 4/4h) e recalcule o **novo resgate** sobre a nova DDT.", []], ["cx", "clinica", "Resolvendo o caso do Gancho (60 mg/dia + 4 resgates de 10 mg)", "**1. Nova DDT:** 60 mg (basal) + 40 mg (4 resgates de 10 mg) = **100 mg/dia**.\n**2. Nova dose fixa (4/4h):** 100 / 6 = 16,6 mg -> arredonda para **15 mg VO de 4/4h**.\n**3. Novo resgate (1/6 a 1/10 de 100 mg):** **10 mg a 15 mg VO** de liberação imediata, se dor.", null], ["cx", "erros", "Erros que derrubam", "Prescrever morfina de liberação prolongada ou metadona como dose de resgate.\nAumentar a dose por tomada de um paciente que está tomando morfina imediata de 8/8h em vez de corrigir o intervalo para 4/4h.\nEsquecer de recalcular o novo resgate após aumentar a dose basal.", null], ["cx", "guardar", "Para guardar", "Resgate = 1/6 a 1/10 da DDT, sempre com morfina de liberação imediata.\nMais de 3 resgates/dia persistentes = somar resgates à DDT, dividir por 6 e recalcular o resgate.", null], ["cx", "sintese", "Síntese", "A morfina é o padrão-ouro sem dose teto, com excreção renal de M6G (analgesia) e M3G (neurotoxicidade). A titulação segura depende do intervalo fixo de 4/4h, do resgate de 1/6 a 1/10 em liberação imediata e do recálculo basal quando há mais de 3 resgates ao dia.", null]]}, {"id": "b6", "capitulo": "c3", "titulo": "Conversão de vias, rotação de opioides, efeitos adversos e sedação paliativa", "onde": "Aula de Manejo da Dor (01:09 a 01:43)", "ensina": ["conversao-vias", "rotacao-opioides", "efeitos-adversos-opioides", "canabinoides-sedacao"], "seq": [["cx", "gancho", "Caso para começar", "Um paciente em uso de morfina 15 mg VO de 4/4h (90 mg/dia) desenvolve disfagia grave e precisará migrar para via subcutânea. No ambulatório, outro paciente em uso de oxicodona 40 mg 12/12h precisa rodar para adesivo de fentanil transdérmico.\n**Antes de seguir:** Como fazer essas duas conversões sem provocar superdosagem? E qual medicação é obrigatória desde o primeiro dia de qualquer opioide?", null], ["cx", "ideia", "A ideia em uma frase", "Via parenteral exige um terço da dose oral da morfina; toda rotação de opioide exige reduzir 25% a 50% da dose equipotente; e a mão que prescreve opioide sempre prescreve laxante.", null], ["passo", "Como converter morfina entre via oral e via subcutânea ou intravenosa?"], ["p", "A conversão entre vias da morfina segue a **Regra do 3**: a via subcutânea (SC) ou intravenosa (IV) é **três vezes mais potente** do que a via oral (VO).", []], ["cx", "conceito", "Regra do 3 na prática", "**VO para SC ou IV:** divida a dose diária por 3 (ex.: 90 mg/dia VO / 3 = **30 mg/dia SC**, ou 5 mg SC de 4/4h).\n**SC ou IV para VO:** multiplique a dose diária por 3.\n**Resgate VO em paciente com BIC SC:** converta primeiro a dose SC para VO (x 3) e só depois calcule 1/6 a 1/10 (ex.: 10 mg SC/24h = 30 mg VO/dia -> resgate VO de 3 a 5 mg).", null], ["passo", "Quando e como fazer a rotação de opioides?"], ["p", "A **rotação de opioides** (troca de um opioide por outro) está indicada quando há **falha analgésica com dose otimizada** ou **efeitos adversos intoleráveis**, como neurotoxicidade pelo metabólito M3G na insuficiência renal.", []], ["p", "O passo a passo exige converter a dose atual para equivalente em morfina oral, calcular a dose equipotente do novo opioide e **reduzir a dose calculada em 25% a 50%** devido à **tolerância cruzada incompleta** entre os fármacos.", []], ["fig", "calculos_morfina.png", "Painel prático de cálculos com morfina e rotação de opioides.", "Síntese visual das quatro fórmulas essenciais: dose de resgate, ajuste basal, Regra do 3 e redução na rotação.", "Esquema didático baseado na aula de Manejo da Dor.", ""], ["tab", "Potência e características dos principais opioides fortes", ["Opioide", "Potência vs. Morfina VO", "Regra prática / Particularidade"], [["**Oxicodona VO**", "1,5 a 2 vezes", "20 mg oxicodona = 30 mg morfina (liberação bifásica)"], ["**Hidromorfona**", "5 a 7 vezes", "Opção útil quando há intolerância à morfina"], ["**Fentanil transdérmico**", "75 a 100 vezes", "Dividir DDT de morfina VO por 2 = mcg/h do adesivo (12, 25, 50, 75, 100)"], ["**Metadona**", "2 a 20 vezes (errática)", "Meia-vida imprevisível (5 a 72h): manejo por especialista"]]], ["cx", "clinica", "Exemplo real da aula: Oxicodona -> Fentanil transdérmico", "Paciente usa oxicodona 40 mg VO 12/12h (80 mg/dia).\n**1. Converter para morfina VO:** 80 x 1,5 = **120 mg/dia de morfina VO**.\n**2. Converter para fentanil TD:** 120 / 2 = **60 mcg/h**.\n**3. Reduzir 25% a 50% (tolerância cruzada incompleta):** redução de ~30% = 42 mcg/h -> prescrever **37,5 mcg/h** (adesivos de 25 + 12,5 mcg/h) e deixar resgate disponível.", null], ["passo", "Como prevenir e tratar os efeitos adversos dos opioides?"], ["p", "O efeito adverso mais frequente é a **constipação intestinal**, que **não desenvolve tolerância** ao longo do tempo. O opioide reduz a motilidade, reduz a água na luz intestinal e diminui a sensibilidade do reflexo evacuatório na ampola retal.", []], ["cx", "destaque", "Mantra dos cuidados paliativos", "\"A mão que prescreve opioide é a que prescreve laxante.\" Prescreva laxativo profilático (osmótico como macrogol ou lactulose + estimulante como bisacodil à noite ou sene) e hidratação desde o primeiro dia. Nunca use óleo mineral em pacientes com disfagia (risco de pneumonia química) e evite ondansetrona (agrava a constipação).", "forte"], ["p", "Para **náuseas e vômitos** no início ou ajuste da morfina, a primeira escolha é **haloperidol** (0,5 a 2 mg VO/SC) ou **metoclopramida** (10 mg VO/SC). **Prurido** responde a anti-histamínicos. **Sedação excessiva** pede descartar infecção e reduzir dose ou rodar o opioide.", []], ["p", "A **depressão respiratória** é rara e **100% dose-dependente**. O antídoto é a **naloxona**, indicada classicamente diante da tríade: **frequência respiratória abaixo de 8 irpm + sedação importante + miose**. Se a depressão respiratória decorrer de erro de dose (iatrogenia), deve ser revertida imediatamente mesmo em paciente paliativo.", []], ["passo", "O que diz a Medicina Baseada em Evidências sobre canabinoides e como diferenciar sedação paliativa de eutanásia?"], ["p", "Revisões sistemáticas (Cochrane) mostram **evidência muito baixa e inconsistente** para canabinoides na analgesia: o CBD isolado não tem evidência robusta, o mito do \"poupador de opioide\" não se sustenta e o THC traz risco de virada psicótica e interações. Ficam restritos, no máximo, à **quarta linha em dor refratária**.", []], ["p", "Por fim, o desmame de opioides deve ser sempre gradual. Já a **sedação paliativa** é ética e legal: utiliza-se dose proporcional (como midazolam) apenas para aliviar um **sintoma refratário intratável** reduzindo o nível de consciência, **sem intenção de acelerar a morte**. A **eutanásia**, ao contrário, busca provocar a morte e é antiética e ilegal no Brasil.", []], ["cx", "erros", "Erros que derrubam", "Multiplicar em vez de dividir por 3 ao passar morfina de VO para SC/IV.\nRodar opioide usando 100% da dose equipotente sem reduzir 25% a 50%.\nUsar ondansetrona como antiemético de rotina para náusea por morfina ou óleo mineral em paciente com disfagia.", null], ["cx", "guardar", "Para guardar", "Morfina VO -> SC/IV divide por 3; rotação de opioide reduz 25% a 50%.\nNaloxona = FR < 8 irpm + sedação + miose; Constipação = laxativo profilático obrigatório.", null], ["cx", "sintese", "Síntese", "Segurança com opioides resume-se a quatro regras: Regra do 3 na troca de via, redução de 25% a 50% na rotação, laxativo profilático obrigatório (com haloperidol para náusea) e reconhecimento imediato da indicação de naloxona.", null]]}, {"id": "b7", "capitulo": "c4", "titulo": "Avaliação sistemática, dispneia, náuseas e constipação", "onde": "Slides 2, 3 e 8 a 17", "ensina": ["esas-avaliacao", "manejo-dispneia", "manejo-nauseas", "manejo-constipacao"], "seq": [["cx", "gancho", "Caso para começar", "Um paciente de 68 anos com câncer de fígado avançado relata falta de ar intensa mesmo em repouso (ESAS 8/10), porém mantém saturação de oxigênio (SpO2) de 92% em ar ambiente e não melhorou com cateter de O2. Na enfermaria ao lado, uma paciente de 59 anos com carcinoma gástrico iniciou morfina ontem e hoje apresenta náuseas nota 8/10 sem sinais de obstrução intestinal.\n**Antes de seguir:** A morfina é contraindicada no paciente com SpO2 de 92%? E qual antiemético ataca o mecanismo exato da náusea induzida por morfina?", null], ["cx", "ideia", "A ideia em uma frase", "Cada sintoma prevalente exige escala validada e tratamento guiado pelo mecanismo: morfina e ar fresco na dispneia, antiemético escolhido pela etiologia e laxativo osmótico mais estimulante na constipação.", null], ["passo", "Qual ferramenta guia a priorização de múltiplos sintomas?"], ["p", "Os quatro princípios gerais do controle de sintomas são: **avaliar regularmente**, **tratar causas reversíveis**, **antecipar e prevenir** efeitos adversos e **comunicar e envolver** paciente e família.", []], ["p", "A ferramenta padrão para priorizar múltiplos sintomas simultâneos (dor, cansaço, sonolência, náusea, apetite, falta de ar, depressão, ansiedade, bem-estar e outro problema como constipação) é a **ESAS-r (Escala de Avaliação de Sintomas de Edmonton)**, graduada de 0 a 10.", []], ["p", "Usar escalas padronizadas é fundamental para capturar a **percepção real do paciente**, porque a avaliação exclusiva do profissional de saúde tende a subestimar o sofrimento subjetivo.", []], ["passo", "Como avaliar e tratar a dispneia em cuidados paliativos?"], ["p", "A **dispneia** é a **sensação subjetiva de falta de ar** e **não se correlaciona obrigatoriamente com a SpO2**. Para quantificá-la, usam-se a **ESAS** e a **Escala de Borg Modificada**.", []], ["p", "Sempre investigue causas reversíveis antes de escalar sintomáticos: derrame pleural, broncoespasmo, anemia grave, tromboembolismo pulmonar (TEP), infecção pulmonar e insuficiência cardíaca.", []], ["p", "No **manejo não farmacológico**, a medida mais eficaz e simples é a **ventilação facial (ar fresco / ventilador de rosto)**, somada a cabeceira elevada (30 a 45 graus), relaxamento e redução de estímulos ambientais. **Oxigenoterapia só deve ser usada se houver hipoxemia documentada.**", []], ["p", "No **manejo farmacológico**, a **morfina é primeira linha** (**2,5 a 5 mg VO/SC a cada 4 horas**). A morfina em baixas doses é segura e eficaz mesmo em pacientes sem hipoxemia, **sem aumentar a mortalidade**. Outras opções incluem **midazolam** (dispneia refratária com agitação), **corticoides** (linfangite carcinomatosa ou obstrução brônquica) e **broncodilatadores** (se broncoespasmo).", []], ["passo", "Como escolher o antiemético correto pela etiologia?"], ["p", "Náuseas e vômitos atingem até **70% dos pacientes** em cuidados paliativos. Escolher qualquer antiemético sem pensar na causa leva a falha terapêutica: o mecanismo determina o receptor-alvo e o fármaco de escolha.", []], ["fig", "antiemeticos_receptores.png", "Escolha do antiemético pelo gatilho e receptor-alvo.", "Correlação direta entre a etiologia da náusea, o receptor predominante e o antiemético de primeira linha em cuidados paliativos.", "Esquema didático baseado nos slides Controle de Sintomas (Prof. Victor Moreira de Souza).", ""], ["p", "Medidas não farmacológicas incluem refeições pequenas e frequentes, evitar odores fortes, posicionamento adequado e acupuntura/acupressão (ponto P6). Em casos de secreções abundantes ou espasmos na obstrução, associa-se **escopolamina**.", []], ["passo", "Como diagnosticar e manejar a constipação intestinal?"], ["p", "Na avaliação, utiliza-se a **Escala de Bristol** (tipos 1 e 2 indicam constipação), frequência inferior a 3 evacuações por semana e **toque retal obrigatório** diante de suspeita de fecaloma ou obstrução.", []], ["p", "Medidas não farmacológicas incluem hidratação oral (se tolerada), mobilização ativa ou passiva e fibras apenas quando a ingesta hídrica é adequada.", []], ["p", "No manejo farmacológico, a primeira linha são os **laxativos osmóticos** (**macrogol / polietilenoglicol**, preferido por causar menos flatulência, ou **lactulose**), associados a **estimulantes** (**bisacodil** 5 a 10 mg VO/supositório à noite ou **sene**) para profilaxia em usuários de opioides. Se houver fecaloma, realiza-se **enema fosfatado ou glicerinado** e desimpactação manual quando necessário.", []], ["cx", "erros", "Erros que derrubam", "Indicar oxigênio de rotina para paciente dispneico com SpO2 normal em vez de morfina em dose baixa e ventilador facial.\nPrescrever ondansetrona como primeira escolha para náusea por morfina (piora a constipação e não bloqueia o receptor D2).\nEsquecer o toque retal antes de aumentar laxativos em paciente há vários dias sem evacuar.", null], ["cx", "guardar", "Para guardar", "Dispneia = morfina 1ª linha + ventilador facial (O2 só se hipoxemia).\nNáuseas: Opioide -> Haloperidol | Gastroparesia -> Metoclopramida | QT/RT -> Ondansetrona | HIC -> Dexametasona | Cinetose -> Dimenidrinato/Meclizina.", null], ["cx", "sintese", "Síntese", "A ESAS-r organiza a priorização dos sintomas. Na dispneia, morfina e ar fresco lideram o manejo; nas náuseas, o gatilho define o receptor e o fármaco; na constipação, Bristol, toque retal e combinação de osmótico com estimulante evitam complicações.", null]]}, {"id": "b8", "capitulo": "c4", "titulo": "Delirium, fadiga, caquexia, saúde mental e sinais de alarme", "onde": "Slides 4 a 7 e 18 a 27", "ensina": ["manejo-delirium", "fadiga-caquexia", "ansiedade-depressao", "sinais-alarme-ps"], "seq": [["cx", "gancho", "Caso para começar", "Um paciente terminal de 76 anos torna-se subitamente sonolento e silencioso, com períodos de confusão mental que oscilam ao longo do dia. A família acredita que o paciente está apenas triste ou cansado. Horas depois, evolui com agitação intensa e mioclonias nas últimas 48 horas de vida.\n**Antes de seguir:** Qual subtipo de delirium costuma passar despercebido nessa fase inicial? E qual fármaco pode ser usado quando a agitação e as mioclonias se tornam refratárias no fim de vida?", null], ["cx", "ideia", "A ideia em uma frase", "O delirium hipoativo é o mais subdiagnosticado, a fadiga tem o exercício físico como primeira linha, a depressão é reconhecida pela anedonia e os sinais de alarme definem a ida ao pronto-socorro.", null], ["passo", "Como diagnosticar e tratar o delirium em cuidados paliativos?"], ["p", "O **delirium** é um **distúrbio agudo e flutuante da atenção e da consciência** de base orgânica (critérios DSM-5), presente em até **80% dos pacientes no fim de vida**.", []], ["p", "Divide-se em três subtipos: **hiperativo** (agitação e agressividade), **hipoativo** (sonolência e confusão silenciosa, **o mais comum e mais subdiagnosticado**) e **misto**.", []], ["p", "O padrão-ouro diagnóstico é o **CAM (Confusion Assessment Method)**, enquanto a escala **RASS** monitora o grau de agitação ou sedação durante o manejo.", []], ["cx", "conceito", "Causas reversíveis de delirium: mnemônico WHHHIMP", "**W**ernicke (deficiência de tiamina) · **H**ipoxemia · **H**ipoglicemia · **H**ipertensão intracraniana · **I**nfecção · **M**etabólico (eletrólitos, cálcio, ureia) · **P**olifarmácia/drogas.", null], ["p", "No **manejo não farmacológico**, garanta ambiente silencioso e iluminado, reorientação frequente (relógio, calendário), presença de familiar próximo, ciclo sono-vigília preservado e redução de cateteres e contenção física.", []], ["p", "No **manejo farmacológico**, o **haloperidol** (0,5 a 2 mg VO/SC) é a primeira linha no delirium hiperativo, com **clorpromazina** como alternativa mais sedativa. No **delirium refratário, mioclonias ou sedação paliativa nas últimas 48h**, o **midazolam SC** é excelente escolha. Evite benzodiazepínicos isolados fora de abstinência.", []], ["passo", "Como diferenciar e conduzir fadiga relacionada ao câncer e caquexia?"], ["p", "A **fadiga relacionada ao câncer (FRC)** define-se (CID-10) por cansaço significativo diário por **2 semanas ou mais**, **não aliviado pelo repouso**, interferindo nas atividades diárias. Avalia-se por ENV (0 a 10), ESAS, BFI ou FACIT-Fatigue.", []], ["p", "Trate causas reversíveis (anemia, hipotireoidismo, hipogonadismo, dor, depressão, distúrbio do sono). A **primeira linha de evidência** é o **exercício físico** aeróbico leve a moderado supervisionado + conservação de energia (evitar repouso prolongado). Como farmacoterapia em casos selecionados: **metilfenidato** (5 a 10 mg VO manhã e meio-dia, em prognóstico curto) ou **dexametasona** (4 a 8 mg/dia por 1 a 2 semanas).", []], ["p", "A **caquexia** é a perda progressiva de massa muscular (com ou sem perda de gordura) não completamente revertida por oferta calórica convencional. Critérios: perda de peso **> 5% em 6 meses** ou **> 2% com IMC < 20 kg/m²**, sarcopenia e inflamação (PCR elevada, albumina < 3,5 g/dL, anemia normocítica).", []], ["p", "Pelo estadiamento de **Fearon (2011)**, classifica-se em: **1) Pré-caquexia** (perda <= 5%); **2) Caquexia instalada** (perda > 5% + anorexia e inflamação); **3) Caquexia refratária** (resposta nula à nutrição e prognóstico < 3 meses).", []], ["p", "O manejo da caquexia combina 5 a 6 refeições fracionadas de alta densidade calórica, suplementação hiperproteica (>= 1,2 g proteína/kg/dia), fisioterapia e aconselhamento familiar sobre expectativas realistas. Fármacos: **acetato de megestrol** (160 a 800 mg/dia; atenção a **trombose** e **supressão adrenal**) ou **dexametasona** (4 mg/dia por 2 a 4 semanas).", []], ["passo", "Como reconhecer e tratar ansiedade e depressão sem confundir com a doença de base?"], ["p", "Na **ansiedade** (ESAS, GAD-7, HADS), exclua primeiro causas orgânicas: dispneia, dor não tratada, delirium hiperativo, corticoides ou broncodilatadores. O manejo associa psicoterapia, mindfulness, escuta ativa e espiritualidade; fármacos incluem **lorazepam** 0,5 a 1 mg VO/SL (curto prazo), **ISRS** (crônica) ou **mirtazapina** (ansiedade + insônia).", []], ["p", "Na **depressão** (PHQ-9, HADS ou pergunta única sobre humor deprimido na última semana), lembre que sintomas somáticos (fadiga, insônia, perda de peso) podem vir do câncer: **valorize anedonia e desesperança**. Fármacos: **sertralina** 25 a 50 mg/dia (1ª linha, efeito em 2 a 4 semanas), **mirtazapina** (útil se insônia + anorexia + ansiedade) ou **metilfenidato** (prognóstico < 4 semanas, efeito em dias).", []], ["passo", "Quais sinais de alarme exigem encaminhamento imediato ao pronto-socorro?"], ["tab", "Sinais de alarme para acionar o Pronto-Socorro", ["Sintoma", "Sinais de alarme (encaminhamento imediato)"], [["**Dispneia**", "SpO2 < 85% refratária, crise de sufocamento com agitação intensa, estridor súbito, hemoptise volumosa"], ["**Náuseas / Vômitos**", "Vômitos fecaloides, hematemese, distensão abdominal aguda, obstrução completa, desidratação grave"], ["**Constipação**", "Distensão abdominal aguda, ausência de flatos, vômitos fecaloides, dor intensa, suspeita de oclusão intestinal"], ["**Delirium**", "Agitação com risco de autolesão, causa emergencial tratável (hipoglicemia, HIC, sepse), hipoativo súbito com rebaixamento"], ["**Fadiga**", "Instalação súbita com dispneia em repouso, hipotensão, confusão aguda, dor torácica, sangramento ativo ou sepse"], ["**Ansiedade / Depressão**", "Ideação suicida ativa com plano, recusa alimentar grave com risco iminente, pânico refratário, sintomas psicóticos"]]], ["cx", "erros", "Erros que derrubam", "Confundir delirium hipoativo com tristeza ou sono normal e deixar de aplicar o CAM.\nUsar antidepressivo como primeira escolha para agitação aguda e mioclonias nas últimas 48 horas de vida.\nDiagnosticar depressão em paciente oncológico olhando apenas para fadiga e perda de peso, sem investigar anedonia e desesperança.", null], ["cx", "guardar", "Para guardar", "Delirium hipoativo é o mais comum e subdiagnosticado; aplique CAM e investigue WHHHIMP.\nExercício físico é 1ª linha na fadiga; anedonia e desesperança definem depressão no paciente grave.", null], ["cx", "sintese", "Síntese", "Reconhecer o delirium hipoativo (CAM + WHHHIMP), tratar fadiga e caquexia com metas realistas, valorizar anedonia na depressão e dominar a tabela de sinais de alarme garante segurança tanto no domicílio quanto no hospital.", null]]}, {"id": "b9", "capitulo": "c5", "titulo": "Princípios dos CP, bioética, espiritualidade, comunicação SPIKES e equipe", "onde": "Aulas 1, 2, 4 e 9 (Questões 1 a 7, 12 e 29)", "ensina": ["principios-cp-etica", "espiritualidade-aps", "spikes-equipe"], "seq": [["cx", "gancho", "Caso para começar", "Uma paciente de 45 anos com linfoma estágio IV, plenamente lúcida (MEEM 30/30), recusa quimioterapia paliativa e escolhe cuidados de conforto em casa. Em outro atendimento na UBS, uma paciente sem vínculo religioso relata \"medo de morrer\" e questiona o sentido de tanto sofrimento apesar de sintomas físicos bem controlados.\n**Antes de seguir:** O oncologista pode internar a primeira paciente contra a vontade para iniciar quimioterapia? E qual a conduta correta diante do sofrimento existencial da segunda paciente?", null], ["cx", "ideia", "A ideia em uma frase", "Cuidados paliativos não prolongam a vida biológica a qualquer custo: protegem a autonomia do paciente capaz, acolhem o sofrimento espiritual com escuta qualificada e unem comunicação estruturada com trabalho em equipe.", null], ["passo", "Quais são os princípios dos cuidados paliativos e o que NÃO faz parte dessa abordagem?"], ["p", "Segundo a OMS, os cuidados paliativos visam melhorar a qualidade de vida de pacientes e familiares diante de doenças ameaçadoras da vida, por meio da prevenção e do alívio do sofrimento nas dimensões **física, psicológica, social e espiritual**, com equipe multiprofissional.", []], ["p", "O **prolongamento indefinido da vida biológica a qualquer custo (distanásia)** **NÃO** é um princípio dos cuidados paliativos. A preservação biológica isolada não pode se sobrepor à dignidade e ao alívio do sofrimento.", []], ["passo", "Como aplicar autonomia e justiça nos dilemas bioéticos?"], ["p", "Pelo princípio da **autonomia**, o paciente adulto com capacidade de discernimento preservada (como MEEM 30/30) tem direito de **recusar tratamentos**, incluindo quimioterapia paliativa, mesmo que a recusa contrarie a percepção da equipe médica.", []], ["p", "Pelo princípio da **justiça**, o acesso aos cuidados paliativos deve ser **universal e equitativo**, sem discriminação por condição social, diagnóstico ou prognóstico.", []], ["passo", "Como abordar a espiritualidade na Atenção Primária (APS/ESF) sem confundir com religião?"], ["p", "Espiritualidade é a busca pessoal de sentido, propósito e conexão, e **existe mesmo em pacientes sem vínculo religioso**. Reconhecer essa dimensão faz parte da integralidade do cuidado na APS domiciliar.", []], ["p", "Diante de angústia existencial (\"tenho medo de morrer\", \"não entendo tanto sofrimento\") ou desespero extremo, a conduta inicial correta é **escuta qualificada, validação dos sentimentos, exploração de fontes de sentido e valores pessoais e articulação de suporte interdisciplinar**.", []], ["cx", "alerta", "O que NUNCA fazer diante do sofrimento espiritual", "Nunca diga que questões de sentido da vida estão fora do escopo médico, nunca sede o paciente para fugir da conversa e nunca encaminhe automaticamente a um líder religioso sem o desejo do paciente.", null], ["passo", "Como estruturar a comunicação (SPIKES) e o papel do médico na equipe?"], ["p", "Para comunicar notícias difíceis com empatia e clareza, utiliza-se o **Protocolo SPIKES**: **S** (*Setting up*: preparar ambiente), **P** (*Perception*: explorar o que o paciente já sabe), **I** (*Invitation*: convite para saber quanto deseja ouvir), **K** (*Knowledge*: transmitir informação de forma clara), **E** (*Empathy*: acolher emoções) e **S** (*Strategy/Summary*: pactuar próximos passos).", []], ["p", "Na **equipe multiprofissional**, a decisão não é por votação nem delegada exclusivamente a outro profissional: o **médico lidera a comunicação empática de prognóstico e plano de cuidados, decide atos privativos** (como a não indicação de ventilação invasiva) e **articula toda a equipe** para o suporte integral.", []], ["cx", "erros", "Erros que derrubam", "Insistir em medidas invasivas ou internação compulsória quando o paciente capaz recusa o tratamento.\nTratar sofrimento existencial exclusivamente com benzodiazepínico ou dizer que é problema filosófico fora da medicina.\nDelegar ao enfermeiro ou psicólogo a comunicação médica de prognóstico ou a decisão de atos privativos.", null], ["cx", "guardar", "Para guardar", "Distanásia (prolongar vida a qualquer custo) NÃO é princípio dos cuidados paliativos.\nSofrimento espiritual sem religião = escuta qualificada + explorar sentido/valores + equipe interdisciplinar.", null], ["cx", "sintese", "Síntese", "Os cuidados paliativos rejeitam a distanásia, respeitam a autonomia do paciente capaz, acolhem a espiritualidade como parte da integralidade e combinam o protocolo SPIKES com a liderança médica articulada à equipe.", null]]}, {"id": "b10", "capitulo": "c5", "titulo": "Luto, sobrecarga do cuidador, PNCP e Diretivas Antecipadas de Vontade", "onde": "Aulas 3, 6, 8, 13 e 15 (Questões 9, 13, 25 a 28 e 30 a 33)", "ensina": ["luto-cuidador", "pncp-sus", "dav-cfm"], "seq": [["cx", "gancho", "Caso para começar", "Um paciente de 67 anos com câncer de pulmão metastático (PPS 30%) havia registrado previamente o desejo de não ir para a UTI e não ser intubado. Ao dar entrada na emergência inconsciente e dispneico, os familiares angustiados exigem transferência imediata para UTI e intubação.\n**Antes de seguir:** Como o paciente está inconsciente agora, a vontade da família passa a prevalecer sobre a Diretiva Antecipada de Vontade registrada previamente?", null], ["cx", "ideia", "A ideia em uma frase", "A Diretiva Antecipada de Vontade registrada por paciente capaz prevalece sobre o desejo dos familiares, e o luto é um processo não linear que só se torna patológico quando persiste com prejuízo funcional prolongado.", null], ["passo", "Como diferenciar luto normal, luto antecipatório e transtorno de luto prolongado?"], ["p", "O **luto** é uma resposta natural, individual e **não linear** diante de uma perda significativa. As pessoas não seguem fases fixas no mesmo ritmo, e é comum haver manifestações físicas como alterações do sono e do apetite.", []], ["p", "O **luto antecipatório** ocorre ainda antes do óbito, quando paciente e família elaboram progressivamente perdas de autonomia, funcionalidade e papéis sociais.", []], ["p", "O **luto complicado (Transtorno de Luto Prolongado)**, conforme critérios do DSM-5-TR cobrados na disciplina, caracteriza-se por **sintomas intensos e persistentes por mais de 12 meses acompanhados de prejuízo funcional significativo**.", []], ["p", "No cuidado à família, utiliza-se a **Escala de Avaliação de Carga do Cuidador de Zarit (ZBI)** para identificar precocemente a sobrecarga do cuidador informal (dimensão social).", []], ["passo", "O que estabelece a Política Nacional de Cuidados Paliativos (PNCP) no SUS?"], ["p", "A **Política Nacional de Cuidados Paliativos (PNCP)** no SUS (Portaria GM/MS nº 3.681/2024) organiza o cuidado paliativo de forma integrada em toda a Rede de Atenção à Saúde, da Atenção Primária (ESF) e Atenção Domiciliar até a alta complexidade.", []], ["p", "A política prevê financiamento específico, formação de **equipes matriciais e assistenciais** e pactuação federativa em todo o país, superando modelos restritos apenas a medicamentos isolados ou a poucas regiões.", []], ["passo", "Como aplicar as Diretivas Antecipadas de Vontade (Resolução CFM nº 1.995/2012)?"], ["p", "As **Diretivas Antecipadas de Vontade (DAV)** são o conjunto de desejos, prévia e expressamente manifestados pelo paciente capaz, sobre cuidados e tratamentos que quer ou não quer receber caso fique incapaz de expressar sua vontade (como recusa de UTI ou intubação orotraqueal).", []], ["fig", "pilares_cp_dav.png", "Comunicação (SPIKES), luto e Diretivas Antecipadas de Vontade.", "Painel integrado dos seis passos do protocolo SPIKES, critérios de luto prolongado e regras éticas da Resolução CFM nº 1.995/2012.", "Esquema didático baseado nas aulas da disciplina e Resolução CFM nº 1.995/2012.", ""], ["cx", "destaque", "Regra de prova: Resolução CFM nº 1.995/2012", "As DAV devem ser registradas pelo médico no **prontuário** (não exigem cartório para ter validade ética) e **prevalecem sobre o desejo dos familiares** quando o paciente perde a lucidez. Cabe ao médico respeitar a diretiva, manter conforto e controle sintomático (como morfina) e dialogar empaticamente com a família explicando os fundamentos éticos e clínicos.", "forte"], ["cx", "erros", "Erros que derrubam", "Acreditar que a vontade da família passa a prevalecer automaticamente quando o paciente fica inconsciente.\nConsiderar que o luto segue fases rígidas iguais para todas as pessoas ou que nunca provoca sintomas físicos.\nClassificar saudade intensa com menos de 6 meses sem prejuízo funcional como transtorno de luto prolongado.", null], ["cx", "guardar", "Para guardar", "DAV (Resolução CFM nº 1.995/2012) prevalece sobre o desejo familiar; não intubar não é abandonar, é garantir conforto.\nLuto prolongado (DSM-5-TR) = sintomas persistentes > 12 meses com prejuízo funcional.", null], ["cx", "sintese", "Síntese", "O cuidado paliativo integral acompanha a sobrecarga do cuidador (Zarit), acolhe o luto de forma individualizada, fortalece a rede do SUS pela PNCP e protege a autonomia do paciente até o fim da vida por meio das Diretivas Antecipadas de Vontade.", null]]}], "testes": [{"id": "t1", "bloco": "b1", "tema": "Subjetividade da dor", "conceito": "dor-subjetiva", "nivel": 1, "papel": "checagem", "enunciado": "Sobre a avaliação clínica da dor em cuidados paliativos, assinale a afirmação correta:", "alternativas": ["O relato do paciente define a dor, e a falta de queixa não a exclui.", "Frequência cardíaca e pressão arterial substituem o relato quando o paciente parece calmo.", "Pacientes sedados ou sem fala clínica raramente sentem dor clinicamente relevante.", "Um paciente que conversa calmamente com familiares não pode ter dor intensa."], "correta": 0, "porque": "A dor é uma experiência estritamente subjetiva. O relato do paciente é o padrão de referência e, em pacientes sedados ou com barreira comunicativa, sinais comportamentais sutis devem ser investigados.", "errados": {"1": "Sinais vitais objetivos não medem dor de forma confiável e podem permanecer normais mesmo diante de sofrimento intenso.", "2": "A sedação ou a barreira de comunicação impedem o relato verbal, mas não eliminam a percepção dolorosa.", "3": "O comportamento externo calmo não invalida a intensidade referida pelo paciente."}, "passo": 2}, {"id": "t2", "bloco": "b1", "tema": "Dor total", "conceito": "dor-total", "nivel": 1, "papel": "checagem", "enunciado": "Um paciente com câncer avançado apresenta piora súbita da dor após descobrir que a família não poderá visitá-lo e relatar medo intenso de morrer sozinho. Qual conceito explica essa amplificação do sofrimento?", "alternativas": ["Dor total, integrando dimensões física, psicológica, social e espiritual.", "Nocicepção pura, na qual toda piora da dor exige nova lesão anatômica.", "Hiperalgesia primária, causada pelo aumento de receptores mecânicos cutâneos.", "Tolerância aguda a analgésicos simples provocada por estresse emocional."], "correta": 0, "porque": "O conceito de dor total (Cicely Saunders) explica que fatores psicológicos (medo), sociais (isolamento) e espirituais modulam e amplificam a dor física.", "errados": {"1": "Nocicepção e dor são processos independentes; o sofrimento não depende apenas de nova lesão anatômica.", "2": "Hiperalgesia refere-se a uma resposta exagerada a estímulo doloroso na via nervosa, não ao impacto social e existencial.", "3": "O quadro descreve amplificação emocional e social da dor, não perda farmacológica de resposta a analgésicos simples."}, "passo": 3}, {"id": "t3", "bloco": "b1", "tema": "Avaliação no prontuário", "conceito": "avaliacao-dor", "nivel": 1, "papel": "checagem", "enunciado": "Qual conduta representa o registro adequado da dor no prontuário de um paciente em cuidados paliativos?", "alternativas": ["Quantificar por EVA ou ESAS e detalhar local, caráter e padrão temporal.", "Registrar apenas \"paciente refere dor\" e reavaliar somente na consulta seguinte.", "Anotar somente a nota numérica da escala sem descrever a qualidade da dor.", "Aplicar a escala numérica verbal em pacientes com demência avançada sem adaptar."], "correta": 0, "porque": "A evolução completa com intensidade (EVA/ESAS), localização, caráter e padrão temporal permite acompanhar a evolução e compartilhar informações claras com a equipe.", "errados": {"1": "O registro genérico impede o acompanhamento da resposta terapêutica pela equipe multidisciplinar.", "2": "A nota numérica isolada não informa se a dor é nociceptiva, neuropática ou incidental.", "3": "Pacientes com limitação cognitiva beneficiam-se de escalas de faces ou avaliação comportamental, não apenas da escala numérica."}, "passo": 4}, {"id": "t4", "bloco": "b2", "tema": "Alodínia e hiperalgesia", "conceito": "dor-neuropatica", "nivel": 2, "papel": "checagem", "enunciado": "Um paciente com metástase vertebral relata dor intensa em queimação no pé toda vez que o lençol encosta na pele. Qual é o nome semiológico desse achado?", "alternativas": ["Alodínia, quando estímulo normalmente inócuo provoca dor.", "Hiperalgesia, pois o toque do lençol é um estímulo naturalmente doloroso.", "Dor visceral referida, causada por inervação autonômica dos membros inferiores.", "Dor nociceptiva somática pura, característica de lesão muscular superficial."], "correta": 0, "porque": "Alodínia é a percepção de dor diante de um estímulo inócuo (toque do lençol ou vestir meia), sendo sinal clássico de dor neuropática.", "errados": {"1": "Na hiperalgesia, o estímulo já é naturalmente doloroso, mas provoca resposta desproporcionalmente intensa.", "2": "A dor visceral origina-se em órgãos internos e não cursa com hipersensibilidade cutânea ao toque leve.", "3": "A lesão muscular superficial gera dor bem localizada à palpação ou movimento, sem queimação ao toque leve de tecido."}, "passo": 3}, {"id": "t5", "bloco": "b2", "tema": "Escada analgésica da OMS", "conceito": "escada-oms", "nivel": 2, "papel": "checagem", "enunciado": "Um paciente com neoplasia avançada chega à primeira consulta em cuidados paliativos com dor contínua nota 9 na EVA. Qual conduta segue a concepção atual da escada analgésica da OMS?", "alternativas": ["Iniciar no 3º degrau com opioide forte em horário fixo e adjuvantes.", "Iniciar obrigatoriamente com dipirona isolada por uma semana antes de opioides.", "Prescrever morfina exclusivamente sob demanda (\"se dor\") para evitar dependência.", "Encaminhar direto para bloqueio nervoso do quarto degrau antes da farmacoterapia."], "correta": 0, "porque": "A escada analgésica atual baseia-se na proporcionalidade: dor intensa (EVA 7 a 10) justifica início imediato de opioide forte em horário fixo, otimizando a via oral antes de pensar em procedimentos invasivos.", "errados": {"1": "Subir degrau por degrau em paciente com dor nota 9 prolonga sofrimento evitável e contraria a atualização da OMS.", "2": "Dor crônica contínua exige esquema pelo relógio (horário fixo); prescrição apenas sob demanda deixa o paciente desprotegido.", "3": "Procedimentos do quarto degrau são reservados para dor refratária após otimização adequada da farmacoterapia."}, "passo": 4}, {"id": "t6", "bloco": "b3", "tema": "Hipodermóclise: técnica", "conceito": "hipodermoclise-tecnica", "nivel": 1, "papel": "checagem", "enunciado": "Durante a instalação de uma hipodermóclise no abdômen de um paciente em cuidados paliativos domiciliares, qual cuidado técnico é obrigatório?", "alternativas": ["Inserir em direção centrípeta e aspirar confirmando ausência de sangue.", "Puncionar em direção centrífuga para retardar a absorção linfática local.", "Infundir todos os medicamentos do paciente sempre pelo mesmo sítio de punção.", "Utilizar a via subcutânea como primeira escolha em choque hipovolêmico grave."], "correta": 0, "porque": "A punção centrípeta acompanha o fluxo linfático natural em direção ao coração, e a aspiração negativa confirma que o cateter está no espaço subcutâneo e não dentro de um vaso sanguíneo.", "errados": {"1": "A direção centrífuga vai contra o fluxo natural da linfa e favorece edema local e má absorção.", "2": "Fármacos contínuos ou incompatíveis precisam de sítios separados para evitar precipitação e irritação.", "3": "Instabilidade hemodinâmica exige via intravenosa pela necessidade de ação imediata."}, "passo": 2}, {"id": "t7", "bloco": "b3", "tema": "Fármacos na hipodermóclise", "conceito": "hipodermoclise-farmacos", "nivel": 1, "papel": "checagem", "enunciado": "Qual grupo de substâncias pode ser administrado com segurança pela via subcutânea (hipodermóclise)?", "alternativas": ["Morfina, metoclopramida, haloperidol e ceftriaxona.", "Cloreto de potássio concentrado, noradrenalina e morfina.", "Nutrição parenteral total, ceftriaxona e dexametasona.", "Quimioterápicos vesicantes, midazolam e furosemida."], "correta": 0, "porque": "Morfina, metoclopramida, haloperidol e ceftriaxona são amplamente utilizados por hipodermóclise em cuidados paliativos. Soluções hipertônicas (KCl), vasoativas, nutrição parenteral e quimioterápicos provocam necrose tecidual.", "errados": {"1": "Cloreto de potássio concentrado e noradrenalina são formalmente proibidos pelo alto risco de necrose tecidual.", "2": "A nutrição parenteral possui alta osmolaridade e macromoléculas que causam necrose no subcutâneo.", "3": "Quimioterápicos possuem elevada toxicidade química local e nunca devem ser infundidos por hipodermóclise."}, "passo": 4}, {"id": "t8", "bloco": "b4", "tema": "Anticonvulsivantes na neuropatia", "conceito": "adjuvantes-neuropatica", "nivel": 2, "papel": "checagem", "enunciado": "Um paciente de 68 anos com doença renal crônica (clearance de creatinina de 28 mL/min) desenvolve dor neuropática periférica em membros inferiores. Qual afirmação está correta sobre a prescrição de adjuvantes?", "alternativas": ["Pregabalina ou gabapentina são adequadas, exigindo ajuste pela função renal.", "Carbamazepina deve ser prescrita como primeira escolha em toda neuropatia periférica.", "Pregabalina tem eliminação exclusivamente hepática e dispensa ajuste na doença renal.", "Amitriptilina em dose alta é a opção mais segura em idosos por não afetar a cognição."], "correta": 0, "porque": "Pregabalina e gabapentina são primeira linha na dor neuropática periférica e dependem de excreção renal, exigindo ajuste abaixo de 60 e 30 mL/min.", "errados": {"1": "A carbamazepina é reservada como primeira escolha apenas para a neuralgia do trigêmeo.", "2": "A excreção da pregabalina é predominantemente renal, o que torna o ajuste indispensável na doença renal crônica.", "3": "Antidepressivos tricíclicos têm efeito anticolinérgico relevante e aumentam o risco de confusão mental e piora cognitiva em idosos."}, "passo": 2}, {"id": "t9", "bloco": "b4", "tema": "Adjuvantes na dor óssea", "conceito": "adjuvantes-ossea", "nivel": 2, "papel": "checagem", "enunciado": "Por que os corticosteroides reduzem a dor em pacientes com metástases ósseas avançadas?", "alternativas": ["Reduzem a inflamação tumoral e o edema do periósteo inervado.", "Reconstroem imediatamente o osso já fraturado por deposição rápida de cálcio.", "Bloqueiam diretamente os receptores opioides no sistema nervoso central.", "Substituem integralmente os bisfosfonatos na profilaxia de fraturas patológicas."], "correta": 0, "porque": "O interior do osso não dói; a estrutura inervada que gera dor é o periósteo. Corticoides reduzem o edema periósteo e a inflamação tumoral.", "errados": {"1": "Corticoides não reconstroem arquitetura óssea nem revertem fraturas já instaladas.", "2": "O mecanismo analgésico dos corticoides é anti-inflamatório e antiedematoso, não relacionado a bloqueio opioide.", "3": "Bisfosfonatos atuam sobre osteoclastos para prevenir fraturas; corticoides não exercem esse efeito protetor ósseo."}, "passo": 4}, {"id": "t10", "bloco": "b4", "tema": "Benzodiazepínicos e opioides", "conceito": "benzodiazepinicos-dor", "nivel": 1, "papel": "checagem", "enunciado": "Qual é o principal risco ao associar benzodiazepínicos com opioides em um paciente em cuidados paliativos?", "alternativas": ["Somar depressão do sistema nervoso central e risco respiratório.", "Antagonizar diretamente o receptor opioide e anular a analgesia da morfina.", "Aumentar de forma súbita a motilidade intestinal com diarreia osmótica grave.", "Provocar necrose tecidual obrigatória quando administrados pela via oral."], "correta": 0, "porque": "Tanto benzodiazepínicos quanto opioides deprimem o sistema nervoso central; a associação exige indicação criteriosa, menor dose possível e vigilância clínica.", "errados": {"1": "Benzodiazepínicos não antagonizam receptores opioides; o problema é a soma dos efeitos depressores centrais.", "2": "Opioides causam constipação, e benzodiazepínicos não provocam diarreia osmótica.", "3": "A via or
