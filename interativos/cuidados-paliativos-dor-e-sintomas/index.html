al não provoca necrose tecidual com essa associação."}, "passo": 5}, {"id": "t11", "bloco": "b5", "tema": "Interação tramadol + ondansetrona", "conceito": "opioides-fracos", "nivel": 1, "papel": "checagem", "enunciado": "Por que não se deve prescrever tramadol e ondansetrona de forma simultânea no controle de sintomas paliativos?", "alternativas": ["A ondansetrona diminui a eficácia analgésica do tramadol.", "A associação provoca hipotensão refratária imediata na maioria dos pacientes.", "A combinação causa aplasia medular cumulativa em poucos dias de uso.", "A ondansetrona converte o tramadol em morfina tóxica no tecido hepático."], "correta": 0, "porque": "O tramadol depende de vias serotoninérgicas descendentes para parte de sua analgesia; o antagonismo 5-HT3 pela ondansetrona reduz o efeito analgésico do tramadol.", "errados": {"1": "A interação não tem como mecanismo principal hipotensão grave.", "2": "Nenhum dos dois fármacos tem supressão medular cumulativa como interação clássica.", "3": "A ondansetrona não converte tramadol em morfina; o bloqueio ocorre no receptor 5-HT3."}, "passo": 1}, {"id": "t12", "bloco": "b5", "tema": "Metabólitos da morfina", "conceito": "morfina-farmacocinetica", "nivel": 2, "papel": "checagem", "enunciado": "Um paciente com doença renal crônica avançada (ClCr 22 mL/min) em uso de doses altas de morfina desenvolve mioclonias e confusão mental. Qual metabólito explica essa neurotoxicidade?", "alternativas": ["M3G, metabólito sem analgesia que acumula na disfunção renal.", "M6G, metabólito inativo responsável apenas por constipação crônica.", "Ácido salicílico derivado da degradação gástrica da morfina oral.", "Naloxona endógena liberada pelos túbulos renais sob sobrecarga."], "correta": 0, "porque": "Na insuficiência renal, há acúmulo dos metabólitos da morfina: o M6G faz analgesia (e pode sedar), enquanto o M3G não analgesia e gera neuroexcitação (mioclonias, confusão mental, hiperalgesia).", "errados": {"1": "O M6G é o metabólito analgésico ativo, e a constipação ocorre em receptores periféricos gastrointestinais.", "2": "A morfina não gera ácido salicílico em seu metabolismo.", "3": "Naloxona é um antagonista opioide exógeno, não um metabólito renal."}, "passo": 2}, {"id": "t13", "bloco": "b5", "tema": "Cálculo de resgate da morfina", "conceito": "calculo-resgate-ajuste", "nivel": 2, "papel": "checagem", "enunciado": "Um paciente em uso de morfina de liberação imediata 10 mg VO de 4/4h (60 mg/dia) precisa de prescrição de dose de resgate. Qual é a prescrição correta?", "alternativas": ["Morfina de liberação imediata 5 mg a 10 mg VO nos intervalos.", "Morfina de liberação prolongada 20 mg VO a cada crise de dor.", "Metadona 20 mg VO sempre que a intensidade da dor aumentar.", "Morfina de liberação imediata 30 mg VO como dose padrão de resgate."], "correta": 0, "porque": "O resgate corresponde a 1/6 a 1/10 da dose diária total (60 mg/dia -> 6 a 10 mg, arredondando 6 mg para 5 mg) e deve ser feito sempre com morfina de liberação imediata.", "errados": {"1": "Morfina de liberação prolongada tem início lento e nunca deve ser usada para resgate.", "2": "Metadona possui meia-vida longa e errática, inadequada como resgate padrão.", "3": "30 mg corresponde à metade da dose diária inteira, com alto risco de intoxicação."}, "passo": 4}, {"id": "t14", "bloco": "b6", "tema": "Conversão VO para SC (Regra do 3)", "conceito": "conversao-vias", "nivel": 2, "papel": "checagem", "enunciado": "Um paciente toma morfina 15 mg VO de 4/4h (total 90 mg/dia) e evolui com disfagia completa. Qual é a dose diária equivalente pela via subcutânea (hipodermóclise)?", "alternativas": ["30 mg/dia SC (5 mg SC 4/4h ou 30 mg em BIC 24h).", "270 mg/dia por via subcutânea, multiplicando a dose oral por 3.", "90 mg/dia por via subcutânea, mantendo a mesma miligramagem oral.", "10 mg/dia por via subcutânea, dividindo a dose oral total por 9."], "correta": 0, "porque": "A via subcutânea ou intravenosa é 3 vezes mais potente que a via oral; portanto, para passar de VO para SC, divide-se a dose diária por 3 (90 / 3 = 30 mg/dia).", "errados": {"1": "Multiplicar por 3 aplica-se ao caminho inverso (SC/IV para VO) e causaria superdosagem grave aqui.", "2": "A via subcutânea evita o metabolismo hepático de primeira passagem, exigindo dose menor que a oral.", "3": "Não existe fator de divisão por 9 na conversão entre morfina oral e subcutânea."}, "passo": 1}, {"id": "t15", "bloco": "b6", "tema": "Indicação de naloxona", "conceito": "efeitos-adversos-opioides", "nivel": 2, "papel": "checagem", "enunciado": "Durante visita domiciliar, um paciente que recebeu aumento recente de morfina encontra-se muito sedado, com pupilas puntiformes (miose) e frequência respiratória de 6 irpm. Qual é a conduta imediata?", "alternativas": ["Reconhecer intoxicação por opioide e reverter imediatamente com naloxona.", "Não intervir porque pacientes paliativos nunca devem receber antídotos.", "Administrar dose extra de benzodiazepínico para estabilizar o ritmo respiratório.", "Aguardar 24 horas observando em domicílio, pois o quadro é benigno."], "correta": 0, "porque": "A tríade FR < 8 irpm + sedação importante + miose define depressão respiratória por opioide com indicação formal de naloxona. Complicações iatrogênicas por erro de dose devem ser revertidas mesmo em cuidados paliativos.", "errados": {"1": "A depressão respiratória iatrogênica causada por excesso de medicamento deve ser revertida; omitir o antídoto configura erro grave.", "2": "Benzodiazepínicos agravam ainda mais a depressão do sistema nervoso central e a parada respiratória.", "3": "Com FR de 6 irpm, há risco iminente de parada respiratória, exigindo ação imediata."}, "passo": 3}, {"id": "t16", "bloco": "b7", "tema": "Escala para múltiplos sintomas", "conceito": "esas-avaliacao", "nivel": 1, "papel": "checagem", "enunciado": "Um paciente oncológico apresenta simultaneamente dor, fadiga, náuseas, ansiedade, dispneia e constipação. Qual ferramenta orienta a avaliação global e a priorização inicial dos sintomas?", "alternativas": ["ESAS-r (Escala de Avaliação de Sintomas de Edmonton).", "Escala de Bristol, voltada apenas para consistência fecal.", "CAM (Confusion Assessment Method), voltada para delirium.", "PHQ-9, utilizada exclusivamente para rastrear depressão."], "correta": 0, "porque": "A ESAS-r pontua de 0 a 10 os principais sintomas físicos e psicológicos (além de um campo extra para constipação), guiando a priorização clínica.", "errados": {"1": "A Escala de Bristol avalia apenas o formato das fezes (tipos 1 a 7).", "2": "O CAM é o instrumento padrão-ouro para diagnosticar delirium, não múltiplos sintomas físicos.", "3": "O PHQ-9 rastreia e gradua especificamente sintomas depressivos."}, "passo": 1}, {"id": "t17", "bloco": "b7", "tema": "Dispneia sem hipoxemia", "conceito": "manejo-dispneia", "nivel": 2, "papel": "checagem", "enunciado": "Um paciente com câncer avançado apresenta dispneia intensa em repouso (ESAS 8/10), mas mantém SpO2 de 93% em ar ambiente. Qual conduta está mais bem indicada?", "alternativas": ["Iniciar morfina em dose baixa (2,5 a 5 mg 4/4h) e ventilador facial.", "Prescrever oxigenoterapia em alto fluxo como única medida eficaz.", "Contraindicar morfina porque saturação acima de 88% impede opioides.", "Reservar morfina apenas se o paciente também relatar dor nota 9."], "correta": 0, "porque": "A dispneia é subjetiva e não depende de hipoxemia. Morfina em baixas doses e ar fresco no rosto são primeira linha mesmo com SpO2 normal, sem aumentar mortalidade.", "errados": {"1": "Sem hipoxemia documentada, o oxigênio suplementar não oferece benefício superior ao ar fresco.", "2": "A morfina é segura e indicada para dispneia refratária independentemente de a SpO2 estar acima de 88%.", "3": "O efeito da morfina sobre a percepção de falta de ar é independente da presença de dor."}, "passo": 2}, {"id": "t18", "bloco": "b7", "tema": "Antiemético por etiologia", "conceito": "manejo-nauseas", "nivel": 2, "papel": "checagem", "enunciado": "Correlacione corretamente o gatilho da náusea com o fármaco de primeira escolha em cuidados paliativos:", "alternativas": ["Opioide -> Haloperidol; Quimioterapia -> Ondansetrona; HIC -> Dexametasona.", "Opioide -> Ondansetrona; Gastroparesia -> Escopolamina; QT -> Meclizina.", "Quimioterapia -> Haloperidol; HIC -> Metoclopramida; Cinetose -> Dexametasona.", "Gastroparesia -> Ondansetrona; Cinetose -> Haloperidol; Opioide -> Meclizina."], "correta": 0, "porque": "Cada gatilho ativa receptores específicos: opioides atuam em D2 na ZGQ (haloperidol), quimioterapia libera serotonina em 5-HT3 (ondansetrona) e HIC responde à redução de edema com dexametasona.", "errados": {"1": "Ondansetrona constipa e não é 1ª escolha para opioide; escopolamina reduz ainda mais a peristalse na gastroparesia.", "2": "Metoclopramida não reduz pressão intracraniana e dexametasona não é primeira escolha para cinetose.", "3": "Gastroparesia precisa de pró-cinético (metoclopramida), e cinetose responde a anti-histamínicos (dimenidrinato/meclizina)."}, "passo": 3}, {"id": "t19", "bloco": "b8", "tema": "Delirium hipoativo e WHHHIMP", "conceito": "manejo-delirium", "nivel": 2, "papel": "checagem", "enunciado": "Qual afirmação sobre o delirium em pacientes sob cuidados paliativos está correta?", "alternativas": ["O subtipo hipoativo é o mais comum e exige CAM e busca de WHHHIMP.", "O delirium ocorre apenas em idosos acima de 80 anos e sempre com agitação.", "Benzodiazepínicos isolados são primeira linha para todo delirium hiperativo.", "Mioclonias e confusão mental nas últimas 48 horas nunca exigem manejo ativo."], "correta": 0, "porque": "O delirium atinge até 80% dos pacientes no fim de vida, sendo o subtipo hipoativo o mais comum e facilmente confundido com tristeza ou sedação. Haloperidol é 1ª linha no hiperativo e midazolam é opção nos quadros refratários.", "errados": {"1": "Delirium pode ocorrer em qualquer adulto gravemente enfermo, e a maioria dos casos é hipoativa (silenciosa).", "2": "Benzodiazepínicos isolados tendem a agravar o delirium, exceto em abstinência ou sedação paliativa refratária.", "3": "Sintomas cognitivos e mioclonias causam grande angústia ao paciente e à família e merecem manejo ativo de conforto."}, "passo": 1}, {"id": "t20", "bloco": "b8", "tema": "Fadiga, caquexia e depressão", "conceito": "ansiedade-depressao", "nivel": 2, "papel": "checagem", "enunciado": "Qual combinação de condutas está alinhada às diretrizes de controle de sintomas em cuidados paliativos?", "alternativas": ["Exercício na fadiga, anedonia na depressão e PS se vômito fecaloide.", "Repouso absoluto na fadiga e depressão definida só por perda de peso.", "Sertralina para efeito em 48 horas em paciente com sobrevida de 2 semanas.", "Observação domiciliar diante de distensão abdominal aguda sem flatos."], "correta": 0, "porque": "Exercício físico adaptado é a 1ª linha de evidência na fadiga; sintomas somáticos confundem a depressão oncológica (valorizar anedonia); vômitos fecaloides e distensão aguda sem flatos são sinais formais de pronto-socorro.", "errados": {"1": "Repouso prolongado piora o descondicionamento e a fadiga, e perda de peso pode ser apenas da caquexia tumoral.", "2": "ISRS como sertralina levam 2 a 4 semanas para efeito pleno; em prognóstico < 4 semanas considera-se metilfenidato.", "3": "Distensão abdominal aguda com parada de eliminação de flatos indica suspeita de oclusão intestinal e exige pronto-socorro."}, "passo": 3}, {"id": "t21", "bloco": "b9", "tema": "Princípios dos cuidados paliativos", "conceito": "principios-cp-etica", "nivel": 1, "papel": "checagem", "enunciado": "Qual afirmação contraria os princípios dos cuidados paliativos segundo a OMS?", "alternativas": ["Prolongar indefinidamente a vida biológica a qualquer custo.", "Aliviar o sofrimento físico, psicológico, social e espiritual.", "Oferecer cuidado integral ao paciente e aos seus familiares.", "Atuar por meio de abordagem multidisciplinar e humanizada."], "correta": 0, "porque": "Prolongar indefinidamente a vida biológica a qualquer custo caracteriza distanásia, prática oposta aos cuidados paliativos.", "errados": {"1": "O alívio multidimensional do sofrimento é o núcleo da definição de cuidados paliativos.", "2": "Paciente e família formam uma unidade de cuidado inseparável.", "3": "A atuação interdisciplinar humanizada é um dos pilares centrais dos cuidados paliativos."}, "passo": 1}, {"id": "t22", "bloco": "b9", "tema": "Espiritualidade sem religião", "conceito": "espiritualidade-aps", "nivel": 1, "papel": "checagem", "enunciado": "Uma paciente com doença avançada, sem vínculo religioso, relata medo intenso da morte e falta de sentido para tanto sofrimento. Qual a conduta inicial mais adequada?", "alternativas": ["Fazer escuta qualificada, explorar valores e articular a equipe.", "Informar que questões de sentido da vida estão fora do escopo médico.", "Encaminhar automaticamente a um líder religioso como conduta padrão.", "Prescrever apenas benzodiazepínico e evitar abordar aspectos subjetivos."], "correta": 0, "porque": "A espiritualidade integra o cuidado paliativo mesmo na ausência de religião; o primeiro passo é escuta qualificada, acolhimento de valores pessoais e suporte da equipe.", "errados": {"1": "O sofrimento existencial integra a dor total e pertence diretamente ao cuidado clínico integral.", "2": "Impor representante religioso a paciente sem vínculo religioso desrespeita a autonomia e a singularidade.", "3": "Medicalizar sem escuta ignora a causa central do sofrimento existencial."}, "passo": 3}, {"id": "t23", "bloco": "b9", "tema": "Papel do médico na equipe", "conceito": "spikes-equipe", "nivel": 2, "papel": "checagem", "enunciado": "Em uma sala de emergência, um paciente com DPOC grave (GOLD 4) e selo de Cuidados Paliativos gera conflito familiar sobre ventilação invasiva. Qual é o papel do médico na equipe interdisciplinar?", "alternativas": ["Liderar comunicação de prognóstico, decidir atos privativos e articular a equipe.", "Delegar ao enfermeiro a conversa de prognóstico e apenas prescrever oxigênio.", "Permitir que o psicólogo decida sozinho as diretivas e apenas assinar depois.", "Submeter a decisão médica privativa a votação simples entre os plantonistas."], "correta": 0, "porque": "No modelo interdisciplinar, o médico assume a responsabilidade pela comunicação de prognóstico e decisões clínicas privativas, integrando as contribuições de toda a equipe.", "errados": {"1": "Comunicar prognóstico médico e definir limites de suporte invasivo não devem ser terceirizados.", "2": "Diretivas antecipadas são expressão do paciente orientadas clinicamente, não decisão unilateral de um membro da equipe.", "3": "Condutas médicas privativas seguem critérios éticos, clínicos e autonomia do paciente, não votação."}, "passo": 4}, {"id": "t24", "bloco": "b10", "tema": "Critério de luto prolongado", "conceito": "luto-cuidador", "nivel": 2, "papel": "checagem", "enunciado": "Qual critério caracteriza o transtorno de luto prolongado (luto complicado) segundo o DSM-5-TR?", "alternativas": ["Sintomas persistentes por mais de 12 meses com prejuízo funcional.", "Saudade intensa por menos de 6 meses sem impacto na rotina diária.", "Choro isolado em datas comemorativas sem interferência nas atividades.", "Alterações transitórias de sono ou apetite no primeiro mês da perda."], "correta": 0, "porque": "O transtorno de luto prolongado exige duração superior a 12 meses (DSM-5-TR) associada a sofrimento persistente e comprometimento funcional.", "errados": {"1": "Saudade intensa nos primeiros meses sem prejuízo funcional faz parte do processo normal de luto.", "2": "Choro episódico sem prejuízo diário não preenche critério de transtorno.", "3": "Alterações transitórias de sono e apetite são manifestações esperadas no luto agudo normal."}, "passo": 1}, {"id": "t25", "bloco": "b10", "tema": "Força ética das DAV", "conceito": "dav-cfm", "nivel": 2, "papel": "checagem", "enunciado": "Um paciente com esclerose múltipla avançada registrou previamente, enquanto capaz, que não desejava intubação orotraqueal em caso de insuficiência respiratória sem perspectiva de reversão. Ao internar inconsciente, um familiar exige a intubação. Qual é a conduta eticamente adequada?", "alternativas": ["Respeitar a DAV, garantir conforto e dialogar com a família.", "Intubar imediatamente para atender a família após perda de lucidez.", "Ignorar a diretiva e decidir sozinho sem conversar com os familiares.", "Acionar o comitê de ética antes de iniciar medidas de conforto clínico."], "correta": 0, "porque": "Pela Resolução CFM nº 1.995/2012, as DAV prevalecem sobre o desejo dos familiares. A equipe deve respeitar a autonomia prévia, controlar sintomas e acolher a angústia familiar por meio do diálogo.", "errados": {"1": "A perda de consciência é justamente o momento para o qual a diretiva antecipada foi criada; a família não a revoga.", "2": "O respeito à DAV deve vir sempre acompanhado de comunicação empática e transparente com os familiares.", "3": "O controle de sintomas de conforto é imediato e nunca deve ser adiado por trâmites burocráticos."}, "passo": 3}], "microtestes": [{"tipo": "vf", "questao": "q11", "alvo": ["Item A"], "conceito": "avaliacao-dor", "bloco": "b1", "enunciado": "A ESAS-r traduz múltiplos sintomas subjetivos (dor, dispneia e fadiga) em notas de 0 a 10 acompanháveis ao longo do tempo.", "resposta": true, "explicacao": "A quantificação seriada de 0 a 10 torna o acompanhamento objetivo no prontuário.", "passo": 4, "id": "m1"}, {"tipo": "vf", "questao": "q11", "alvo": ["Item A"], "conceito": "dor-subjetiva", "bloco": "b1", "enunciado": "A avaliação por escalas padronizadas deve priorizar a percepção referida pelo próprio paciente sempre que a comunicação estiver preservada.", "resposta": true, "explicacao": "O autorrelato é o padrão de referência para sintomas subjetivos como dor, dispneia e fadiga.", "passo": 2, "id": "m2"}, {"tipo": "vf", "questao": "q38", "alvo": ["D"], "conceito": "dor-subjetiva", "bloco": "b1", "enunciado": "Em cuidados paliativos, um paciente sedado que não verbaliza queixas pode estar sentindo dor real.", "resposta": true, "explicacao": "A incapacidade de verbalizar ou a ausência de agitação não excluem dor; a equipe deve avaliar sinais indiretos como gemência e rigidez.", "passo": 2, "id": "m3"}, {"tipo": "multipla", "questao": "q38", "alvo": ["D"], "conceito": "avaliacao-dor", "bloco": "b1", "enunciado": "Qual parâmetro é o mais confiável para definir a intensidade da dor em um paciente lúcido e comunicativo?", "alternativas": ["O relato subjetivo do próprio paciente quantificado em escala", "A frequência cardíaca medida no oxímetro", "A impressão visual do acompanhante", "O tamanho da lesão tumoral na tomografia"], "correta": 0, "explicacao": "O autorrelato do paciente em escalas como EVA ou ESAS é o padrão-ouro para avaliar intensidade dolorosa.", "passo": 4, "id": "m4"}, {"tipo": "vf", "questao": "q39", "alvo": ["C"], "conceito": "dor-nociceptiva", "bloco": "b2", "enunciado": "A dor nociceptiva visceral caracteriza-se por localização imprecisa e difusa, diferentemente da dor somática bem localizada.", "resposta": true, "explicacao": "Órgãos internos são inervados pelo sistema nervoso autônomo, gerando dor difusa e mal delimitada.", "passo": 2, "id": "m5"}, {"tipo": "lacuna", "questao": "q39", "alvo": ["C"], "conceito": "dor-neuropatica", "bloco": "b2", "enunciado": "A sensação dolorosa provocada por um estímulo habitualmente não doloroso, como o toque de uma roupa, chama-se ______.", "resposta": "alodínia", "explicacao": "Alodínia é um marcador semiológico típico da dor neuropática.", "passo": 3, "id": "m6"}, {"tipo": "vf", "questao": "q47", "alvo": ["A"], "conceito": "escada-oms", "bloco": "b2", "enunciado": "A lógica atual da escada analgésica da OMS permite iniciar diretamente no terceiro degrau quando o paciente apresenta dor intensa.", "resposta": true, "explicacao": "A proporcionalidade substituiu a obrigatoriedade de percorrer os degraus anteriores em dores intensas.", "passo": 4, "id": "m7"}, {"tipo": "vf", "questao": "q47", "alvo": ["A"], "conceito": "avaliacao-dor", "bloco": "b1", "enunciado": "Estimar a dor de forma sistemática evita mascarar outros sintomas e reduz a escolha de medicamentos inadequados.", "resposta": true, "explicacao": "Sem avaliação estruturada da dor, o plano terapêutico fica impreciso e aumenta o risco de sofrimento e efeitos adversos.", "passo": 4, "id": "m8"}, {"tipo": "vf", "questao": "q19", "alvo": ["A"], "conceito": "hipodermoclise-farmacos", "bloco": "b3", "enunciado": "Soluções hipertônicas como KCl concentrado e drogas vasoativas não devem ser infundidas por hipodermóclise devido ao risco de necrose tecidual.", "resposta": true, "explicacao": "A vasoconstrição capilar e a alta osmolaridade lesam diretamente o tecido celular subcutâneo.", "passo": 4, "id": "m9"}, {"tipo": "multipla", "questao": "q37", "alvo": ["A"], "conceito": "adjuvantes-neuropatica", "bloco": "b4", "enunciado": "Ao escalonar um paciente que falha com codeína para morfina, o que deve ser feito com a codeína?", "alternativas": ["Suspender a codeína e iniciar apenas a morfina em horário fixo", "Manter a codeína e somar morfina na mesma prescrição", "Dobrar a dose da codeína e manter sem morfina", "Substituir por carbamazepina isolada"], "correta": 0, "explicacao": "Não se associam dois opioides de degraus diferentes; troca-se o opioide fraco pelo opioide forte.", "passo": 2, "id": "m10"}, {"tipo": "vf", "questao": "q37", "alvo": ["A"], "conceito": "dor-neuropatica", "bloco": "b2", "enunciado": "Queimação, formigamento e dor ao vestir uma meia (alodínia) são achados típicos de dor neuropática.", "resposta": true, "explicacao": "A lesão nervosa periférica ou radicular gera sintomas em queimação, parestesia e alodínia.", "passo": 3, "id": "m11"}, {"tipo": "vf", "questao": "q37", "alvo": ["A"], "conceito": "escada-oms", "bloco": "b2", "enunciado": "Quando a dor permanece intensa mesmo com codeína (2º degrau), deve-se escalonar para opioide forte (3º degrau), como a morfina.", "resposta": true, "explicacao": "Na escada analgésica da OMS, dor intensa refratária ao 2º degrau exige transição para o 3º degrau.", "passo": 4, "id": "m12"}, {"tipo": "lacuna", "questao": "q43", "alvo": ["A"], "conceito": "adjuvantes-ossea", "bloco": "b4", "enunciado": "A estrutura fina que reveste o osso e cujo edema explica a dor nas metástases ósseas, responsiva a corticoides, é o ______.", "resposta": "periósteo", "explicacao": "A porção interna do osso não dói; a dor óssea origina-se na distensão e inflamação do periósteo.", "passo": 4, "id": "m13"}, {"tipo": "vf", "questao": "q36", "alvo": ["B"], "conceito": "opioides-fracos", "bloco": "b5", "enunciado": "Entre os opioides fracos, a codeína apresenta maior segurança clínica do que o tramadol.", "resposta": true, "explicacao": "O tramadol carrega risco de síndrome serotoninérgica, metabolismo errático e interação com ondansetrona.", "passo": 1, "id": "m14"}, {"tipo": "lacuna", "questao": "q40", "alvo": ["D"], "conceito": "calculo-resgate-ajuste", "bloco": "b5", "enunciado": "A dose de resgate de morfina oral corresponde à fração de 1/6 a ______ da dose diária total.", "resposta": "1/10", "explicacao": "Usa-se 1/6 para pacientes mais estáveis e 1/10 para idosos ou frágeis.", "passo": 4, "id": "m15"}, {"tipo": "vf", "questao": "q41", "alvo": ["Conduta"], "conceito": "conversao-vias", "bloco": "b6", "enunciado": "Ao converter morfina oral para via subcutânea em paciente com disfagia grave, divide-se a dose diária oral por 3.", "resposta": true, "explicacao": "A via subcutânea é 3 vezes mais potente que a via oral por evitar o metabolismo hepático de primeira passagem.", "passo": 1, "id": "m16"}, {"tipo": "vf", "questao": "q42", "alvo": ["Conduta"], "conceito": "calculo-resgate-ajuste", "bloco": "b5", "enunciado": "Necessidade persistente de mais de 3 doses de resgate por dia indica recalcular a dose basal somando os resgates à dose diária total.", "resposta": true, "explicacao": "Somar os resgates à basal e dividir por 6 estabiliza a concentração plasmática e controla a dor de forma contínua.", "passo": 5, "id": "m17"}, {"tipo": "vf", "questao": "q44", "alvo": ["C"], "conceito": "rotacao-opioides", "bloco": "b6", "enunciado": "Ao converter oxicodona para fentanil transdérmico, o cálculo deve passar primeiro pela equivalência em morfina oral e depois sofrer redução de 25% a 50%.", "resposta": true, "explicacao": "A morfina oral é a referência universal de conversão, e a redução de segurança evita toxicidade por tolerância cruzada incompleta.", "passo": 2, "id": "m18"}, {"tipo": "vf", "questao": "q46", "alvo": ["Itens a e b"], "conceito": "morfina-farmacocinetica", "bloco": "b5", "enunciado": "A morfina de liberação imediata tem meia-vida de 4 horas, exigindo prescrição fixa de 4 em 4 horas.", "resposta": true, "explicacao": "Intervalos maiores como 8/8h ou 12/12h deixam janelas sem analgesia adequada.", "passo": 3, "id": "m19"}, {"tipo": "vf", "questao": "q46", "alvo": ["Itens a e b"], "conceito": "efeitos-adversos-opioides", "bloco": "b6", "enunciado": "A prescrição de laxativo profilático deve acompanhar todo paciente que inicia morfina.", "resposta": true, "explicacao": "Diferente da náusea e da sonolência, a constipação induzida por opioides não desenvolve tolerância.", "passo": 3, "id": "m20"}, {"tipo": "multipla", "questao": "q49", "alvo": ["D"], "conceito": "efeitos-adversos-opioides", "bloco": "b6", "enunciado": "Qual laxativo deve ser EVITADO em pacientes paliativos com disfagia pelo risco de pneumonia química grave?", "alternativas": ["Óleo mineral", "Macrogol (PEG)", "Lactulose", "Bisacodil"], "correta": 0, "explicacao": "O óleo mineral é derivado de petróleo; se aspirado por paciente com disfagia, provoca pneumonia química/lipoídica potencialmente fatal.", "passo": 3, "id": "m21"}, {"tipo": "vf", "questao": "q8", "alvo": ["C"], "conceito": "esas-avaliacao", "bloco": "b7", "enunciado": "A utilização de escalas padronizadas como a ESAS evita que a avaliação exclusiva do profissional subestime o sofrimento subjetivo do paciente.", "resposta": true, "explicacao": "A percepção do próprio paciente registrada na escala é o guia mais fiel da intensidade sintomática.", "passo": 1, "id": "m22"}, {"tipo": "vf", "questao": "q9", "alvo": ["C"], "conceito": "esas-avaliacao", "bloco": "b7", "enunciado": "A Escala de Zarit (ZBI) avalia a sobrecarga do cuidador informal, complementando a avaliação multidimensional em cuidados paliativos.", "resposta": true, "explicacao": "A ZBI aborda a dimensão social/familiar, enquanto a ESAS-r foca nos sintomas do paciente.", "passo": 1, "id": "m23"}, {"tipo": "multipla", "questao": "q14", "alvo": ["B"], "conceito": "manejo-nauseas", "bloco": "b7", "enunciado": "Qual receptor-alvo na zona gatilho quimiorreceptora explica a ação do haloperidol na náusea induzida por opioides?", "alternativas": ["Receptor dopaminérgico D2", "Receptor serotoninérgico 5-HT3", "Receptor histamínico H1", "Receptor muscarínico M1"], "correta": 0, "explicacao": "Opioides e causas metabólicas estimulam receptores D2 na zona gatilho quimiorreceptora, bloqueados com alta potência pelo haloperidol.", "passo": 3, "id": "m24"}, {"tipo": "vf", "questao": "q15", "alvo": ["C"], "conceito": "manejo-dispneia", "bloco": "b7", "enunciado": "Em pacientes dispneicos sem hipoxemia documentada, o ar fresco de um ventilador facial tem eficácia semelhante ou superior ao oxigênio suplementar.", "resposta": true, "explicacao": "A sensação de fluxo de ar fresco na face reduz diretamente a percepção central de falta de ar.", "passo": 2, "id": "m25"}, {"tipo": "vf", "questao": "q16", "alvo": ["A"], "conceito": "sinais-alarme-ps", "bloco": "b8", "enunciado": "Distensão abdominal aguda, ausência de flatos e vômitos fecaloides indicam suspeita de oclusão intestinal e exigem encaminhamento imediato ao pronto-socorro.", "resposta": true, "explicacao": "Esses achados configuram urgência abdominal e constam na lista formal de sinais de alarme dos slides.", "passo": 4, "id": "m26"}, {"tipo": "vf", "questao": "q16", "alvo": ["A"], "conceito": "manejo-constipacao", "bloco": "b7", "enunciado": "Na avaliação domiciliar da constipação sem sinais de oclusão, o toque retal é obrigatório quando há suspeita de fecaloma.", "resposta": true, "explicacao": "O toque retal diferencia fecaloma (tratável com enema/desimpactação) de ampola vazia com obstrução alta.", "passo": 4, "id": "m27"}, {"tipo": "vf", "questao": "q17", "alvo": ["D"], "conceito": "manejo-dispneia", "bloco": "b7", "enunciado": "O uso de ventilador de rosto (ar fresco direcionado à face) é medida não farmacológica eficaz para alívio da dispneia em cuidados paliativos.", "resposta": true, "explicacao": "O estímulo de ar fresco sobre os ramos sensitivos faciais reduz a sensação subjetiva de falta de ar.", "passo": 2, "id": "m28"}, {"tipo": "vf", "questao": "q21", "alvo": ["D"], "conceito": "manejo-nauseas", "bloco": "b7", "enunciado": "A náusea e os vômitos induzidos por quimioterapia têm como principal via os receptores serotoninérgicos 5-HT3, respondendo à ondansetrona.", "resposta": true, "explicacao": "Antagonistas 5-HT3 (como a ondansetrona) são primeira escolha na êmese associada a quimioterapia e radioterapia.", "passo": 3, "id": "m29"}, {"tipo": "vf", "questao": "q22", "alvo": ["Item B"], "conceito": "manejo-dispneia", "bloco": "b7", "enunciado": "Morfina 2,5 a 5 mg VO/SC a cada 4 horas e cabeceira elevada compõem o manejo de primeira linha da dispneia em cuidados paliativos.", "resposta": true, "explicacao": "A combinação de medidas ambientais com opioide em dose baixa controla a percepção de falta de ar.", "passo": 2, "id": "m30"}, {"tipo": "vf", "questao": "q22", "alvo": ["Item B"], "conceito": "escada-oms", "bloco": "b2", "enunciado": "O manejo da dor crônica combina analgésicos em horário fixo com medidas multimodais como fisioterapia adaptada.", "resposta": true, "explicacao": "Controlar a dor física viabiliza intervenções não farmacológicas que melhoram conforto e rigidez.", "passo": 5, "id": "m31"}, {"tipo": "vf", "questao": "q24", "alvo": ["C"], "conceito": "manejo-nauseas", "bloco": "b7", "enunciado": "Dexametasona é o fármaco de escolha para náuseas causadas por hipertensão intracraniana, enquanto meclizina ou dimenidrinato atuam na cinetose vestibular.", "resposta": true, "explicacao": "A dexametasona reduz o edema cerebral, e os anti-histamínicos bloqueiam receptores H1 vestibulares.", "passo": 3, "id": "m32"}, {"tipo": "lacuna", "questao": "q35", "alvo": ["A"], "conceito": "manejo-delirium", "bloco": "b8", "enunciado": "O instrumento padrão-ouro utilizado para o diagnóstico sistemático de delirium em cuidados paliativos é o ______.", "resposta": "CAM", "explicacao": "O Confusion Assessment Method (CAM) avalia início agudo, curso flutuante, inatenção, pensamento desorganizado e nível de consciência.", "passo": 1, "id": "m33"}, {"tipo": "vf", "questao": "q2", "alvo": ["B"], "conceito": "principios-cp-etica", "bloco": "b9", "enunciado": "Prolongar indefinidamente a vida biológica a qualquer custo (distanásia) é contrário aos princípios dos cuidados paliativos.", "resposta": true, "explicacao": "Os cuidados paliativos priorizam qualidade de vida, dignidade e alívio do sofrimento, rejeitando a obstinação terapêutica.", "passo": 1, "id": "m34"}, {"tipo": "vf", "questao": "q4", "alvo": ["C"], "conceito": "espiritualidade-aps", "bloco": "b9", "enunciado": "Na Estratégia Saúde da Família (APS domiciliar), reconhecer a dimensão espiritual faz parte da integralidade do cuidado paliativo.", "resposta": true, "explicacao": "A abordagem da espiritualidade não é exclusiva da alta complexidade e integra o cuidado longitudinal na APS.", "passo": 3, "id": "m35"}, {"tipo": "vf", "questao": "q12", "alvo": ["D"], "conceito": "spikes-equipe", "bloco": "b9", "enunciado": "No protocolo SPIKES, a etapa P (Perception) consiste em investigar o que o paciente já sabe sobre o diagnóstico antes de passar novas informações.", "resposta": true, "explicacao": "Ouvir a percepção prévia evita choques bruscos e ajusta a linguagem ao entendimento real do paciente.", "passo": 4, "id": "m36"}, {"tipo": "vf", "questao": "q26", "alvo": ["B"], "conceito": "luto-cuidador", "bloco": "b10", "enunciado": "No DSM-5-TR, o transtorno de luto prolongado exige persistência dos sintomas por mais de 12 meses com prejuízo funcional.", "resposta": true, "explicacao": "Duração superior a 12 meses associada a impacto funcional diferencia o luto complicado da reação normal de luto.", "passo": 1, "id": "m37"}, {"tipo": "vf", "questao": "q29", "alvo": ["B"], "conceito": "spikes-equipe", "bloco": "b9", "enunciado": "O trabalho interdisciplinar não elimina a responsabilidade do médico de liderar a comunicação de prognóstico e decidir atos privativos.", "resposta": true, "explicacao": "A liderança médica nos atos privativos caminha junto com a articulação empática de enfermagem, psicologia e demais áreas.", "passo": 4, "id": "m38"}, {"tipo": "vf", "questao": "q31", "alvo": ["Item C"], "conceito": "dav-cfm", "bloco": "b10", "enunciado": "O registro das Diretivas Antecipadas de Vontade no prontuário médico tem validade ética sem exigir obrigatoriamente escritura em cartório.", "resposta": true, "explicacao": "A Resolução CFM nº 1.995/2012 estabelece o registro no prontuário como instrumento ético plenamente válido.", "passo": 3, "id": "m39"}, {"tipo": "lacuna", "questao": "q32", "alvo": ["D"], "conceito": "dav-cfm", "bloco": "b10", "enunciado": "A Resolução do Conselho Federal de Medicina que regulamenta as Diretivas Antecipadas de Vontade no Brasil é a Resolução CFM nº ______.", "resposta": "1.995/2012", "explicacao": "A Resolução CFM nº 1.995/2012 assegura o registro em prontuário e a prevalência da vontade do paciente sobre o desejo familiar.", "passo": 3, "id": "m40"}], "questoes": [{"id": "q11", "capitulo": "c1", "ref": "Banco da disciplina, Q11 (Dissertativa - Caso George)", "enunciado": "Caso George: paciente com doença neurológica avançada dependente para alimentação, higiene e movimentação. Principais sintomas relatados: dispneia, dor muscular com espasticidade e fadiga.\nPergunta A: Como avaliar esses sintomas de maneira prática para traduzir sensações subjetivas como dispneia, dor e fadiga em um dado objetivo? Qual instrumento você utilizaria?", "itens": null, "tabela": null, "resposta_esperada": "**1. Instrumento de escolha:** Escala de Avaliação de Sintomas de Edmonton (ESAS-r), graduada de 0 a 10 para cada sintoma (dor, cansaço/fadiga, falta de ar, sonolência, náusea, apetite, depressão, ansiedade e bem-estar), podendo complementar a dor com a EVA ou escala de faces.\n**2. Aplicação prática:** Solicitar ao próprio paciente (ou cuidador, se incapacitado) que atribua nota de 0 (ausência) a 10 (pior intensidade possível) de forma seriada.\n**3. Utilidade clínica:** Permite transformar percepções subjetivas em escores comparáveis no prontuário, priorizar os sintomas mais intensos e monitorar a resposta ao tratamento.", "comentario": "1. Nomeie diretamente o instrumento padrão de múltiplos sintomas em CP: ESAS-r (0 a 10), citando EVA como complemento para dor.\n2. Explique a função prática: quantificar percepções subjetivas de forma seriada para priorizar e reavaliar condutas.", "figuras": [], "alvos": {"Item A": ["avaliacao-dor", "dor-subjetiva"]}}, {"id": "q38", "capitulo": "c1", "ref": "Banco da disciplina, Q38", "enunciado": "Sobre a avaliação e validação da dor em pacientes sob cuidados paliativos, assinale a alternativa correta:", "itens": null, "tabela": null, "resposta_esperada": "**Resposta correta: Alternativa D.** A dor é subjetiva e pode existir sem expressão comportamental evidente, sobretudo em pacientes sedados, confusos ou afásicos.\n**Por que A está errada:** Pacientes com dor crônica intensa podem apresentar postura calma ou fácies neutra.\n**Por que B está errada:** Sinais vitais podem permanecer normais na dor crônica e não determinam a necessidade de opioide.\n**Por que C está errada:** A falta de queixa verbal pode refletir sedação, confusão ou limitação comunicativa, não ausência de dor.", "comentario": "1. Lembre que a dor é experiência subjetiva sem marcador laboratorial ou comportamental obrigatório.\n2. Em cuidados paliativos, pacientes sedados ou sem fala exigem busca ativa de sinais sutis de sofrimento.", "figuras": [], "alvos": {"D": ["dor-subjetiva", "avaliacao-dor"]}, "objetiva": {"alts": ["A dor sempre exige expressão facial intensa para ser validada clinicamente.", "A dor só justifica uso contínuo de opioides quando há alteração de pressão arterial.", "Todo paciente sem queixa verbal espontânea está livre de dor.", "A dor não precisa de manifestação comportamental visível para ser real; em cuidados paliativos, a ausência de queixa não significa ausência de dor, especialmente em pacientes sedados ou com dificuldade de comunicação."], "correta": 3}}, {"id": "q39", "capitulo": "c1", "ref": "Banco da disciplina, Q39", "enunciado": "Paciente de 58 anos com câncer de pâncreas metastático relata dor no epigástrio, sem alodínia ou hiperalgesia. Qual é a classificação fisiopatológica mais provável dessa dor?", "itens": null, "tabela": null, "resposta_esperada": "**Resposta correta: Alternativa C.** A dor origina-se de um órgão interno (pâncreas), projeta-se de forma difusa no epigástrio e não apresenta sinais neuropáticos como alodínia ou hiperalgesia.\n**Por que A está errada:** Não há evidência clínica de lesão do sistema nervoso central nem de componente neuropático.\n**Por que B está errada:** A ausência de queimação, choque, alodínia e hiperalgesia afasta dor neuropática periférica.\n**Por que D está errada:** A dor somática profunda envolve ossos, músculos ou tendões e costuma ser bem localizada.", "comentario": "1. Identifique a estrutura acometida: pâncreas é uma víscera abdominal.\n2. Verifique o exame sensitivo: sem alodínia ou hiperalgesia, descarta-se o componente neuropático.", "figuras": [], "alvos": {"C": ["dor-nociceptiva", "dor-neuropatica"]}, "objetiva": {"alts": ["Dor mista com componente central.", "Dor neuropática periférica.", "Dor nociceptiva visceral.", "Dor nociceptiva somática profunda."], "correta": 2}}, {"id": "q47", "capitulo": "c1", "ref": "Banco da disciplina, Q47", "enunciado": "Sobre o controle da dor em pacientes paliativos, analise as asserções:\nI. Ao atender um paciente com quadro de dor, deve-se estimar a dor utilizando a escada analgésica da dor para a escolha do medicamento de acordo com a necessidade,\nPORQUE\nII. Um paciente com a dor mal conduzida mascara demais sintomas, tira tempo de qualidade de vida do paciente e o uso de um medicamento inadequado pode fazer surgir mais efeitos adversos que o desejado.", "itens": null, "tabela": null, "resposta_esperada": "**Resposta correta: Alternativa A.** Ambas as proposições são verdadeiras e a segunda explica exatamente o motivo clínico pelo qual a escolha proporcional pela escada analgésica é indispensável.\n**Por que B está errada:** Existe relação direta de causa e finalidade entre evitar sofrimento/efeitos adversos e escolher o fármaco de modo proporcional.\n**Por que C está errada:** A asserção II é verdadeira, pois dor mal controlada compromete toda a avaliação clínica e a qualidade de vida.\n**Por que D está errada:** A asserção I é verdadeira ao defender a avaliação da dor guiada pela escada analgésica.", "comentario": "1. Avalie cada afirmação isoladamente: ambas descrevem princípios centrais do manejo da dor.\n2. Teste a conexão com \"porque\": escolhemos o degrau proporcional justamente para controlar a dor sem toxicidade desnecessária.", "figuras": [], "alvos": {"A": ["escada-oms", "avaliacao-dor"]}, "objetiva": {"alts": ["As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.", "As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.", "A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.", "A asserção I é uma proposição falsa, e a II é uma proposição verdadeira."], "correta": 0}}, {"id": "q19", "capitulo": "c2", "ref": "Banco da disciplina, Q19", "enunciado": "A hipodermóclise é uma opção fundamental em cuidados paliativos, poupa veias para procedimentos imperativos e é facilmente realizada em domicílio. Abaixo temos opções de drogas que podemos realizar por essa via, EXCETO:", "itens": null, "tabela": null, "resposta_esperada": "**Resposta correta: Alternativa A.** O cloreto de potássio (KCl) concentrado é uma solução hipertônica irritante e formalmente proibido na hipodermóclise pelo risco de necrose tecidual e arritmias graves.\n**Por que B está errada:** Morfina é um dos principais fármacos utilizados por hipodermóclise em cuidados paliativos.\n**Por que C está errada:** Metoclopramida pode ser administrada com segurança pela via subcutânea.\n**Por que D está errada:** Ceftriaxona é um antibiótico compatível com a hipodermóclise.", "comentario": "1. Lembre os quatro grupos proibidos na via subcutânea: KCl concentrado, vasoativas, nutrição parenteral e quimioterápicos.\n2. Atenção à palavra EXCETO no enunciado: procure a substância hipertônica/irritante.", "figuras": [], "alvos": {"A": ["hipodermoclise-farmacos"]}, "objetiva": {"alts": ["KCl concentrado.", "Morfina.", "Metoclopramida.", "Ceftriaxona."], "correta": 0}}, {"id": "q37", "capitulo": "c2", "ref": "Banco da disciplina, Q37 / Q48", "enunciado": "Um paciente com quadro de dor crônica por tumor de próstata metastático em coluna queixa-se de dor na perna direita em queimação, formigamento e desconforto ao toque que impede até de vestir uma meia (alodínia). Está em uso de codeína há 2 semanas, além de dipirona, mas mantém dor de alta intensidade. Qual opção melhor explica o quadro e indica os medicamentos que devem ser prescritos?", "itens": null, "tabela": null, "resposta_esperada": "**Resposta correta: Alternativa A.** Queimação, formigamento e alodínia (não tolerar vestir meia) caracterizam dor neuropática. Como a dor permanece intensa apesar de codeína (2º degrau), troca-se a codeína por morfina (3º degrau) e associa-se o adjuvante específico pregabalina.\n**Por que B está errada:** O quadro não é visceral, e dobrar opioide fraco em dor intensa não resolve o mecanismo neuropático.\n**Por que C está errada:** Não é dor muscular, e nunca se associa opioide fraco com opioide forte simultaneamente.\n**Por que D está errada:** Nunca se mantém codeína ao iniciar morfina (redundância sem ganho analgésico e mais toxicidade).", "comentario": "1. Reconheça o mecanismo pela semiologia: queimação + formigamento + alodínia = dor neuropática.\n2. Dor intensa refratária a codeína exige subir para morfina (trocando a codeína, nunca mantendo as duas).\n3. Adicione o adjuvante de primeira linha para dor neuropática periférica: pregabalina.", "figuras": [], "alvos": {"A": ["adjuvantes-neuropatica", "dor-neuropatica", "escada-oms"]}, "objetiva": {"alts": ["Dor neuropática: trocar codeína por morfina e associar com pregabalina.", "Dor visceral: dobrar a dose da codeína e associar paracetamol e anti-inflamatório.", "Dor muscular: iniciar morfina e dobrar a dose da codeína.", "Dor neuropática: iniciar morfina, mantendo a codeína, e associar com prednisona."], "correta": 0}}, {"id": "q43", "capitulo": "c2", "ref": "Banco da disciplina, Q43", "enunciado": "Helena, de 45 anos, com mieloma múltiplo e lesões osteolíticas, apresenta dor difusa em ossos longos, intensidade 6/10, contínua. Refere alívio parcial com dipirona 1 g de 6/6h. Qual adjuvante seria mais indicado para otimizar o controle álgico, considerando a fisiopatologia?", "itens": null, "tabela": null, "resposta_esperada": "**Resposta correta: Alternativa A.** O mieloma múltiplo cursa com lesões osteolíticas mediadas por osteoclastos; o bisfosfonato ácido zoledrônico (4 mg IV a cada 4 semanas) é o adjuvante direcionado à fisiopatologia óssea, reduzindo dor e risco de fraturas.\n**Por que B está errada:** Amitriptilina é adjuvante voltado à dor neuropática e modulação central, não à osteólise.\n**Por que C está errada:** Gabapentina atua em dor neuropática, e o caso descreve dor óssea osteolítica pura.\n**Por que D está errada:** Morfina é analgésico opioide primário (não adjuvante) e 10 mg/dia isolado não ataca a fisiopatologia osteolítica.", "comentario": "1. Leia o comando com atenção: a pergunta pede um ADJUVANTE baseado na FISIOPATOLOGIA.\n2. Mieloma múltiplo + lesões osteolíticas = dor óssea por reabsorção -> bisfosfonato (ácido zoledrônico).", "figuras": [], "alvos": {"A": ["adjuvantes-ossea"]}, "objetiva": {"alts": ["Ácido Zoledrônico 4 mg IV a cada 4 semanas.", "Amitriptilina 25 mg/dia.", "Gabapentina 300 mg/dia.", "Morfina 10 mg/dia."], "correta": 0}}, {"id": "q36", "capitulo": "c3", "ref": "Banco da disciplina, Q36", "enunciado": "Em controle sintomático paliativo, por que não se deve associar tramadol e ondansetrona simultaneamente?", "itens": null, "tabela": null, "resposta_esperada": "**Resposta correta: Alternativa B.** A ondansetrona é antagonista serotoninérgico 5-HT3 e reduz a ação analgésica do tramadol, que depende parcialmente da via serotoninérgica.\n**Por que A está errada:** Hipotensão grave não é a interação característica dessa dupla.\n**Por que C está errada:** Não há supressão medular cumulativa descrita para essa associação.\n**Por que D está errada:** O motivo específico que contraindica a combinação no controle álgico é a perda de eficácia analgésica do tramadol.", "comentario": "1. Associe tramadol à via serotoninérgica.\n2. Lembre que ondansetrona bloqueia receptor 5-HT3 e corta parte da analgesia do tramadol.", "figuras": [], "alvos": {"B": ["opioides-fracos"]}, "objetiva": {"alts": ["Risco de hipotensão grave.", "Ondansetrona diminui a eficácia analgésica do tramadol.", "Supressão medular cumulativa.", "Prolongamento QT isolado."], "correta": 1}}, {"id": "q40", "capitulo": "c3", "ref": "Banco da disciplina, Q40", "enunciado": "Para um paciente em uso regular de morfina oral que necessita de prescrição de dose de resgate para crises de dor incidental, qual é o fármaco de escolha?", "itens": null, "tabela": null, "resposta_esperada": "**Resposta correta: Alternativa D.** A dose de resgate exige início rápido de ação (pico em 1 hora), o que só é alcançado com morfina de liberação imediata.\n**Por que A e B estão erradas:** Formulações de liberação prolongada demoram horas para atingir pico e não servem para dor em crise.\n**Por que C está errada:** A metadona tem meia-vida longa e imprevisível (5 a 72 horas), oferecendo alto risco de acúmulo em resgates.", "comentario": "1. Palavra-chave do enunciado: RESGATE.\n2. Resgate = sempre morfina de LIBERAÇÃO IMEDIATA (nunca prolongada nem metadona).", "figuras": [], "alvos": {"D": ["calculo-resgate-ajuste"]}, "objetiva": {"alts": ["Morfina de liberação prolongada 20 mg.", "Morfina de liberação prolongada 10 mg.", "Metadona 20 mg.", "Morfina de liberação imediata 20 mg."], "correta": 3}}, {"id": "q41", "capitulo": "c3", "ref": "Banco da disciplina, Q41 (Dissertativa - Troca de via)", "enunciado": "Paciente acamado com dor caracterizada por gemência evolui para disfagia grave enquanto fazia uso de morfina comprimidos de 30 mg de liberação prolongada (12/12h, total 60 mg/dia VO). Qual é a melhor escolha de via e como calcular a nova dose?", "itens": null, "tabela": null, "resposta_esperada": "**1. Via de escolha:** Migrar para via subcutânea (hipodermóclise) ou alternativa transdérmica (fentanil), evitando triturar comprimidos de liberação prolongada.\n**2. Cálculo pela Regra do 3 (VO para SC):** Dividir a dose diária oral por 3 -> 60 mg/dia VO / 3 = **20 mg/dia por via subcutânea** (em bomba de infusão contínua em 24h ou cerca de 3 a 3,5 mg SC de 4/4h).\n**3. Resgate e segurança:** Prescrever resgate subcutâneo (1/6 a 1/10 da DDT SC, cerca de 2 a 3 mg SC) e manter laxativo profilático compatível.", "comentario": "1. Nunca esmague comprimido de liberação prolongada (risco de liberação maciça e intoxicação).\n2. Com disfagia grave, escolha hipodermóclise e divida a dose diária oral por 3.", "figuras": [], "alvos": {"Conduta": ["conversao-vias"]}}, {"id": "q42", "capitulo": "c3", "ref": "Banco da disciplina, Q42 (Dissertativa - Ajuste por resgates)", "enunciado": "Um paciente em uso de morfina de liberação imediata de horário solicitou 5 doses de resgate nas últimas 24 horas de forma persistente. Qual é a melhor conduta para ajustar o esquema analgésico?", "itens": null, "tabela": null, "resposta_esperada": "**1. Conferência prévia:** Confirmar se o paciente está tomando a morfina no intervalo correto de 4 em 4 horas e com boa adesão.\n**2. Recálculo da dose basal:** Como houve mais de 3 resgates/dia persistentes, somar a dose diária basal atual + o total de miligramas dos 5 resgates utilizados em 24h para obter a nova Dose Diária Total (DDT).\n**3. Nova posologia e novo resgate:** Dividir a nova DDT por 6 (prescrição de 4/4h) e recalcular a nova dose de resgate (1/6 a 1/10 da nova DDT em liberação imediata).", "comentario": "1. Regra do gatilho: mais de 3 resgates/dia persistentes indica dose basal insuficiente.\n2. Passo a passo: checar 4/4h -> somar basal + resgates -> dividir por 6 -> recalcular resgate.", "figuras": [], "alvos": {"Conduta": ["calculo-resgate-ajuste"]}}, {"id": "q44", "capitulo": "c3", "ref": "Banco da disciplina, Q44", "enunciado": "Em relação à rotação de opioides em cuidados paliativos, assinale a afirmação correta:", "itens": null, "tabela": null, "resposta_esperada": "**Resposta correta: Alternativa C.** Como os diferentes opioides não compartilham 100% da mesma afinidade e tolerância nos receptores (tolerância cruzada incompleta), reduz-se 25% a 50% da dose equipotente calculada para prevenir superdosagem.\n**Por que A está errada:** A rotação é conduta técnica para falha analgésica com dose otimizada ou toxicidade intolerável.\n**Por que B está errada:** Aumentar a dose na troca provocaria risco elevado de depressão respiratória.\n**Por que D está errada:** A conversão sempre passa pela tabela de equivalência em morfina oral.", "comentario": "1. Identifique o mecanismo de segurança da rotação: tolerância cruzada incompleta.\n2. Memorize a faixa obrigatória de redução: 25% a 50%.", "figuras": [], "alvos": {"C": ["rotacao-opioides"]}, "objetiva": {"alts": ["A rotação é indicada apenas quando o paciente deseja trocar a cor do comprimido.", "Deve-se sempre iniciar o novo opioide com 150% da dose equipotente calculada.", "Na rotação, a dose equipotente do novo opioide deve ser reduzida em 25% a 50%, devido à tolerância cruzada incompleta entre opioides específicos.", "A rotação dispensa cálculo de equivalência em morfina oral."], "correta": 2}}, {"id": "q46", "capitulo": "c3", "ref": "Banco da disciplina, Q46 (Dissertativa - Escalonamento)", "enunciado": "Diante de um paciente com dor oncológica intensa que necessita escalonar para morfina de liberação imediata:\na) Qual cuidado imediato obrigatório deve acompanhar a prescrição da morfina?\nb) Qual a dose mínima inicial e o intervalo posológico padrão para prescrever a morfina de liberação imediata?", "itens": null, "tabela": null, "resposta_esperada": "**1. Cuidado imediato obrigatório (item a):** Prescrever laxativo profilático (osmótico como macrogol ou lactulose associado a estimulante como bisacodil ou sene) desde o primeiro dia, pois a constipação não desenvolve tolerância; orientar também antiemético de resgate (haloperidol) se náuseas iniciais.\n**2. Dose mínima inicial e intervalo (item b):** Iniciar com **2,5 mg a 5 mg VO** (especialmente em idosos, frágeis ou caquéticos, seguindo a regra \"start slow, go slow, but go\") no intervalo posológico fixo **de 4 em 4 horas**, deixando dose de resgate de 1/6 a 1/10.", "comentario": "1. Item a: aplique o mantra \"a mão que prescreve opioide é a que prescreve laxante\".\n2. Item b: morfina de liberação imediata = 2,5 a 5 mg (frágeis/início) de 4 em 4 horas fixo.", "figuras": [], "alvos": {"Itens a e b": ["efeitos-adversos-opioides", "morfina-farmacocinetica"]}}, {"id": "q49", "capitulo": "c3", "ref": "Banco da disciplina, Q49", "enunciado": "Ao optar pela prescrição de morfina para um paciente com dor crônica oncológica intensa, qual cuidado imediato o médico deve ter?", "itens": null, "tabela": null, "resposta_esperada": "**Resposta correta: Alternativa D.** A constipação é o efeito adverso mais prevalente dos opioides e o único que não desenvolve tolerância, exigindo laxativo profilático desde o primeiro dia.\n**Por que A está errada:** Morfina não tem taquicardia como efeito adverso principal.\n**Por que B está errada:** Depressão respiratória é rara e dose-dependente quando a titulação é feita corretamente.\n**Por que C está errada:** Prurido por liberação histamínica pode ocorrer, mas não justifica profilaxia obrigatória contra anafilaxia.", "comentario": "1. Aplique o mantra da disciplina: a mão que prescreve opioide é a que prescreve laxante.\n2. Lembre que náusea e sonolência podem gerar tolerância, mas constipação não gera tolerância.", "figuras": [], "alvos": {"D": ["efeitos-adversos-opioides"]}, "objetiva": {"alts": ["Solicitar a compra de um oxímetro para avaliar a frequência cardíaca, pelo risco de taquicardia.", "Solicitar enfermagem 12h noturna pelo risco de parada respiratória aguda.", "Prescrever anti-histamínico, pelo risco de reação anafilática.", "Prescrever laxativo, pois a constipação é o principal efeito adverso dos opioides."], "correta": 3}}, {"id": "q8", "capitulo": "c4", "ref": "Banco da disciplina, Q8", "enunciado": "Em paciente oncológico com múltiplos sintomas (dor, fadiga, náuseas, ansiedade, dispneia e constipação), qual ferramenta guia a ordem de avaliação e priorização paliativa conforme princípios de controle sintomático?", "itens": null, "tabela": null, "resposta_esperada": "**Resposta correta: Alternativa C.** A ESAS (Edmonton Symptom Assessment System) avalia simultaneamente os principais sintomas físicos e emocionais de 0 a 10, permitindo priorizar o sofrimento mais intenso.\n**Por que A está errada:** Avalia apenas consistência fecal.\n**Por que B está errada:** Ferramenta específica para diagnóstico de delirium.\n**Por que D está errada:** Instrumento específico de triagem e gravidade da depressão.", "comentario": "1. Veja a lista de múltiplos sintomas diferentes no enunciado.\n2. A única escala multidimensional de sintomas gerais entre as alternativas é a ESAS.", "figuras": [], "alvos": {"C": ["esas-avaliacao"]}, "objetiva": {"alts": ["Escala de Bristol.", "CAM.", "ESAS.", "PHQ-9."], "correta": 2}}, {"id": "q9", "capitulo": "c4", "ref": "Banco da disciplina, Q9", "enunciado": "Analise as duas afirmações a seguir sobre a avaliação de pacientes em Cuidados Paliativos:\nI. A utilização de escalas de avaliação padronizadas é fundamental para a compreensão aprofundada e o manejo eficaz dos múltiplos sintomas e necessidades do paciente em Cuidados Paliativos.\nPORQUE\nII. A Escala de Avaliação de Carga do Cuidador de Zarit (ZBI) é uma das ferramentas recomendadas para identificar a sobrecarga do cuidador informal, um aspecto crucial da abordagem social.", "itens": null, "tabela": null, "resposta_esperada": "**Resposta correta: Alternativa C.** Ambas são verdadeiras: escalas padronizadas são fundamentais na avaliação paliativa e a ZBI avalia a sobrecarga do cuidador informal. Porém, a II traz apenas um exemplo específico da dimensão social e não explica o porquê da afirmação geral I.\n**Por que A e B estão erradas:** Nenhuma das afirmações é falsa.\n**Por que D está errada:** Não há relação causal direta entre medir sobrecarga do cuidador e a justificativa geral para usar escalas de múltiplos sintomas do paciente.", "comentario": "1. Confira se I e II são verdadeiras isoladamente (ambas são corretas).\n2. Teste o conectivo PORQUE: a ZBI é um exemplo específico (cuidador), não a causa geral de se usar escalas nos sintomas do paciente.", "figuras": [], "alvos": {"C": ["esas-avaliacao"]}, "objetiva": {"alts": ["A afirmação I é verdadeira e a II é falsa.", "A afirmação II é verdadeira e a I é falsa.", "Ambas as afirmações são verdadeiras, mas a II não justifica a I.", "Ambas as afirmações são verdadeiras, e a II justifica a I."], "correta": 2}}, {"id": "q14", "capitulo": "c4", "ref": "Banco da disciplina, Q14", "enunciado": "Mulher de 59 anos, com carcinoma gástrico metastático em cuidados paliativos domiciliares, refere náuseas intensas (ESAS 8/10) após início de morfina para dor abdominal refratária, associadas a fadiga (7/10) e anorexia (6/10). Exame físico: desidratada leve, abdome sem distensão e sem sinais de obstrução. Qual o fármaco inicial mais indicado neste caso?", "itens": null, "tabela": null, "resposta_esperada": "**Resposta correta: Alternativa B.** A náusea foi desencadeada pelo início da morfina (estímulo de receptores D2 na zona gatilho quimiorreceptora), cenário em que o haloperidol em baixa dose (0,5 a 2 mg VO/SC) é o fármaco inicial mais indicado.\n**Por que A está errada:** Metoclopramida é primeira linha principalmente para gastroparesia/estase gástrica.\n**Por que C está errada:** Domperidona tem menor penetração central e não supera o haloperidol na náusea por opioide.\n**Por que D está errada:** Ondansetrona é escolha em quimioterapia/radioterapia e piora a constipação induzida pela morfina.", "comentario": "1. Identifique o gatilho temporal: náusea intensa logo após início da MORFINA.\n2. Opioide -> Zona gatilho quimiorreceptora (receptor D2) -> Haloperidol.", "figuras": [], "alvos": {"B": ["manejo-nauseas"]}, "objetiva": {"alts": ["Metoclopramida 10 mg VO 8/8h.", "Haloperidol 1 mg VO 12/12h.", "Domperidona 10 mg VO 8/8h.", "Ondansetrona 8 mg VO 8/8h."], "correta": 1}}, {"id": "q15", "capitulo": "c4", "ref": "Banco da disciplina, Q15", "enunciado": "Entre as medidas abaixo para o manejo inicial não farmacológico da dispneia em paciente paliativo sem hipoxemia documentada, qual é classicamente recomendada por sua eficácia e simplicidade?", "itens": null, "tabela": null, "resposta_esperada": "**Resposta correta: Alternativa C.** O ventilador de rosto (ar fresco sobre a face) estimula receptores sensitivos faciais e reduz a sensação subjetiva de dispneia, sendo medida não farmacológica de primeira linha.\n**Por que A e B estão erradas:** Sem hipoxemia documentada, oxigênio em alto fluxo ou VNI não superam medidas de conforto simples.\n**Por que D está errada:** Morfina IV contínua em dose alta sem titulação inicial oferece risco desnecessário.", "comentario": "1. Lembre o slide de manejo não farmacológico da dispneia: ventilador facial + cabeceira elevada.\n2. Oxigênio só entra se houver hipoxemia documentada.", "figuras": [], "alvos": {"C": ["manejo-dispneia"]}, "objetiva": {"alts": ["Ventilação mecânica não invasiva obrigatória.", "Oxigenoterapia em alto fluxo.", "Ventilador de rosto (ar fresco direcionado à face).", "Morfina IV isolada 2 mg/hora sem titulação prévia."], "correta": 2}}, {"id": "q16", "capitulo": "c4", "ref": "Banco da disciplina, Q16", "enunciado": "Um paciente em cuidados paliativos domiciliares com constipação apresenta quadro abdominal agudo. Qual achado indica encaminhamento imediato ao pronto-socorro por suspeita de oclusão intestinal?", "itens": null, "tabela": null, "resposta_esperada": "**Resposta correta: Alternativa A.** Distensão abdominal aguda, parada de eliminação de flatos, dor intensa e vômitos fecaloides são os sinais clássicos de alarme para oclusão intestinal com indicação de pronto-socorro.\n**Por que B, C e D estão erradas:** Podem ser manejados inicialmente em domicílio/ambulatório com toque retal, ajuste de laxativos e reposição oral.", "comentario": "1. Memorize os sinais de alarme da constipação: distensão aguda + ausência de flatos + vômitos fecaloides + dor intensa.", "figuras": [], "alvos": {"A": ["sinais-alarme-ps", "manejo-constipacao"]}, "objetiva": {"alts": ["Distensão abdominal aguda associada a ausência de flatos, dor intensa e vômitos fecaloides.", "Ausência isolada de evacuação por 5 dias sem dor ou distensão.", "Hipocalemia leve isolada (K+ = 3,2 mEq/L).", "Fadiga associada sem alterações ao exame abdominal."], "correta": 0}}, {"id": "q17", "capitulo": "c4", "ref": "Banco da disciplina, Q17", "enunciado": "Sr. João, 68 anos, em cuidados paliativos por câncer de fígado avançado, relata dispneia intensa e persistente mesmo em repouso, com SpO2 de 92%, sem alívio substancial com oxigenoterapia suplementar. Qual a conduta mais apropriada em relação ao uso de opioides?", "itens": null, "tabela": null, "resposta_esperada": "**Resposta correta: Alternativa D.** Morfina em baixas doses (2,5 a 5 mg VO/SC 4/4h) é tratamento farmacológico de primeira linha para dispneia refratária, mesmo com SpO2 normal, sem aumentar mortalidade.\n**Por que A está errada:** Sem hipoxemia, aumentar O2 não traz alívio superior ao ar fresco (ventilador facial).\n**Por que B está errada:** A indicação na dispneia é independente da presença de dor.\n**Por que C está errada:** Saturação acima de 88% não contraindica morfina em baixas doses.", "comentario": "1. Lembre que dispneia é subjetiva e não exige hipoxemia para ser tratada.\n2. Morfina em dose baixa = 1ª linha segura, eficaz e sem aumento de mortalidade.", "figuras": [], "alvos": {"D": ["manejo-dispneia"]}, "objetiva": {"alts": ["Aumentar a dose de oxigênio é a única medida eficaz, pois a dispneia sempre indica necessidade de maior oferta de O2.", "A morfina deve ser reservada apenas para pacientes com dispneia associada à dor intensa.", "A morfina é contraindicada neste caso, pois a saturação de oxigênio está acima de 88%.", "Iniciar morfina em baixas doses é uma opção segura e eficaz para o alívio da dispneia, mesmo em pacientes sem hipoxemia, e não está associada a aumento de mortalidade."], "correta": 3}}, {"id": "q21", "capitulo": "c4", "ref": "Banco da disciplina, Q21", "enunciado": "Um paciente de 62 anos, em tratamento quimioterápico para carcinoma gástrico avançado, apresenta episódios severos de náuseas e vômitos nas horas seguintes à infusão dos quimioterápicos. Qual classe de medicamentos é a mais indicada?", "itens": null, "tabela": null, "resposta_esperada": "**Resposta correta: Alternativa D.** A quimioterapia libera serotonina no trato gastrointestinal e na zona gatilho quimiorreceptora, tornando os antagonistas 5-HT3 (ondansetrona 4 a 8 mg) a classe de escolha.\n**Por que A está errada:** Anti-histamínicos atuam principalmente em causas vestibulares/cinetose.\n**Por que B está errada:** Metoclopramida é destaque na gastroparesia/estase gástrica.\n**Por que C está errada:** Escopolamina atua em secreções e espasmos/obstrução.", "comentario": "1. Gatilho do caso: infusão de QUIMIOTERAPIA.\n2. Quimioterapia/radioterapia = receptor 5-HT3 = Ondansetrona.", "figuras": [], "alvos": {"D": ["manejo-nauseas"]}, "objetiva": {"alts": ["Anti-histamínicos, como o Dimenidrinato.", "Antagonistas dopaminérgicos, como a Metoclopramida.", "Anticolinérgicos, como a Escopolamina.", "Antagonistas serotoninérgicos 5-HT3, como a Ondansetrona."], "correta": 3}}, {"id": "q22", "capitulo": "c4", "ref": "Banco da disciplina, Q22 (Dissertativa - Caso George)", "enunciado": "Caso George (continuação): Com base nos dois sintomas principais apresentados por George (1. Dispneia; 2. Dor muscular e espasticidade), indique uma medida de tratamento/controle adequada para cada sintoma.", "itens": null, "tabela": null, "resposta_esperada": "**1. Dispneia:** Medidas não farmacológicas (cabeceira elevada 30 a 45 graus e ventilador facial com ar fresco) associadas à primeira linha farmacológica com **morfina em baixas doses** (2,5 a 5 mg VO/SC a cada 4h), usando oxigenoterapia apenas se houver hipoxemia documentada.\n**2. Dor muscular e espasticidade:** Analgesia proporcional pela escada da OMS em horário fixo (analgésico simples/opioide conforme intensidade) associada a fisioterapia motora/alongamento suave e adjuvantes miorrelaxantes ou neuromoduladores conforme avaliação clínica.", "comentario": "1. Para dispneia, sempre cite a dupla de ouro: ventilador facial + morfina em dose baixa (O2 só se hipoxemia).\n2. Para dor muscular/espasticidade, combine analgesia de horário + medida não farmacológica (fisioterapia/posicionamento).", "figuras": [], "alvos": {"Item B": ["manejo-dispneia", "escada-oms"]}}, {"id": "q24", "capitulo": "c4", "ref": "Banco da disciplina, Q24", "enunciado": "Correlacione os principais gatilhos de náuseas em cuidados paliativos com os fármacos classicamente associados:\n(I) Lentificação da peristalse / espasmos | (II) Aumento da pressão intracraniana | (III) Quimioterapia | (IV) Movimentos (cinetose)\n(A) Ondansetrona | (B) Dexametasona | (C) Escopolamina | (D) Meclizina", "itens": null, "tabela": null, "resposta_esperada": "**Resposta correta: Alternativa C (I-C; II-B; III-A; IV-D).** Pressão intracraniana responde à dexametasona (II-B), quimioterapia responde à ondansetrona (III-A), cinetose/movimento responde à meclizina (IV-D) e, por eliminação/espasmos intestinais, I-C (escopolamina).\n**Por que A, B e D estão erradas:** Trocam as associações clássicas de HIC (dexametasona), quimioterapia (ondansetrona) e cinetose (meclizina).", "comentario": "1. Comece pelos três pares inquestionáveis: HIC = Dexametasona (II-B), QT = Ondansetrona (III-A), Cinetose = Meclizina (IV-D).\n2. Só a alternativa C traz II-B, III-A e IV-D juntos.", "figuras": [], "alvos": {"C": ["manejo-nauseas"]}, "objetiva": {"alts": ["I-A; II-B; III-C; IV-D.", "I-C; II-D; III-A; IV-B.", "I-C; II-B; III-A; IV-D.", "I-A; II-D; III-C; IV-B."], "correta": 2}}, {"id": "q35", "capitulo": "c4", "ref": "Banco da disciplina, Q35", "enunciado": "Alterações cognitivas como delirium, alucinações e mioclonias podem aparecer nas últimas 48 horas de vida e causar intenso sofrimento ao paciente e aos familiares. Sobre o manejo desse quadro, assinale a correta:", "itens": null, "tabela": null, "resposta_esperada": "**Resposta correta: Alternativa A.** Diante de delirium refratário, agitação e mioclonias angustiantes nas últimas 48 horas de vida, o midazolam subcutâneo é excelente escolha para controle sintomático e sedação paliativa.\n**Por que B está errada:** O quadro terminal tem base orgânica (delirium), e antidepressivos levam semanas para agir.\n**Por que C está errada:** Mioclonias podem indicar neurotoxicidade por opioide ou sofrimento terminal e devem ser manejadas.\n**Por que D está errada:** Podem ocorrer em adultos de qualquer idade em fase terminal.", "comentario": "1. Identifique o cenário: últimas 48 horas de vida + delirium/agitação/mioclonias refratárias.\n2. Fármaco de escolha na sedação paliativa e delirium refratário terminal: Midazolam.", "figuras": [], "alvos": {"A": ["manejo-delirium"]}, "objetiva": {"alts": ["O Midazolam é uma ótima escolha para a sedação e controle dos sintomas, podendo ser utilizado.", "A agitação é causada por ansiedade e depressão, e a primeira escolha deve ser um antidepressivo.", "As mioclonias são benignas e não devem mudar conduta nem serem fontes de preocupação.", "Tanto o delirium quanto as mioclonias são comuns só em pacientes idosos."], "correta": 0}}, {"id": "q2", "capitulo": "c5", "ref": "Banco da disciplina, Q2", "enunciado": "Das opções abaixo, qual NÃO é um princípio do cuidado paliativo?", "itens": null, "tabela": null, "resposta_esperada": "**Resposta correta: Alternativa B.** Prolongar indefinidamente a vida biológica a qualquer custo define distanásia, contrariando diretamente os princípios dos cuidados paliativos.\n**Por que A, C e D estão erradas:** Todas descrevem princípios legítimos da definição da OMS para cuidados paliativos.", "comentario": "1. Procure o conceito incompatível com qualidade de vida e proporcionalidade.\n2. \"A qualquer custo\" sinaliza distanásia (obstinação terapêutica).", "figuras": [], "alvos": {"B": ["principios-cp-etica"]}, "objetiva": {"alts": ["Alívio do sofrimento físico, psicológico e espiritual.", "Prolongamento indefinido da vida biológica a qualquer custo.", "Cuidado integral ao paciente e sua família.", "Abordagem multidisciplinar e humanizada."], "correta": 1}}, {"id": "q4", "capitulo": "c5", "ref": "Banco da disciplina, Q4", "enunciado": "Paciente em acompanhamento domiciliar na UBS evolui com dispneia progressiva e fadiga extrema. Relata: \"Tenho medo de morrer... não entendo o porquê de tanto sofrimento.\" Sem vínculo religioso. Equipe observa sofrimento emocional apesar de sintomas físicos adequados. Qual a melhor condução inicial?", "itens": null, "tabela": null, "resposta_esperada": "**Resposta correta: Alternativa C.** O sofrimento existencial sem vínculo religioso deve ser acolhido com escuta qualificada, exploração de sentido/valores pessoais e suporte interdisciplinar.\n**Por que A está errada:** Reduzir sofrimento existencial a benzodiazepínico evita o problema real.\n**Por que B está errada:** A dimensão espiritual faz parte da integralidade do cuidado médico paliativo.\n**Por que D está errada:** Espiritualidade não se confunde com imposição religiosa.", "comentario": "1. Note o detalhe: \"sem vínculo religioso\" -> descarta encaminhamento religioso automático.\n2. A melhor conduta inicial em sofrimento existencial é sempre escuta qualificada + sentido/valores + equipe.", "figuras": [], "alvos": {"C": ["espiritualidade-aps"]}, "objetiva": {"alts": ["Priorizar manejo farmacológico exclusivo da ansiedade (ex.: benzodiazepínicos), evitando aspectos subjetivos.", "Informar que questões de sentido da vida são filosóficas, fora do escopo médico.", "Realizar escuta qualificada das angústias, explorar fontes de sentido/valores pessoais e articular suporte interdisciplinar.", "Encaminhar imediatamente a representante religioso, como padrão para sofrimento espiritual."], "correta": 2}}, {"id": "q12", "capitulo": "c5", "ref": "Banco da disciplina, Q12", "enunciado": "Mulher de 65 anos, com insuficiência cardíaca refratária (FE 25%, NYHA IV), será comunicada sobre a gravidade do quadro e transição para cuidados paliativos. Qual etapa do protocolo SPIKES corresponde a investigar previamente o que a paciente já compreende sobre sua doença antes de transmitir novas informações?", "itens": null, "tabela": null, "resposta_esperada": "**Resposta correta: Alternativa D.** A letra P (Perception) avalia o nível de percepção e conhecimento prévio do paciente sobre a própria condição clínica antes de dar a má notícia.\n**Por que A está errada:** Setting up refere-se à preparação do ambiente, privacidade e presença de familiares.\n**Por que B está errada:** Empathy é o acolhimento das emoções após a notícia.\n**Por que C está errada:** Invitation pergunta o quanto de detalhe o paciente deseja saber naquele momento.", "comentario": "1. Revise o acrônimo SPIKES: S (ambiente) -> P (o que já sabe) -> I (quanto quer saber) -> K (informação) -> E (empatia) -> S (estratégia).", "figuras": [], "alvos": {"D": ["spikes-equipe"]}, "objetiva": {"alts": ["S (Setting up - Preparando o ambiente).", "E (Empathy - Empatia).", "I (Invitation - Convite).", "P (Perception - Percepção)."], "correta": 3}}, {"id": "q26", "capitulo": "c5", "ref": "Banco da disciplina, Q26", "enunciado": "Qual critério define luto complicado (transtorno de luto prolongado, DSM-5-TR) em cuidados paliativos?", "itens": null, "tabela": null, "resposta_esperada": "**Resposta correta: Alternativa B.** No DSM-5-TR, o transtorno de luto prolongado define-se por sintomas persistentes por mais de 12 meses acompanhados de prejuízo funcional.\n**Por que A, C e D estão erradas:** Descrevem reações esperadas do luto normal, sem duração prolongada nem comprometimento funcional.", "comentario": "1. Memorize os dois critérios simultâneos do DSM-5-TR: tempo (> 12 meses) + prejuízo funcional.", "figuras": [], "alvos": {"B": ["luto-cuidador"]}, "objetiva": {"alts": ["Saudade intensa por menos de 6 meses sem impacto funcional.", "Sintomas persistentes por mais de 12 meses com prejuízo funcional.", "Choro isolado sem interferência diária.", "Melhora gradual espontânea em 3 meses."], "correta": 1}}, {"id": "q29", "capitulo": "c5", "ref": "Banco da disciplina, Q29", "enunciado": "Homem de 55 anos, com DPOC grave (GOLD 4) e selo de Cuidados Paliativos no prontuário, é atendido no pronto-socorro em exacerbação grave, com medo de morte e conflito familiar sobre ventilação invasiva. Considerando o papel do médico em equipe multiprofissional, qual a melhor conduta?", "itens": null, "tabela": null, "resposta_esperada": "**Resposta correta: Alternativa B.** Na equipe interdisciplinar, o médico lidera a comunicação empática de prognóstico e plano de cuidados, assume atos privativos (como limitação de ventilação invasiva) e articula toda a equipe.\n**Por que A, C e D estão erradas:** Terceirizar prognóstico, transferir atos privativos ou decidir por votação contraria o papel legal e ético do médico na equipe.", "comentario": "1. Em equipe interdisciplinar, cada profissional atua no seu escopo: prognóstico e atos médicos privativos são liderados pelo médico em articulação com a equipe.", "figuras": [], "alvos": {"B": ["spikes-equipe"]}, "objetiva": {"alts": ["Enfermeiro conduz conversa familiar sobre prognóstico; médico prescreve apenas oxigenoterapia.", "Médico lidera comunicação empática (prognóstico/planos), decide atos privativos (ex.: não ventilação invasiva), articulando equipe para suporte não farmacológico.", "Psicólogo decide diretivas antecipadas; médico aprova após.", "Equipe vota decisão final; médico executa prescrição consensual."], "correta": 1}}, {"id": "q31", "capitulo": "c5", "ref": "Banco da disciplina, Q31 (Dissertativa - Caso George)", "enunciado": "Caso George (parte C): Tendo ciência da sua condição, George solicita ao médico que o ajude a fazer uma declaração de vontades para quando não puder mais responder de maneira adequada. Um dos maiores medos é ficar em uma máquina para respirar.\nQual é o nome de tal documento e qual deve ser a orientação médica neste sentido?", "itens": null, "tabela": null, "resposta_esperada": "**1. Nome do documento:** Diretivas Antecipadas de Vontade (DAV), também conhecidas na prática clínica como testamento vital.\n**2. Orientação médica (Resolução CFM nº 1.995/2012):** Esclarecer com clareza os cenários futuros (incluindo recusa à ventilação mecânica invasiva), registrar as vontades detalhadamente no **prontuário médico** (não há obrigatoriedade de cartório para validade ética), incentivar o diálogo transparente com a família ou representante designado e assegurar que a DAV pode ser revisada a qualquer momento enquanto houver capacidade de decisão.", "comentario": "1. Nome exato exigido: Diretivas Antecipadas de Vontade (DAV).\n2. Cite os três pilares práticos: registro em prontuário (dispensa cartório), diálogo com a família e possibilidade de revisão.", "figuras": [], "alvos": {"Item C": ["dav-cfm"]}}, {"id": "q32", "capitulo": "c5", "ref": "Banco da disciplina, Q32", "enunciado": "Homem de 67 anos com câncer de pulmão avançado, metástases cerebrais e lombares e PPS 30% chega à emergência inconsciente e dispneico. Previamente, manifestou desejo de não ir para UTI e não ser intubado, mas familiares angustiados pedem UTI. Considerando o Código de Ética Médica e a Resolução CFM nº 1.995/2012, avalie:\nI. Dada a gravidade, o médico deve encaminhar o paciente à UTI para suporte ventilatório.\nII. O desejo da família deve ser respeitado, uma vez que o paciente não se encontra lúcido.\nIII. Constitui conduta adequada não intubar o paciente, manter conforto e dignidade, controlando dor e outros sintomas.", "itens": null, "tabela": null, "resposta_esperada": "**Resposta correta: Alternativa D.** Apenas o item III está correto: pela Resolução CFM nº 1.995/2012, a Diretiva Antecipada de Vontade prevalece sobre o desejo familiar, devendo-se não intubar e assegurar conforto e controle sintomático.\n**Por que I está errada:** Internação em UTI para intubação contraria a diretiva prévia e configura distanásia.\n**Por que II está errada:** A perda de lucidez não transfere à família o poder de anular a vontade previamente manifestada pelo paciente.", "comentario": "1. Resolução CFM nº 1.995/2012: DAV prevalece sobre a vontade dos familiares.\n2. Não intubar significa priorizar conforto, dignidade e controle rigoroso de dor e dispneia (morfina).", "figuras": [], "alvos": {"D": ["dav-cfm"]}, "objetiva": {"alts": ["Alternativa I somente.", "Alternativas I e II somente.", "Alternativas II e III somente.", "Alternativa III somente."], "correta": 3}}], "rev": {"c1": {"cornell": [[["Por que não julgar a dor pela aparência?", "Porque a dor é subjetiva; ausência de queixa verbal não exclui dor em sedados."], ["O que diferencia alodínia de hiperalgesia?", "Alodínia é dor a estímulo não doloroso; hiperalgesia é resposta exagerada a estímulo doloroso."], ["Qual a regra atual da escada da OMS?", "Proporcionalidade: dor intensa inicia direto no 3º degrau, em horário fixo."]], "Avaliar a dor com escalas, reconhecer a dor total, classificar o mecanismo fisiopatológico e aplicar a escada da OMS de forma proporcional formam a base de toda prescrição analgésica."], "quadros": [["Resumo comparativo dos tipos de dor", ["Tipo", "Localização", "Achado marcante"], [["Somática", "Bem localizada", "Dor óssea ou muscular pontual"], ["Visceral", "Difusa / profunda", "Cólica ou aperto sem alodínia"], ["Neuropática", "Trajeto nervoso / extremidades", "Queimação, choque, alodínia, hiperalgesia"]]]], "topicos_html": "<ol class=\"outline\"><li><span class=\"it\">Subjetividade e dor total<span class=\"frase\">Dor é experiência pessoal modulada por quatro dimensões.<\/span><\/span><ol><li><span class=\"it\"><b>Frequência<\/b><span class=\"expl\">Presente em 70% dos pacientes em CP e até 95% nos últimos dias<\/span><\/span><\/li><li><span class=\"it\"><b>Dor total<\/b><span class=\"expl\">Física, psicológica, social e espiritual<\/span><\/span><\/li><li><span class=\"it\"><b>Escalas<\/b><span class=\"expl\">EVA (0 a 10), ESAS e escala de faces<\/span><\/span><\/li><\/ol><\/li><li><span class=\"it\">Classificação fisiopatológica<span class=\"frase\">O mecanismo da dor orienta o tratamento.<\/span><\/span><ol><li><span class=\"it\"><b>Nociceptiva somática<\/b><span class=\"expl\">Pele, músculo e osso; bem localizada<\/span><\/span><\/li><li><span class=\"it\"><b>Nociceptiva visceral<\/b><span class=\"expl\">Órgãos internos; difusa, sem alodínia<\/span><\/span><\/li><li><span class=\"it\"><b>Neuropática<\/b><span class=\"expl\">Queimação, choque, parestesia, alodínia e hiperalgesia<\/span><\/span><\/li><li><span class=\"it\"><b>Mista<\/b><span class=\"expl\">Componente nociceptivo e neuropático simultâneos<\/span><\/span><\/li><\/ol><\/li><li><span class=\"it\">Escada analgésica da OMS<span class=\"frase\">Escolha proporcional com via oral e horário fixo.<\/span><\/span><ol><li><span class=\"it\"><b>Degraus 1 a 3<\/b><span class=\"expl\">Leve (simples) -&gt; Moderada (opioide fraco/baixa dose) -&gt; Intensa (opioide forte)<\/span><\/span><\/li><li><span class=\"it\"><b>Degrau 4<\/b><span class=\"expl\">Intervenção apenas após otimizar dose, via e intervalo<\/span><\/span><\/li><\/ol><\/li><\/ol>", "mapa_svgs": ["<svg class=\"rv-mapa\" viewBox=\"0 0 640 301\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, sans-serif\"><path d=\"M78 150.7 C85.5 150.7,85.5 47.9,93.0 47.9\" stroke=\"#2b4f7e\" stroke-width=\"1.5\" fill=\"none\"/><rect x=\"93.0\" y=\"38.3\" width=\"253.3\" height=\"19.2\" rx=\"6\" fill=\"#2b4f7e\"/><text x=\"100.0\" y=\"51.7\" font-size=\"10.8\" font-weight=\"600\" fill=\"#fff\">Dor Total<\/text><path d=\"M346.3 47.9 C354.6 47.9,354.6 11.6,361.3 11.6\" stroke=\"#2b4f7e\" stroke-width=\"1.1\" fill=\"none\"/><rect x=\"361.3\" y=\"2.0\" wi
