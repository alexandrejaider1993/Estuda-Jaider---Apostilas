nte, sabe-se se é Gram-positivo, Gram-negativo ou anaeróbio e, portanto, a sensibilidade esperada. Em seguida vêm duas perguntas do capítulo 1: **onde** a infecção foi adquirida e **se o paciente já tomou** algum antimicrobiano, porque o que o paciente tomou provavelmente não serve de novo.", []], ["p", "E há um dado local: a **sensibilidade na instituição**. A CCIH solta um **boletim de sensibilidade** com o perfil das bactérias daquele hospital. \"Uma coisa é trabalhar no Santa Marcelina, outra coisa é trabalhar no Sírio-Libanês\": perfis diferentes, usos diferentes, resistências diferentes.", []], ["passo", "Quem é o paciente"], ["p", "Depois, o paciente. **Idade**, porque a fisiologia muda e o agente provável também. **Função renal e hepática**. **Local da infecção**, pela afinidade do fármaco. **Imunidade**: imunocomprometido pede bactericida. E os **outros fármacos** que o paciente usa, que é onde moram as interações.", []], ["p", "Nas interações, a professora deu três regras de uso racional: não associar fármacos de **mesmo mecanismo de ação**; cuidado com **indutores e inibidores enzimáticos**, preferindo um antimicrobiano que não dependa da enzima afetada; e atenção à **ligação a proteínas**. E uma quarta, que a professora repetiu: não somar **efeitos adversos iguais**. \"Os antimicrobianos, a maioria deles, são nefrotóxicos, uns menos, outros mais.\" Até os beta-lactâmicos, a classe mais segura.", []], ["p", "Volte ao caso do início. O antineoplásico já agride o rim, e todo antineoplásico é hematotóxico, o que deixa o paciente imunodeprimido. O ideal é escolher um antimicrobiano que não seja nefrotóxico, ou o menos nefrotóxico, e monitorar o rim. A professora resumiu: \"a gente divide o fígado e o rim, não vou acabar com o rim do cara de uma vez\". Às vezes não há opção sem risco, e então é risco e benefício, sabendo o que pode acontecer e o que fazer quando acontecer.", []], ["cx", "destaque", "Destaque da professora", "\"Mesmo os beta-lactâmicos, que são a melhor classe e que têm a janela terapêutica mais ampla, mais segura, todos são nefrotóxicos. Uns mais, outros menos.\"", "forte"], ["passo", "Qual fármaco"], ["p", "Só então se escolhe o fármaco, pelos critérios do slide 23: **espectro de atividade**; **tipo de atividade**, bactericida ou bacteriostático; **sensibilidade** do microrganismo; **toxicidade relativa**; **perfil farmacocinético**, que inclui a posologia (\"se você vai ter que tomar o medicamento quatro vezes ao dia, é muito mais complexo\"); **via de administração**, preferindo a oral; **evidência de eficácia clínica**, e não \"porque eu acho que vai dar certo\"; e **custo**.", []], ["fig", "v33escolha.png", "Como escolher o antimicrobiano, passo a passo", "O que olhar: os quatro primeiros passos (azuis) vêm antes de pensar em qualquer fármaco; os verdes tratam do paciente e do fármaco; o mostarda, da prescrição. O losango final é a reavaliação de 48 horas. Pergunta para responder só olhando: em que passo entra o boletim de sensibilidade da CCIH?", "Esquema original elaborado a partir de A1 01:09:40 a 01:15:40 e SL 22 e 23.", ""], ["cx", "erros", "Erros que derrubam", "Escolher o fármaco antes de pensar no agente provável e na origem da infecção.\nSomar dois nefrotóxicos sem necessidade.\nIgnorar a posologia: tomada quatro vezes ao dia reduz a adesão.\nAchar que o perfil de resistência é igual em todo hospital.", null], ["cx", "guardar", "Para guardar", "Primeiro a infecção e o agente, depois o paciente, por último o fármaco. Quase todo antimicrobiano é nefrotóxico: não some toxicidades.", null], ["cx", "sintese", "Síntese", "**Antes do fármaco:** infecção, agente provável, origem, boletim da CCIH, uso prévio.\n**Paciente:** idade, rim, fígado, local, imunidade, outros fármacos.\n**Interações:** mesmo mecanismo, indutor ou inibidor enzimático, ligação a proteínas, efeitos adversos iguais.\n**Fármaco:** espectro, efeito, sensibilidade, toxicidade, farmacocinética, via oral, evidência, custo.", null]]}, {"id": "b34", "capitulo": "c3", "titulo": "Dose, via e duração", "onde": "A1 01:14:06 a 01:17:54; SL 46", "ensina": ["dose-certa", "via-oral", "duracao"], "seq": [["cx", "gancho", "Caso para começar", "O marido da professora quebrou o nariz num fim de semana. O médico acertou o antimicrobiano, mas, na farmácia, a posologia não fechava o tratamento.\n**Antes de seguir:** por que um erro de posologia virou um problema prático com a receita retida?", null], ["cx", "ideia", "A ideia em uma frase", "A escolha certa se perde com a dose, a via ou a duração erradas: a prescrição só termina quando os três estão certos.", null], ["passo", "Dose e posologia"], ["p", "\"Dose é importante. Não adianta fazer tudo bonitinho e dar a dose errada.\" Responda antes de ler: **o que acontece se a dose for baixa demais?** O fármaco não atinge a CIM, as bactérias mais sensíveis morrem e as menos sensíveis sobram: risco de **resistência**.", []], ["p", "Há também a consequência prática. Como a receita é **retida**, se a dose ou a posologia saírem erradas, o paciente precisa voltar ao médico para uma receita nova. Foi o que aconteceu com o marido da professora: o fármaco estava certo, mas a quantidade prescrita \"não era suficiente para o tratamento\", e foi preciso voltar ao hospital e \"caçar o cara\". \"Não adianta fazer a lição de casa só pela metade.\"", []], ["passo", "Via oral e tratamento em casa"], ["p", "A melhor via, sempre que possível, é a **oral**, e o melhor lugar é **a casa do paciente**. A professora lembrou que antigamente havia pacientes internados só tomando medicação oral; hoje, quem toma oral vai para casa. Os hospitais \"se tornaram grandes UTIs\": ficam os graves. Internar quem não precisa expõe o paciente aos germes hospitalares que você viu no capítulo 1.", []], ["passo", "Duração"], ["p", "A duração varia \"de acordo com o microrganismo envolvido e de acordo com a localização\". O slide 46 dá a referência: **7 a 10 dias** nas infecções moderadas, **10 a 14 dias** nas graves; **dose única** em gonorreia e ITU; **3 dias** na ITU não complicada; e a exceção, a **osteomielite**, com **28 dias**.", []], ["p", "Por que o osso demora tanto? Porque o osso é um tecido de **pouca penetrabilidade** para os antimicrobianos: é difícil o fármaco chegar lá em concentração adequada, e o tratamento precisa ser longo. É o mesmo raciocínio de afinidade pelo tecido do capítulo 1, agora aplicado ao tempo.", []], ["fig", "v34duracao.png", "Quanto tempo dura o tratamento", "O que olhar: cada barra é uma situação do slide 46; nas faixas de tempo, a parte clara é o mínimo e a escura vai até o máximo. A barra vermelha da osteomielite é quase três vezes maior que a das infecções graves. Pergunta para responder só olhando: qual situação tem o tratamento mais longo, e por quê?", "Esquema original elaborado a partir de SL 46 e A1 01:16:43 a 01:17:46.", ""], ["cx", "alerta", "Atenção", "⚠️ A transcrição traz \"o osso tem uma boa penetrabilidade nos antimicrobianos\", e a frase seguinte diz o contrário: \"eu tenho pouca penetrabilidade, o tratamento é prolongado\". O sentido da explicação é o segundo, e foi o que ficou no texto: **pouca penetração no osso, tratamento longo**.", null], ["cx", "erros", "Erros que derrubam", "Achar que a dose pode ser \"aproximada\": dose baixa seleciona resistência.\nInternar paciente que pode tomar medicação oral em casa.\nEsquecer a exceção da osteomielite: 28 dias, pela pouca penetração no osso.", null], ["cx", "guardar", "Para guardar", "Dose certa, via oral e o tempo certo. Osso: pouca penetração, 28 dias.", null], ["cx", "sintese", "Síntese", "**Dose:** errada, risco de resistência; com receita retida, o paciente precisa voltar.\n**Via:** oral sempre que possível, tratando em casa.\n**Duração:** 7 a 10 dias (moderadas), 10 a 14 (graves), dose única ou 3 dias (algumas ITU), 28 dias (osteomielite).", null]]}, {"id": "b35", "capitulo": "c3", "titulo": "Gram-positivo, Gram-negativo e o agente pela doença", "onde": "A1 01:17:54 a 01:20:43; SL 25 e 26", "ensina": ["gram-parede", "toxicidade-seletiva", "agente-doenca"], "seq": [["cx", "gancho", "Caso para começar", "Um paciente tratado com sulfa por muito tempo desenvolve anemia. A sulfa age numa via da bactéria.\n**Antes de seguir:** por que um fármaco feito para a bactéria afeta o sangue do paciente?", null], ["cx", "ideia", "A ideia em uma frase", "O fármaco precisa combinar com a construção da bactéria, e o efeito adverso aparece quando o alvo dele também existe nas nossas células.", null], ["passo", "Paredes diferentes, fármacos diferentes"], ["p", "A professora retomou a estrutura das bactérias. **Gram-positivos** e **Gram-negativos** são construídos de modo diferente, e \"o mecanismo de ação antimicrobiano tem que ser adequado de acordo com a constituição daquele micro-organismo\". O slide 26 resume: o Gram-positivo tem **parede espessa de peptidoglicano**; o Gram-negativo tem pouco peptidoglicano, coberto por uma **membrana externa** com lipoproteínas e lipopolissacarídeos.", [["Peptidoglicano", "Malha de açúcares e peptídeos que forma a parede bacteriana; é o alvo dos beta-lactâmicos."]]], ["p", "Nos Gram-negativos, a membrana externa tem as **porinas**, que são **canais hidrofílicos**. Responda antes de ler: **que tipo de fármaco passa melhor por um canal hidrofílico?** O hidrofílico. Por isso, \"geralmente, antimicrobianos com características mais hidrofílicas\" pegam melhor os Gram-negativos: atravessam as porinas. É a mesma porina que, alterada, vira o mecanismo de resistência de menor entrada.", []], ["fig", "v35gram.png", "A parede do Gram-positivo e a do Gram-negativo", "O que olhar: à esquerda, as camadas roxas de peptidoglicano espesso; à direita, a membrana externa rosa com duas porinas, o peptidoglicano fino e a membrana interna, e o fármaco azul atravessando uma porina. Pergunta para responder só olhando: por onde um fármaco hidrofílico entra no Gram-negativo? Esquema didático, fora de escala.", "Esquema original elaborado a partir de A1 01:18:19 a 01:19:00 e SL 26.", ""], ["fig", "sl26gram.png", "Gram-positivo e Gram-negativo no slide da aula", "O que olhar: compare com o esquema anterior. À esquerda, o desenho das duas paredes, com o canal de porina no Gram-negativo; à direita, o quadro \"parede espessa de peptideoglicano\" contra as quatro camadas do Gram-negativo. Pergunta para responder só olhando: quantas camadas o quadro lista para o Gram-negativo? Imagem de origem em baixa resolução.", "Slide 26 da aula.", "larga"], ["passo", "Por que há efeitos adversos"], ["p", "Se o alvo é da bactéria, por que o paciente sofre? A professora explicou: sentimos os efeitos adversos \"quando a gente tem algo em comum com o micro-organismo e, de repente, aquilo faz parte do alvo farmacológico\". O exemplo é a **sulfa**: a sulfa age na via do **folato**, e nós também dependemos do folato para formar as células do sangue. Se a nossa via também é afetada, aparece **anemia**.", []], ["passo", "Cada doença, seu agente"], ["p", "Por último, a ponte com o diagnóstico. Como saber se o agente é Gram-positivo, Gram-negativo, aeróbio ou anaeróbio? A professora lembrou um truque que circula entre estudantes: pelo nome, os Gram-positivos seriam \"masculinos\" e os Gram-negativos, \"femininos\". E avisou na mesma frase: \"toda regra tem sua exceção. Presta atenção.\" Use como lembrete, nunca como regra.", []], ["p", "O mais seguro é ligar **doença e agente**. Sinais de coqueluche? Pense em *Bordetella*. Sinais de gonorreia? *Neisseria*. \"De acordo com o tipo de doença infecciosa que o paciente apresenta, a gente tem o agente etiológico mais provável. E é isso que a gente vai focar o nosso tratamento.\" Com isso, o volume fecha o círculo que abriu no capítulo 1: do diagnóstico ao agente, do agente ao espectro, do tecido ao fármaco.", []], ["cx", "alerta", "Atenção", "O truque do gênero do nome tem muitas exceções. 💡 *Neisseria*, de nome feminino, é Gram-negativa e encaixa; mas *Clostridium* e *Bacillus* são Gram-positivos de nome que não é feminino nem segue o padrão, e *Bacteroides* é Gram-negativo de nome masculino. Na prova, decida pelo agente, não pelo nome.", null], ["cx", "erros", "Erros que derrubam", "Achar que o mesmo fármaco serve igual para Gram-positivo e Gram-negativo: a estrutura muda o acesso.\nUsar o \"nome masculino ou feminino\" como regra.\nEsquecer que efeito adverso vem de alvo em comum, como o folato na sulfa.", null], ["cx", "guardar", "Para guardar", "Gram-negativo: membrana externa com porinas; hidrofílico passa. Efeito adverso: alvo que também é nosso.", null], ["cx", "sintese", "Síntese", "**Gram-positivo:** parede espessa de peptidoglicano. **Gram-negativo:** membrana externa com porinas hidrofílicas.\n**Efeito adverso:** alvo em comum; sulfa, folato, anemia.\n**Agente:** cada doença tem o seu (coqueluche, Bordetella; gonorreia, Neisseria).", null]]}], "testes": [{"id": "t1", "bloco": "b11", "tema": "Foco da disciplina", "conceito": "foco-disciplina", "nivel": 1, "papel": "checagem", "enunciado": "Segundo a professora, qual conjunto é o foco da Farmacoterapia no estudo dos antimicrobianos?", "alternativas": ["Mecanismo, espectro, interações e reações adversas", "Esquemas de primeira e segunda escolha por doença", "Diagnóstico laboratorial de cada bactéria", "Doses pediátricas e adultas de cada antimicrobiano usado"], "correta": 0, "porque": "A professora disse que o foco é mecanismo de ação, interações medicamentosas, efeitos adversos e espectro; a indicação só entra porque depende da farmacocinética.", "errados": {"1": "A ordem de escolha por doença ficou para a Infectologia, segundo a própria professora.", "2": "Diagnóstico laboratorial não foi o recorte anunciado para esta disciplina.", "3": "Doses não fizeram parte do foco anunciado."}, "passo": 1}, {"id": "t2", "bloco": "b11", "tema": "Afinidade", "conceito": "espectro-afinidade", "nivel": 2, "papel": "checagem", "enunciado": "Uma quinolona tem atividade contra a bactéria de uma infecção de pele. Por que a professora diz que não é a melhor escolha?", "alternativas": ["A afinidade dela é por pulmão e rim, não pela pele", "A quinolona não tem atividade contra Gram-positivos", "A quinolona só existe na forma injetável", "A quinolona é bacteriostática em qualquer dose"], "correta": 0, "porque": "O espectro até alcança a bactéria, mas a quinolona se concentra principalmente no tecido pulmonar e renal; na pele, a concentração é incerta.", "errados": {"1": "A professora disse o contrário: as quinolonas podem pegar Gram-positivos.", "2": "A via de administração não foi o argumento da aula.", "3": "A ação bactericida ou bacteriostática não foi o motivo apontado."}, "passo": 2}, {"id": "t3", "bloco": "b11", "tema": "Caso clínico", "conceito": "agente-provavel", "nivel": 3, "papel": "checagem", "enunciado": "Paciente de 30 anos com celulite na perna, sem internação recente. Qual o primeiro raciocínio que a aula ensina antes de escolher o fármaco?", "alternativas": ["Pensar no agente provável da pele, o estafilococo", "Pedir antibiograma e esperar o resultado", "Começar pelo fármaco de espectro mais amplo disponível", "Escolher pela via mais cômoda ao paciente"], "correta": 0, "porque": "Pela topografia (pele) se chega ao agente mais provável, o estafilococo; com o agente definido, escolhe-se o espectro necessário e um fármaco que chegue ao tecido.", "errados": {"1": "Esperar exame atrasaria o tratamento de uma infecção comum; a aula manda pensar primeiro no mais provável.", "2": "Começar pelo espectro mais amplo é o \"tiro de canhão\" que a professora condena.", "3": "A posologia pesa depois, entre fármacos que já cobrem o agente."}, "passo": 3}, {"id": "t4", "bloco": "b12", "tema": "Infecção hospitalar", "conceito": "origem-infeccao", "nivel": 1, "papel": "checagem", "enunciado": "Até quanto tempo depois da alta uma infecção ainda é considerada hospitalar, segundo a aula?", "alternativas": ["48 horas", "24 horas", "7 dias", "30 dias"], "correta": 0, "porque": "A professora disse que, se a infecção aparece até 48 horas depois da alta, a infecção foi adquirida no hospital.", "errados": {"1": "O prazo citado na aula é maior que esse.", "2": "O prazo citado na aula é bem menor que esse.", "3": "Esse prazo não foi o da aula."}, "passo": 1}, {"id": "t5", "bloco": "b12", "tema": "Pressão seletiva", "conceito": "pressao-seletiva", "nivel": 2, "papel": "checagem", "enunciado": "Por que usar logo uma cefalosporina de terceira geração \"para garantir\" é criticado na aula?", "alternativas": ["Porque seleciona bactérias resistentes no ambiente", "Porque cefalosporinas não pegam nenhum Gram-negativo", "Porque o fármaco é bacteriostático nessa dose", "Porque a via oral não alcança o pulmão"], "correta": 0, "porque": "Usar amplo espectro por insegurança mata as sensíveis e deixa as resistentes sem concorrência: é a pressão de seleção que gera superbactérias.", "errados": {"1": "A professora disse que a de terceira geração pega Gram-positivo e Gram-negativo.", "2": "Ação bacteriostática não foi o argumento da aula.", "3": "A via não entrou nesse raciocínio."}, "passo": 2}, {"id": "t6", "bloco": "b12", "tema": "Caso clínico", "conceito": "reavaliar-48h", "nivel": 3, "papel": "checagem", "enunciado": "Criança com meningite bacteriana grave. Por que, aqui, não se aplica a regra de esperar 48 horas antes de mudar a conduta?", "alternativas": ["Porque a infecção pode matar antes desse prazo", "Porque a meningite é sempre viral nessa faixa de idade", "Porque o líquor já define o antimicrobiano", "Porque o antibiograma sai em poucas horas"], "correta": 0, "porque": "A regra das 48 h vale para a maioria das infecções, mas a meningite pode matar em menos tempo; por isso a conduta começa forte, com dose de ataque.", "errados": {"1": "A aula tratou de meningite bacteriana, não viral.", "2": "A professora contou que o líquor pode estar limpo no início e piorar em horas.", "3": "O tempo do antibiograma não foi o argumento."}, "passo": 3}, {"id": "t7", "bloco": "b13", "tema": "CIM", "conceito": "cim", "nivel": 1, "papel": "checagem", "enunciado": "O que é a concentração inibitória mínima (CIM)?", "alternativas": ["A menor concentração que impede o crescimento", "A concentração máxima tolerada pelo paciente", "A concentração do fármaco no estado de equilíbrio", "A concentração que o rim consegue eliminar"], "correta": 0, "porque": "A CIM é a concentração que o antimicrobiano precisa atingir para impedir o crescimento da bactéria; abaixo dela, não há efeito.", "errados": {"1": "Tolerância do paciente fala de toxicidade, não de efeito sobre a bactéria.", "2": "O equilíbrio é um momento da farmacocinética, que pode estar acima ou abaixo do nível eficaz.", "3": "Eliminação renal não define o nível que age na bactéria."}, "passo": 1}, {"id": "t8", "bloco": "b13", "tema": "Dose de ataque", "conceito": "dose-ataque", "nivel": 2, "papel": "checagem", "enunciado": "Por que a meningite é o exemplo clássico de uso de dose de ataque?", "alternativas": ["Porque não se pode perder horas abaixo da CIM", "Porque o fármaco fica tóxico quando dado em doses repetidas", "Porque a via oral é a única possível", "Porque a bactéria é sempre resistente"], "correta": 0, "porque": "Na infecção grave, esperar as doses repetidas atingirem a CIM é tempo perdido; a dose de ataque atinge a CIM já na primeira dose.", "errados": {"1": "Toxicidade das doses repetidas não foi o motivo dado.", "2": "Na meningite a via citada foi a endovenosa.", "3": "A resistência não foi o argumento: o problema é o tempo até agir."}, "passo": 2}, {"id": "t9", "bloco": "b14", "tema": "Adesão", "conceito": "adesao", "nivel": 1, "papel": "checagem", "enunciado": "Paciente para o antimicrobiano no terceiro dia porque melhorou. O que a aula prevê?", "alternativas": ["Os resistentes se multiplicam e a infecção pode voltar", "A infecção não volta, porque todas as bactérias já morreram", "O fármaco passa a agir melhor numa nova tentativa", "O organismo fica imune àquela bactéria"], "correta": 0, "porque": "Ao melhorar, só as sensíveis morreram; as resistentes ficam sem concorrência, multiplicam-se, e o mesmo antimicrobiano deixa de funcionar.", "errados": {"1": "A melhora indica que as sensíveis morreram, não todas as bactérias.", "2": "A nova tentativa encontra mais resistentes, não menos.", "3": "Imunidade contra a bactéria não foi o que a aula descreveu."}, "passo": 2}, {"id": "t10", "bloco": "b14", "tema": "Receita", "conceito": "receita-retida", "nivel": 1, "papel": "checagem", "enunciado": "O que mudou na venda de antimicrobianos no Brasil, segundo a aula?", "alternativas": ["Passaram a exigir receita retida", "Passaram a ser isentos de prescrição", "Passaram a ser vendidos só em hospital", "Passaram a ter tarja vermelha sem retenção"], "correta": 0, "porque": "A legislação passou a exigir retenção da receita; a professora disse que só a retenção realmente impede a venda livre.", "errados": {"1": "O caminho foi o oposto: maior controle.", "2": "Só alguns, como a vancomicina, ficaram restritos ao hospital.", "3": "Tarja vermelha sem retenção é o caso da nimesulida, que continua sendo vendida a quem pede."}, "passo": 1}, {"id": "t11", "bloco": "b14", "tema": "Caso clínico", "conceito": "caminho-meio", "nivel": 3, "papel": "checagem", "enunciado": "Criança de 2 anos com coriza e tosse há um dia, sem sinais de gravidade. A mãe pede antibiótico. Qual conduta segue o raciocínio da aula?", "alternativas": ["Explicar que deve ser viral e reavaliar em três dias", "Prescrever amoxicilina para evitar complicação", "Prescrever o espectro mais amplo disponível", "Recusar qualquer reavaliação até surgir febre alta e persistente"], "correta": 0, "porque": "A maioria das infecções da criança é viral; antimicrobiano não age em vírus. O caminho do meio é orientar, esperar três dias e reavaliar.", "errados": {"1": "Esse é o \"espirrou, tossiu, Amoxil\" que a professora criticou.", "2": "Amplo espectro sem indicação seleciona resistência e destrói o microbioma.", "3": "O caminho do meio inclui reavaliar; abandonar a criança é o outro extremo."}, "passo": 3}, {"id": "t12", "bloco": "b15", "tema": "Profilaxia", "conceito": "profilaxia-tratamento", "nivel": 2, "papel": "checagem", "enunciado": "Idoso com DPOC em uso profilático de um antimicrobiano desenvolve pneumonia. Qual conduta segue a aula?", "alternativas": ["Tratar com outro antimicrobiano", "Dobrar a dose do mesmo fármaco", "Manter o mesmo fármaco por mais tempo", "Suspender todo antimicrobiano e observar"], "correta": 0, "porque": "O fármaco usado na profilaxia provavelmente já selecionou bactérias resistentes; por isso o tratamento usa outro antimicrobiano.", "errados": {"1": "A professora criticou aumentar a dose de um fármaco que não responde: só aumenta a toxicidade.", "2": "Prolongar o fármaco que já falhou mantém a pressão sobre os resistentes.", "3": "O paciente tem pneumonia e precisa de tratamento."}, "passo": 4}, {"id": "t13", "bloco": "b15", "tema": "Indústria", "conceito": "poucos-novos", "nivel": 1, "papel": "checagem", "enunciado": "O que a aula diz que surgiu, nas últimas décadas, no lugar de antimicrobianos realmente novos?", "alternativas": ["Associações de fármaco antigo com inibidor de enzima", "Uma nova família de fármacos por ano", "Versões mais tóxicas e mais potentes de fármacos antigos", "Antimicrobianos que tratam também vírus"], "correta": 0, "porque": "Depois da linezolida, o que surgiu foram novas associações: um antimicrobiano antigo com um inibidor da enzima de resistência.", "errados": {"1": "A professora disse justamente que quase não surgem famílias novas.", "2": "Toxicidade maior não foi o que a aula descreveu.", "3": "Antimicrobianos antibacterianos não agem em vírus."}, "passo": 1}, {"id": "t14", "bloco": "b15", "tema": "Rodízio", "conceito": "rodizio", "nivel": 2, "papel": "checagem", "enunciado": "Por que a sulfa voltou a ser usada na infecção urinária depois de anos de quinolonas?", "alternativas": ["Ficou anos sem uso e perdeu a pressão de seleção", "Surgiu uma sulfa nova, de uma família química diferente", "As quinolonas foram proibidas no Brasil", "A sulfa passou a ser de amplo espectro"], "correta": 0, "porque": "Sem uso por um longo período, a pressão de seleção sobre a sulfa sumiu, e a sensibilidade pôde voltar: é o rodízio.", "errados": {"1": "A aula falou da mesma sulfa, não de uma família nova.", "2": "A professora não falou em proibição.", "3": "O espectro da sulfa não mudou."}, "passo": 2}, {"id": "t15", "bloco": "b15", "tema": "Associação", "conceito": "associacao-resistencia", "nivel": 1, "papel": "checagem", "enunciado": "Por que tuberculose, HIV e hanseníase são tratadas sempre com associação de fármacos?", "alternativas": ["Para evitar o surgimento de resistência", "Para encurtar o tratamento para dias", "Para dispensar o acompanhamento médico", "Para reduzir a nefrotoxicidade de cada um"], "correta": 0, "porque": "Nos tratamentos longos, a associação garante que uma bactéria resistente a um fármaco seja atingida pelo outro.", "errados": {"1": "Esses tratamentos continuam longos.", "2": "O acompanhamento continua necessário.", "3": "Somar fármacos não reduz toxicidade; esse não foi o motivo."}, "passo": 3}, {"id": "t16", "bloco": "b21", "tema": "Termos", "conceito": "termos", "nivel": 1, "papel": "checagem", "enunciado": "O que diferencia um antibiótico de um antimicrobiano, segundo a aula?", "alternativas": ["A origem: antibiótico é só o de origem natural", "O alvo: antibiótico só age em fungos", "A via: antibiótico só existe na forma oral e nunca injetável", "A dose: antibiótico sempre é bactericida"], "correta": 0, "porque": "Os dois agem contra microrganismos; antibiótico é produzido por um microrganismo contra outro, enquanto antimicrobiano inclui também os sintéticos.", "errados": {"1": "Antibióticos agem principalmente em bactérias, e o alvo não foi o critério da aula.", "2": "A via de administração não define o termo.", "3": "Ser bactericida não é o que define antibiótico."}, "passo": 1}, {"id": "t17", "bloco": "b21", "tema": "Antissepsia", "conceito": "antissepsia", "nivel": 2, "papel": "checagem", "enunciado": "No curativo de uma ferida, qual é o termo correto para a limpeza com solução química na pele do paciente?", "alternativas": ["Antissepsia", "Esterilização", "Desinfecção", "Descontaminação de superfície"], "correta": 0, "porque": "Solução química em tecido vivo é antisséptico; o procedimento é antissepsia.", "errados": {"1": "Esterilização é processo para material, como a autoclave.", "2": "Desinfetante se usa em objetos e mobiliário.", "3": "Superfície é objeto, não tecido vivo."}, "passo": 2}, {"id": "t18", "bloco": "b22", "tema": "Efeito", "conceito": "cida-statico", "nivel": 1, "papel": "checagem", "enunciado": "O que acontece com as bactérias quando se usa um bacteriostático?", "alternativas": ["Param de crescer e o sistema imune as elimina", "São destruídas diretamente pelo fármaco", "Ficam resistentes logo na primeira dose", "Passam a crescer mais devagar para sempre"], "correta": 0, "porque": "O bacteriostático impede o crescimento; quem elimina as bactérias paradas é o sistema imune.", "errados": {"1": "Destruir diretamente é o que faz o outro tipo de fármaco.", "2": "Resistência não é o efeito esperado do fármaco.", "3": "O efeito depende de o fármaco estar presente; não é permanente."}, "passo": 1}, {"id": "t19", "bloco": "b22", "tema": "Imunodeprimido", "conceito": "imuno-cida", "nivel": 2, "papel": "checagem", "enunciado": "Paciente neutropênico em quimioterapia com infecção bacteriana. Que tipo de efeito se prefere no antimicrobiano, segundo a aula?", "alternativas": ["Bactericida", "Bacteriostático", "Qualquer um, desde que de amplo espectro", "O que tiver menor custo"], "correta": 0, "porque": "Sem defesas, ninguém elimina as bactérias que um bacteriostático só paralisou; por isso se prefere o que mata.", "errados": {"1": "Esse tipo depende de um sistema imune que o paciente não tem.", "2": "Amplo espectro não resolve a falta de defesa e aumenta a seleção de resistentes.", "3": "Custo pesa, mas não substitui o raciocínio sobre o efeito."}, "passo": 2}, {"id": "t20", "bloco": "b22", "tema": "Dose", "conceito": "dose-efeito", "nivel": 2, "papel": "checagem", "enunciado": "Um paciente não respondeu ao antimicrobiano e o médico apenas dobrou a dose. Qual o risco que a professora apontou?", "alternativas": ["Só aumentar a toxicidade, sem ganho de efeito", "Transformar qualquer fármaco em bactericida potente", "Curar mais rápido em qualquer caso", "Reduzir a chance de nefrotoxicidade"], "correta": 0, "porque": "Nem todo fármaco muda de bacteriostático para bactericida com a dose; em muitos, dobrar a dose só aumenta a toxicidade.", "errados": {"1": "A professora disse que isso não vale para qualquer fármaco.", "2": "Sem resposta ao fármaco, mais dose não garante cura.", "3": "Dose maior tende a aumentar, não reduzir, a toxicidade."}, "passo": 3}, {"id": "t21", "bloco": "b22", "tema": "CIM e CBM", "conceito": "cim-cbm", "nivel": 3, "papel": "checagem", "enunciado": "No laboratório, a CIM e a CBM de um fármaco são iguais. Como o slide da aula classifica esse fármaco?", "alternativas": ["Bactericida", "Bacteriostático", "Sem efeito sobre a bactéria", "Resistente por bomba de efluxo"], "correta": 0, "porque": "Se a concentração que para o crescimento já é a que mata 99,9%, a razão CBM/CIM é 1: bactericida, pelo slide 25.", "errados": {"1": "Esse tipo corresponde à razão maior que 1 no slide.", "2": "O fármaco tem efeito: para e mata na mesma concentração.", "3": "Bomba de efluxo é mecanismo de resistência, não classificação de efeito."}, "passo": 4}, {"id": "t22", "bloco": "b23", "tema": "História", "conceito": "historia", "nivel": 1, "papel": "checagem", "enunciado": "Qual foi a primeira família de antimicrobianos, segundo a linha do tempo da aula?", "alternativas": ["Sulfonamidas", "Beta-lactâmicos", "Aminoglicosídeos", "Quinolonas"], "correta": 0, "porque": "As sulfas, de 1935, são as mais antigas; os beta-lactâmicos vieram em seguida.", "errados": {"1": "Essa família veio logo depois, com a penicilina.", "2": "Essa família surgiu depois do cloranfenicol.", "3": "Essa família é bem posterior, dos anos 1960."}, "passo": 2}, {"id": "t23", "bloco": "b23", "tema": "Alergia", "conceito": "macrolideo-alternativa", "nivel": 2, "papel": "checagem", "enunciado": "Paciente alérgico à penicilina, com sinusite. Qual família a aula indica como alternativa de espectro semelhante?", "alternativas": ["Macrolídeos", "Cefalosporinas", "Carbapenêmicos", "Glicopeptídeos"], "correta": 0, "porque": "O macrolídeo substitui o beta-lactâmico no alérgico, com espectro semelhante; azitromicina ainda tem posologia cômoda.", "errados": {"1": "Essa família também é beta-lactâmica.", "2": "Essa família também é beta-lactâmica.", "3": "Essa família é reservada a Gram-positivo resistente à oxacilina."}, "passo": 3}, {"id": "t24", "bloco": "b23", "tema": "Gerações", "conceito": "geracoes", "nivel": 2, "papel": "checagem", "enunciado": "Qual frase descreve corretamente a diferença entre as gerações de quinolonas e de cefalosporinas?", "alternativas": ["Quinolona amplia; cefalosporina muda de Gram+ para Gram-", "As duas ampliam o espectro, de forma igual, a cada nova geração", "Quinolonas mudam; cefalosporinas ampliam", "As duas perdem espectro a cada geração"], "correta": 0, "porque": "Nas quinolonas cada geração amplia o espectro; nas cefalosporinas a primeira pega mais Gram-positivo e as últimas, mais Gram-negativo.", "errados": {"1": "A professora alertou justamente que as duas não se comportam igual.", "2": "É o inverso do que a aula ensinou.", "3": "Nenhuma das duas perde espectro com a geração."}, "passo": 4}, {"id": "t25", "bloco": "b23", "tema": "Caso clínico", "conceito": "vanco-reserva", "nivel": 3, "papel": "checagem", "enunciado": "Paciente internado com infecção por estafilococo que não respondeu à oxacilina. O que a aula indica?", "alternativas": ["Vancomicina, porque há resistência a beta-lactâmicos", "Outra penicilina de espectro maior", "Uma cefalosporina de primeira geração, por via oral mesmo", "Dobrar a dose da oxacilina"], "correta": 0, "porque": "Sem resposta à oxacilina, há resistência a beta-lactâmicos; trocar de beta-lactâmico não adianta, e entra a vancomicina.", "errados": {"1": "Outro beta-lactâmico esbarra na mesma resistência.", "2": "Esse também é beta-lactâmico.", "3": "Mais dose de um fármaco que não age só aumenta a toxicidade."}, "passo": 4}, {"id": "t26", "bloco": "b23", "tema": "Maior família", "conceito": "betalactamico-maior", "nivel": 1, "papel": "checagem", "enunciado": "Por que a alergia a beta-lactâmico é mais limitante que a alergia a sulfa?", "alternativas": ["Porque os beta-lactâmicos são a maior família", "Porque a sulfa é mais tóxica para o rim", "Porque a sulfa não tem substituto", "Porque beta-lactâmicos são só injetáveis"], "correta": 0, "porque": "Quem é alérgico a beta-lactâmico perde a maior família de antimicrobianos de uma vez; na alergia a sulfa, sobram muitas opções.", "errados": {"1": "A toxicidade renal não foi o argumento da professora.", "2": "É o contrário: a professora disse que na alergia a sulfa há muitas opções.", "3": "Há beta-lactâmicos orais, como a amoxicilina."}, "passo": 2}, {"id": "t27", "bloco": "b24", "tema": "Famílias", "conceito": "classe-quimica", "nivel": 1, "papel": "checagem", "enunciado": "A qual família pertence a gentamicina?", "alternativas": ["Aminoglicosídeos", "Macrolídeos", "Glicopeptídeos", "Tetraciclinas"], "correta": 0, "porque": "Gentamicina, amicacina e neomicina são aminoglicosídeos, segundo o slide 10.", "errados": {"1": "Os exemplos desta família na aula foram eritromicina e azitromicina.", "2": "Os exemplos desta família foram vancomicina e teicoplanina.", "3": "O exemplo desta família foi a doxiciclina."}, "passo": 1}, {"id": "t28", "bloco": "b24", "tema": "Associação", "conceito": "assoc-espectro", "nivel": 2, "papel": "checagem", "enunciado": "Por que a professora prefere penicilina com amicacina a uma ceftriaxona sozinha?", "alternativas": ["Dois mecanismos diferentes dificultam a resistência", "A ceftriaxona não pega Gram-negativos", "A amicacina reduz a toxicidade renal da penicilina associada", "A associação é sempre mais barata"], "correta": 0, "porque": "Penicilina (Gram-positivo) e amicacina (Gram-negativo) cobrem os dois grupos, e dois mecanismos diferentes dificultam que a bactéria escape.", "errados": {"1": "A ceftriaxona pega Gram-negativos; o problema apontado foi a resistência.", "2": "Redução de toxicidade não foi o argumento.", "3": "Custo não foi o argumento da professora."}, "passo": 2}, {"id": "t29", "bloco": "b24", "tema": "Vanco e teico", "conceito": "vanco-teico", "nivel": 3, "papel": "checagem", "enunciado": "Idoso com infecção multirresistente por Gram-positivo, estável, que poderia tratar em casa. Por que a teicoplanina pode ser preferível à vancomicina?", "alternativas": ["Pode ser intramuscular e evita a internação", "Tem espectro muito mais amplo que o da vancomicina", "Não tem nenhum efeito nefrotóxico", "Age em Gram-negativos também"], "correta": 0, "porque": "As duas têm espectro semelhante; a vancomicina é só endovenosa de 6 em 6 horas e obriga a internar, enquanto a teicoplanina pode ser intramuscular.", "errados": {"1": "A professora disse que o espectro das duas é muito semelhante.", "2": "Nefrotoxicidade não foi a diferença apontada; a aula diz que quase todos são nefrotóxicos.", "3": "As duas são glicopeptídeos de Gram-positivo."}, "passo": 3}, {"id": "t30", "bloco": "b24", "tema": "Polimixina", "conceito": "polimixina-ultima", "nivel": 1, "papel": "checagem", "enunciado": "Quando a polimixina B é usada, segundo a aula?", "alternativas": ["Quando não sobra outra opção, por ser muito tóxica", "Como primeira escolha em qualquer infecção de pele leve", "Na profilaxia de cirurgia limpa", "Sempre associada à vancomicina"], "corr na e amoxicilina são semissintéticas: parte de origem biológica, parte feita em laboratório.", "errados": {"1": "O exemplo de natural foi a penicilina G.", "2": "O exemplo de sintético foi o sulfametoxazol.", "3": "Esse grupo corresponde aos naturais, como a penicilina G."}, "passo": 2}, {"id": "t34", "bloco": "b25", "tema": "Espectro", "conceito": "espectro-class", "nivel": 2, "papel": "checagem", "enunciado": "Qual dos fármacos abaixo a aula classifica como de espectro amplo?", "alternativas": ["Tetraciclina", "Penicilina G", "Eritromicina", "Estreptomicina"], "correta": 0, "porque": "Tetraciclinas e cloranfenicol são os exemplos de amplo espectro: pegam Gram-positivo, Gram-negativo, clamídia e riquétsia.", "errados": {"1": "O slide põe esse fármaco entre os de espectro estreito.", "2": "O slide põe esse fármaco entre os de espectro estreito.", "3": "O slide põe esse fármaco entre os de espectro estreito."}, "passo": 1}, {"id": "t35", "bloco": "b25", "tema": "Mecanismo", "conceito": "mec-parede", "nivel": 1, "papel": "checagem", "enunciado": "Qual dupla de famílias age inibindo a síntese da parede celular?", "alternativas": ["Beta-lactâmicos e glicopeptídeos", "Aminoglicosídeos e macrolídeos", "Sulfonamidas e quinolonas", "Tetraciclinas e polimixinas"], "correta": 0, "porque": "Penicilinas e cefalosporinas (beta-lactâmicos) e vancomicina (glicopeptídeo) inibem a síntese da parede.", "errados": {"1": "Essas duas agem no ribossomo.", "2": "Essas duas agem no folato e nos ácidos nucleicos.", "3": "Uma age no ribossomo e a outra na membrana."}, "passo": 3}, {"id": "t36", "bloco": "b26", "tema": "Microbioma", "conceito": "microbioma", "nivel": 2, "papel": "checagem", "enunciado": "Paciente usou várias vezes quinolona por conta própria e agora tem diarreia intensa por Clostridium. Qual a explicação da aula?", "alternativas": ["O antimicrobiano destruiu o microbioma e abriu espaço", "A quinolona causa diarreia por toxicidade direta no intestino", "O Clostridium é sensível à quinolona e mudou", "A diarreia é uma alergia ao fármaco"], "correta": 0, "porque": "O uso repetido matou a flora normal; sem concorrência, o Clostridium cresceu. O tratamento citado é vancomicina por via oral.", "errados": {"1": "A aula não atribuiu a diarreia a uma toxicidade direta.", "2": "A explicação da aula foi a perda da flora, não uma mudança do Clostridium.", "3": "A professora não falou em alergia nesse caso."}, "passo": 2}, {"id": "t37", "bloco": "b26", "tema": "Razões", "conceito": "uso-correto", "nivel": 1, "papel": "checagem", "enunciado": "Qual item NÃO está entre as razões do slide para usar antimicrobianos corretamente?", "alternativas": ["Aumentar a venda de medicamentos", "Garantir a eficácia terapêutica", "Preservar o microbioma humano", "Reduzir custos"], "correta": 0, "porque": "O slide lista eficácia, microbioma, evitar resistência e reduzir custos; aumentar vendas não é razão clínica.", "errados": {"1": "Esse item está na lista do slide.", "2": "Esse item está na lista do slide.", "3": "Esse item está na lista do slide."}, "passo": 1}, {"id": "t38", "bloco": "b26", "tema": "Custo", "conceito": "custo", "nivel": 2, "papel": "checagem", "enunciado": "Que medida simples reduziu o uso de medicamentos no hospital de Massachusetts citado pela professora?", "alternativas": ["Mostrar ao médico o valor da prescrição", "Proibir antimicrobianos de alto custo", "Exigir duas assinaturas em cada receita", "Trocar todos por genéricos"], "correta": 0, "porque": "A prescrição eletrônica mostrava o valor com um som de moedas; o próprio médico passou a cortar o desnecessário.", "errados": {"1": "A professora disse que não se proíbe o que o paciente precisa.", "2": "Essa medida não foi citada.", "3": "Essa medida não foi citada."}, "passo": 3}, {"id": "t39", "bloco": "b31", "tema": "Tipos", "conceito": "resist-natural", "nivel": 1, "papel": "checagem", "enunciado": "Um fármaco que só age em Gram-positivos não funciona contra um Gram-negativo. Que tipo de resistência é essa?", "alternativas": ["Natural", "Adquirida por seleção", "Adquirida por indução", "Cruzada entre famílias"], "correta": 0, "porque": "A bactéria nunca foi alvo daquele fármaco: a estrutura é diferente. É a resistência natural, ou primária.", "errados": {"1": "Seleção pressupõe uma bactéria antes sensível que sofreu mutação.", "2": "Indução pressupõe genes recebidos de outra bactéria.", "3": "Resistência cruzada não foi o conceito tratado nesse ponto."}, "passo": 1}, {"id": "t40", "bloco": "b31", "tema": "Indução", "conceito": "resist-adquirida", "nivel": 2, "papel": "checagem", "enunciado": "Uma bactéria sensível recebe de outra um plasmídeo com gene de resistência. Como a aula classifica essa resistência?", "alternativas": ["Adquirida por indução", "Adquirida por seleção", "Natural ou primária", "Resistência por efeito da dose"], "correta": 0, "porque": "Troca de plasmídeos e transposons é o caminho da indução, dentro da resistência adquirida.", "errados": {"1": "Esse caminho é o da mutação que o uso do fármaco seleciona.", "2": "A bactéria era sensível, então não é resistência natural.", "3": "A dose não define o tipo de resistência."}, "passo": 2}, {"id": "t41", "bloco": "b31", "tema": "Seleção", "conceito": "resist-adquirida", "nivel": 3, "papel": "checagem", "enunciado": "No slide dos quatro quadros, uma bactéria resistente já existia antes do antibiótico e, no fim, domina a infecção. O que o antibiótico fez?", "alternativas": ["Matou as sensíveis e deixou a resistente sem concorrência", "Causou a mutação na bactéria resistente", "Transferiu um plasmídeo de resistência entre as bactérias da cultura", "Fortaleceu as bactérias sensíveis"], "correta": 0, "porque": "O antibiótico não cria a mutação; o antibiótico seleciona: mata as sensíveis, e a resistente, que já estava lá, multiplica-se.", "errados": {"1": "A mutação já existia no primeiro quadro.", "2": "Troca de plasmídeo é outro caminho e não é o que o slide mostra.", "3": "As sensíveis morrem , "2": "O exemplo da aula para esse mecanismo foram as porinas.", "3": "O exemplo da aula para esse mecanismo foi a tetraciclina em Bacteroides."}, "passo": 3}, {"id": "t45", "bloco": "b32", "tema": "Caso clínico", "conceito": "mec-permeab", "nivel": 3, "papel": "checagem", "enunciado": "Uma Klebsiella, bactéria Gram-negativa, deixa de responder a um beta-lactâmico porque modificou os canais da membrana externa. Qual mecanismo explica?", "alternativas": ["Menor entrada por alteração das porinas", "Bomba de efluxo que expulsa a tetraciclina", "Alteração da DNA girase", "Produção de penicilinase"], "correta": 0, "porque": "Beta-lactâmicos entram nos Gram-negativos pelas porinas; com as porinas alteradas, o fármaco não penetra.", "errados": {"1": "Efluxo põe para fora um fármaco que já entrou, e o fármaco do caso não é tetraciclina.", "2": "A DNA girase é o alvo das quinolonas.", "3": "O enunciado descreve mudança nos canais, não uma enzima."}, "passo": 2}, {"id": "t46", "bloco": "b32", "tema": "Raciocínio", "conceito": "mec-raciocinio", "nivel": 2, "papel": "checagem", "enunciado": "Por que a professora diz que não é preciso decorar mecanismos de resistência por classe?", "alternativas": ["Porque são os mesmos; muda só o alvo de cada classe", "Porque cada classe tem um mecanismo de resistência exclusivo", "Porque o tema não cai na prova da disciplina", "Porque só os beta-lactâmicos têm resistência"], "correta": 0, "porque": "Os mecanismos se repetem em todas as classes: menos entrada, enzima, alvo alterado e efluxo; o que muda é o alvo de cada uma.", "errados": {"1": "A professora disse o contrário: é tudo parecido.", "2": "A professora avisou que vai perguntar sobre mecanismos de resistência.", "3": "A aula deu exemplos em quinolonas, tetraciclinas e carbapenêmicos."}, "passo": 1}, {"id": "t47", "bloco": "b33", "tema": "Interações", "conceito": "interacoes-toxicidade", "nivel": 2, "papel": "checagem", "enunciado": "Paciente já usa um antineoplásico nefrotóxico e prec no agente provável.", "2": "A professora disse o contrário: são perfis diferentes.", "3": "A dose não é o que o boletim informa."}, "passo": 1}, {"id": "t50", "bloco": "b34", "tema": "Duração", "conceito": "duracao", "nivel": 1, "papel": "checagem", "enunciado": "Qual a duração de tratamento que o slide da aula indica para osteomielite?", "alternativas": ["28 dias", "7 dias", "14 dias", "Dose única"], "correta": 0, "porque": "A osteomielite é a exceção do slide 46: 28 dias, porque o antimicrobiano penetra pouco no osso.", "errados": {"1": "Esse tempo é o mínimo das infecções moderadas.", "2": "Esse tempo é o máximo das infecções graves.", "3": "Dose única aparece para gonorreia e ITU."}, "passo": 3}, {"id": "t51", "bloco": "b34", "tema": "Dose", "conceito": "dose-certa", "nivel": 2, "papel": "checagem", "enunciado": "Por que dose abaixo da necessária favorece a resistência?", "alternativas": ["Não atinge a CIM e deixa sobreviver as menos sensíveis", "Aumenta a toxicidade renal do fármaco", "Faz o fármaco passar a agir só nas bactérias Gram-negativas", "Transforma o fármaco em bactericida"], "correta": 0, "porque": "Sem atingir a concentração eficaz, só as bactérias mais sensíveis morrem; as menos sensíveis sobram e são selecionadas.", "errados": {"1": "Toxicidade se associa a dose alta, não baixa.", "2": "A dose não muda o espectro do fármaco.", "3": "Dose baixa tende ao efeito contrário."}, "passo": 1}, {"id": "t52", "bloco": "b34", "tema": "Caso clínico", "conceito": "via-oral", "nivel": 3, "papel": "checagem", "enunciado": "Idoso estável, com infecção que pode ser tratada por via oral. O que a aula recomenda?", "alternativas": ["Tratar em casa por via oral", "Internar para tomar a medicação oral", "Internar para usar via endovenosa", "Esperar a infecção piorar para internar"], "correta": 0, "porque": "Sempre que possível, via oral e tratamento em casa; internar quem não precisa expõe o idoso aos germes hospitalares.", "errados": {"1": "A professora disse que hoje eisseria", "Bordetella", "Staphylococcus", "Clostridium"], "correta": 0, "porque": "A professora ligou gonorreia a Neisseria e coqueluche a Bordetella.", "errados": {"1": "Esse agente foi ligado à coqueluche.", "2": "Esse agente foi ligado às infecções de pele.", "3": "Esse agente foi ligado à diarreia depois de antimicrobiano."}, "passo": 3}, {"id": "t56", "bloco": "b35", "tema": "Caso integrador", "conceito": "agente-doenca", "nivel": 3, "papel": "checagem", "enunciado": "Paciente de 70 anos, transplantado renal, teve alta há um dia e volta com pneumonia. Já usou penicilina há duas semanas e toma um fármaco nefrotóxico. Qual combinação de cuidados reúne o raciocínio da aula?", "alternativas": ["Germe hospitalar, outro fármaco e menos nefrotoxicidade", "Repetir a penicilina, que já funcionou antes", "Usar o maior espectro possível, sem se preocupar com o rim", "Tratar como infecção comunitária comum"], "correta": 0, "porque": "Alta há um dia: infecção hospitalar. Penicilina recente: provável resistência. Imunossupressão: preferir bactericida. Nefrotóxico em uso: não somar toxicidade.", "errados": {"1": "O uso recente sugere que os resistentes sobreviveram.", "2": "Amplo espectro sem critério seleciona resistência e ignora a toxicidade renal somada.", "3": "Até 48 h depois da alta a infecção é hospitalar."}, "passo": 3}], "microtestes": [{"tipo": "vf", "questao": "q557", "alvo": ["A"], "conceito": "caminho-meio", "bloco": "b14", "enunciado": "Dar antimicrobiano sem indicação clara, \"para garantir\", é exemplo de prescrição racional.", "resposta": false, "explicacao": "É o contrário: a aula pede indicação real e avaliação da gravidade; sem indicação, só se seleciona resistência.", "passo": 3, "id": "m1"}, {"tipo": "vf", "questao": "q557", "alvo": ["B"], "conceito": "poucos-novos", "bloco": "b15", "enunciado": "Na época em que a indústria pagava viagens a médicos, o objetivo era que os médicos saíssem do evento prescrevendo o produto.", "resposta": true, "explicacao": "A professora contou do lançamento da linezolida: \"Era de graça? Não... Para todo mundo sair de lá, prescrever.\" Promoção não é evidência.", "passo": 1, "id": "m2"}, {"tipo": "multipla", "questao": "q557", "alvo": ["C"], "conceito": "espectro-afinidade", "bloco": "b11", "enunciado": "Qual conjunto de critérios a aula usa para escolher um antimicrobiano?", "alternativas": ["Espectro, chegada ao tecido, segurança, evidência e custo", "Preço mais baixo da farmácia mais próxima", "Preferência pessoal de quem está de plantão", "Apenas o antimicrobiano mais recente lançado no mercado"], "correta": 0, "explicacao": "A escolha racional junta espectro, afinidade pelo tecido, toxicidade, evidência de eficácia e custo.", "passo": 2, "id": "m3"}, {"tipo": "lacuna", "questao": "q557", "alvo": ["D"], "conceito": "adesao", "bloco": "b14", "enunciado": "O antimicrobiano tem um tempo certo de uso: se são sete dias, são ____ dias, nem menos, nem a mais sem motivo.", "resposta": "sete", "explicacao": "O tempo depende da doença, do microrganismo e da topografia; prolongar sem motivo mantém a pressão de seleção.", "passo": 2, "id": "m4"}, {"tipo": "multipla", "questao": "q312", "alvo": ["I"], "conceito": "classe-quimica", "bloco": "b24", "enunciado": "Eritromicina e azitromicina pertencem a qual família?", "alternativas": ["Macrolídeos", "Aminoglicosídeos", "Quinolonas", "Tetraciclinas"], "correta": 0, "explicacao": "São os dois exemplos de macrolídeos dos slides.", "passo": 1, "id": "m5"}, {"tipo": "vf", "questao": "q312", "alvo": ["II"], "conceito": "vanco-reserva", "bloco": "b23", "enunciado": "O glicopeptídeo mais conhecido é usado quando o Gram-positivo não respondeu à oxacilina.", "resposta": true, "explicacao": "É a vancomicina, glicopeptídeo, ao lado da teicoplanina.", "passo": 4, "id": "m6"}, {"tipo": "lacuna", "questao": "q312", "alvo": ["II", "III"], "conceito": "classe-quimica", "bloco": "b24", "enunciado": "Norfloxacino e ciprofloxacino são ____, enquanto a doxiciclina é uma tetraciclina.", "resposta": "quinolonas", "explicacao": "As quinolonas do slide são norfloxacino e ciprofloxacino; a doxiciclina é o exemplo de tetraciclina, e polimixina é polipeptídeo.", "passo": 1, "id": "m7"}, {"tipo": "vf", "questao": "q312", "alvo": ["IV"], "conceito": "classe-quimica", "bloco": "b24", "enunciado": "Amicacina, gentamicina e neomicina são exemplos da mesma família.", "resposta": true, "explicacao": "São os aminoglicosídeos do slide 10.", "passo": 1, "id": "m8"}, {"tipo": "multipla", "questao": "q313", "alvo": ["I"], "conceito": "mec-proteica", "bloco": "b25", "enunciado": "As tetraciclinas atuam em qual alvo da bactéria?", "alternativas": ["Síntese proteica, no ribossomo", "Síntese do DNA", "Síntese da parede", "Síntese do ácido fólico"], "correta": 0, "explicacao": "Tetraciclinas estão no grupo que afeta a síntese proteica, de forma bacteriostática.", "passo": 3, "id": "m9"}, {"tipo": "vf", "questao": "q313", "alvo": ["II"], "conceito": "mec-parede", "bloco": "b25", "enunciado": "Penicilinas e cefalosporinas inibem a formação da parede celular e são bactericidas.", "resposta": true, "explicacao": "São os beta-lactâmicos da lista de inibidores da parede do slide 29.", "passo": 3, "id": "m10"}, {"tipo": "lacuna", "questao": "q313", "alvo": ["III"], "conceito": "mec-outros", "bloco": "b25", "enunciado": "Trimetoprim e sulfonamidas bloqueiam enzimas do metabolismo do ____.", "resposta": "folato", "explicacao": "O slide 30 diz que os dois bloqueiam enzimas essenciais do metabolismo dos folatos.", "passo": 3, "id": "m11"}, {"tipo": "vf", "questao": "q313", "alvo": ["IV"], "conceito": "mec-outros", "bloco": "b25", "enunciado": "Rifampicina e quinolonas afetam o metabolismo dos ácidos nucleicos.", "resposta": true, "explicacao": "É a lista do slide 30 para ácidos nucleicos.", "passo": 3, "id": "m12"}, {"tipo": "vf", "questao": "q393", "alvo": ["A", "D"], "conceito": "mec-proteica", "bloco": "b25", "enunciado": "Os aminoglicosídeos agem na síntese proteica, no ribossomo.", "resposta": true, "explicacao": "Agem no ribossomo e, diferente dos outros desse grupo, são bactericidas.", "passo": 3, "id": "m13"}, {"tipo": "multipla", "questao": "q393", "alvo": ["C"], "conceito": "mec-proteica", "bloco": "b25", "enunciado": "No slide 32, a linezolida aparece em qual grupo?", "alternativas": ["Inibidores da síntese de proteínas", "Inibidores da parede", "Inibidores do folato", "Inibidores da síntese de DNA"], "correta": 0, "explicacao": "A figura do slide põe a linezolida junto de tetraciclinas, macrolídeos, clindamicina e cloranfenicol.", "passo": 3, "id": "m14"}, {"tipo": "lacuna", "questao": "q393", "alvo": ["B"], "conceito": "mec-parede", "bloco": "b25", "enunciado": "A vancomicina, um glicopeptídeo, inibe a síntese da ____ celular.", "resposta": "parede", "explicacao": "Está na lista de inibidores da parede do slide 29, com penicilinas e cefalosporinas.", "passo": 3, "id": "m15"}, {"tipo": "vf", "questao": "q393", "alvo": ["E"], "conceito": "mec-outros", "bloco": "b25", "enunciado": "As sulfonamidas inibem a parede celular, como as penicilinas.", "resposta": false, "explicacao": "As sulfonamidas bloqueiam enzimas do metabolismo do folato.", "passo": 3, "id": "m16"}, {"tipo": "vf", "questao": "q398", "alvo": ["Menos entrada"], "conceito": "mec-permeab", "bloco": "b32", "enunciado": "Nos Gram-negativos, porinas alteradas podem impedir a entrada de beta-lactâmicos.", "resposta": true, "explicacao": "Os beta-lactâmicos entram pelas porinas; alteradas, o fármaco não penetra.", "passo": 2, "id": "m17"}, {"tipo": "multipla", "questao": "q398", "alvo": ["Enzima"], "conceito": "mec-enzima", "bloco": "b32", "enunciado": "Penicilinases e carbapenemases fazem o quê com o fármaco?", "alternativas": ["Destroem o fármaco", "Põem o fármaco para fora", "Mudam o alvo do fármaco", "Impedem a entrada do fármaco na bactéria"], "correta": 0, "explicacao": "São enzimas produzidas pela bactéria que inativam o antimicrobiano.", "passo": 3, "id": "m18"}, {"tipo": "lacuna", "questao": "q398", "alvo": ["Alvo alterado"], "conceito": "mec-alvo", "bloco": "b32", "enunciado": "As quinolonas se ligam à ____; se a bactéria altera essa enzima, o fármaco não se liga.", "resposta": "DNA girase", "explicacao": "É o exemplo da aula de alteração do local de ligação.", "passo": 4, "id": "m19"}, {"tipo": "vf", "questao": "q398", "alvo": ["Efluxo"], "conceito": "mec-efluxo", "bloco": "b32", "enunciado": "Na bomba de efluxo, o fármaco nem chega a entrar na bactéria.", "resposta": false, "explicacao": "O fármaco entra, mas é posto para fora antes de acumular; quem não entra é o caso das porinas alteradas.", "passo": 5, "id": "m20"}, {"tipo": "multipla", "questao": "q399", "alvo": ["Agente e topografia"], "conceito": "agente-provavel", "bloco": "b11", "enunciado": "Infecção de pele, sem internação: qual agente a aula manda pensar primeiro?", "alternativas": ["Estafilococo", "Pseudomonas", "Clostridium", "Escherichia coli"], "correta": 0, "explicacao": "Pela topografia (pele), o agente mais provável é o estafilococo.", "passo": 3, "id": "m21"}, {"tipo": "vf", "questao": "q399", "alvo": ["Agente e topografia"], "conceito": "escolha-principios", "bloco": "b33", "enunciado": "Na sequência da aula, o fármaco é escolhido antes de definir o agente provável.", "resposta": false, "explicacao": "É o contrário: primeiro a infecção e o agente, depois o paciente, por último o fármaco.", "passo": 1, "id": "m22"}, {"tipo": "lacuna", "questao": "q399", "alvo": ["Origem e uso prévio"], "conceito": "origem-infeccao", "bloco": "b12", "enunciado": "Infecção que aparece até ____ horas depois da alta é considerada hospitalar.", "resposta": "48", "explicacao": "Regra da aula: até 48 horas depois da alta, a infecção foi adquirida no hospital.", "passo": 1, "id": "m23"}, {"tipo": "vf", "questao": "q399", "alvo": ["Origem e uso prévio"], "conceito": "ccih-boletim", "bloco": "b33", "enunciado": "O perfil de sensibilidade das bactérias é o mesmo em qualquer hospital.", "resposta": false, "explicacao": "Cada instituição tem o seu; a CCIH publica o boletim.", "passo": 1, "id": "m24"}, {"tipo": "multipla", "questao": "q399", "alvo": ["Paciente"], "conceito": "imuno-cida", "bloco": "b22", "enunciado": "Para o paciente imunodeprimido, qual efeito se prefere?", "alternativas": ["Bactericida", "Bacteriostático", "Tanto faz", "Bacteriostático em dose reduzida"], "correta": 0, "explicacao": "Sem sistema imune, ninguém elimina as bactérias que o bacteriostático só paralisou.", "passo": 2, "id": "m25"}, {"tipo": "vf", "questao": "q399", "alvo": ["Paciente"], "conceito": "interacoes-toxicidade", "bloco": "b33", "enunciado": "Associar dois fármacos nefrotóxicos aumenta o risco de lesão renal.", "resposta": true, "explicacao": "Somar efeitos adversos iguais aumenta a toxicidade; quase todo antimicrobiano é nefrotóxico.", "passo": 2, "id": "m26"}, {"tipo": "lacuna", "questao": "q399", "alvo": ["Dose, via e duração"], "conceito": "via-oral", "bloco": "b34", "enunciado": "Sempre que possível, a via preferida é a ____, com tratamento em casa.", "resposta": "oral", "explicacao": "A professora disse: \"sempre que possível, oral; sempre que possível, tratar o paciente na casa dele\".", "passo": 2, "id": "m27"}, {"tipo": "multipla", "questao": "q399", "alvo": ["Dose, via e duração"], "conceito": "duracao", "bloco": "b34", "enunciado": "Qual infecção do slide tem o tratamento mais longo?", "alternativas": ["Osteomielite", "Gonorreia", "ITU não complicada", "Faringite bacteriana"], "correta": 0, "explicacao": "A osteomielite exige 28 dias, pela pouca penetração do fármaco no osso.", "passo": 3, "id": "m28"}, {"tipo": "vf", "questao": "q399", "alvo": ["Dose, via e duração"], "conceito": "dose-certa", "bloco": "b34", "enunciado": "Dose abaixo da necessária pode selecionar bactérias resistentes.", "resposta": true, "explicacao": "Sem atingir a concentração eficaz, sobram as menos sensíveis.", "passo": 1, "id": "m29"}, {"tipo": "vf", "questao": "q399", "alvo": ["Reavaliação em 48 h"], "conceito": "reavaliar-48h", "bloco": "b12", "enunciado": "Sem melhora em 48 horas, a aula recomenda trocar o antimicrobiano.", "resposta": true, "explicacao": "É a regra das 48 horas; a exceção são as infecções graves, que não esperam.", "passo": 3, "id": "m30"}, {"tipo": "vf", "questao": "q325", "alvo": ["A"], "conceito": "mec-enzima", "bloco": "b32", "enunciado": "A bactéria pode produzir uma enzima que destrói o antimicrobiano antes que o fármaco aja.", "resposta": true, "explicacao": "É a inativação enzimática, um dos quatro mecanismos.", "passo": 3, "id": "m31"}, {"tipo": "lacuna", "questao": "q325", "alvo": ["B"], "conceito": "mec-outros", "bloco": "b25", "enunciado": "As sulfonamidas agem na via do ____ bacteriano.", "resposta": "folato", "explicacao": "É o alvo de sulfonamidas e trimetoprim.", "passo": 3, "id": "m32"}, {"tipo": "multipla", "questao": "q325", "alvo": ["C"], "conceito": "mec-proteica", "bloco": "b25", "enunciado": "Em que estrutura agem tetraciclinas e aminoglicosídeos?", "alternativas": ["Ribossomo", "Parede celular", "DNA girase", "Membrana citoplasmática"], "correta": 0, "explicacao": "As duas famílias agem na síntese proteica, no ribossomo.", "passo": 3, "id": "m33"}, {"tipo": "vf", "questao": "q325", "alvo": ["D"], "conceito": "classe-quimica", "bloco": "b24", "enunciado": "A anfotericina, um poliênico, age no ergosterol da membrana dos fungos.", "resposta": true, "explicacao": "Ergosterol é da membrana fúngica e da Leishmania; não tem relação com beta-lactâmicos.", "passo": 4, "id": "m34"}, {"tipo": "multipla", "questao": "q325", "alvo": ["E"], "conceito": "mec-raciocinio", "bloco": "b32", "enunciado": "Quantos são os mecanismos de resistência que a aula descreve?", "alternativas": ["Quatro", "Dois", "Seis", "Oito"], "correta": 0, "explicacao": "Menos entrada, enzima, alvo alterado e efluxo.", "passo": 1, "id": "m35"}], "questoes": [{"id": "q557", "capitulo": "c1", "ref": "Simulado Final de Farmacoterapia, questão 40 (simulado baseado nas provas antigas)", "enunciado": "Qual das alternativas representa um exemplo de uso racional de medicamentos?", "itens": [], "tabela": null, "resposta_esperada": "Gabarito não oficial: C. A) errada: amplo espectro, sem indicação e por tempo prolongado é o oposto do uso racional; seleciona resistência e destrói o microbioma. B) errada: introduzir fármaco só por promoção da indústria ignora evidência e custo; a professora lembrou que os brindes da indústria tinham esse objetivo. C) certa: eficácia, segurança, custo e evidência são exatamente os critérios de escolha da aula. D) errada: manter carbapenêmico depois de a infecção resolver prolonga a pressão de seleção sem benefício; o tempo do tratamento tem limite.", "comentario": "Leia cada opção perguntando: há indicação, há evidência, o espectro e o tempo são os necessários? Só uma opção responde \"sim\" às três.", "figuras": [], "alvos": {"A": ["caminho-meio"], "B": ["poucos-novos"], "C": ["espectro-afinidade"], "D": ["adesao"]}, "objetiva": {"alts": ["Prescrever antibiótico de amplo espectro por tempo prolongado sem indicação", "Introduzir medicamento novo apenas por promoção da indústria", "Escolher terapia baseada em eficácia, segurança, custo e evidência científica", "Manter carbapenêmico após resolução da infecção apenas por segurança"], "correta": 2}}, {"id": "q312", "capitulo": "c2", "ref": "Prova antiga, compilado do banco (questão 312 do Banco de Questões)", "enunciado": "Acerca dos antimicrobianos, analise as afirmativas a seguir:", "itens": ["I. A azitromicina pertence à classe dos macrolídeos.", "II. A vancomicina pertence à classe das quinolonas.", "III. A doxiciclina pertence à classe das polimixinas.", "IV. A gentamicina pertence à classe dos aminoglicosídeos.", "Estão corretas as afirmativas:"], "tabela": null, "resposta_esperada": "Gabarito não oficial: C (I e IV). I) Correta: azitromicina é macrolídeo. II) Errada: vancomicina é glicopeptídeo, não quinolona. III) Errada: doxiciclina é tetraciclina, não polimixina. IV) Correta: gentamicina é aminoglicosídeo. A) e D) incluem a II, falsa; B) inclui a II e exclui a I.", "comentario": "Julgue cada afirmativa só pela família do fármaco (slides 10 e 11) e depois procure a opção que reúne exatamente as verdadeiras.", "figuras": [], "alvos": {"I": ["classe-quimica"], "II": ["vanco-reserva", "classe-quimica"], "III": ["classe-quimica"], "IV": ["classe-quimica"]}, "objetiva": {"alts": ["I e II apenas", "II e IV apenas", "I e IV apenas", "I, II e III apenas"], "correta": 2}}, {"id": "q313", "capitulo": "c2", "ref": "Prova antiga, compilado do banco (questão 313 do Banco de Questões)", "enunciado": "Sobre os mecanismos de ação dos fármacos antimicrobianos, analise os itens abaixo:", "itens": ["I. A doxiciclina danifica o DNA bacteriano.", "II. A amoxicilina atua na síntese da parede celular bacteriana (peptideoglicano).", "III. A sulfadiazina age sobre a síntese ou ação do folato bacteriano.", "IV. O ciprofloxacino age sobre a síntese do DNA bacteriano.", "Estão CORRETOS:"], "tabela": null, "resposta_esperada": "Gabarito não oficial: D (II, III e IV). I) Errado: a doxiciclina é tetraciclina e age na síntese proteica, no ribossomo, não no DNA. II) Certo: a amoxicilina, beta-lactâmico, inibe a síntese da parede (peptideoglicano). III) Certo: a sulfadiazina é sulfonamida e age no folato. IV) Certo: o ciprofloxacino é quinolona e age nos ácidos nucleicos. A), B) e C) incluem o item I, que é falso.", "comentario": "Para cada fármaco, identifique a família e depois o alvo da família: tetraciclina, ribossomo; beta-lactâmico, parede; sulfa, folato; quinolona, DNA.", "figuras": [], "alvos": {"I": ["mec-proteica"], "II": ["mec-parede"], "III": ["mec-outros"], "IV": ["mec-outros"]}, "objetiva": {"alts": ["Somente os itens I e II", "Somente os itens I e III", "Somente os itens I, II e IV", "Somente os itens II, III e IV"], "correta": 3}}, {"id": "q393", "capitulo": "c2", "ref": "Prova antiga, compilado do banco (questão 393 do Banco de Questões; início do enunciado ilegível no original)", "enunciado": "(Início do enunciado incompleto no original) … constitutivamente resistentes aos antibióticos inibidores da síntese da parede celular. Assinale a alternativa que apresenta as duas classes mais importantes de inibidores da parede celular:", "itens": [], "tabela": null, "resposta_esperada": "Gabarito não oficial: B. B) Certa: beta-lactâmicos (penicilinas, cefalosporinas) e glicopeptídeos (vancomicina) inibem a síntese da parede. A) Errada: aminoglicosídeos e macrolídeos agem no ribossomo. C) Errada: macrolídeos e oxazolidinonas (linezolida) agem na síntese proteica. D) Errada: os aminoglicosídeos agem no ribossomo. E) Errada: as sulfonamidas agem no folato.", "comentario": "Elimine toda opção que tenha pelo menos uma família de outro alvo: ribossomo (aminoglicosídeos, macrolídeos, linezolida) ou folato (sulfas).", "figuras": [], "alvos": {"A": ["mec-proteica"], "B": ["mec-parede"], "C": ["mec-proteica"], "D": ["mec-proteica"], "E": ["mec-outros"]}, "objetiva": {"alts": ["Aminoglicosídeos e macrolídeos", "Beta-lactâmicos e glicopeptídeos", "Macrolídeos e oxazolidinonas", "Beta-lactâmicos e aminoglicosídeos", "Sulfonamidas e glicopeptídeos"], "correta": 1}}, {"id": "q398", "capitulo": "c3", "ref": "Prova antiga, dissertativa 4 (questão 398 do Banco de Questões; resolvida por alunos na pasta Provas Antigas)", "enunciado": "Descreva os mecanismos de resistência bacterianos.", "itens": null, "tabela": null, "resposta_esperada": "Para agir, o antimicrobiano precisa atingir concentração adequada no alvo, dentro da bactéria; cada mecanismo impede uma etapa. (1) Redução da captação ou da permeabilidade: a bactéria altera parede, membrana ou porinas e o fármaco não entra; ex.: beta-lactâmicos em Gram-negativos com porinas alteradas. (2) Produção de enzimas que inativam o fármaco: ex.: beta-lactamases (penicilinases), cefalosporinases e carbapenemases. (3) Alteração do local de ligação ou da enzima-alvo, ou produção do alvo em excesso: ex.: quinolonas e DNA girase alterada. (4) Bomba de efluxo: o fármaco entra, mas é posto para fora e não acumula; ex.: tetraciclina e Bacteroides. Os mecanismos são os mesmos em todas as classes; muda o alvo.", "comentario": "Comece pela condição (concentração no alvo) e percorra o caminho do fármaco: entrar, ficar inteiro, encaixar, acumular. Para cada etapa, nomeie o mecanismo, explique em uma frase e dê o exemplo da aula; a professora pede explicação, não só a lista.", "figuras": [], "alvos": {"Menos entrada": ["mec-permeab"], "Enzima": ["mec-enzima"], "Alvo alterado": ["mec-alvo"], "Efluxo": ["mec-efluxo"]}}, {"id": "q399", "capitulo": "c3", "ref": "Prova antiga, dissertativa 5 (questão 399 do Banco de Questões; resolvida por alunos na pasta Provas Antigas)", "enunciado": "Como devemos fazer a prescrição de antimicrobianos?", "itens": null, "tabela": null, "resposta_esperada": "Pela sequência da aula. (1) Infecção e agente: definir a infecção provável e, pela topografia e pela idade, o agente etiológico mais provável; pensar no simples. (2) Origem e história: comunidade ou hospital (até 48 h depois da alta é hospitalar), sensibilidade da instituição (boletim da CCIH) e antimicrobianos já usados, que não se repetem. (3) Paciente: idade, função renal e hepática, local da infecção (afinidade do fármaco pelo tecido), imunidade (imunodeprimido, bactericida) e outros fármacos (evitar mesmo mecanismo, interações enzimáticas e toxicidades somadas, como a nefrotoxicidade). (4) Fármaco: espectro restrito quando possível, bactericida ou bacteriostático, toxicidade, farmacocinética e posologia que favoreçam a adesão, evidência de eficácia e custo. (5) Prescrição: dose adequada ao sítio e ao tipo de infecção (dose de ataque nas graves), via oral sempre que possível, duração certa (mínima necessária), monoterapia sempre que possível, receita com retenção, orientação para completar o tratamento e reavaliação em 48 horas. Guiar-se por cultura quando possível, colhendo antes de começar nas infecções graves.", "comentario": "Organize a resposta como um fluxo, do diagnóstico à reavaliação, e dê um exemplo curto em cada etapa. Os itens de cultura antes do tratamento e de monoterapia são detalhados na Parte 02 da aula (volume 1B); vale citá-los aqui.", "figuras": [], "alvos": {"Agente e topografia": ["agente-provavel", "escolha-principios"], "Origem e uso prévio": ["origem-infeccao", "ccih-boletim"], "Paciente": ["interacoes-toxicidade", "imuno-cida"], "Dose, via e duração": ["dose-certa", "via-oral", "duracao"], "Reavaliação em 48 h": ["reavaliar-48h"]}}, {"id": "q325", "capitulo": "c3", "ref": "Simulado embasado em provas antigas, bloco 5.1, questão 9 (questão 325 do Banco de Questões)", "enunciado": "O mecanismo de resistência bacteriana mais comum contra beta-lactâmicos envolve:", "itens": [], "tabela": null, "resposta_esperada": "Gabarito não oficial: A. A) Certa: a bactéria produz beta-lactamases, enzimas que inativam o beta-lactâmico; foi o exemplo da aula para inativação enzimática. B) Errada: folato é alvo das sulfonamidas, não dos beta-lactâmicos. C) Errada: o ribossomo 30S é alvo de outras famílias, e o beta-lactâmico age na parede. D) Errada: ergosterol é da membrana dos fungos, alvo dos poliênicos. E) Errada: prostaglandinas não fazem parte dos quatro mecanismos de resistência.", "comentario": "Lembre o alvo do beta-lactâmico (parede) e os quatro mecanismos de resistência; descarte o que é alvo de outra família ou não é mecanismo de resistência.", "figuras": [], "alvos": {"A": ["mec-enzima"], "B": ["mec-outros"], "C": ["mec-proteica"], "D": ["classe-quimica"], "E": ["mec-raciocinio"]}, "objetiva": {"alts": ["produção de beta-lactamases", "aumento da síntese de folato", "mutação ribossomal 30S exclusivamente", "aumento de ergosterol", "produção de prostaglandinas"], "correta": 0}}], "rev": {"c1": {"cornell": [[["O que a disciplina cobra?", "Mecanismo, espectro, interações e reações adversas."], ["Quinolona tem afinidade por?", "Pulmão e rim."], ["Agente provável da pele?", "Estafilococo."], ["Prazo da infecção hospitalar após a alta?", "48 horas."], ["O que é pressão seletiva?", "Uso que mata sensíveis e deixa resistentes."], ["Quando trocar o fármaco?", "Sem melhora em 48 h."], ["O que é CIM?", "Menor concentração que impede o crescimento."], ["Para que serve a dose de ataque?", "Atingir a CIM já na primeira dose."], ["Por que completar o tratamento?", "Para não deixar os resistentes crescerem."], ["Último antimicrobiano novo citado?", "Linezolida."], ["O fármaco da profilaxia pode tratar?", "Não."]], "Escolher antimicrobiano é juntar espectro, afinidade pelo tecido e agente provável, considerar a origem da infecção e o uso prévio, agir rápido nas graves e preservar cada fármaco: receita retida, adesão, rodízio, associação e profilaxia separada de tratamento."], "quadros": [["Situações e conduta", ["Situação", "Risco", "Conduta da aula"], [["Infecção hospitalar", "Germe resistente", "Considerar resistência na escolha"], ["Uso recente do fármaco", "Resistentes sobreviveram", "Escolher outro"], ["Meningite", "Morte antes de 48 h", "Dose de ataque"], ["Paciente para no 3º dia", "Infecção volta", "Orientar a completar"], ["Quadro viral", "Seleção sem benefício", "Explicar e reavaliar"], ["Profilaxia prévia", "Resistência ao fármaco", "Tratar com outro"]]]], "topicos_html": "<ol class=\"outline\"><li><span class=\"it\">Foco da disciplina<span class=\"frase\">Família, mecanismo, espectro, interações e reações adversas.</span></span><ol><li><span class=\"it\"><b>Indicação</b><span class=\"expl\">Só entra porque depende da farmacocinética.</span></span></li></ol></li><li><span class=\"it\">Escolha racional<span class=\"frase\">Três perguntas ao mesmo tempo.</span></span><ol><li><span class=\"it\"><b>Espectro</b><span class=\"expl\">Quem o fármaco alcança.</span></span></li><li><span class=\"it\"><b>Afinidade</b><span class=\"expl\">Se chega ao tecido; quinolona: pulmão e rim.</span></span></li><li><span class=\"it\"><b>Agente provável</b><span class=\"expl\">Pela topografia e idade; pele: estafilococo.</span></span></li></ol></li><li><span class=\"it\">Origem e uso prévio<span class=\"frase\">Hospital e uso recente indicam resistência.</span></span><ol><li><span class=\"it\"><b>48 h após a alta</b><span class=\"expl\">Ainda é infecção hospitalar.</span></span></li><li><span class=\"it\"><b>Pressão seletiva</b><span class=\"expl\">Uso amplo e por insegurança seleciona superbactérias; CCIH organiza.</span></span></li><li><span class=\"it\"><b>Reavaliar</b><span class=\"expl\">Sem melhora em 48 h, trocar; meningite não espera.</span></span></li></ol></li><li><span class=\"it\">Dose de ataque<span class=\"frase\">Atinge a CIM já na primeira dose.</span></span><ol><li><span class=\"it\"><b>CIM</b><span class=\"expl\">Concentração mínima que impede o crescimento.</span></span></li><li><span class=\"it\"><b>Quando</b><span class=\"expl\">Infecções graves, como meningite.</span></span></li></ol></li><li><span class=\"it\">Uso responsável<span class=\"frase\">Receita retida, adesão e caminho do meio.</span></span><ol><li><span class=\"it\"><b>Adesão</b><span class=\"expl\">Parar ao melhorar deixa os resistentes crescerem.</span></span></li><li><span class=\"it\"><b>Vírus</b><span class=\"expl\">Antimicrobiano não trata; explicar à mãe.</span></span></li></ol></li><li><span class=\"it\">Preservar os fármacos<span class=\"frase\">Quase não surgem novos.</span></span><ol><li><span class=\"it\"><b>Associações</b><span class=\"expl\">Fármaco antigo com inibidor de enzima.</span></span></li><li><span class=\"it\"><b>Rodízio</b><span class=\"expl\">Sem uso, a sensibilidade volta.</span></span></li><li><span class=\"it\"><b>Profilaxia</b><span class=\"expl\">O que previne não trata.</span></span></li></ol></li></ol>", "mapa_svgs": ["<svg class=\"rv-mapa\" viewBox=\"0 0 640 410\" width=\"100%\" xmln  class=\"expl\">Origem natural.</span></span></li><li><span class=\"it\"><b>Antisséptico</b><span class=\"expl\">Tecido vivo.</span></span></li><li><span class=\"it\"><b>Desinfetante</b><span class=\"expl\">Objeto.</span></span></li><li><span class=\"it\"><b>Esterilização</b><span class=\"expl\">Processo, só material.</span></span></li></ol></li><li><span class=\"it\">Efeito<span class=\"frase\">Matar ou parar de crescer.</span></span><ol><li><span class=\"it\"><b>Bactericida</b><span class=\"expl\">Mata.</span></span></li><li><span class=\"it\"><b>Bacteriostático</b><span class=\"expl\">Para o crescimento; o sistema imune elimina.</span></span></li><li><span class=\"it\"><b>Imunodeprimido</b><span class=\"expl\">Preferir bactericida.</span></span></li><li><span class=\"it\"><b>Dose</b><span class=\"expl\">Muda o efeito só em alguns fármacos.</span></span></li><li><span class=\"it\"><b>CIM e CBM</b><span class=\"expl\">Para e mata; razão CBM/CIM.</span></span></li></ol></li><li><span class=\"it\">História<span class=\"frase\">Famílias em ondas.</span></span><ol><li><span class=\"it\"><b>Ordem</b><span class=\"expl\">Sulfas, beta-lactâmicos, cloranfenicol e tetraciclinas, aminoglicosídeos, macrolídeos, glicopeptídeos, quinolonas, linezolida.</span></span></li><li><span class=\"it\"><b>Papéis</b><span class=\"expl\">Macrolídeo na alergia; vancomicina na resistência à oxacilina.</span></span></li><li><span class=\"it\"><b>Gerações</b><span class=\"expl\">Quinolona amplia; cefalosporina muda.</span></span></li></ol></li><li><span class=\"it\">Estrutura química<span class=\"frase\">Famílias e exemplos.</span></span><ol><li><span class=\"it\"><b>Associações</b><span class=\"expl\">Penicilina + amicacina; Nebacetin.</span></span></li><li><span class=\"it\"><b>Vanco × teico</b><span class=\"expl\">Mesmo espectro; vias diferentes.</span></span></li><li><span class=\"it\"><b>Polimixina</b><span class=\"expl\">Último recurso.</span></span></li></ol></li><li><span class=\"it\">
