 Gram+ x Gram-?", "Natural."], ["Seleção é?", "Mutação selecionada pelo uso."], ["Indução é?", "Plasmídeos e transposons."], ["Condição para o fármaco agir?", "Concentração no alvo, dentro da bactéria."], ["Porinas alteradas?", "Menos entrada."], ["Carbapenemase?", "Enzima que inativa."], ["Quinolona e DNA girase?", "Alvo alterado."], ["Tetraciclina e Bacteroides?", "Bomba de efluxo."], ["Quase todo antimicrobiano é?", "Nefrotóxico."], ["Via preferida?", "Oral, em casa."], ["Osteomielite dura?", "28 dias."], ["Sulfa e anemia?", "Folato, alvo em comum."]], "A resistência é natural ou adquirida, e a adquirida usa sempre os mesmos quatro mecanismos. A escolha percorre agente, origem, paciente e fármaco, e a prescrição só termina com dose, via e duração certas e reavaliação em 48 horas."], "quadros": [["Mecanismos de resistência", ["Mecanismo", "Etapa bloqueada", "Exemplo"], [["Menos entrada", "Entrar", "Beta-lactâmicos e porinas"], ["Enzima", "Ficar inteiro", "Beta-lactamases, carbapenemases"], ["Alvo alterado", "Encaixar", "Quinolona e DNA girase"], ["Efluxo", "Acumular", "Tetraciclina e Bacteroides"]]], ["Duração do tratamento", ["Situação", "Tempo", "Por quê"], [["Moderada", "7 a 10 dias", "Padrão"], ["Grave", "10 a 14 dias", "Mais carga bacteriana"], ["Gonorreia, ITU", "Dose única", "Slide 46"], ["ITU não complicada", "3 dias", "Slide 46"], ["Osteomielite", "28 dias", "Pouca penetração no osso"]]]], "topicos_html": "<ol class=\"outline\"><li><span class=\"it\">Tipos de resistência<span class=\"frase\">Natural e adquirida.</span></span><ol><li><span class=\"it\"><b>Natural</b><span class=\"expl\">A bactéria não tem o alvo.</span></span></li><li><span class=\"it\"><b>Adquirida</b><span class=\"expl\">Era sensível e mudou.</span></span><ol><li><span class=\"it\"><b>Seleção</b><span class=\"expl\">Mutação selecionada pelo uso.</span></span></li><li><span class=\"it\"><b>Indução</b><span class=\"expl\">Plasmídeos e transposons.</span></span></li></ol></li></ol></li><li><span class=\"it\">Quatro mecanismos<span class=\"frase\">Muda só o alvo de cada classe.</span></span><ol><li><span class=\"it\"><b>Menos entrada</b><span class=\"expl\">Porinas; beta-lactâmicos em Gram-negativos.</span></span></li><li><span class=\"it\"><b>Enzima</b><span class=\"expl\">Beta-lactamases, carbapenemases.</span></span></li><li><span class=\"it\"><b>Alvo alterado</b><span class=\"expl\">Quinolona e DNA girase.</span></span></li><li><span class=\"it\"><b>Efluxo</b><span class=\"expl\">Tetraciclina e Bacteroides.</span></span></li></ol></li><li><span class=\"it\">Escolha<span class=\"frase\">Sequência da aula.</span></span><ol><li><span class=\"it\"><b>Antes do fármaco</b><span class=\"expl\">Infecção, agente, origem, CCIH, uso prévio.</span></span></li><li><span class=\"it\"><b>Paciente</b><span class=\"expl\">Idade, rim, fígado, local, imunidade, outros fármacos.</span></span></li><li><span class=\"it\"><b>Fármaco</b><span class=\"expl\">Espectro, efeito, toxicidade, PK, via, evidência, custo.</span></span></li><li><span class=\"it\"><b>Nefrotoxicidade</b><span class=\"expl\">Quase todos; não somar.</span></span></li></ol></li><li><span class=\"it\">Prescrição<span class=\"frase\">Dose, via e duração.</span></span><ol><li><span class=\"it\"><b>Dose</b><span class=\"expl\">Errada gera resistência; receita retida.</span></span></li><li><span class=\"it\"><b>Via</b><span class=\"expl\">Oral e em casa.</span></span></li><li><span class=\"it\"><b>Duração</b><span class=\"expl\">7 a 10, 10 a 14, dose única, 3 dias, 28 na osteomielite.</span></span></li></ol></li><li><span class=\"it\">Bactéria e paciente<span class=\"frase\">Estrutura e alvo em comum.</span></span><ol><li><span class=\"it\"><b>Gram-negativo</b><span class=\"expl\">Porinas hidrofílicas.</span></span></li><li><span class=\"it\"><b>Efeito adverso</b><span class=\"expl\">Sulfa, folato, anemia.</span></span></li><li><span class=\"it\"><b>Agente</b><span class=\"expl\">Coqueluche, Bordetella; gonorreia, Neisseria.</span></span></li></ol></li></ol>", "mapa_svgs": ["<svg class=\"rv-mapa\" viewBox=\"0 0 640 561\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, sans-serif\"><path d=\"M78 277.7 C85.5 277.7,85.5 29.8,93.0 29.8\" stroke=\"#2b4f7e\" stroke-width=\"1.5\" fill=\"none\"/><rect x=\"93.0\" y=\"20.1\" width=\"152.1\" height=\"19.2\" rx=\"6\" fill=\"#2b4f7e\"/><text x=\"100.0\" y=\"33.5\" font-size=\"10.8\" font-weight=\"600\" fill=\"#fff\">Resistência</text><path d=\"M245.1 29.8 C253.3 29.8,253.3 11.6,260.1 11.6\" stroke=\"#2b4f7e\" stroke-width=\"1.1\" fill=\"none\"/><rect x=\"260.1\" y=\"2.0\" width=\"55.2\" height=\"19.2\" rx=\"5\" fill=\"#eef3f9\" stroke=\"#2b4f7e\" stroke-width=\".8\"/><text x=\"267.1\" y=\"15.1\" font-size=\"10\" font-weight=\"600\" fill=\"#2b4f7e\">Natural</text><path d=\"M245.1 29.8 C253.3 29.8,253.3 47.9,260.1 47.9\" stroke=\"#2b4f7e\" stroke-width=\"1.1\" fill=\"none\"/><rect x=\"260.1\" y=\"38.3\" width=\"66.4\" height=\"19.2\" rx=\"5\" fill=\"#eef3f9\" stroke=\"#2b4f7e\" stroke-width=\".8\"/><text x=\"267.1\" y=\"51.4\" font-size=\"10\" font-weight=\"600\" fill=\"#2b4f7e\">Adquirida</text><path d=\"M326.5 47.9 C390.2 47.9,390.2 35.8,442.3 35.8\" stroke=\"#2b4f7e\" stroke-width=\"0.8\" fill=\"none\"/><rect x=\"442.3\" y=\"26.2\" width=\"51.3\" height=\"19.2\" rx=\"4\" fill=\"#fff\" stroke=\"#2b4f7e\" stroke-opacity=\".35\" stroke-width=\".6\"/><text x=\"449.3\" y=\"39.2\" font-size=\"9.6\" font-weight=\"400\" fill=\"#1d1d1f\">Seleção</text><path d=\"M326.5 47.9 C390.2 47.9,390.2 60.0,442.3 60.0\" stroke=\"#2b4f7e\" stroke-width=\"0.8\" fill=\"none\"/><rect x=\"442.3\" y=\"50.4\" width=\"51.3\" height=\"19.2\" rx=\"4\" fill=\"#fff\" stroke=\"#2b4f7e\" stroke-opacity=\".35\" stroke-width=\".6\"/><text x=\"449.3\" y=\"63.4\" font-size=\"9.6\" font-weight=\"400\" fill=\"#1d1d1f\">Indução</text><path d=\"M78 277.7 C85.5 277.7,85.5 126.5,93.0 126.5\" stroke=\"#a8322d\" stroke-width=\"1.5\" fill=\"none\"/><rec <script id="ej-responder">
/* Estuda Jaider: clicar numa alternativa só marca; a correção vem no botão "Responder". */
(function(){
  if (window.__ejResp) return; window.__ejResp = 1;
  var passar = false, pend = {};
  function temD(){ try { return typeof D !== 'undefined' && D; } catch(_) { return null; } }
  function avaliado(t){
    if (!t || t.type !== 'radio' || t.disabled) return false;
    if (t.dataset && t.dataset.obj) return true;
    var n = t.name || '', d = temD();
    if (n.indexOf('er-') === 0 || n === 'rv') return true;
    if (!d) return false;
    if (d.q && n.indexOf('-') > 0 && n.indexOf('av-') !== 0) return true;
    return (d.testes||[]).some(function(x){return x.id===n;}) || (d.microtestes||[]).some(function(x){return x.id===n;});
  }
  function grupo(t){ return t.closest('.ops') || t.parentElement; }
  function responder(g){
    var sel = g.querySelector('input[type=radio]:checked'); if (!sel || sel.disabled) return;
    delete pend[sel.name]; passar = true;
    try { sel.dispatchEvent(new Event('change', {bubbles:true})); } finally { passar = false; }
  }
  function botao(t){
    var g = grupo(t), b = g.nextElementSibling;
    if (!(b && b.classList.contains('ej-resp'))) {
      b = document.createElement('div'); b.className = 'acoes ej-resp';
      b.innerHTML = '<button type="button" class="bt">Responder</button>';
      g.after(b);
    }
    b.querySelector('button').onclick = function(){ responder(g); };
  }
  document.addEventListener('change', function(e){
    var t = e.target; if (passar || !avaliado(t)) return;
    e.stopImmediatePropagation(); e.stopPropagation();
    pend[t.name] = t.value;
    botao(t);
  }, true);
  function restaurar(){
    for (var n in pend) {
      var esc = window.CSS && CSS.escape ? CSS.escape(n) : n;
      var r = document.querySelector('input[type=radio][name="'+esc+'"][value="'+pend[n]+'"]');
      if (!r) continue;
      if (r.disabled) { delete pend[n]; continue; }
      if (!r.checked) r.checked = true;
      botao(r);
    }
  }
  new MutationObserver(function(){ restaurar(); }).observe(document.documentElement, {childList:true, subtree:true});
  var st = document.createElement('style');
  st.textContent = '.ej-resp{margin-top:10px}.ej-resp .bt{min-width:120px}';
  document.head.appendChild(st);
})();
</script>
