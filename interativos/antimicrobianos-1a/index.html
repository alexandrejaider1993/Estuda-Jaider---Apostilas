<style>
/* Layout: página clara da marca, cabeçalho enxuto com logo à direita, menu de capítulos com abas à esquerda e coluna de leitura. Visual claro por decisão do brand book. */
:root{--bg:#FDFDFC;--tinta:#1D1D1F;--suave:#5B5F66;--fio:#D9DCE1;--veia:#2B4F7E;--arteria:#A8322D;--nervo:#9A7609;--linfa:#3D7A5A;--prova:#5B4B8A;--prof:#C2410C;--livro:#6B5A3E;--atencao:#4A4E55;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--tinta);font-family:var(--org);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

.topo{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;max-width:1080px;margin:0 auto}
.logo{width:130px;height:auto;flex:none;display:block}
.marca{order:2}
nav{display:flex;gap:4px;align-items:center;flex-wrap:wrap}

nav a:hover{background:var(--f-atencao)}nav a.on{background:var(--veia);color:#fff}
.pill{font-size:12.5px;font-weight:600;color:var(--suave);font-variant-numeric:tabular-nums;padding-left:8px}

h2{font-size:20px;font-weight:600;margin:12px 0 0;text-wrap:balance}
h3{font-size:15px;font-weight:600;margin:0}

.lin:first-child{border-top:0}.lin span:first-child{min-width:0}.est{font-size:12.5px;font-weight:600;color:var(--suave);white-space:nowrap}

.rod{font-size:13px;color:var(--suave)}

<script>
const D={"capitulos": [{"id": "c1", "titulo": "O olhar da farmacoterapia sobre os antimicrobianos", "abertura": "Antes de falar de qualquer família, a Profa. Soraia gastou a primeira meia hora da aula ensinando a pensar. Este capítulo vem primeiro porque tudo o que vem depois depende dele: por que o espectro sozinho não decide a escolha, por que a origem da infecção e o uso prévio mudam o fármaco, por que infecção grave pede dose de ataque, por que o paciente precisa completar o tratamento e por que quase não surgem antimicrobianos novos. Ao terminar, você consegue explicar, para qualquer fármaco, o raciocínio que a prova espera.", "slides": "Slides 1 a 3, 15 a 17", "provas": "Banco 8.7 e 13.1 (questão 557)"}, {"id": "c2", "titulo": "Conceitos, famílias e classificações", "abertura": "Com o raciocínio do capítulo 1 em mãos, a aula passou ao vocabulário. Este capítulo vem antes da resistência porque não dá para falar de mecanismo de resistência sem saber o que é bactericida, quais são as famílias e onde cada uma age. Ao terminar, você consegue classificar qualquer antimicrobiano de quatro jeitos (estrutura química, espectro, efeito e origem), dizer onde cada fármaco age na bactéria e explicar por que o uso correto preserva eficácia, microbioma e dinheiro.", "slides": "Slides 6 a 15, 25, 29 a 33", "provas": "Banco 8.1 (questões 312 e 313) e 8.7 (questão 393)"}, {"id": "c3", "titulo": "Resistência e escolha racional do antimicrobiano", "abertura": "O último terço da aula juntou tudo. Primeiro, como a resistência aparece e por quais mecanismos a bactéria escapa do fármaco: a professora avisou que vai pedir isso na prova. Depois, os critérios para escolher e prescrever, que também já caíram como dissertativa. Este capítulo fecha o volume porque depende de tudo o que veio antes: origem da infecção, espectro, efeito e alvo. Ao terminar, você consegue descrever os quatro mecanismos de resistência para qualquer família e montar, passo a passo, a prescrição racional de um antimicrobiano.", "slides": "Slides 18 a 26, 46", "provas": "Banco 8.7 (dissertativas 398 e 399), 8.2 (questão 325)"}], "conceitos": [{"id": "foco-disciplina", "nome": "O que a Farmacoterapia cobra", "definicao": "Família, mecanismo de ação, espectro, interações e reações adversas; a indicação entra pela farmacocinética."}, {"id": "espectro-afinidade", "nome": "Espectro e afinidade pelo tecido", "definicao": "O fármaco precisa alcançar o bicho e chegar em concentração suficiente no tecido infectado."}, {"id": "agente-provavel", "nome": "Agente etiológico provável", "definicao": "A topografia e a idade dizem qual microrganismo é mais provável e orientam a primeira escolha."}, {"id": "origem-infeccao", "nome": "Comunidade ou hospital", "definicao": "Infecção que aparece até 48 h depois da alta é hospitalar e tende a ter germes resistentes."}, {"id": "pressao-seletiva", "nome": "Pressão seletiva e CCIH", "definicao": "Usar antimicrobiano seleciona os resistentes; a CCIH orienta o uso para reduzir essa pressão."}, {"id": "reavaliar-48h", "nome": "Reavaliar em 48 horas", "definicao": "Sem melhora em 48 h, troca-se o antimicrobiano; infecção grave como meningite não espera."}, {"id": "cim", "nome": "Concentração inibitória mínima", "definicao": "Concentração que o antimicrobiano precisa atingir para impedir o crescimento da bactéria."}, {"id": "dose-ataque", "nome": "Dose de ataque", "definicao": "Dose inicial maior que atinge a concentração eficaz de imediato, usada nas infecções graves."}, {"id": "receita-retida", "nome": "Receita com retenção", "definicao": "Antimicrobiano só é vendido com receita retida; a mudança da lei reduziu a automedicação."}, {"id": "adesao", "nome": "Completar o tratamento", "definicao": "Parar ao melhorar deixa os resistentes se multiplicarem; a infecção volta e o mesmo fármaco falha."}, {"id": "caminho-meio", "nome": "O caminho do meio", "definicao": "Avaliar gravidade e paciente: não tratar infecção viral com antimicrobiano, nem deixar sem tratar criança ou idoso."}, {"id": "poucos-novos", "nome": "Poucos antimicrobianos novos", "definicao": "Sem lucro em tratamento curto, a indústria quase não pesquisa; o último novo citado foi a linezolida; hoje surgem associações."}, {"id": "rodizio", "nome": "Rodízio de antimicrobianos", "definicao": "Um fármaco fora de uso por muito tempo pode recuperar eficácia; hospitais fazem rodízio programado."}, {"id": "associacao-resistencia", "nome": "Associação contra resistência", "definicao": "Em tratamentos longos (tuberculose, HIV, hanseníase) associam-se fármacos para evitar resistência."}, {"id": "profilaxia-tratamento", "nome": "Profilaxia não é tratamento", "definicao": "O antimicrobiano usado para prevenir não serve para tratar, porque provavelmente já selecionou resistência."}, {"id": "termos", "nome": "Antimicrobiano e antibiótico", "definicao": "Antimicrobiano inclui tudo o que age contra microrganismos; antibiótico é só o produzido por um microrganismo."}, {"id": "antissepsia", "nome": "Antissepsia, desinfecção e esterilização", "definicao": "Antisséptico em tecido vivo, desinfetante em objeto; esterilização elimina toda forma de vida, em material."}, {"id": "cida-statico", "nome": "Bactericida e bacteriostático", "definicao": "Bactericida mata a bactéria; bacteriostático impede o crescimento, e o sistema imune termina o serviço."}, {"id": "dose-efeito", "nome": "Dose e efeito", "definicao": "Alguns fármacos são bacteriostáticos em dose baixa e bactericidas em dose alta, mas nem todos: aumentar a dose pode só aumentar a toxicidade."}, {"id": "imuno-cida", "nome": "Imunodeprimido e bactericida", "definicao": "No imunodeprimido, prefere-se bactericida, porque o sistema imune não termina o serviço."}, {"id": "cim-cbm", "nome": "CIM e CBM no laboratório", "definicao": "O laboratório testa concentrações crescentes: a que para o crescimento (CIM) e a que mata (CBM) definem o tipo de efeito."}, {"id": "historia", "nome": "Linha do tempo das famílias", "definicao": "Sulfas em 1935, penicilina em larga escala em 1941, cloranfenicol e tetraciclinas em 1950, depois aminoglicosídeos, macrolídeos, glicopeptídeos e quinolonas."}, {"id": "betalactamico-maior", "nome": "Beta-lactâmicos, a maior família", "definicao": "É a maior classe; por isso a alergia a beta-lactâmico limita muito as opções."}, {"id": "macrolideo-alternativa", "nome": "Macrolídeo como alternativa", "definicao": "Na alergia a beta-lactâmico usa-se macrolídeo, de espectro semelhante; a posologia também pesa na escolha."}, {"id": "vanco-reserva", "nome": "Vancomicina para resistência", "definicao": "Glicopeptídeo usado quando o Gram-positivo não respondeu nem à oxacilina; não é primeira escolha."}, {"id": "geracoes", "nome": "Gerações: quinolonas e cefalosporinas", "definicao": "Nas quinolonas, cada geração amplia o espectro; nas cefalosporinas, cada geração muda o espectro, de Gram-positivo para Gram-negativo."}, {"id": "classe-quimica", "nome": "Famílias pela estrutura química", "definicao": "Aminoglicosídeos, macrolídeos, polipeptídeos, glicopeptídeos, poliênicos, sulfonamidas, quinolonas, beta-lactâmicos, tetraciclinas e cloranfenicol, com seus exemplos."}, {"id": "assoc-espectro", "nome": "Associar para somar espectro", "definicao": "Juntar um fármaco de Gram-positivo com um de Gram-negativo amplia o espectro com menos risco de resistência que um só de amplo espectro."}, {"id": "vanco-teico", "nome": "Vancomicina e teicoplanina", "definicao": "Espectro parecido; vancomicina é só endovenosa de 6 em 6 horas, teicoplanina pode ser intramuscular e permite tratar em casa."}, {"id": "polimixina-ultima", "nome": "Polimixina como último recurso", "definicao": "Extremamente tóxica; usada quando não sobra opção para Gram-negativo multirresistente."}, {"id": "espectro-class", "nome": "Espectro estreito e amplo", "definicao": "Estreito alcança poucos grupos (penicilina G); amplo alcança muitos (tetraciclinas, cloranfenicol) e não deve ser usado como bala de canhão."}, {"id": "origem-class", "nome": "Origem do fármaco", "definicao": "Natural (penicilina G), semissintético (ampicilina, amoxicilina) ou sintético (sulfametoxazol)."}, {"id": "mec-parede", "nome": "Alvo na parede", "definicao": "Penicilinas, cefalosporinas, vancomicina, bacitracina e cicloserina inibem a síntese da parede e são bactericidas."}, {"id": "mec-proteica", "nome": "Alvo no ribossomo", "definicao": "Cloranfenicol, tetraciclina, eritromicina e clindamicina inibem a síntese proteica (bacteriostáticos); aminoglicosídeos a alteram e matam."}, {"id": "mec-outros", "nome": "Membrana, ácidos nucleicos e folato", "definicao": "Polimixina altera a permeabilidade; rifampicina e quinolonas, os ácidos nucleicos; sulfonamidas e trimetoprim, o folato."}, {"id": "uso-correto", "nome": "Quatro razões para o uso correto", "definicao": "Eficácia terapêutica, preservar o microbioma, evitar resistência e reduzir custos."}, {"id": "microbioma", "nome": "Microbioma e superinfecção", "definicao": "Amplo espectro mata a flora normal e abre espaço para Clostridium (diarreia) e fungos (candidíase)."}, {"id": "custo", "nome": "Custo dos antimicrobianos", "definicao": "Antimicrobianos e antineoplásicos chegavam a metade do orçamento da farmácia hospitalar; informar o custo reduz o uso desnecessário."}, {"id": "resist-natural", "nome": "Resistência natural", "definicao": "A estrutura da bactéria não tem o que o fármaco atinge; o fármaco nunca funcionou contra essa bactéria."}, {"id": "resist-adquirida", "nome": "Resistência adquirida", "definicao": "Bactéria antes sensível passa a resistir: por seleção (mutação) ou por indução (plasmídeos e transposons)."}, {"id": "mec-raciocinio", "nome": "Um raciocínio para todas as classes", "definicao": "O fármaco precisa atingir concentração no alvo dentro da bactéria; os mecanismos são os mesmos, muda só o alvo."}, {"id": "mec-permeab", "nome": "Menos entrada", "definicao": "A bactéria altera parede, membrana ou porinas e o fármaco não entra; ex.: beta-lactâmicos em Gram-negativos."}, {"id": "mec-enzima", "nome": "Enzima que inativa", "definicao": "A bactéria produz enzima que destrói o fármaco: beta-lactamases (penicilinases), cefalosporinases, carbapenemases."}, {"id": "mec-alvo", "nome": "Alvo alterado ou em excesso", "definicao": "A enzima-alvo muda de forma ou é produzida em excesso; ex.: quinolona e DNA girase."}, {"id": "mec-efluxo", "nome": "Bomba de efluxo", "definicao": "O fármaco entra, mas é posto para fora antes de atingir concentração; ex.: tetraciclina e Bacteroides."}, {"id": "escolha-principios", "nome": "Critérios de escolha", "definicao": "Agente provável, origem e boletim da CCIH, uso prévio, paciente e características do fármaco, com evidência e custo."}, {"id": "interacoes-toxicidade", "nome": "Interações e toxicidade somada", "definicao": "Evitar mesmo mecanismo, indutores e inibidores enzimáticos e efeitos adversos iguais; quase todo antimicrobiano é nefrotóxico."}, {"id": "ccih-boletim", "nome": "Sensibilidade da instituição", "definicao": "Cada hospital tem seu perfil de resistência; a CCIH publica o boletim de sensibilidade."}, {"id": "dose-certa", "nome": "Dose e posologia certas", "definicao": "Dose errada gera risco de resistência; com receita retida, posologia errada obriga o paciente a voltar."}, {"id": "via-oral", "nome": "Via oral e tratamento em casa", "definicao": "Sempre que possível, oral e em casa; internar expõe o paciente a mais risco."}, {"id": "duracao", "nome": "Duração do tratamento", "definicao": "7 a 10 dias nas moderadas, 10 a 14 nas graves, dose única ou 3 dias em algumas ITU, 28 dias na osteomielite."}, {"id": "gram-parede", "nome": "Parede de Gram-positivo e Gram-negativo", "definicao": "Gram-positivo tem parede espessa de peptidoglicano; Gram-negativo tem membrana externa com porinas, por onde passam fármacos hidrofílicos."}, {"id": "toxicidade-seletiva", "nome": "Efeito adverso e alvo em comum", "definicao": "O efeito adverso aparece quando o alvo do fármaco também existe em nós; ex.: sulfa, folato e anemia."}, {"id": "agente-doenca", "nome": "Doença e agente provável", "definicao": "Cada doença infecciosa tem um agente provável (coqueluche, Bordetella; gonorreia, Neisseria); o diagnóstico orienta o fármaco."}], "blocos": [{"id": "b11", "capitulo": "c1", "titulo": "Espectro não basta: afinidade pelo tecido e agente provável", "onde": "A1 00:01:28 a 00:04:12", "ensina": ["foco-disciplina", "espectro-afinidade", "agente-provavel"], "seq": [["cx", "gancho", "Caso para começar", "Uma colega da turma teve uma infecção de pele e saiu da consulta com ciprofloxacino, uma quinolona, prescrito. A quinolona até tem atividade contra Gram-positivos.\n**Antes de seguir:** se o espectro alcança a bactéria, por que a professora disse que essa prescrição não faz sentido?", null], ["cx", "ideia", "A ideia em uma frase", "Escolher antimicrobiano é responder a três perguntas ao mesmo tempo: o fármaco alcança o bicho (espectro), chega ao tecido infectado em concentração suficiente (afinidade) e cobre o agente mais provável daquela topografia?", null], ["passo", "O que esta disciplina quer de você"], ["p", "A aula começou com um aviso. A turma já tinha visto antimicrobianos em DIP e ainda vai ver com outros professores e na Infectologia; o que muda em cada disciplina é o olhar. O olhar da Farmacoterapia, nas palavras da professora, é saber **a família a que o fármaco pertence, o mecanismo de ação, o espectro de ação e as principais indicações**. Logo depois a professora afinou o foco: \"mecanismo de ação, interações medicamentosas, efeitos adversos e o espectro\".", [["Antimicrobiano", "Do grego anti, contra, mikrós, pequeno, e bíos, vida: o que age contra os seres vivos microscópicos."]]], ["p", "E a indicação? A indicação entra, mas por um motivo farmacológico: a indicação depende da **farmacocinética**, isto é, de onde o fármaco chega e em que concentração. Primeira, segunda e terceira escolha para cada infecção ficam para a Infectologia. Guarde esse recorte, porque é ele que diz o que cai na prova.", []], ["cx", "destaque", "Destaque da professora", "\"Aqui, qual é o foco principal? Mecanismo de ação, interações medicamentosas, efeitos adversos e o espectro.\" Ela repetiu a lista no fim da aula seguinte, ao dizer o que vai cobrar.", "forte"], ["passo", "Espectro e afinidade pelo tecido"], ["p", "Pense no que acontece depois que o comprimido é engolido. Para matar a bactéria, o fármaco precisa estar **onde a bactéria está**, e em quantidade suficiente. Por isso a professora insistiu que a indicação \"não vai variar somente em função do espectro de ação, Gram-positivo, Gram-negativo, Pseudomonas. Ele varia também em função da **afinidade pelo tecido**\".", []], ["p", "Responda antes de seguir: **a quinolona é uma boa escolha para a pele?** A afinidade da quinolona é principalmente pelo tecido **pulmonar e renal**. Na pele, ninguém garante que a quinolona chegue à concentração necessária. O espectro pode até pegar a bactéria, e o paciente pode até melhorar, mas, nas palavras da professora, \"é um tiro no escuro, sem racionalidade\". Racional é escolher o que se sabe que chega lá.", [["Afinidade tecidual", "Tendência de um fármaco se concentrar em certos tecidos; depende da farmacocinética, não do espectro."]]], ["passo", "O agente provável pela topografia"], ["p", "A terceira pergunta completa as outras duas. Como saber qual bactéria cobrir antes de qualquer exame? Pela **topografia da infecção** e pela idade do paciente. A professora deu o exemplo da pele: o agente mais provável é o **estafilococo**. Sabendo o agente provável, sabe-se o espectro que interessa; sabendo o tecido, sabe-se qual fármaco chega lá. Daí sai a primeira escolha.", [["Topografia", "Do grego tópos, lugar, e graphé, descrição: o lugar do corpo onde está a infecção."]]], ["fig", "v11escolha.png", "Três perguntas que convergem na escolha", "O que olhar: as três caixas de cima são perguntas diferentes, e só a resposta conjunta leva à caixa verde. A caixa vermelha mostra o caso da aula, em que o espectro respondia \"sim\" e a afinidade não. Pergunta para responder só olhando: qual das três perguntas o ciprofloxacino na pele não responde?", "Esquema original elaborado a partir de A1 00:01:48 a 00:04:12.", ""], ["cx", "erros", "Erros que derrubam", "Achar que, se o espectro pega a bactéria, qualquer fármaco serve: falta saber se ele chega ao tecido.\nResponder na prova com primeira, segunda e terceira escolha de cada doença: o foco aqui é mecanismo, espectro, interações e reações adversas.\nConfundir afinidade pelo tecido com espectro: uma é farmacocinética, o outro é sobre quais bactérias o fármaco alcança.", null], ["cx", "guardar", "Para guardar", "Espectro diz quem o fármaco alcança; afinidade diz se ele chega lá. A escolha precisa das duas e do agente provável.", null], ["cx", "sintese", "Síntese", "**Foco da disciplina:** família, mecanismo, espectro, interações e reações adversas.\n**Escolha:** espectro + afinidade pelo tecido + agente provável pela topografia.\n**Exemplo:** quinolona tem afinidade por pulmão e rim; na pele, é tiro no escuro.", null]]}, {"id": "b12", "capitulo": "c1", "titulo": "Onde a infecção foi adquirida e o que o paciente já usou", "onde": "A1 00:04:12 a 00:07:56", "ensina": ["origem-infeccao", "pressao-seletiva", "reavaliar-48h"], "seq": [["cx", "gancho", "Caso para começar", "Dois pacientes chegam à UPA com pneumonia. O primeiro nunca foi internado. O segundo teve alta do hospital ontem e tomou penicilina há duas semanas.\n**Antes de seguir:** os dois podem receber o mesmo antimicrobiano de primeira escolha? Por quê?", null], ["cx", "ideia", "A ideia em uma frase", "Antes do fármaco, pergunte onde a infecção foi adquirida e o que o paciente já tomou: hospital e uso recente significam bactérias já selecionadas.", null], ["passo", "Comunidade ou hospital"], ["p", "A professora usou a pneumonia para mostrar o raciocínio. Se o paciente \"está com pneumonia aqui na comunidade, ele apareceu lá, foi lá na UPA e estava com pneumonia, ele nunca ficou internado\", cabe a primeira escolha, por exemplo uma penicilina. Mas e se o paciente acabou de sair de uma internação?", []], ["p", "Aqui entra uma regra de tempo: se a infecção aparece **até 48 horas depois da alta**, considera-se **infecção hospitalar**; o paciente a adquiriu dentro do hospital. E a professora perguntou à turma: \"Os bichinhos do hospital são bonzinhos?\" Não são. No hospital circula muito antimicrobiano, e as bactérias que sobrevivem ali são justamente as resistentes.", []], ["passo", "Pressão seletiva, superbactérias e a CCIH"], ["p", "Por que o hospital concentra resistência? Porque cada antimicrobiano usado mata as bactérias sensíveis e deixa as resistentes vivas, sem concorrência. A professora chama isso de **pressão positiva** (pressão de seleção): quanto mais e pior se usa, mais resistentes sobram. Para controlar essa pressão, o hospital tem a **CCIH**, que direciona o uso dos antimicrobianos e cria uma ordem lógica de escolha.", [["CCIH", "Comissão de Controle de Infecção Hospitalar: orienta e vigia o uso de antimicrobianos no hospital."]]], ["p", "Daí a crítica ao uso por insegurança. Dar logo uma cefalosporina de terceira geração, que pega Gram-positivo e Gram-negativo, parece garantir a cura; mas, nas palavras da professora, o que se está fazendo é \"selecionando superbactérias\". O mesmo vale para o uso prévio: se o paciente tomou penicilina há pouco e a pneumonia voltou, provavelmente \"os resistentes voltaram\", e repetir a penicilina não resolve.", []], ["passo", "Reavaliar em 48 horas, menos quando não dá para esperar"], ["p", "Escolhido o fármaco, quando se sabe que ele falhou? A regra da aula: **48 horas**. Se o paciente não melhorou em 48 horas, troca-se o antimicrobiano. A exceção é a infecção que mata antes disso. Numa **meningite**, \"em 48 horas o cara está morto\"; por isso, nas infecções do sistema nervoso central, a conduta já começa forte, com dose de ataque, que é o assunto do próximo subtópico.", []], ["fig", "v12origem.png", "Duas perguntas antes de escolher o fármaco", "O que olhar: o primeiro losango separa comunidade de hospital, com a regra das 48 h depois da alta; o segundo pergunta pelo uso recente. As caixas vermelhas são as saídas em que o germe já foi selecionado. Pergunta para responder só olhando: o paciente que teve alta ontem e tomou penicilina há duas semanas termina em qual caixa?", "Esquema original elaborado a partir de A1 00:04:36 a 00:07:56.", ""], ["cx", "clinica", "Correlação clínica", "Pneumonia de repetição: a primeira pergunta da anamnese é \"quais antimicrobianos você tomou?\". O que foi usado há pouco não se repete, porque é provável que já tenha selecionado resistência.", null], ["cx", "erros", "Erros que derrubam", "Esquecer que infecção até 48 h depois da alta conta como hospitalar.\nRepetir o antimicrobiano que o paciente tomou há pouco tempo.\nAchar que amplo espectro \"por segurança\" é inofensivo: seleciona superbactérias.\nEsperar 48 h numa meningite antes de agir com força.", null], ["cx", "guardar", "Para guardar", "Hospital e uso recente: germe selecionado. Sem melhora em 48 h, troque; infecção grave não espera.", null], ["cx", "sintese", "Síntese", "**Origem:** comunidade aceita a primeira escolha; hospital (até 48 h após a alta) sugere resistência.\n**Uso prévio:** não repetir o que foi usado há pouco.\n**Pressão seletiva:** uso amplo e por insegurança seleciona resistentes; a CCIH organiza o uso.\n**Reavaliação:** 48 h, exceto infecção grave.", null]]}, {"id": "b13", "capitulo": "c1", "titulo": "Dose de ataque e concentração inibitória mínima", "onde": "A1 00:07:56 a 00:09:56", "ensina": ["cim", "dose-ataque"], "seq": [["cx", "gancho", "Caso para começar", "A professora contou de uma criança que chegou vomitando, com líquor limpo. Depois do almoço, voltou cheia de petéquias, com o líquor alterado, e \"às vezes não dava tempo\".\n**Antes de seguir:** se o antimicrobiano certo for dado na dose comum, por que ele pode demorar a fazer efeito?", null], ["cx", "ideia", "A ideia em uma frase", "Todo antimicrobiano precisa atingir uma concentração mínima para agir; com doses comuns isso leva várias doses, e a dose de ataque atinge essa concentração já na primeira.", null], ["passo", "Por que a primeira dose comum não basta"], ["p", "A professora retomou a farmacocinética: para ter efeito, o fármaco precisa atingir uma **concentração plasmática** adequada. Com doses repetidas, essa concentração vai subindo dose a dose até o **equilíbrio**, quando a velocidade de entrada se iguala à de eliminação. Mesmo por via endovenosa, em que não há a etapa de absorção, existe a excreção, e a primeira dose sozinha não chega lá.", [["Estado de equilíbrio", "Momento em que o que entra a cada dose se iguala ao que é eliminado; a concentração para de subir."]]], ["p", "No caso dos antimicrobianos, a concentração que interessa tem nome: **concentração inibitória mínima**, a CIM. É, nas palavras da professora, \"a concentração que eu preciso atingir para conseguir aí debelar aquele micro-organismo\". Abaixo dela, o fármaco está no sangue, mas não age.", [["CIM", "Concentração inibitória mínima: menor concentração que impede o crescimento da bactéria."]]], ["passo", "O que a dose de ataque resolve"], ["p", "Agora junte as duas ideias. Se a CIM só é atingida depois de algumas doses, as primeiras horas são **tempo perdido**, e numa infecção grave essas horas contam. A **dose de ataque** é uma primeira dose maior, que já leva a concentração acima da CIM; as doses seguintes só mantêm o nível. Por isso, nas infecções do sistema nervoso central, como a meningite, a professora disse que \"sempre a gente vai falar de dose de ataque\".", []], ["fig", "v13ataque.png", "Dose de ataque e CIM", "O que olhar: a linha tracejada é a CIM. A curva azul (com dose de ataque) já começa acima dela; a curva cinza (só doses comuns) leva algumas doses para cruzá-la, e a faixa vermelha é o tempo perdido. Pergunta para responder só olhando: em qual das duas curvas o paciente passa as primeiras horas sem efeito antimicrobiano? Esquema didático, sem valores reais.", "Esquema original elaborado a partir de A1 00:07:56 a 00:09:56.", ""], ["cx", "erros", "Erros que derrubam", "Achar que qualquer primeira dose já tem efeito pleno: abaixo da CIM, o fármaco não age.\nPensar que a via endovenosa dispensa a dose de ataque: não há absorção, mas há eliminação.\nUsar a dose de ataque como regra para toda infecção: ela é para as graves, em que não se pode esperar.", null], ["cx", "guardar", "Para guardar", "Abaixo da CIM, o fármaco está lá mas não age. Na infecção grave, a dose de ataque elimina o tempo perdido.", null], ["cx", "sintese", "Síntese", "**CIM:** concentração mínima que impede o crescimento da bactéria.\n**Problema:** doses comuns só atingem a CIM depois de algumas doses.\n**Solução nas graves:** dose de ataque, que atinge a CIM já na primeira; exemplo da aula, meningite.", null]]}, {"id": "b14", "capitulo": "c1", "titulo": "Receita retida, adesão e o caminho do meio", "onde": "A1 00:09:56 a 00:15:05; 00:31:14 a 00:34:18", "ensina": ["receita-retida", "adesao", "caminho-meio"], "seq": [["cx", "gancho", "Caso para começar", "Uma mãe chega ao pronto-socorro: o filho de 2 anos espirrou e tossiu, sem febre alta, há um dia. Ela pede \"um antibiótico para garantir\".\n**Antes de seguir:** o que é mais fácil para o médico, e o que é mais correto?", null], ["cx", "ideia", "A ideia em uma frase", "Antimicrobiano se prescreve com racionalidade: só quando há indicação, com orientação para tomar até o fim, porque parar no meio seleciona resistentes.", null], ["passo", "A receita retida"], ["p", "A professora lembrou que, há uns 15 anos, bastava pedir na farmácia: \"Moço, eu quero uma cefalexina\", e o balconista vendia. A lei mudou. Hoje os antimicrobianos **só são vendidos com receita médica retida**, e a professora resumiu sem rodeios: \"Nesse país só funciona a retenção de receita\". O que é tarja vermelha sem retenção, como a nimesulida, continua sendo vendido a quem pede.", []], ["p", "Essa mudança diminuiu muito a automedicação, embora sempre haja quem compre sem receita, sem saber a origem do produto. E essa mudança tem uma consequência para quem prescreve, que volta no capítulo 3: se a dose ou a posologia saírem erradas, o paciente terá de voltar para refazer a receita.", []], ["passo", "Por que não parar quando melhora"], ["p", "Para o leigo, a lógica parece óbvia: \"Eu tomei o medicamento, eu melhorei, eu preciso continuar tomando?\". Responda antes de ler: **o que acontece com as bactérias quando o paciente para no terceiro dia?** As sensíveis já morreram, por isso o paciente melhorou. Mas, se havia algumas resistentes, elas ficam vivas e agora sem concorrência. Multiplicam-se, e \"quando volta a infecção, não adianta voltar\" ao mesmo antimicrobiano.", []], ["p", "Por isso a orientação da professora ao prescrever: \"Você vai melhorar, em dois dias você vai estar bem, mas você precisa fazer o tratamento direitinho. Se são sete dias, são sete dias; se são quatorze dias, são quatorze dias.\" O tempo depende da doença, do microrganismo e da topografia.", []], ["fig", "v14adesao.png", "O que acontece quando o tratamento para no meio", "O que olhar: azul é bactéria sensível, vermelho é resistente. Do primeiro ao quarto quadro, a proporção de vermelhas cresce porque o tratamento parou quando só as sensíveis tinham morrido. Pergunta para responder só olhando: por que o mesmo fármaco falha no último quadro?", "Esquema original elaborado a partir de A1 00:12:08 a 00:13:31 e 01:04:46.", ""], ["passo", "O caminho do meio"], ["p", "A professora comparou com países desenvolvidos, onde \"o cara precisa ficar muito grave para prescrever o antimicrobiano\". Aqui se prescreve mais. A resposta certa fica no meio: \"nem tanto o céu, nem tanto a terra\". Infecção leve num adulto com boa imunidade pode ser debelada pelo próprio organismo; já o bebê, com o sistema imune em desenvolvimento, e o idoso não podem ficar sem tratamento, pelo risco de infecção grave.", []], ["p", "E há o erro mais comum: tratar infecção viral com antimicrobiano. Antibacteriano não age em vírus. O ditado \"espirrou, tossiu, Amoxil\" descreve o excesso de amoxicilina em crianças, e a maioria das infecções da infância é viral. A professora chamou o Alexandre pelo nome para perguntar o que é mais fácil: prescrever, ou explicar à mãe que provavelmente é vírus, pedir três dias de paciência e reavaliar? Mais fácil é \"tratar a mãe com antibiótico no filho\". O correto é explicar. A professora contou, como contraste, que o próprio filho só tomou o primeiro antimicrobiano aos 22 anos, numa amigdalite, e que hoje é difícil achar criança de um ano que nunca tenha tomado. Até os cinco anos o sistema imune está se formando, e a criança vai adoecer; isso, sozinho, não é indicação de antimicrobiano.", []], ["cx", "destaque", "Destaque da professora", "\"Porque hoje, infelizmente, é assim, Alexandre, o que é mais fácil? Eu prescrever um antimicrobiano ou eu explicar para a mãe que a maioria das infecções que a criança tem é viral?\"", "medio"], ["cx", "erros", "Erros que derrubam", "Achar que melhorar é sinal para parar: as resistentes ainda estão lá.\nPrescrever antimicrobiano para quadro viral, como resfriado na criança.\nIr ao outro extremo e deixar sem tratamento um bebê ou um idoso com infecção.", null], ["cx", "guardar", "Para guardar", "Se são sete dias, são sete dias. Antimicrobiano não trata vírus: explique à mãe em vez de prescrever.", null], ["cx", "sintese", "Síntese", "**Lei:** antimicrobiano só com receita retida.\n**Adesão:** parar ao melhorar deixa os resistentes crescerem; a infecção volta e o fármaco falha.\n**Caminho do meio:** avaliar gravidade e paciente; não tratar vírus; não deixar bebê e idoso sem tratamento.", null]]}, {"id": "b15", "capitulo": "c1", "titulo": "Poucos fármacos novos: rodízio, associações e profilaxia", "onde": "A1 00:15:48 a 00:26:41", "ensina": ["poucos-novos", "rodizio", "associacao-resistencia", "profilaxia-tratamento"], "seq": [["cx", "gancho", "Caso para começar", "Um idoso com DPOC, muito secretivo, recebe um antimicrobiano de forma contínua para não fazer pneumonia toda hora. Um dia, faz pneumonia mesmo assim.\n**Antes de seguir:** faz sentido tratar essa pneumonia com o mesmo antimicrobiano?", null], ["cx", "ideia", "A ideia em uma frase", "Como quase não surgem antimicrobianos novos, cada fármaco precisa ser preservado: rodízio, associação nos tratamentos longos e nunca tratar com o que se usa para prevenir.", null], ["passo", "Por que a indústria não traz fármacos novos"], ["p", "A professora perguntou à turma por que a indústria farmacêutica não se interessa por antimicrobianos, e respondeu com a conta do lucro: \"você tem uma infecção, eu te dou antimicrobiano por cinco dias, você fica bom... cadê minha lucratividade?\". Doenças crônicas, como o diabetes, garantem uso por toda a vida; o antimicrobiano é usado poucos dias e nunca mais.", []], ["p", "O resultado é que, segundo a professora, o último antimicrobiano realmente novo foi a **linezolida**, por volta de 2000 e 2001. Depois disso surgiram **novas associações**: \"um antimicrobiano velho com um inibidor de alguma enzima que aquele micro-organismo produz, para inibir a resistência\". E a professora ligou isso à história da longevidade: no século XIX, 40 anos já era velhice, porque as pessoas morriam de infecção; os antimicrobianos mudaram isso. Se forem mal usados, com o surgimento de **superbactérias**, a população pode voltar a morrer de infecção sem ter o que usar.", []], ["passo", "O rodízio: o fármaco que volta"], ["p", "Responda antes de ler: **se um antimicrobiano ficar anos sem ser usado, o que acontece com a resistência a ele?** Sem uso, some a pressão de seleção, e a sensibilidade pode voltar. A professora deu o exemplo da infecção urinária: primeiro \"sulfa, sulfa, sulfa\"; depois quinolonas, \"cipro, cipro, cipro, norfloxacino\"; hoje, depois de um longo período sem uso, volta-se à sulfa. Há hospitais que programam esse **rodízio**: um período com um fármaco, depois a troca, para evitar cepas resistentes.", []], ["fig", "v15rodizio.png", "O rodízio de antimicrobianos na infecção urinária", "O que olhar: a linha do tempo vai da sulfa às quinolonas e a seta tracejada mostra a volta da sulfa. Pergunta para responder só olhando: o que precisou acontecer entre a primeira e a última caixa para a sulfa voltar a funcionar?", "Esquema original elaborado a partir de A1 00:22:26 a 00:23:52.", ""], ["passo", "Associação nos tratamentos longos"], ["p", "Nas infecções de tratamento prolongado, como **tuberculose, HIV e hanseníase**, usam-se sempre associações de vários antimicrobianos. Por quê? Porque, num tratamento de meses, uma bactéria que fique resistente a um fármaco ainda é atingida pelo outro. A associação existe \"justamente para evitar a resistência\".", []], ["passo", "Profilaxia não é tratamento"], ["p", "Alguns antimicrobianos são usados de forma **profilática**: no centro cirúrgico, uma cefalosporina específica é usada só para prevenir infecção, e não para tratar. E no idoso com DPOC muito secretivo, que \"parece que tem uma pororoca\", o antimicrobiano contínuo evita pneumonias de repetição.", [["Profilaxia", "Do grego prophýlaxis, precaução: uso para prevenir, antes de a infecção existir."]]], ["p", "Agora volte ao caso do início. Se esse idoso fizer pneumonia, trata-se com o mesmo fármaco? Não. \"Se eu já usei como profilático, muito provavelmente a gente já tem mecanismos de resistência daquele micro-organismo.\" A regra é simples: **o que se usa para prevenir não se usa para tratar**.", []], ["cx", "destaque", "Destaque da professora", "\"Então, o que eu uso como profilático, eu não uso para tratar... Deu para entender isso?\"", "medio"], ["cx", "erros", "Erros que derrubam", "Achar que a indústria lança antimicrobianos novos todo ano: o que surge são associações com inibidores de enzimas.\nTratar uma infecção com o mesmo fármaco usado na profilaxia.\nPensar que resistência é para sempre: sem uso, a sensibilidade pode voltar.", null], ["cx", "guardar", "Para guardar", "Antimicrobiano novo é raro: preserve. O que previne não trata.", null], ["cx", "sintese", "Síntese", "**Indústria:** pouco lucro, poucos fármacos novos; o último foi a linezolida; hoje, associações.\n**Rodízio:** sem uso, a sensibilidade pode voltar (sulfa na ITU).\n**Tratamentos longos:** associação para evitar resistência.\n**Profilaxia:** o fármaco usado para prevenir não é usado para tratar.", null]]}, {"id": "b21", "capitulo": "c2", "titulo": "Antimicrobiano, antibiótico, antisséptico, desinfetante e esterilização", "onde": "A1 00:26:25 a 00:29:50; SL 6 e 7", "ensina": ["termos", "antissepsia"], "seq": [["cx", "gancho", "Caso para começar", "No curativo, uma técnica diz ao paciente: \"vou esterilizar o local da lesão\". Outra completa: \"e depois eu desinfeto\".\n**Antes de seguir:** o que cada termo realmente significa, e qual seria o certo para a pele do paciente?", null], ["cx", "ideia", "A ideia em uma frase", "Antimicrobiano é o guarda-chuva; antibiótico é o de origem natural; antisséptico se usa em tecido vivo, desinfetante em objeto, e esterilizar é processo para material.", null], ["passo", "Antimicrobiano não é sinônimo de antibiótico"], ["p", "A professora abriu o assunto avisando que alguns termos \"doem o ouvido\" quando usados errado por um profissional. O primeiro par: **antimicrobiano** e **antibiótico**. Os dois fazem a mesma coisa; o que muda é a **origem**. Antimicrobiano pode ser de origem natural ou sintética. Antibiótico é só o de origem natural: um microrganismo produz uma substância contra outro.", [["Antibiótico", "Do grego anti, contra, e bíos, vida: substância produzida por um ser vivo contra outro."]]], ["p", "Na fala do dia a dia, ninguém vai corrigir quem troca as palavras. Mas, como a professora lembrou, \"uma coisa é a língua falada, outra coisa é a língua escrita\": num artigo, numa apresentação em congresso ou numa prova, o termo certo conta. O slide 6 resume: antimicrobiano descreve as substâncias usadas para tratar infecções e **inclui** antibióticos, desinfetantes e antissépticos.", []], ["passo", "Antisséptico, desinfetante e esterilização"], ["p", "Dentro do guarda-chuva, a diferença entre antisséptico e desinfetante é **onde** a solução química é usada. **Antisséptico** vai em **tecido vivo**: pele, mucosa, ferida. **Desinfetante** vai em **objeto**: mobiliário, instrumento, cama. Por isso a professora brincou com a técnica do curativo: \"Você virou o quê? Você virou uma cama, um móvel\".", [["Antissepsia", "Do grego anti, contra, e sêpsis, putrefação: limpeza que limita a infecção em tecido vivo."]]], ["p", "E esterilizar? **Esterilização** é um processo que elimina todas as formas de vida, feito em material, na autoclave ou com glutaraldeído. \"Ela vai te colocar na autoclave pra mergulhar você no glutaraldeído?\", perguntou a professora. No paciente, o certo é dizer que se faz **antissepsia**.", []], ["fig", "v21termos.png", "O guarda-chuva dos antimicrobianos", "O que olhar: a caixa de cima é o termo geral; as quatro de baixo diferem pela origem (azuis) ou pelo lugar de uso (verde, tecido vivo; cinza, objeto). A caixa tracejada mostra que esterilização é um processo, não uma substância. Pergunta para responder só olhando: qual termo se usa para a pele do paciente no curativo?", "Esquema original elaborado a partir de A1 00:26:48 a 00:29:28 e SL 6.", ""], ["cx", "destaque", "Destaque da professora", "\"Embora a gente use de forma indiscriminada, antibióticos como antimicrobianos de forma de sinônimo, não são sinônimos.\"", "medio"], ["cx", "erros", "Erros que derrubam", "Usar antibiótico e antimicrobiano como sinônimos num texto escrito.\nDizer que vai \"esterilizar\" ou \"desinfetar\" a pele do paciente.\nAchar que antisséptico e desinfetante não são antimicrobianos: os dois estão dentro do termo geral.", null], ["cx", "guardar", "Para guardar", "Antibiótico é natural; antimicrobiano é tudo. Tecido vivo: antisséptico. Objeto: desinfetante. Esterilizar: só material.", null], ["cx", "sintese", "Síntese", "**Antimicrobiano:** termo geral, natural ou sintético.\n**Antibiótico:** só origem natural, de um microrganismo contra outro.\n**Antisséptico:** tecido vivo. **Desinfetante:** objeto.\n**Esterilização:** processo que elimina toda vida, em material.", null]]}, {"id": "b22", "capitulo": "c2", "titulo": "Bactericida e bacteriostático: o que muda para o paciente", "onde": "A1 00:29:50 a 00:31:22; 00:54:42; 01:13:06; 01:17:54 a 01:18:19; SL 13 e 25", "ensina": ["cida-statico", "dose-efeito", "imuno-cida", "cim-cbm"], "seq": [["cx", "gancho", "Caso para começar", "Paciente em quimioterapia, com neutrófilos baixos, desenvolve uma infecção. Há dois fármacos que cobrem o agente: um mata a bactéria, o outro só impede que ela cresça.\n**Antes de seguir:** qual você escolheria, e por quê?", null], ["cx", "ideia", "A ideia em uma frase", "Bactericida mata; bacteriostático só segura o crescimento e deixa o resto para o sistema imune. Quem não tem sistema imune funcionando precisa de bactericida.", null], ["passo", "Matar ou parar de crescer"], ["p", "Os antimicrobianos fazem uma de duas coisas: provocam a destruição do microrganismo ou inibem o seu crescimento. Os que matam são **bactericidas**; os que impedem o crescimento são **bacteriostáticos**. A professora resumiu a diferença numa frase: no bacteriostático, \"ele impede o crescimento, mas o bicho está lá ainda\".", [["Bactericida", "Do latim caedere, matar: o que mata a bactéria."], ["Bacteriostático", "Do grego statikós, que detém: o que para o crescimento."]]], ["p", "E quem elimina as bactérias que ficaram paradas? O **sistema imune**. O bacteriostático ganha tempo: a população para de crescer, e as defesas do paciente dão conta do resto.", []], ["fig", "v22curvas.png", "O que cada tipo de fármaco faz com a população de bactérias", "O que olhar: depois da linha tracejada (início do fármaco), a curva cinza continua subindo, a mostarda fica parada e a azul cai. A caixa verde lembra quem termina o serviço do bacteriostático. Pergunta para responder só olhando: num paciente sem defesa, qual curva voltaria a subir se o sistema imune não eliminasse as bactérias paradas? Esquema qualitativo, sem valores reais.", "Esquema original elaborado a partir de A1 00:29:50 e 00:54:42.", ""], ["passo", "No imunodeprimido, prefira bactericida"], ["p", "Agora volte ao caso do início. Responda antes de ler: **se o paciente não tem neutrófilos, quem vai eliminar as bactérias que o bacteriostático só paralisou?** Ninguém. Por isso a professora perguntou: \"Se o cara já é imunodeprimido, será que dá pra arriscar em dar um fármaco bacteriostático pra ele?\". Nos critérios de escolha, a professora repetiu: com o sistema imune comprometido, \"é melhor a gente usar drogas que sejam bactericidas\".", []], ["cx", "destaque", "Destaque da professora", "\"Se ele é bacteriostático, pensa: eu não tô matando, eu só tô inibindo o crescimento. Aquelas bactérias que estão lá, estão.\"", "forte"], ["passo", "A dose pode mudar o efeito, mas nem sempre"], ["p", "Há uma nuance. Em alguns fármacos, **doses menores são bacteriostáticas e doses maiores, bactericidas**. Mas a professora fez questão do alerta: isso não vale para qualquer um. A professora contou de uma prescrição em que o tratamento não deu certo e o médico \"só aumentou a dose\", com um fármaco cuja dose \"não ia fazer a menor diferença\": só aumentou a **toxicidade**. \"Não precisa conhecer o mundo, mas aquilo que você está prescrevendo, você precisa saber.\"", []], ["passo", "Como o laboratório descobre: CIM e CBM"], ["p", "Como se sabe se um fármaco é bactericida ou bacteriostático? No laboratório. Testam-se concentrações crescentes do antimicrobiano sobre a bactéria e observam-se dois pontos: a menor concentração que **para o crescimento**, a CIM, e a menor que **mata**, a **CBM** (concentração bactericida mínima). O slide 25 define a CBM como a concentração que elimina 99,9% das bactérias.", [["CBM", "Concentração bactericida mínima: menor concentração que elimina 99,9% das bactérias."]]], ["p", "A lógica é intuitiva: se a concentração que para o crescimento já é a que mata, o fármaco é bactericida; se é preciso muito mais para matar do que para parar, ele se comporta como bacteriostático. O slide resume com a razão entre as duas.", []], ["fig", "sl25cimcbm.png", "CIM, CBM e a razão entre elas", "O que olhar: em cima, a CIM impede o crescimento (o X vermelho); no meio, a CBM elimina 99,9% das bactérias (a caveira); embaixo, a razão CBM/CIM igual a 1 indica bactericida, maior que 1, bacteriostático. Pergunta para responder só olhando: se a CBM for o dobro da CIM, como o slide classifica o fármaco? Imagem de origem em baixa resolução.", "Slide 25 da aula.", ""], ["cx", "alerta", "Atenção", "O slide usa o corte \"CBM/CIM igual a 1, bactericida; maior que 1, bacteriostático\". 💡 Em textos de microbiologia, o critério mais usado é uma razão de até 4 para bactericida. **Na prova desta disciplina, use o slide.** Em outras provas, confira a fonte que a banca usa.", null], ["cx", "erros", "Erros que derrubam", "Achar que bacteriostático \"não serve\": ele serve quando o sistema imune funciona.\nDar bacteriostático ao imunodeprimido.\nAumentar a dose de qualquer fármaco esperando que vire bactericida: em muitos, só sobe a toxicidade.", null], ["cx", "guardar", "Para guardar", "Bacteriostático segura; o sistema imune elimina. Sem sistema imune, bactericida.", null], ["cx", "sintese", "Síntese", "**Bactericida:** mata. **Bacteriostático:** para o crescimento; o sistema imune termina.\n**Imunodeprimido:** preferir bactericida.\n**Dose:** em alguns fármacos muda o efeito; em outros, só aumenta a toxicidade.\n**Laboratório:** CIM (para) e CBM (mata 99,9%); razão CBM/CIM.", null]]}, {"id": "b23", "capitulo": "c2", "titulo": "Como surgiram as famílias: de Fleming à linezolida", "onde": "A1 00:17:39 a 00:18:26; 00:34:18 a 00:45:09; SL 8 e 9", "ensina": ["historia", "betalactamico-maior", "macrolideo-alternativa", "vanco-reserva", "geracoes"], "seq": [["cx", "gancho", "Caso para começar", "Um paciente alérgico à penicilina tem sinusite. O colega sugere \"trocar por outro beta-lactâmico qualquer\".\n**Antes de seguir:** por que isso é um problema, e qual família a aula indica no lugar?", null], ["cx", "ideia", "A ideia em uma frase", "As famílias surgiram em ondas, e cada uma trouxe uma vantagem: entender a ordem ajuda a lembrar o espectro e o papel de cada uma hoje.", null], ["passo", "Antes e depois de Fleming"], ["p", "Muito antes de saber o que era micróbio, as pessoas já usavam o que hoje chamaríamos de antimicrobiano. Falava-se em \"miasmas\", mas observava-se que certos cuidados melhoravam a infecção. A professora contou que, nas guerras, deixava-se pão embaixo da sela do cavalo para criar **bolor** e passá-lo nos ferimentos. Não por acaso, boa parte dos antimicrobianos atuais deriva de fungos.", []], ["p", "O passo científico veio com **Fleming**. \"Diz a lenda que o bicho saiu de férias\", e uma cultura contaminada por fungo mostrou que, ao redor do fungo, nada crescia: o fungo produzia algo que inibia as outras bactérias. Era a penicilina. A produção em **larga escala começou em 1941**, durante a **Segunda Guerra**. O slide 8 dá a escala da expansão: 513 antimicrobianos em 1961 e cerca de 8000 hoje.", []], ["p", "Um aluno estranhou: se quase não surgem antimicrobianos novos, como existem 8000? A professora explicou que esse número inclui os usados fora da medicina humana, na agricultura e na criação de animais, para aumentar o peso e a reprodução. Para uso humano, a lista é bem menor, e parte dessa exposição chega a nós \"de tabela\", pela comida.", []], ["passo", "As ondas de famílias"], ["p", "A ordem, como no slide 9: primeiro as **sulfas, em 1935**, as mais antigas. Depois os **beta-lactâmicos**, que são a **maior família** de antimicrobianos. Por isso a alergia pesa tanto: alérgico à sulfa tem muitas outras opções; alérgico a beta-lactâmico perde a maior família de uma vez. Em **1950** vieram o **cloranfenicol** e as **tetraciclinas**, muito usados por serem de **amplo espectro**: a geração da professora tomou cloranfenicol, a dos pais dela, tetraciclina.", [["Beta-lactâmico", "Família cujo núcleo químico é o anel beta-lactâmico: penicilinas, cefalosporinas, carbapenêmicos e monobactâmicos."]]], ["p", "Daí vem uma crença popular: \"antibiótico faz mal para os dentes\". A culpa era da **tetraciclina**, que **se liga ao cálcio** e mancha a dentina. E o cloranfenicol, hoje pouco usado, por causa do risco de **anemia aplástica**. Depois surgiram os **aminoglicosídeos**, muito bons para **Gram-negativos**, enquanto os primeiros beta-lactâmicos pegavam bem os Gram-positivos.", []], ["fig", "sl09linha.png", "Linha do tempo das famílias de antimicrobianos", "O que olhar: as barras vermelhas mostram as famílias surgindo de 1935 até os anos 1960; a seta \"Innovation gap\" marca as décadas quase sem novidade; à direita, em verde, a linezolida (oxazolidinonas) e os poucos que vieram depois. Pergunta para responder só olhando: qual família é a mais antiga? Imagem de origem em baixa resolução.", "Slide 9 da aula (adaptado de Fischbach e Walsh, 2009).", "larga"], ["passo", "Macrolídeos: alternativa na alergia, e a posologia conta"], ["p", "Os **macrolídeos** são a resposta para o paciente do caso: quem é alérgico a beta-lactâmico recebe macrolídeo, que tem espectro de ação semelhante; quem não pode usar amoxicilina pode receber azitromicina ou eritromicina. Mas a professora acrescentou um critério que costuma ser esquecido: a **posologia**.", []], ["p", "Responda antes de ler: **numa sinusite, o que o paciente prefere: amoxicilina de 8 em 8 horas por 14 dias, ou azitromicina uma vez por dia por 5 dias?** A segunda, claro. E a eritromicina quase não se prescreve mais porque é de 6 em 6 horas. Posologia ruim é adesão ruim, e adesão ruim, como você viu no capítulo 1, também gera resistência. O mesmo raciocínio vale para antivirais: o aciclovir oral exige muitas tomadas ao dia; ⚠️ o valaciclovir, de 12 em 12 horas, melhora a adesão.", []], ["passo", "Glicopeptídeos, quinolonas e o que vem depois"], ["p", "Os **glicopeptídeos** têm na **vancomicina** o representante famoso. A vancomicina é usada quando o paciente tem infecção por Gram-positivo que **não respondeu nem à oxacilina**, isto é, resistente aos beta-lactâmicos; trocar para outro beta-lactâmico não adianta. Por isso a vancomicina \"é só pra gente utilizar em casos específicos\": não é primeira escolha. Se há tantos pacientes com vancomicina no hospital, é porque já se usou tanto o resto \"que não tá pegando\".", []], ["p", "As **quinolonas** têm gerações, e a professora alertou para uma confusão clássica com as **cefalosporinas**, que também têm gerações. Nas quinolonas, cada geração **amplia** o espectro. Nas cefalosporinas, cada geração **muda** o espectro: as de primeira geração pegam mais Gram-positivo; as de terceira, quarta e quinta, mais Gram-negativo. Depois, quarenta anos quase sem novidade, até a **linezolida**, por volta de 2000.", []], ["tab", "As famílias na ordem da aula", ["Família", "Quando", "O que a aula destacou"], [["**Sulfas**", "1935", "As mais antigas; voltaram à ITU pelo rodízio"], ["**Beta-lactâmicos**", "Década de 1940", "Maior família; alergia limita muito"], ["**Cloranfenicol e tetraciclinas**", "1950", "Amplo espectro; tetraciclina mancha dentes; cloranfenicol e anemia aplástica"], ["**Aminoglicosídeos**", "Depois", "Bons para Gram-negativos"], ["**Macrolídeos**", "Depois", "Alternativa na alergia a beta-lactâmico"], ["**Glicopeptídeos**", "Depois", "Vancomicina: Gram-positivo resistente à oxacilina"], ["**Quinolonas**", "Depois", "Cada geração amplia o espectro"], ["**Oxazolidinonas**", "Cerca de 2000", "Linezolida, o último novo citado"]]], ["cx", "erros", "Erros que derrubam", "Achar que cefalosporinas e quinolonas mudam igual de geração: nas quinolonas amplia, nas cefalosporinas muda de Gram-positivo para Gram-negativo.\nTrocar penicilina por outro beta-lactâmico no paciente alérgico.\nUsar vancomicina como primeira escolha.", null], ["cx", "guardar", "Para guardar", "Alergia a beta-lactâmico: macrolídeo. Gram-positivo que não respondeu à oxacilina: vancomicina.\nQuinolona: a geração amplia. Cefalosporina: a geração muda, de Gram-positivo para Gram-negativo.", null], ["cx", "sintese", "Síntese", "**Ordem:** sulfas (1935), beta-lactâmicos, cloranfenicol e tetraciclinas (1950), aminoglicosídeos, macrolídeos, glicopeptídeos, quinolonas, linezolida.\n**Papéis:** macrolídeo na alergia; vancomicina na resistência à oxacilina.\n**Gerações:** quinolona amplia; cefalosporina muda.", null]]}, {"id": "b24", "capitulo": "c2", "titulo": "Classificação pela estrutura química", "onde": "A1 00:39:38 a 00:50:58; 00:45:09 a 00:47:13; SL 10 e 11", "ensina": ["classe-quimica", "assoc-espectro", "vanco-teico", "polimixina-ultima"], "seq": [["cx", "gancho", "Caso para começar", "Na pediatria, a prescrição \"penicilina mais amicacina\" aparece toda hora. Um aluno perguntou: \"por que não prescrevo logo ceftriaxona, que pega os dois?\"\n**Antes de seguir:** o que você responderia?", null], ["cx", "ideia", "A ideia em uma frase", "Classificar pela estrutura química dá o nome da família; saber o espectro de cada família explica por que algumas associações fazem sentido.", null], ["passo", "As famílias e seus exemplos"], ["p", "A primeira forma de classificar é pela **estrutura química**: o nome da família costuma dizer o que há na molécula. O **aminoglicosídeo**, por exemplo, tem esse nome porque junta uma amina a um glicosídeo. Os slides 10 e 11 listam as famílias, e são esses exemplos que as questões de prova cobram.", [["Aminoglicosídeo", "Amina (grupo com nitrogênio) ligada a glicosídeo (açúcar): o nome descreve a molécula."]]], ["tab", "Famílias pela estrutura química (slides 10 e 11)", ["Família", "Exemplos da aula"], [["**Aminoglicosídeos**", "Amicacina, gentamicina, neomicina"], ["**Macrolídeos**", "Eritromicina, azitromicina"], ["**Polipeptídeos**", "Polimixina B, bacitracina"], ["**Glicopeptídeos**", "Vancomicina, teicoplanina"], ["**Poliênicos**", "Anfotericina, nistatina (antifúngicos)"], ["**Sulfonamidas**", "Sulfametoxazol, dapsona"], ["**Quinolonas**", "Norfloxacino, ciprofloxacino"], ["**Beta-lactâmicos**", "Penicilinas, cefalosporinas, carbapenêmicos, monobactâmicos"], ["**Tetraciclinas**", "Doxiciclina"], ["**Derivados do nitrobenzeno**", "Cloranfenicol"]]], ["passo", "Associações que somam espectro"], ["p", "Saber o espectro de cada família explica as associações. A **penicilina** pega Gram-positivo; a **amicacina**, um aminoglicosídeo, pega Gram-negativo. Juntas, cobrem os dois. E a resposta ao aluno do caso: usar uma droga só de amplo espectro, como a ceftriaxona, \"aumenta o risco de resistência\". Dois fármacos por mecanismos diferentes tornam muito menos provável que a mesma bactéria escape dos dois. A professora brincou: melhor \"fazer picadinho\" do que usar uma droga só de amplo espectro.", []], ["p", "O mesmo raciocínio está numa pomada que quase todo mundo já usou, o **Nebacetin**: **neomicina** (aminoglicosídeo, pega Gram-negativo) com **bacitracina** (polipeptídeo, pega Gram-positivo). Um completa o outro, e por isso a pomada serve para a maioria das infecções de pele superficiais.", []], ["fig", "v23pares.png", "Associações que somam espectro", "O que olhar: na coluna roxa ficam os fármacos de Gram-positivo, na rosa os de Gram-negativo, e na verde a associação que resulta. A faixa vermelha lembra por que não usar uma droga só de amplo espectro. Pergunta para responder só olhando: o que a neomicina acrescenta à bacitracina no Nebacetin?", "Esquema original elaborado a partir de A1 00:39:38 a 00:40:08 e 00:45:32 a 00:45:56.", ""], ["cx", "destaque", "Destaque da professora", "Ao aluno que sugeriu ceftriaxona: \"Porque daí eu estou aumentando o risco de resistência. Deu para entender como é o raciocínio?\"", "medio"], ["passo", "Polimixina, vancomicina e teicoplanina"], ["p", "A **polimixina B**, um polipeptídeo, é \"extremamente tóxica\". Quando se usa? Quando não sobra mais nada: \"é só polimixina e Deus na causa\". Se a polimixina não funcionar, há pouco a fazer. O volume 1B detalha essa família.", []], ["p", "Entre os glicopeptídeos, **vancomicina** e **teicoplanina** têm espectro muito semelhante; o que muda é a **forma de administração**. Pense num idoso com infecção multirresistente: a vancomicina é **só endovenosa, de 6 em 6 horas**, e obriga a internar. A teicoplanina pode ser **intramuscular, duas vezes ao dia**, e o idoso trata em casa. Para um paciente com resposta imune comprometida, \"quanto mais longe do hospital, melhor\": internar sem necessidade aumenta o risco de sair com pneumonia ou coisa pior.", []], ["passo", "Poliênicos e cloranfenicol hoje"], ["p", "Os **poliênicos** são antifúngicos, assunto de outra aula. A professora antecipou um detalhe: a **anfotericina** se liga ao **ergosterol** da membrana do fungo, e como a *Leishmania* também tem ergosterol, a anfotericina serve também na leishmaniose.", [["Ergosterol", "Lipídio da membrana dos fungos, no lugar do colesterol das células humanas."]]], ["p", "O **cloranfenicol** tem hoje um uso bem direcionado: **Haemophilus resistente**. A pneumonia não melhorou com os tradicionais, já se usou a cefalosporina, o paciente segue com febre: aí entra o cloranfenicol, principalmente em criança. A professora contou que, nos anos 1980, a meningite era tratada com ampicilina e cloranfenicol em doses altas, e que a própria professora e um colega nunca viram aplasia medular. Mas concluiu: se há trabalhos mostrando o risco, \"para que você vai arriscar?\". A discrasia sanguínea, explicou, costuma reverter quando o fármaco é suspenso.", []], ["cx", "erros", "Erros que derrubam", "Classificar vancomicina como quinolona ou doxiciclina como polimixina: decore os exemplos de cada família.\nAchar que uma droga só de amplo espectro é sempre melhor que duas de espectros complementares.\nEsquecer que a vancomicina obriga a internar, porque é só endovenosa.", null], ["cx", "guardar", "Para guardar", "Penicilina com amicacina e o Nebacetin somam Gram-positivo e Gram-negativo com menos risco de resistência.\nVanco e teico: mesmo espectro; vanco interna, teico vai para casa.", null], ["cx", "sintese", "Síntese", "**Famílias:** decore os exemplos dos slides 10 e 11.\n**Associação:** Gram-positivo + Gram-negativo amplia o espectro com menos resistência.\n**Polimixina:** muito tóxica, último recurso.\n**Vanco × teico:** mesmo espectro; vanco endovenosa 6/6 h, teico intramuscular 2 vezes ao dia.\n**Cloranfenicol hoje:** Haemophilus resistente.", null]]}, {"id": "b25", "capitulo": "c2", "titulo": "Espectro, efeito, origem e mecanismo de ação", "onde": "A1 00:53:44 a 00:55:59; SL 12 a 14, 29 a 33", "ensina": ["espectro-class", "origem-class", "mec-parede", "mec-proteica", "mec-outros"], "seq": [["cx", "gancho", "Caso para começar", "Uma questão de prova diz: \"a doxiciclina danifica o DNA bacteriano\" e \"o ciprofloxacino age sobre a síntese do DNA\".\n**Antes de seguir:** qual das duas frases está certa, e como saber sem decorar uma tabela enorme?", null], ["cx", "ideia", "A ideia em uma frase", "Além da família, todo antimicrobiano se classifica pelo espectro, pelo efeito, pela origem e pelo alvo na bactéria; o alvo é o que mais cai e o que explica o resto.", null], ["passo", "Espectro estreito e amplo"], ["p", "A segunda forma de classificar é pelo **espectro de ação**. **Espectro estreito**: penicilina G, estreptomicina, eritromicina. **Espectro amplo**: tetraciclinas e cloranfenicol, que pegam Gram-negativo, Gram-positivo, clamídia e riquétsia. A professora explicou por que os de amplo espectro foram tão usados nos anos 1950 e 1960: \"Eu dou tetraciclina, resolve. Não importa se é Gram-positiva, se é Gram-negativa\". Era o raciocínio de não \"esquentar a cabeça\", e foi esse raciocínio que ajudou a criar os multirresistentes. A regra que a professora deixou: \"eu não posso usar uma bala de canhão para matar uma formiga\".", []], ["passo", "Efeito e origem"], ["p", "A terceira, pelo **efeito**, você já conhece: bactericida ou bacteriostático. A quarta, pela **origem**: **natural**, de origem biológica (penicilina G, estreptomicina, eritromicina); **semissintética**, parte biológica e parte feita em laboratório (ampicilina, amoxicilina); e **sintética** (sulfametoxazol). Os naturais vêm de fungos, bactérias e actinomicetos. A professora contou que hoje se estudam antimicrobianos produzidos por bactérias que vivem nas camadas profundas do solo, mas a toxicidade e o baixo retorno travam o desenvolvimento.", [["Actinomicetos", "Bactérias do solo, filamentosas, que produzem muitos antibióticos naturais."]]], ["tab", "Quatro formas de classificar (slides 12 a 14)", ["Critério", "Grupos", "Exemplos da aula"], [["**Estrutura química**", "Famílias", "Aminoglicosídeos, macrolídeos, beta-lactâmicos..."], ["**Espectro**", "Estreito / amplo", "Penicilina G, estreptomicina, eritromicina / tetraciclinas, cloranfenicol"], ["**Efeito**", "Bactericida / bacteriostático", "Mata / para o crescimento"], ["**Origem**", "Natural / semissintético / sintético", "Penicilina G / ampicilina, amoxicilina / sulfametoxazol"]]], ["passo", "O alvo na bactéria: o mecanismo de ação"], ["p", "A classificação que mais cai é a do **mecanismo de ação**, ou seja, onde o fármaco age na bactéria. Pense na bactéria como uma célula com uma **parede**, uma **membrana**, **ribossomos** que fabricam proteínas, o **DNA** e uma via própria para fazer **folato**. Cada família ataca um desses pontos, e os slides 29 e 30 listam quem ataca o quê, junto com o efeito.", []], ["p", "Na **parede**: penicilinas, cefalosporinas, cicloserina, bacitracina e vancomicina, todos **bactericidas**. Na **permeabilidade da membrana**: polimixina, e também nistatina e anfotericina B nos fungos, bactericidas. Na **síntese proteica**, dois grupos: cloranfenicol, tetraciclina, eritromicina e clindamicina **afetam** a síntese e são **bacteriostáticos**; os **aminoglicosídeos** alteram a síntese a ponto de levar à morte celular, e são **bactericidas**. Nos **ácidos nucleicos**: rifampicina e quinolonas. No **folato**: trimetoprim e sulfonamidas.", []], ["fig", "v24alvos.png", "Onde cada família age na célula bacteriana", "O que olhar: cada caixa aponta para um alvo; o rótulo diz se o grupo é bactericida ou bacteriostático. Repare que o ribossomo recebe duas caixas, porque os aminoglicosídeos matam e os outros só param o crescimento. Pergunta para responder só olhando: em qual alvo age o ciprofloxacino, e em qual age a doxiciclina? Esquema didático, fora de escala.", "Esquema original elaborado a partir de SL 29 e 30.", ""], ["fig", "sl32mecacao.png", "A mesma ideia no slide da aula", "O que olhar: compare com o esquema anterior. A figura do slide traz os mesmos alvos (parede, membrana, ribossomos, DNA e a via do PABA ao ácido tetra-hidrofólico) e acrescenta fármacos de outras aulas, como daptomicina e linezolida. Pergunta para responder só olhando: em que grupo o slide põe a linezolida?", "Slide 32 da aula.", "larga"], ["cx", "alerta", "Atenção", "O slide 30 chama sulfonamidas e trimetoprim de **bactericidas**. 💡 Na literatura, cada um isolado costuma ser bacteriostático, e a associação (sulfametoxazol com trimetoprim) é que é bactericida; uma questão do banco (397) usa essa versão. **Na prova desta disciplina, siga o slide** se a pergunta for sobre a lista da aula; se a questão falar do fármaco isolado, lembre a versão da literatura.", null], ["cx", "erros", "Erros que derrubam", "Dizer que a doxiciclina danifica o DNA: ela é tetraciclina, age na síntese proteica.\nEsquecer que aminoglicosídeo age no ribossomo e mesmo assim é bactericida.\nPôr polimixina entre os inibidores da parede: ela age na permeabilidade da membrana.", null], ["cx", "guardar", "Para guardar", "Parede: beta-lactâmicos e vancomicina. Ribossomo: tetraciclina, macrolídeo, clindamicina, cloranfenicol e aminoglicosídeo. DNA: quinolonas e rifampicina. Folato: sulfas e trimetoprim.", null], ["cx", "sintese", "Síntese", "**Espectro:** estreito (penicilina G) ou amplo (tetraciclinas, cloranfenicol).\n**Origem:** natural, semissintético, sintético.\n**Alvos:** parede (bactericidas), membrana (polimixina), ribossomo (bacteriostáticos, exceto aminoglicosídeos), ácidos nucleicos (quinolonas, rifampicina), folato (sulfas, trimetoprim).", null]]}, {"id": "b26", "capitulo": "c2", "titulo": "Por que usar corretamente: eficácia, microbioma, resistência e custo", "onde": "A1 00:55:59 a 01:03:12; 01:04:46 a 01:05:51; SL 15 a 17", "ensina": ["uso-correto", "microbioma", "custo"], "seq": [["cx", "gancho", "Caso para começar", "Um médico com bronquite se automedicava com quinolona a cada piora. Um dia ligou para a professora pedindo vancomicina: estava com diarreia e não saía do banheiro.\n**Antes de seguir:** o que a quinolona tem a ver com a diarreia, e por que a vancomicina?", null], ["cx", "ideia", "A ideia em uma frase", "Usar antimicrobiano corretamente protege quatro coisas: a eficácia do fármaco, o microbioma do paciente, o futuro contra a resistência e o dinheiro do sistema.", null], ["passo", "As quatro razões"], ["p", "O slide 15 pergunta \"por que usar corretamente?\" e responde com quatro itens: **eficácia terapêutica**, porque cada uso inadequado gera resistência e diminui a eficácia; **preservar a flora**, o microbioma humano; **evitar a indução de resistência**; e **reduzir custos**. O slide lembra que há cerca de 1 kg de micróbios num adulto e dez vezes mais micróbios que células humanas.", [["Microbioma", "Conjunto de microrganismos que vivem no corpo, sobretudo no intestino, e participam da homeostase."]]], ["passo", "O microbioma e a superinfecção"], ["p", "O caso do início mostra a segunda razão na prática. A quinolona repetida \"acabou com o microbioma\" do amigo da professora e \"deu uma oportunidade para o ***Clostridium*** fazer a festa\". O tratamento da diarreia por *Clostridium* é **vancomicina por via oral**, mas a vancomicina é de uso hospitalar, e o paciente precisou internar para tomá-la.", []], ["p", "A mesma lógica explica uma queixa comum: depois de um antimicrobiano de **amplo espectro**, a paciente começa com corrimento e coceira, uma **infecção fúngica**. \"Não tá numa má fase\", disse a professora: o antimicrobiano matou a concorrência, e o fungo cresceu. É o que se chama de superinfecção.", []], ["fig", "v26microbioma.png", "Como o antimicrobiano abre espaço para a superinfecção", "O que olhar: a sequência vai do fármaco (azul) à destruição da flora (vermelho) e ao espaço sem concorrência (mostarda), que se abre para dois desfechos. Pergunta para responder só olhando: por que um antimicrobiano antibacteriano pode terminar numa infecção por fungo?", "Esquema original elaborado a partir de A1 01:00:36 a 01:01:37 e 01:05:33.", ""], ["passo", "O custo"], ["p", "A quarta razão é dinheiro, e a professora falou com experiência de chefe de farmácia hospitalar. Toda nota fiscal de imipenem (Tienam) obrigava-a a explicar o valor à diretoria. Metade do orçamento da farmácia ia para **antimicrobianos e antineoplásicos**; a outra metade sustentava todo o resto do hospital. A saída, disse a professora, não é proibir o médico de usar o que o paciente precisa, mas **sensibilizar a equipe** para usar corretamente.", []], ["p", "A professora contou de um hospital universitário em Massachusetts, nos anos 1990, em que a prescrição eletrônica fazia um som de moedas e mostrava o valor. Só isso reduziu o uso: o próprio médico se assustava e cortava o que não precisava. E deu um exemplo de \"perfumaria\": prescrever ferro na maternidade para a puérpera, que fica constipada e não recebe alta enquanto não evacuar. Dinheiro mal gasto é dinheiro que não melhora o atendimento.", []], ["p", "Por fim, a dimensão mundial dos slides 16 e 17: segundo a OMS, dois terços dos antibióticos são usados sem prescrição, mais da metade das prescrições é inadequada, metade dos pacientes compra antimicrobiano para um dia e 90% para até três dias. Países pobres quase não gastam com medicamentos porque não podem pagar, e morrem; países ricos usam demais. De novo, o caminho do meio.", []], ["cx", "erros", "Erros que derrubam", "Achar que o efeito do antimicrobiano se limita à bactéria-alvo: ele atinge todo o microbioma.\nNão ligar a diarreia ou a candidíase depois do antimicrobiano ao próprio tratamento.\nIgnorar o custo: metade do orçamento da farmácia ia para antimicrobianos e antineoplásicos.", null], ["cx", "guardar", "Para guardar", "Uso correto preserva eficácia, microbioma, futuro e dinheiro. Amplo espectro mata a concorrência: Clostridium e fungo agradecem.", null], ["cx", "sintese", "Síntese", "**Quatro razões:** eficácia, microbioma, resistência, custo.\n**Superinfecção:** Clostridium (vancomicina oral) e fungo depois de amplo espectro.\n**Custo:** metade do orçamento da farmácia; mostrar o preço ao médico reduz o uso.", null]]}, {"id": "b31", "capitulo": "c3", "titulo": "Resistência natural e adquirida", "onde": "A1 01:03:55 a 01:05:51; SL 18 e 19", "ensina": ["resist-natural", "resist-adquirida"], "seq": [["cx", "gancho", "Caso para começar", "Um fármaco que só age em Gram-positivos é dado a um paciente com infecção por Gram-negativo e não funciona. Em outro paciente, uma bactéria que respondia à penicilina deixou de responder.\n**Antes de seguir:** as duas situações são o mesmo tipo de resistência?", null], ["cx", "ideia", "A ideia em uma frase", "Na resistência natural, o fármaco nunca serviu para aquela bactéria; na adquirida, a bactéria era sensível e mudou, por mutação ou por receber genes de outra.", null], ["passo", "Natural: o fármaco nunca serviu"], ["p", "A professora lembrou que a turma já tinha visto o tema com outro professor e foi direto ao ponto. A **resistência natural**, ou primária, é \"óbvia\": se o fármaco pega Gram-positivo e a bactéria é Gram-negativa, ele não funciona, \"porque a estrutura é diferente\". A bactéria não tem o alvo, ou o fármaco não consegue chegar a ele. Não houve mudança nenhuma: aquele fármaco nunca foi para aquela bactéria.", []], ["passo", "Adquirida: seleção e indução"], ["p", "A **resistência adquirida**, ou secundária, é a que preocupa. A bactéria era sensível e deixou de ser. O slide 18 mostra dois caminhos. **Por seleção**: uma **mutação** aparece ao acaso, e o uso do antimicrobiano mata as sensíveis e deixa a mutante crescer. **Por indução**: a bactéria recebe de outra os genes de resistência, por troca de **plasmídeos** e **transposons**.", [["Plasmídeo", "DNA fora do cromossomo, que se replica sozinho e carrega genes, inclusive de resistência."], ["Transposon", "Pedaço de DNA que \"pula\" e se insere num plasmídeo ou no cromossomo da bactéria."]]], ["p", "Responda antes de ler: **onde o comportamento do paciente entra nessa história?** Na seleção. A professora resumiu: \"Eu tenho uma infeliz que é resistente. Se eu não tomar o antimicrobiano de forma adequada, eu posso dar oportunidade dessa infeliz aqui se multiplicar, acabo com a concorrência.\" É o mesmo raciocínio da adesão, no capítulo 1.", []], ["fig", "v31tipos.png", "Natural e adquirida", "O que olhar: à esquerda, em roxo, a resistência natural, sem mudança na bactéria; à direita, em vermelho, a adquirida, com seus dois caminhos. A faixa de baixo define plasmídeo e transposon. Pergunta para responder só olhando: a bactéria que recebeu um plasmídeo de outra tem resistência por seleção ou por indução?", "Esquema original elaborado a partir de A1 01:04:21 e SL 18.", ""], ["fig", "sl19selecao.png", "A seleção em quatro quadros", "O que olhar: no quadro 1 há uma bactéria resistente (laranja) entre muitas normais (azuis); no 2, o antibiótico mata as normais; no 3, as resistentes se multiplicam; no 4, a infecção é toda resistente. Pergunta para responder só olhando: o antibiótico criou a bactéria laranja, ou ela já estava lá? Imagem de origem em baixa resolução, com texto em inglês.", "Slide 19 da aula.", "larga"], ["cx", "erros", "Erros que derrubam", "Chamar de resistência adquirida o caso do fármaco de Gram-positivo que não age em Gram-negativo: isso é natural.\nAchar que o antibiótico \"cria\" a mutação: ele seleciona a que já existia.\nTrocar seleção (mutação) por indução (plasmídeos e transposons).", null], ["cx", "guardar", "Para guardar", "Natural: nunca serviu. Adquirida: era sensível e mudou, por mutação selecionada ou por genes recebidos.", null], ["cx", "sintese", "Síntese", "**Natural (primária):** a bactéria não tem o alvo; ex.: fármaco de Gram-positivo em Gram-negativo.\n**Adquirida (secundária):** por seleção (mutação) ou indução (plasmídeos e transposons).\n**Papel do uso:** o uso inadequado seleciona a resistente que já existia.", null]]}, {"id": "b32", "capitulo": "c3", "titulo": "Os quatro mecanismos de resistência", "onde": "A1 00:15:21 a 00:15:48; 01:05:51 a 01:09:40; SL 20 e 21", "ensina": ["mec-raciocinio", "mec-permeab", "mec-enzima", "mec-alvo", "mec-efluxo"], "seq": [["cx", "gancho", "Caso para começar", "Na prova vem a dissertativa: \"Descreva os mecanismos de resistência bacterianos\". Você não lembra a lista de cor.\n**Antes de seguir:** que pergunta sobre o caminho do fármaco até o alvo permite reconstruir os quatro mecanismos?", null], ["cx", "ideia", "A ideia em uma frase", "Para agir, o fármaco precisa entrar, continuar inteiro, encontrar o alvo e ficar lá em concentração suficiente; cada mecanismo de resistência bloqueia uma dessas etapas.", null], ["passo", "Um raciocínio só"], ["p", "A professora tirou o peso da memorização logo no começo da aula: \"Os mecanismos de resistência, gente, é tudo igual. O que muda? De acordo com o mecanismo de ação, se o alvo é uma determinada enzima, aquela enzima pode estar alterada\". E avisou: \"Eu vou ficar perguntando qual o mecanismo de resistência... é só raciocinar\". Na aula seguinte, repetiu que não vai pedir o mecanismo de uma classe, e sim que se expliquem os mecanismos.", []], ["p", "O raciocínio parte de uma condição: \"Para o medicamento fazer efeito, ele precisa atingir uma determinada **concentração no interior do micro-organismo**\". Pense no caminho do fármaco: entrar na bactéria, não ser destruído, ligar-se ao alvo e permanecer em concentração suficiente. Cada etapa pode ser bloqueada.", []], ["cx", "destaque", "Destaque da professora", "\"Então, eu vou ficar perguntando qual o mecanismo de resistência de determinada classe, porque é tudo parecido, é só raciocinar.\"", "forte"], ["passo", "Menos entrada"], ["p", "Primeira etapa: entrar. Se a bactéria **altera a permeabilidade**, mudando a parede ou a membrana, o fármaco não entra, e sem entrar não há efeito. O exemplo da aula são os **beta-lactâmicos** nos **Gram-negativos**: esses fármacos passam pelas **porinas**, os canais da membrana externa; se as porinas mudam, \"o antibiótico não consegue mais penetrar no micro-organismo, pronto, já não vou ter mais eficácia\".", [["Porina", "Canal hidrofílico da membrana externa dos Gram-negativos, por onde entram fármacos hidrofílicos."]]], ["passo", "Enzima que inativa"], ["p", "Segunda etapa: continuar inteiro. A bactéria pode **produzir uma enzima que inativa** o fármaco. Os exemplos são as **beta-lactamases**, como as **penicilinases**, que destroem as penicilinas; as **cefalosporinases**; e as **carbapenemases**, que inativam os carbapenêmicos. É contra essas enzimas que surgiram as \"novas associações\" do capítulo 1: fármaco antigo com inibidor da enzima.", []], ["passo", "Alvo alterado ou em excesso"], ["p", "Terceira etapa: encontrar o alvo. Se a bactéria **altera o local de ligação**, o fármaco chega mas não se encaixa. O exemplo da aula: as **quinolonas** se ligam à **DNA girase**; se a bactéria altera essa enzima, a quinolona \"não vai conseguir mais se ligar\". Há uma variante: a bactéria **produz o alvo em excesso**, e o fármaco não consegue inibir tudo.", []], ["passo", "Bomba de efluxo"], ["p", "Quarta etapa: permanecer. Na **bomba de efluxo**, a bactéria \"deixa o antimicrobiano entrar, mas, da mesma forma que entrou, ela coloca para fora\". Sem acumular, o fármaco nunca atinge a concentração necessária. O exemplo da aula: a **tetraciclina** era muito usada contra **Bacteroides**, até que essas bactérias passaram a ter bomba de efluxo.", [["Efluxo", "Do latim effluxus, que escoa para fora: saída ativa do fármaco da célula."]]], ["fig", "v32mec4.png", "Os quatro mecanismos de resistência", "O que olhar: cada caixa vermelha aponta para uma etapa no caminho do fármaco (bolinha azul): a porina fechada impede a entrada, a enzima E destrói o fármaco, o alvo alterado não recebe o fármaco e a bomba o põe para fora. Pergunta para responder só olhando: em qual dos quatro o fármaco chega a entrar e mesmo assim não age por falta de concentração? Esquema didático, fora de escala.", "Esquema original elaborado a partir de A1 01:06:14 a 01:09:40 e SL 20.", ""], ["fig", "sl20mecres.png", "Os mesmos quatro no slide da aula", "O que olhar: compare a numeração com o esquema anterior: 1, bloqueio da entrada; 2, enzimas que inativam; 3, alteração da molécula-alvo (em vermelho); 4, efluxo do antibiótico. Pergunta para responder só olhando: qual número corresponde à DNA girase alterada?", "Slide 20 da aula.", ""], ["tab", "Os quatro mecanismos com os exemplos da aula", ["Mecanismo", "O que a bactéria faz", "Exemplo da aula"], [["**1. Menos entrada**", "Altera parede, membrana ou porinas", "Beta-lactâmicos em Gram-negativos"], ["**2. Enzima que inativa**", "Produz enzima que destrói o fármaco", "Beta-lactamases, cefalosporinases, carbapenemases"], ["**3. Alvo alterado ou em excesso**", "Muda a enzima-alvo ou produz demais", "Quinolona e DNA girase"], ["**4. Bomba de efluxo**", "Põe o fármaco para fora", "Tetraciclina e Bacteroides"]]], ["cx", "erros", "Erros que derrubam", "Responder com a lista sem explicar: a professora pede que se expliquem os mecanismos.\nConfundir bomba de efluxo (o fármaco entra e sai) com menos entrada (nem entra).\nAchar que cada classe tem mecanismos próprios: são os mesmos quatro; muda o alvo.", null], ["cx", "guardar", "Para guardar", "Entrar, ficar inteiro, encaixar e acumular: porina, enzima, alvo e efluxo.", null], ["cx", "sintese", "Síntese", "**Condição:** concentração adequada no alvo, dentro da bactéria.\n**1.** Menos entrada (porinas; beta-lactâmicos em Gram-negativos).\n**2.** Enzima que inativa (beta-lactamases, carbapenemases).\n**3.** Alvo alterado ou em excesso (quinolona e DNA girase).\n**4.** Bomba de efluxo (tetraciclina e Bacteroides).", null]]}, {"id": "b33", "capitulo": "c3", "titulo": "Princípios da escolha do antimicrobiano", "onde": "A1 00:15:48 a 00:17:39; 01:09:40 a 01:15:40; SL 22 a 24", "ensina": ["escolha-principios", "interacoes-toxicidade", "ccih-boletim"], "seq": [["cx", "gancho", "Caso para começar", "Paciente em quimioterapia, já usando um antineoplásico nefrotóxico, interna com infecção. Há dois antimicrobianos que cobrem o agente provável; um deles é bem mais nefrotóxico.\n**Antes de seguir:** o que pesa na escolha além do espectro?", null], ["cx", "ideia", "A ideia em uma frase", "A escolha percorre uma sequência: infecção e agente provável, origem e sensibilidade local, uso prévio, quem é o paciente e, só então, qual fármaco e como prescrevê-lo.", null], ["passo", "Do diagnóstico ao agente e à origem"], ["p", "A professora começou pelo que vem antes de qualquer fármaco: saber \"qual é o agente etiológico provável\". Pela **topografia** e pela **idade**, sabe-se o microrganismo mais provável, e a regra é \"pensar no simples, no mais provável\". Sabendo o age
